<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <style>
    @keyframes pom-shine { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.18); opacity: 0.55; } }
    .shine { transform-origin: 152px 118px; animation: pom-shine 0.9s ease-in-out 6; }
    @media (prefers-reduced-motion: reduce) {
      .shine { animation: none; }
    }
  </style>
  <!-- Tail & Legs -->
  <path d="M38 138 C16 132, 12 102, 30 88 C24 78, 36 68, 50 76 C54 96, 52 122, 38 138 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M58 126 C52 148, 54 176, 70 178 C82 178, 86 162, 88 152 L104 152 C106 162, 110 178, 122 178 C138 176, 140 148, 134 126 Z" fill="#F2F4F7" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <!-- Chest & Bandana -->
  <path d="M46 112 C38 126, 46 144, 62 148 C80 156, 114 156, 132 148 C148 144, 156 126, 148 112 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M60 114 L96 144 L132 114 Z" fill="#FF9600" stroke="#4B4B4B" stroke-width="5" stroke-linejoin="round"/>
  <path d="M68 114 L96 136 L124 114 Z" fill="#58CC02"/>
  <!-- Head, Ears & Golden Crown -->
  <path d="M48 72 L42 34 C42 24, 56 22, 72 38 C86 32, 106 32, 120 38 C136 22, 150 24, 150 34 L144 72 C160 84, 160 108, 140 118 C122 128, 70 128, 52 118 C32 108, 32 84, 48 72 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M72 36 L68 14 L84 24 L96 8 L108 24 L124 14 L120 36 Z" fill="#FFC800" stroke="#4B4B4B" stroke-width="5" stroke-linejoin="round"/>
  <!-- Proud Smile -->
  <circle cx="74" cy="78" r="11" fill="#3B232E"/>
  <circle cx="70" cy="74" r="4" fill="#FFFFFF"/>
  <circle cx="118" cy="78" r="11" fill="#3B232E"/>
  <circle cx="114" cy="74" r="4" fill="#FFFFFF"/>
  <ellipse cx="96" cy="86" rx="7" ry="5" fill="#3B232E"/>
  <path d="M84 94 Q96 110 108 94" fill="#FF6B8B" stroke="#3B232E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Golden Trophy Cup -->
  <path d="M132 106 H172 V124 C172 138, 132 138, 132 124 Z" fill="#FFC800" stroke="#4B4B4B" stroke-width="5" stroke-linejoin="round"/>
  <path d="M152 136 V152 M138 152 H166" stroke="#4B4B4B" stroke-width="6" stroke-linecap="round"/>
  <polygon class="shine" points="178,86 181,94 189,97 181,100 178,108 175,100 167,97 175,94" fill="#FFC800"/>
  <circle cx="128" cy="126" r="10" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="5"/>
</svg>
