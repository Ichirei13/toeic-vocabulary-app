<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <style>
    @keyframes pom-swirl { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .swirl-l { transform-origin: 76px 78px; animation: pom-swirl 2s linear infinite; }
    .swirl-r { transform-origin: 124px 78px; animation: pom-swirl 2s linear infinite reverse; }
    @media (prefers-reduced-motion: reduce) {
      .swirl-l, .swirl-r { animation: none; }
    }
  </style>
  <!-- Spinning Stars Above Head -->
  <ellipse cx="100" cy="18" rx="42" ry="10" stroke="#FFC800" stroke-width="3" stroke-dasharray="6 6"/>
  <circle cx="58" cy="18" r="5" fill="#FFC800"/>
  <circle cx="142" cy="18" r="5" fill="#FFC800"/>
  <!-- Body & Bandana -->
  <path d="M62 128 C54 150, 56 176, 72 178 C84 178, 88 164, 92 154 L108 154 C112 164, 116 178, 128 178 C144 176, 146 150, 138 128 Z" fill="#F2F4F7" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M50 114 C42 128, 50 146, 66 150 C84 158, 116 158, 134 150 C150 146, 158 128, 150 114 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M64 116 L100 146 L136 116 Z" fill="#FF9600" stroke="#4B4B4B" stroke-width="5" stroke-linejoin="round"/>
  <path d="M72 116 L100 138 L128 116 Z" fill="#58CC02"/>
  <!-- Head & Ears -->
  <path d="M52 72 L46 34 C46 24, 60 22, 76 38 C90 32, 110 32, 124 38 C140 22, 154 24, 154 34 L148 72 C164 84, 164 108, 144 118 C126 128, 74 128, 56 118 C36 108, 36 84, 52 72 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <!-- Swirl Dizzy Eyes -->
  <g class="swirl-l">
    <circle cx="76" cy="78" r="12" stroke="#3B232E" stroke-width="4"/>
    <path d="M76 78 C76 72, 84 72, 84 78 C84 84, 70 84, 70 76" stroke="#3B232E" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g class="swirl-r">
    <circle cx="124" cy="78" r="12" stroke="#3B232E" stroke-width="4"/>
    <path d="M124 78 C124 72, 132 72, 132 78 C132 84, 118 84, 118 76" stroke="#3B232E" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <ellipse cx="100" cy="88" rx="6.5" ry="4.5" fill="#3B232E"/>
  <path d="M84 102 Q92 94 100 102 Q108 110 116 102" fill="none" stroke="#3B232E" stroke-width="4.5" stroke-linecap="round"/>
</svg>
