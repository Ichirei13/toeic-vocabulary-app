<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <style>
    @keyframes pom-tilt { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(-11deg); } }
    @keyframes pom-paw { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .tilt-head { transform-origin: 100px 92px; animation: pom-tilt 2s ease-in-out infinite; }
    .chin-paw { animation: pom-paw 2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .tilt-head, .chin-paw { animation: none; }
    }
  </style>
  <!-- Tail -->
  <path d="M42 142 C20 138, 18 110, 34 96 C28 86, 40 76, 52 84 C56 104, 54 126, 42 142 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Body & Legs -->
  <path d="M62 126 C56 148, 58 176, 74 178 C86 178, 90 162, 92 152 L108 152 C110 162, 114 178, 126 178 C142 176, 144 148, 138 126 Z" fill="#F2F4F7" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <!-- Fluffy Chest & Bandana -->
  <path d="M48 112 C40 126, 48 144, 64 148 C82 156, 118 156, 136 148 C152 144, 160 126, 152 112 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M64 114 L100 144 L136 114 Z" fill="#FF9600" stroke="#4B4B4B" stroke-width="5" stroke-linejoin="round"/>
  <path d="M72 114 L100 136 L128 114 Z" fill="#58CC02"/>
  <!-- Tilted Head -->
  <g class="tilt-head">
    <path d="M52 72 L46 32 C46 22, 60 20, 76 38 C90 32, 110 32, 124 38 C140 20, 154 22, 154 32 L148 72 C164 84, 164 108, 144 118 C126 128, 74 128, 56 118 C36 108, 36 84, 52 72 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
    <path d="M55 62 L53 38 C53 34, 62 34, 70 46 Z" fill="#D6DCE5"/>
    <path d="M145 62 L147 38 C147 34, 138 34, 130 46 Z" fill="#D6DCE5"/>
    <path d="M68 62 Q78 58 84 64" stroke="#98A2B3" stroke-width="4" stroke-linecap="round"/>
    <path d="M132 62 Q122 58 116 64" stroke="#98A2B3" stroke-width="4" stroke-linecap="round"/>
    <circle cx="78" cy="78" r="11" fill="#3B232E"/>
    <circle cx="74" cy="74" r="4" fill="#FFFFFF"/>
    <circle cx="122" cy="78" r="11" fill="#3B232E"/>
    <circle cx="118" cy="74" r="4" fill="#FFFFFF"/>
    <ellipse cx="100" cy="86" rx="7" ry="5" fill="#3B232E"/>
    <path d="M93 98 Q100 92 107 98" fill="none" stroke="#3B232E" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Thinking Paw on Chin -->
  <path class="chin-paw" d="M132 132 C148 122, 146 98, 126 98 C114 98, 114 114, 124 120" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
