<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <style>
    @keyframes pom-star-spin { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.2) rotate(12deg); } }
    @keyframes pom-excited { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .star-l { transform-origin: 76px 78px; animation: pom-star-spin 0.7s ease-in-out 8; }
    .star-r { transform-origin: 124px 78px; animation: pom-star-spin 0.7s ease-in-out 8; }
    .body-excited { animation: pom-excited 0.6s ease-in-out 9; }
    @media (prefers-reduced-motion: reduce) {
      .star-l, .star-r, .body-excited { animation: none; }
    }
  </style>
  <g class="body-excited">
    <!-- Tail & Legs -->
    <path d="M156 138 C180 132, 184 102, 166 88 C172 78, 160 68, 146 76 C142 96, 144 122, 156 138 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
    <path d="M62 126 C56 148, 58 176, 74 178 C86 178, 90 162, 92 152 L108 152 C110 162, 114 178, 126 178 C142 176, 144 148, 138 126 Z" fill="#F2F4F7" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
    <!-- Chest & Bandana -->
    <path d="M48 112 C40 126, 48 144, 64 148 C82 156, 118 156, 136 148 C152 144, 160 126, 152 112 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
    <path d="M64 114 L100 144 L136 114 Z" fill="#FF9600" stroke="#4B4B4B" stroke-width="5" stroke-linejoin="round"/>
    <path d="M72 114 L100 136 L128 114 Z" fill="#58CC02"/>
    <!-- Head & Ears -->
    <path d="M52 72 L46 32 C46 22, 60 20, 76 38 C90 32, 110 32, 124 38 C140 20, 154 22, 154 32 L148 72 C164 84, 164 108, 144 118 C126 128, 74 128, 56 118 C36 108, 36 84, 52 72 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
    <path d="M55 62 L53 38 C53 34, 62 34, 70 46 Z" fill="#D6DCE5"/>
    <path d="M145 62 L147 38 C147 34, 138 34, 130 46 Z" fill="#D6DCE5"/>
    <!-- Big Golden Star Eyes -->
    <polygon class="star-l" points="76,62 80,72 91,73 83,80 85,91 76,85 67,91 69,80 61,73 72,72" fill="#FFC800" stroke="#3B232E" stroke-width="3" stroke-linejoin="round"/>
    <polygon class="star-r" points="124,62 128,72 139,73 131,80 133,91 124,85 115,91 117,80 109,73 120,72" fill="#FFC800" stroke="#3B232E" stroke-width="3" stroke-linejoin="round"/>
    <!-- Nose & Amazed Open Mouth -->
    <ellipse cx="100" cy="88" rx="7" ry="5" fill="#3B232E"/>
    <ellipse cx="100" cy="103" rx="11" ry="9" fill="#FF6B8B" stroke="#3B232E" stroke-width="4.5"/>
    <!-- Paws on Cheeks in Amazement -->
    <circle cx="58" cy="102" r="11" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="5"/>
    <circle cx="142" cy="102" r="11" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="5"/>
  </g>
</svg>
