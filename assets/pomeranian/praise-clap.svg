<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <style>
    @keyframes pom-clap-l { 0%, 100% { transform: translateX(0) rotate(0deg); } 50% { transform: translateX(10px) rotate(8deg); } }
    @keyframes pom-clap-r { 0%, 100% { transform: translateX(0) rotate(0deg); } 50% { transform: translateX(-10px) rotate(-8deg); } }
    @keyframes pom-spark { 0%, 100% { opacity: 0.25; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.15); } }
    .paw-l { transform-origin: 76px 128px; animation: pom-clap-l 0.35s ease-in-out 15; }
    .paw-r { transform-origin: 124px 128px; animation: pom-clap-r 0.35s ease-in-out 15; }
    .sparks { transform-origin: 100px 104px; animation: pom-spark 0.35s ease-in-out 15; }
    @media (prefers-reduced-motion: reduce) {
      .paw-l, .paw-r, .sparks { animation: none; }
    }
  </style>
  <!-- Tail & Legs -->
  <path d="M156 138 C180 132, 184 102, 166 88 C172 78, 160 68, 146 76 C142 96, 144 122, 156 138 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M62 126 C56 148, 58 176, 74 178 C86 178, 90 162, 92 152 L108 152 C110 162, 114 178, 126 178 C142 176, 144 148, 138 126 Z" fill="#F2F4F7" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <!-- Chest & Bandana -->
  <path d="M48 112 C40 126, 48 144, 64 148 C82 156, 118 156, 136 148 C152 144, 160 126, 152 112 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M64 114 L100 144 L136 114 Z" fill="#FF9600" stroke="#4B4B4B" stroke-width="5" stroke-linejoin="round"/>
  <path d="M72 114 L100 136 L128 114 Z" fill="#58CC02"/>
  <!-- Head & Ears -->
  <path d="M52 72 L46 32 C46 22, 60 20, 76 38 C90 32, 110 32, 124 38 C140 20, 154 22, 154 32 L148 72 C164 84, 164 108, 144 118 C126 128, 74 128, 56 118 C36 108, 36 84, 52 72 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M55 62 L53 38 C53 34, 62 34, 70 46 Z" fill="#D6DCE5"/>
  <path d="M145 62 L147 38 C147 34, 138 34, 130 46 Z" fill="#D6DCE5"/>
  <!-- Happy Closed Arc Eyes & Rosy Cheeks -->
  <path d="M66 78 Q78 66 90 78" fill="none" stroke="#3B232E" stroke-width="6" stroke-linecap="round"/>
  <path d="M110 78 Q122 66 134 78" fill="none" stroke="#3B232E" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="62" cy="88" rx="8" ry="5" fill="#FF9EB5" opacity="0.7"/>
  <ellipse cx="138" cy="88" rx="8" ry="5" fill="#FF9EB5" opacity="0.7"/>
  <ellipse cx="100" cy="86" rx="7" ry="5" fill="#3B232E"/>
  <path d="M88 94 Q100 112 112 94" fill="#FF6B8B" stroke="#3B232E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Clapping Paws & Effect -->
  <g class="sparks">
    <path d="M100 98 V88 M82 104 L72 96 M118 104 L128 96" stroke="#FFC800" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <g class="paw-l">
    <ellipse cx="76" cy="126" rx="16" ry="12" transform="rotate(-20 76 126)" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="5.5"/>
  </g>
  <g class="paw-r">
    <ellipse cx="124" cy="126" rx="16" ry="12" transform="rotate(20 124 126)" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="5.5"/>
  </g>
</svg>
