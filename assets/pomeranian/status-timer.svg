<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <style>
    @keyframes pom-tick { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(6deg); } }
    .watch { transform-origin: 148px 124px; animation: pom-tick 0.35s ease-in-out 15; }
    @media (prefers-reduced-motion: reduce) {
      .watch { animation: none; }
    }
  </style>
  <!-- Body & Bandana -->
  <path d="M56 126 C50 148, 52 176, 68 178 C80 178, 84 162, 86 152 L102 152 C104 162, 108 178, 120 178 C134 176, 136 148, 130 126 Z" fill="#F2F4F7" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M44 112 C36 126, 44 144, 60 148 C78 156, 112 156, 130 148 C144 144, 152 126, 144 112 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M58 114 L94 144 L130 114 Z" fill="#FF9600" stroke="#4B4B4B" stroke-width="5" stroke-linejoin="round"/>
  <path d="M66 114 L94 136 L122 114 Z" fill="#58CC02"/>
  <!-- Head & Focused Brows -->
  <path d="M46 72 L40 32 C40 22, 54 20, 70 38 C84 32, 104 32, 118 38 C134 20, 148 22, 148 32 L142 72 C158 84, 158 108, 138 118 C120 128, 68 128, 50 118 C30 108, 30 84, 46 72 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M62 64 L80 70" stroke="#4B4B4B" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M126 64 L108 70" stroke="#4B4B4B" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="72" cy="78" r="10" fill="#3B232E"/>
  <circle cx="68" cy="74" r="3.5" fill="#FFFFFF"/>
  <circle cx="116" cy="78" r="10" fill="#3B232E"/>
  <circle cx="112" cy="74" r="3.5" fill="#FFFFFF"/>
  <ellipse cx="94" cy="86" rx="6.5" ry="4.5" fill="#3B232E"/>
  <path d="M86 96 H102" stroke="#3B232E" stroke-width="5" stroke-linecap="round"/>
  <!-- Ticking Stopwatch -->
  <g class="watch">
    <rect x="142" y="84" width="12" height="10" rx="2" fill="#FFC800" stroke="#4B4B4B" stroke-width="4"/>
    <circle cx="148" cy="124" r="28" fill="#FFC800" stroke="#4B4B4B" stroke-width="5"/>
    <circle cx="148" cy="124" r="20" fill="#FFFFFF"/>
    <path d="M148 124 L148 112 M148 124 L160 118" stroke="#3B232E" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="122" cy="126" r="10" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="5"/>
  </g>
</svg>
