<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <style>
    @keyframes pom-heart { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    @keyframes pom-float-h { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    .big-heart { transform-origin: 100px 136px; animation: pom-heart 0.8s ease-in-out infinite; }
    .mini-hearts { animation: pom-float-h 1.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .big-heart, .mini-hearts { animation: none; }
    }
  </style>
  <!-- Floating Mini Hearts -->
  <g class="mini-hearts">
    <path d="M34 44 C28 36, 18 42, 34 54 C50 42, 40 36, 34 44 Z" fill="#FF6B8B"/>
    <path d="M166 38 C160 30, 150 36, 166 48 C182 36, 172 30, 166 38 Z" fill="#FF6B8B"/>
  </g>
  <!-- Tail & Legs -->
  <path d="M42 138 C18 132, 14 102, 32 88 C26 78, 38 68, 52 76 C56 96, 54 122, 42 138 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M62 126 C56 148, 58 176, 74 178 C86 178, 90 162, 92 152 L108 152 C110 162, 114 178, 126 178 C142 176, 144 148, 138 126 Z" fill="#F2F4F7" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <!-- Chest & Bandana -->
  <path d="M48 112 C40 126, 48 144, 64 148 C82 156, 118 156, 136 148 C152 144, 160 126, 152 112 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M64 114 L100 144 L136 114 Z" fill="#FF9600" stroke="#4B4B4B" stroke-width="5" stroke-linejoin="round"/>
  <path d="M72 114 L100 136 L128 114 Z" fill="#58CC02"/>
  <!-- Head & Ears -->
  <path d="M52 72 L46 32 C46 22, 60 20, 76 38 C90 32, 110 32, 124 38 C140 20, 154 22, 154 32 L148 72 C164 84, 164 108, 144 118 C126 128, 74 128, 56 118 C36 108, 36 84, 52 72 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M55 62 L53 38 C53 34, 62 34, 70 46 Z" fill="#D6DCE5"/>
  <path d="M145 62 L147 38 C147 34, 138 34, 130 46 Z" fill="#D6DCE5"/>
  <!-- Loving Arc Eyes & Blush -->
  <path d="M66 78 Q78 66 90 78" fill="none" stroke="#3B232E" stroke-width="6" stroke-linecap="round"/>
  <path d="M110 78 Q122 66 134 78" fill="none" stroke="#3B232E" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="62" cy="88" rx="9" ry="5.5" fill="#FF6B8B" opacity="0.65"/>
  <ellipse cx="138" cy="88" rx="9" ry="5.5" fill="#FF6B8B" opacity="0.65"/>
  <ellipse cx="100" cy="86" rx="7" ry="5" fill="#3B232E"/>
  <path d="M89 94 Q100 106 111 94" fill="none" stroke="#3B232E" stroke-width="5" stroke-linecap="round"/>
  <!-- Big Heart Hugged by Paws -->
  <g class="big-heart">
    <path d="M100 124 C82 104, 56 118, 66 142 C74 158, 100 172, 100 172 C100 172, 126 158, 134 142 C144 118, 118 104, 100 124 Z" fill="#FF4B72" stroke="#4B4B4B" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="72" cy="138" r="11" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="5"/>
    <circle cx="128" cy="138" r="11" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="5"/>
  </g>
</svg>
