<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <style>
    @keyframes pom-tomato { 0%, 100% { transform: scale(1) rotate(-3deg); } 50% { transform: scale(1.06) rotate(4deg); } }
    .tomato { transform-origin: 146px 132px; animation: pom-tomato 1.1s ease-in-out 5; }
    @media (prefers-reduced-motion: reduce) {
      .tomato { animation: none; }
    }
  </style>
  <!-- Tail & Legs -->
  <path d="M38 138 C16 132, 12 102, 30 88 C24 78, 36 68, 50 76 C54 96, 52 122, 38 138 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M58 126 C52 148, 54 176, 70 178 C82 178, 86 162, 88 152 L104 152 C106 162, 110 178, 122 178 C138 176, 140 148, 134 126 Z" fill="#F2F4F7" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <!-- Chest & Bandana -->
  <path d="M46 112 C38 126, 46 144, 62 148 C80 156, 114 156, 132 148 C148 144, 156 126, 148 112 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M60 114 L96 144 L132 114 Z" fill="#FF9600" stroke="#4B4B4B" stroke-width="5" stroke-linejoin="round"/>
  <path d="M68 114 L96 136 L124 114 Z" fill="#58CC02"/>
  <!-- Head & Ears -->
  <path d="M48 72 L42 32 C42 22, 56 20, 72 38 C86 32, 106 32, 120 38 C136 20, 150 22, 150 32 L144 72 C160 84, 160 108, 140 118 C122 128, 70 128, 52 118 C32 108, 32 84, 48 72 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="74" cy="78" r="11" fill="#3B232E"/>
  <circle cx="70" cy="74" r="4" fill="#FFFFFF"/>
  <circle cx="118" cy="78" r="11" fill="#3B232E"/>
  <circle cx="114" cy="74" r="4" fill="#FFFFFF"/>
  <ellipse cx="96" cy="86" rx="7" ry="5" fill="#3B232E"/>
  <path d="M84 94 Q96 108 108 94" fill="#FF6B8B" stroke="#3B232E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Glossy Red Pomodoro Tomato Timer -->
  <g class="tomato">
    <ellipse cx="148" cy="134" rx="26" ry="22" fill="#FF4B4B" stroke="#4B4B4B" stroke-width="5"/>
    <path d="M136 114 L148 106 L160 114 L152 118 L148 112 L144 118 Z" fill="#58CC02" stroke="#4B4B4B" stroke-width="3.5" stroke-linejoin="round"/>
    <ellipse cx="138" cy="128" rx="4" ry="7" transform="rotate(-20 138 128)" fill="#FFFFFF" opacity="0.65"/>
    <circle cx="124" cy="134" r="10" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="5"/>
  </g>
</svg>
