<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <style>
    @keyframes pom-hi5 { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.12) rotate(-6deg); } }
    .hi5-paw { transform-origin: 150px 104px; animation: pom-hi5 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) 7; }
    @media (prefers-reduced-motion: reduce) {
      .hi5-paw { animation: none; }
    }
  </style>
  <!-- Tail & Legs -->
  <path d="M38 138 C16 132, 12 102, 30 88 C24 78, 36 68, 50 76 C54 96, 52 122, 38 138 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M58 126 C52 148, 54 176, 70 178 C82 178, 86 162, 88 152 L104 152 C106 162, 110 178, 122 178 C138 176, 140 148, 134 126 Z" fill="#F2F4F7" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <!-- Chest & Bandana -->
  <path d="M46 112 C38 126, 46 144, 62 148 C80 156, 114 156, 132 148 C148 144, 156 126, 148 112 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M60 114 L96 144 L132 114 Z" fill="#FF9600" stroke="#4B4B4B" stroke-width="5" stroke-linejoin="round"/>
  <path d="M68 114 L96 136 L124 114 Z" fill="#58CC02"/>
  <!-- Head & Ears -->
  <path d="M48 72 L42 32 C42 22, 56 20, 72 38 C86 32, 106 32, 120 38 C136 20, 150 22, 150 32 L144 72 C160 84, 160 108, 140 118 C122 128, 70 128, 52 118 C32 108, 32 84, 48 72 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M51 62 L49 38 C49 34, 58 34, 66 46 Z" fill="#D6DCE5"/>
  <path d="M141 62 L143 38 C143 34, 134 34, 126 46 Z" fill="#D6DCE5"/>
  <!-- Wink & Big Smile -->
  <circle cx="74" cy="78" r="11" fill="#3B232E"/>
  <circle cx="70" cy="74" r="4" fill="#FFFFFF"/>
  <path d="M108 78 Q118 68 128 78" fill="none" stroke="#3B232E" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="96" cy="86" rx="7" ry="5" fill="#3B232E"/>
  <path d="M84 94 Q96 112 108 94" fill="#FF6B8B" stroke="#3B232E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Big Forward High-Five Paw with Pink Pads -->
  <g class="hi5-paw">
    <circle cx="152" cy="106" r="26" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6"/>
    <ellipse cx="152" cy="112" rx="9" ry="7" fill="#FF8DA6"/>
    <circle cx="140" cy="96" r="4.5" fill="#FF8DA6"/>
    <circle cx="152" cy="92" r="4.5" fill="#FF8DA6"/>
    <circle cx="164" cy="96" r="4.5" fill="#FF8DA6"/>
    <path d="M174 72 L184 64 M182 88 L192 84 M160 66 L164 56" stroke="#58CC02" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
