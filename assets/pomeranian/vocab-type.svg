<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <style>
    @keyframes pom-type-l { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
    @keyframes pom-type-r { 0%, 100% { transform: translateY(6px); } 50% { transform: translateY(0); } }
    .paw-l { animation: pom-type-l 0.28s ease-in-out infinite; }
    .paw-r { animation: pom-type-r 0.28s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .paw-l, .paw-r { animation: none; }
    }
  </style>
  <!-- Head & Ears -->
  <path d="M52 72 L46 32 C46 22, 60 20, 76 38 C90 32, 110 32, 124 38 C140 20, 154 22, 154 32 L148 72 C164 84, 164 108, 144 118 C126 128, 74 128, 56 118 C36 108, 36 84, 52 72 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M55 62 L53 38 C53 34, 62 34, 70 46 Z" fill="#D6DCE5"/>
  <path d="M145 62 L147 38 C147 34, 138 34, 130 46 Z" fill="#D6DCE5"/>
  <!-- Bandana -->
  <path d="M64 114 L100 140 L136 114 Z" fill="#FF9600" stroke="#4B4B4B" stroke-width="5" stroke-linejoin="round"/>
  <path d="M72 114 L100 133 L128 114 Z" fill="#58CC02"/>
  <!-- Focused Sparkling Eyes -->
  <circle cx="78" cy="78" r="11" fill="#3B232E"/>
  <circle cx="74" cy="74" r="4" fill="#FFFFFF"/>
  <circle cx="122" cy="78" r="11" fill="#3B232E"/>
  <circle cx="118" cy="74" r="4" fill="#FFFFFF"/>
  <ellipse cx="100" cy="86" rx="7" ry="5" fill="#3B232E"/>
  <path d="M88 94 Q100 106 112 94" fill="none" stroke="#3B232E" stroke-width="5" stroke-linecap="round"/>
  <!-- Cute Mini Keyboard (タイプ演習モード) -->
  <rect x="34" y="142" width="132" height="38" rx="10" fill="#202F36" stroke="#4B4B4B" stroke-width="5"/>
  <rect x="44" y="150" width="16" height="10" rx="3" fill="#58CC02"/>
  <rect x="64" y="150" width="16" height="10" rx="3" fill="#FFFFFF"/>
  <rect x="84" y="150" width="16" height="10" rx="3" fill="#FFFFFF"/>
  <rect x="104" y="150" width="16" height="10" rx="3" fill="#FFFFFF"/>
  <rect x="124" y="150" width="32" height="10" rx="3" fill="#FF9600"/>
  <rect x="64" y="164" width="72" height="8" rx="3" fill="#1CB0F6"/>
  <!-- Animated Typing Paws -->
  <circle class="paw-l" cx="72" cy="138" r="11" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="5"/>
  <circle class="paw-r" cx="128" cy="138" r="11" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="5"/>
</svg>
