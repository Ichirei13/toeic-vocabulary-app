<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <style>
    @keyframes pom-sprout { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(7deg); } }
    .sprout { transform-origin: 100px 34px; animation: pom-sprout 1.4s ease-in-out 4; }
    @media (prefers-reduced-motion: reduce) {
      .sprout { animation: none; }
    }
  </style>
  <!-- Sprouting Leaf on Head (5問: コツコツ・ウォームアップ) -->
  <g class="sprout">
    <path d="M100 34 V16" stroke="#58CC02" stroke-width="5" stroke-linecap="round"/>
    <path d="M100 20 C84 10, 76 24, 100 28 Z" fill="#58CC02" stroke="#4B4B4B" stroke-width="4" stroke-linejoin="round"/>
    <path d="M100 20 C116 10, 124 24, 100 28 Z" fill="#89E219" stroke="#4B4B4B" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- Tail & Legs -->
  <path d="M42 138 C18 132, 14 102, 32 88 C26 78, 38 68, 52 76 C56 96, 54 122, 42 138 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M62 126 C56 148, 58 176, 74 178 C86 178, 90 162, 92 152 L108 152 C110 162, 114 178, 126 178 C142 176, 144 148, 138 126 Z" fill="#F2F4F7" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <!-- Chest & Bandana -->
  <path d="M48 112 C40 126, 48 144, 64 148 C82 156, 118 156, 136 148 C152 144, 160 126, 152 112 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M64 114 L100 144 L136 114 Z" fill="#FF9600" stroke="#4B4B4B" stroke-width="5" stroke-linejoin="round"/>
  <path d="M72 114 L100 136 L128 114 Z" fill="#58CC02"/>
  <!-- Head & Ears -->
  <path d="M52 72 L46 34 C46 24, 60 22, 76 38 C90 32, 110 32, 124 38 C140 22, 154 24, 154 34 L148 72 C164 84, 164 108, 144 118 C126 128, 74 128, 56 118 C36 108, 36 84, 52 72 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M55 62 L53 40 C53 36, 62 36, 70 46 Z" fill="#D6DCE5"/>
  <path d="M145 62 L147 40 C147 36, 138 36, 130 46 Z" fill="#D6DCE5"/>
  <!-- Eyes & Smile -->
  <circle cx="78" cy="78" r="11" fill="#3B232E"/>
  <circle cx="74" cy="74" r="4" fill="#FFFFFF"/>
  <circle cx="122" cy="78" r="11" fill="#3B232E"/>
  <circle cx="118" cy="74" r="4" fill="#FFFFFF"/>
  <ellipse cx="100" cy="86" rx="7" ry="5" fill="#3B232E"/>
  <path d="M88 94 Q100 108 112 94" fill="#FF6B8B" stroke="#3B232E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Warm Coffee/Tea Mug -->
  <rect x="134" y="114" width="28" height="32" rx="6" fill="#FF9600" stroke="#4B4B4B" stroke-width="5"/>
  <path d="M162 120 H168 C174 120, 174 138, 168 138 H162" stroke="#4B4B4B" stroke-width="5" stroke-linecap="round"/>
  <circle cx="132" cy="130" r="9" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="5"/>
</svg>
