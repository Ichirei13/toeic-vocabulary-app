<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <style>
    @keyframes pom-soul { 0%, 100% { transform: translateY(0) rotate(-4deg); opacity: 0.9; } 50% { transform: translateY(-10px) rotate(6deg); opacity: 0.55; } }
    .soul { transform-origin: 148px 64px; animation: pom-soul 2.2s ease-in-out 3; }
    @media (prefers-reduced-motion: reduce) {
      .soul { animation: none; }
    }
  </style>
  <!-- Floating Cute Ghost Wisp (魂抜け) -->
  <g class="soul">
    <path d="M136 86 C132 68, 128 48, 144 38 C158 30, 172 44, 166 62 C162 74, 148 82, 136 86 Z" fill="#E0F2FE" stroke="#98A2B3" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="144" cy="52" r="3" fill="#4B4B4B"/>
    <circle cx="156" cy="52" r="3" fill="#4B4B4B"/>
    <ellipse cx="150" cy="60" rx="3" ry="4" fill="#4B4B4B"/>
  </g>
  <!-- Exhausted Lying Pomeranian -->
  <ellipse cx="98" cy="172" rx="74" ry="9" fill="#0D1519" opacity="0.5"/>
  <path d="M32 146 C26 122, 48 106, 86 112 L140 116 C164 120, 170 148, 156 164 L38 164 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M68 122 L88 144 L72 158 Z" fill="#FF9600" stroke="#4B4B4B" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Head & Flat Dazed Eyes -->
  <path d="M68 110 L64 76 C64 68, 76 66, 88 80 C100 76, 116 76, 128 80 C140 66, 152 68, 152 76 L148 112 C160 124, 158 148, 140 158 C122 166, 86 166, 68 158 C52 148, 54 124, 68 110 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <line x1="82" y1="120" x2="98" y2="120" stroke="#3B232E" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="118" y1="120" x2="134" y2="120" stroke="#3B232E" stroke-width="5.5" stroke-linecap="round"/>
  <ellipse cx="108" cy="128" rx="6" ry="4" fill="#3B232E"/>
  <path d="M100 144 C100 134, 118 134, 118 144 Z" fill="#FF6B8B" stroke="#3B232E" stroke-width="4.5" stroke-linejoin="round"/>
</svg>
