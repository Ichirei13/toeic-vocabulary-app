<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <style>
    @keyframes pom-quiver { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(2px); } }
    @keyframes pom-tear-wobble { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    .head-sad { animation: pom-quiver 1.4s ease-in-out infinite; }
    .tears { transform-origin: 100px 84px; animation: pom-tear-wobble 0.9s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .head-sad, .tears { animation: none; }
    }
  </style>
  <!-- Drooping Tail & Seated Legs -->
  <path d="M148 152 C166 152, 174 136, 162 124 C152 116, 142 132, 148 152 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M62 128 C54 150, 56 176, 72 178 C84 178, 88 164, 92 154 L108 154 C112 164, 116 178, 128 178 C144 176, 146 150, 138 128 Z" fill="#F2F4F7" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <!-- Chest & Bandana -->
  <path d="M50 114 C42 128, 50 146, 66 150 C84 158, 116 158, 134 150 C150 146, 158 128, 150 114 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
  <path d="M64 116 L100 146 L136 116 Z" fill="#FF9600" stroke="#4B4B4B" stroke-width="5" stroke-linejoin="round"/>
  <path d="M72 116 L100 138 L128 116 Z" fill="#58CC02"/>
  <!-- Head with Drooping Ears -->
  <g class="head-sad">
    <path d="M54 70 C30 68, 22 82, 36 92 L50 86 C36 102, 42 118, 58 122 C76 130, 124 130, 142 122 C158 118, 164 102, 150 86 L164 92 C178 82, 170 68, 146 70 C136 42, 64 42, 54 70 Z" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="6" stroke-linejoin="round"/>
    <!-- Sad Eyebrows -->
    <path d="M66 66 Q76 60 84 68" stroke="#4B4B4B" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M134 66 Q124 60 116 68" stroke="#4B4B4B" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Watery Puppy Eyes -->
    <circle cx="76" cy="80" r="12" fill="#3B232E"/>
    <circle cx="72" cy="75" r="4.5" fill="#FFFFFF"/>
    <circle cx="80" cy="83" r="2.5" fill="#FFFFFF"/>
    <circle cx="124" cy="80" r="12" fill="#3B232E"/>
    <circle cx="120" cy="75" r="4.5" fill="#FFFFFF"/>
    <circle cx="128" cy="83" r="2.5" fill="#FFFFFF"/>
    <!-- Watery Tears at Eye Corners -->
    <g class="tears">
      <ellipse cx="70" cy="90" rx="8" ry="4.5" fill="#4DD0E1"/>
      <ellipse cx="130" cy="90" rx="8" ry="4.5" fill="#4DD0E1"/>
    </g>
    <!-- Nose & Pouting Mouth -->
    <ellipse cx="100" cy="88" rx="6.5" ry="4.5" fill="#3B232E"/>
    <path d="M90 102 Q100 94 110 102" fill="none" stroke="#3B232E" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Paws Held Together on Chest -->
  <circle cx="88" cy="128" r="11" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="5"/>
  <circle cx="112" cy="128" r="11" fill="#FFFFFF" stroke="#4B4B4B" stroke-width="5"/>
</svg>
