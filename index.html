<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEIC Drill</title>
<meta name="theme-color" content="#1b1712">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TOEIC Drill">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root {
  --ink: #1b1712;
  --paper: #f2e6c9;
  --seal: #b3382a;
  --gold: #c9a05c;
  --jade: #4f7a68;
  --ivory: #f0e6d2;
  --muted: #8a7f6e;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
body {
  margin: 0; padding: 0;
  background-color: var(--ink);
  background-image: radial-gradient(circle at 50% 0%, #2a241d, var(--ink));
  color: var(--paper);
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
#app {
  max-width: 540px;
  margin: 0 auto;
  width: 100%;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  position: relative;
  overflow: hidden;
}
.header {
  padding: 10px 20px 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
}
.streak-bar {
  margin: 0 20px 8px;
  padding: 6px 12px;
  border: 1px solid rgba(201, 160, 92, 0.35);
  border-radius: 10px;
  font-size: 13px;
  color: var(--ivory);
  text-align: center;
  cursor: pointer;
}
.streak-bar.done { border-color: var(--jade); color: var(--jade); background: rgba(79, 122, 104, 0.15); }
.title-wrap { text-align: left; line-height: 1.15; }
.eyebrow {
  color: var(--gold);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin: 0;
}
.title {
  font-size: 17px;
  font-weight: bold;
  margin: 0;
}
.subtitle { display: none; }
.filter-toggle {
  flex-shrink: 0;
  background: rgba(242, 230, 201, 0.08);
  border: 1px solid rgba(242, 230, 201, 0.25);
  color: var(--paper);
  font-size: 12px;
  font-family: inherit;
  padding: 6px 12px;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.filter-toggle.active {
  background: var(--paper);
  color: var(--ink);
  border-color: var(--paper);
  font-weight: 600;
}
.filter-toggle .caret { font-size: 9px; transition: transform 0.25s; }
.filter-toggle.active .caret { transform: rotate(180deg); }
.filter-count {
  background: var(--seal);
  color: #fff;
  border-radius: 10px;
  min-width: 16px;
  padding: 1px 5px;
  font-size: 10px;
  font-weight: 700;
  display: none;
}
.filters {
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex-shrink: 0;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height 0.25s ease, opacity 0.2s ease, padding 0.25s ease;
}
.filters.open {
  max-height: 290px;
  opacity: 1;
  padding: 2px 20px 8px;
}
.filter-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.filter-row::-webkit-scrollbar { display: none; }
.chip {
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--muted);
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
  background: transparent;
  cursor: pointer;
  transition: all 0.2s;
}
.chip.active {
  background: var(--paper);
  color: var(--ink);
  border-color: var(--paper);
  font-weight: 600;
}
.segments {
  display: flex;
  background: rgba(242, 230, 201, 0.1);
  border-radius: 10px;
  padding: 3px;
  margin: 0 20px 6px;
  flex-shrink: 0;
}
.filters .segments { margin: 0; }
#mode-segments { margin: 2px 20px 8px; }
.segment {
  flex: 1;
  text-align: center;
  padding: 6px 4px;
  font-size: 12px;
  border-radius: 7px;
  color: var(--muted);
  cursor: pointer;
  transition: 0.3s;
}
.segment.active {
  background: var(--paper);
  color: var(--ink);
  font-weight: bold;
}
.main-area {
  flex: 1;
  min-height: 0;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#quiz-container {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.card {
  background: var(--paper);
  color: var(--ink);
  border-radius: 16px;
  padding: 14px 18px;
  text-align: center;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  margin-bottom: 10px;
  position: relative;
  transition: transform 0.3s, opacity 0.3s;
  flex: 0 1 auto;
  min-height: clamp(120px, 26vh, 240px);
  max-height: 100%;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform-style: preserve-3d;
}
.card > * { flex-shrink: 0; }
.card::before, .card::after { content: ''; flex: 1 0 0; }
.card.flash-mode::before, .card.flash-mode::after { content: none; }
.card.shake {
  animation: shake 0.4s;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
.word-display {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: clamp(22px, 7vw, 32px);
  font-weight: bold;
  margin-bottom: 8px;
  line-height: 1.2;
  word-break: break-word;
}
.pos-tag {
  background: rgba(0,0,0,0.06);
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  color: var(--ink);
  margin-bottom: 8px;
  flex-shrink: 0;
}
.meaning-display {
  font-size: clamp(16px, 5vw, 20px);
  font-weight: 600;
  margin-bottom: 8px;
  line-height: 1.35;
}
.example-display {
  font-size: 13px;
  color: #555;
  line-height: 1.45;
  margin-top: 10px;
  border-top: 1px dashed rgba(0,0,0,0.1);
  padding-top: 10px;
  display: none;
}
.choices {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 10px;
  flex-shrink: 0;
}
.choice-btn {
  background: rgba(242, 230, 201, 0.05);
  border: 1px solid rgba(242, 230, 201, 0.2);
  color: var(--paper);
  font-family: inherit;
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.35;
  text-align: left;
  cursor: pointer;
  transition: 0.2s;
}
.choice-btn:active { background: rgba(242, 230, 201, 0.1); }
.choice-btn.correct {
  background: var(--jade);
  border-color: var(--jade);
  color: white;
}
.choice-btn.wrong {
  background: var(--seal);
  border-color: var(--seal);
  color: white;
}
.action-bar {
  flex-shrink: 0;
  height: 54px;
  padding: 0 20px 8px;
  display: flex;
  gap: 8px;
}
.next-btn {
  background: var(--gold);
  color: var(--ink);
  border: none;
  font-family: inherit;
  padding: 13px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  flex: 1;
  display: none;
}
.dont-know-btn {
  background: transparent;
  color: var(--muted);
  border: 1px dashed rgba(242, 230, 201, 0.35);
  font-family: inherit;
  padding: 13px;
  border-radius: 12px;
  font-size: 14px;
  cursor: pointer;
  flex: 1;
  display: none;
  transition: 0.2s;
}
.dont-know-btn:active { background: rgba(242, 230, 201, 0.08); color: var(--paper); }
.type-input-container {
  width: 100%;
  margin-top: 12px;
}
.type-input {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 2px solid var(--ink);
  font-family: ui-monospace, SFMono-Regular, monospace;
  font-size: 24px;
  text-align: center;
  padding: 8px;
  color: var(--ink);
  outline: none;
}
.type-input::placeholder { color: rgba(0,0,0,0.2); }
.footer {
  padding: 8px 20px 12px;
  border-top: 1px solid rgba(242, 230, 201, 0.1);
  flex-shrink: 0;
}
.stats {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
}
.progress-track {
  height: 4px;
  border-radius: 2px;
  background: rgba(242, 230, 201, 0.15);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0;
  background: var(--gold);
  transition: width 0.3s;
}
.sheet-close {
  position: sticky;
  top: 0;
  float: right;
  margin: -8px -8px 0 0;
  z-index: 1;
  width: 32px; height: 32px;
  border-radius: 50%;
  border: none;
  background: rgba(0,0,0,0.08);
  color: var(--ink);
  font-size: 16px;
  cursor: pointer;
}
/* 文法: 回答後は選択肢を1行に縮めて解説に縦を譲る */
.choices.compact { flex-direction: row; }
.choices.compact .choice-btn {
  flex: 1;
  padding: 8px 4px;
  text-align: center;
  font-size: 13px;
}
.choices.compact .choice-text { display: none; }
.choice-mark { margin-left: 6px; font-weight: 700; }
.choices.compact .choice-btn.correct .choice-label,
.choices.compact .choice-btn.wrong .choice-label { color: #fff; }
.grammar-your-ans {
  font-size: 13px;
  color: var(--seal);
  font-weight: 600;
  margin: -4px 0 8px;
}
/* タイプモード */
.type-check-btn {
  width: 100%;
  margin-top: 10px;
  background: var(--ink);
  color: var(--paper);
  border: none;
  border-radius: 10px;
  padding: 10px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.type-input:disabled { opacity: 1; -webkit-text-fill-color: var(--ink); }
.type-result {
  width: 100%;
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  text-align: left;
  font-size: 14px;
  line-height: 1.6;
}
.type-result.ok { background: rgba(79, 122, 104, 0.15); }
.type-result.ng { background: rgba(179, 56, 42, 0.1); }
.type-result-label { font-size: 11px; color: var(--muted); margin-right: 6px; }
.type-result-yours { text-decoration: line-through; color: var(--seal); font-family: ui-monospace, SFMono-Regular, monospace; }
.type-result-answer { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 20px; font-weight: bold; color: var(--jade); }
.bottom-sheet {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: var(--paper);
  color: var(--ink);
  border-radius: 24px 24px 0 0;
  padding: 24px;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  max-height: 80vh;
  overflow-y: auto;
  z-index: 100;
}
.bottom-sheet.open { transform: translateY(0); }
.bottom-sheet .chip { border-color: rgba(0,0,0,0.25); color: var(--muted); }
.bottom-sheet .chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.guide-chapter { margin-top: 20px; }
.guide-chapter h3 { font-size: 15px; margin: 0 0 8px; padding-bottom: 6px; border-bottom: 2px solid var(--gold); }
.guide-notes { font-size: 13px; line-height: 1.7; white-space: pre-wrap; background: rgba(255,255,255,0.45); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
.guide-notes.empty { color: var(--muted); font-style: italic; }
.guide-label { font-size: 11px; font-weight: bold; color: var(--muted); margin: 10px 0 4px; }
.guide-themes { display: flex; flex-wrap: wrap; gap: 4px; }
.guide-theme { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: rgba(0,0,0,0.06); }
.guide-rule { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.08); }
.guide-rule-no { flex-shrink: 0; min-width: 34px; font-size: 12px; font-weight: bold; color: #b45309; }
.guide-rule-title { flex: 1; font-size: 13px; line-height: 1.5; }
.guide-rule-meta { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.guide-rule-weak { color: var(--seal); font-weight: bold; }
.guide-solve-btn { flex-shrink: 0; background: transparent; border: 1px solid var(--jade); color: var(--jade); border-radius: 12px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
.phase-overview { font-size: 13px; line-height: 1.7; margin-bottom: 10px; }
.phase-cards { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
.phase-card { background: rgba(255,255,255,0.5); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.6; }
.phase-card strong { display: block; color: #b45309; font-size: 13px; }
.phase-list { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.7; }
.phase-steps { display: flex; flex-direction: column; gap: 8px; }
.phase-step { display: flex; gap: 10px; background: rgba(234,179,8,0.08); border-left: 3px solid #eab308; border-radius: 6px; padding: 8px 10px; }
.phase-step-no { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: #b45309; color: #fff; font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
.phase-step-title { font-size: 13px; font-weight: bold; color: #b45309; }
.phase-step-action { font-size: 12.5px; font-weight: 600; margin-top: 2px; line-height: 1.6; }
.phase-step-detail { font-size: 12px; color: #555; margin-top: 4px; line-height: 1.65; white-space: pre-line; }
.phase-tips { margin-top: 10px; background: rgba(234,179,8,0.12); border-radius: 8px; padding: 8px 10px; }
.phase-tips-title { font-size: 12px; font-weight: bold; color: #b45309; margin-bottom: 2px; }
.grammar-phase-details { margin: 10px 0; padding: 10px 12px; background: rgba(234,179,8,0.08); border: 1px solid rgba(234,179,8,0.25); border-radius: 8px; }
.grammar-phase-details summary { cursor: pointer; font-weight: 600; color: #b45309; font-size: 13px; }
.grammar-phase-details .phase-steps { margin-top: 10px; }
.chip.rule-filter-chip { border-color: #b45309; color: #b45309; }
.sheet-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
  z-index: 99;
}
.sheet-overlay.open { opacity: 1; pointer-events: auto; }
.weak-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid rgba(0,0,0,0.1);
}
.weak-word {
  font-family: monospace;
  font-size: 16px;
  font-weight: bold;
}
.weak-meaning {
  font-size: 13px;
  color: #555;
  margin-top: 4px;
}
.del-btn {
  background: transparent;
  border: 1px solid var(--seal);
  color: var(--seal);
  border-radius: 12px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
}
.weak-list-summary { font-size: 12px; color: var(--muted); margin: -4px 0 8px; }
.weak-mode-row { flex-wrap: wrap; margin-bottom: 10px; }
.weak-list-summary strong { color: var(--seal); }
.weak-due { font-size: 11px; color: var(--muted); margin-top: 4px; }
.weak-due.now { color: var(--seal); font-weight: bold; }
/* 学習記録のバックアップ */
.backup-open-btn { width: 100%; margin: 0 0 12px; padding: 9px 12px; border-radius: 10px; border: 1px dashed rgba(0,0,0,0.3); background: rgba(255,255,255,0.4); color: var(--ink); font-family: inherit; font-size: 13px; text-align: left; cursor: pointer; }
.backup-back { background: none; border: none; padding: 0; margin: 0 0 8px; color: var(--muted); font-family: inherit; font-size: 13px; cursor: pointer; }
.backup-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.backup-table td, .backup-table th { padding: 6px 4px; border-bottom: 1px solid rgba(0,0,0,0.08); text-align: left; }
.backup-table th { font-size: 11px; color: var(--muted); }
.backup-table.compare td + td, .backup-table.compare th + th { text-align: right; }
.backup-note { font-size: 12px; color: var(--muted); margin: 6px 0 10px; }
.backup-file-name { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; word-break: break-all; }
.backup-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.backup-btn { flex: 1 1 auto; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--ink); background: transparent; color: var(--ink); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.backup-btn.primary { background: var(--ink); color: var(--paper); }
.backup-btn.danger { background: var(--seal); border-color: var(--seal); color: #fff; }
.backup-btn.small { display: block; margin-top: 6px; padding: 6px 10px; font-size: 12px; }
.backup-msg { font-size: 13px; line-height: 1.6; border-radius: 8px; padding: 8px 10px; margin: 0 0 10px; }
.backup-msg.ok { background: rgba(79,122,104,0.15); color: var(--jade); }
.backup-msg.ng { background: rgba(179,56,42,0.1); color: var(--seal); }
.backup-msg.warn { background: rgba(234,179,8,0.15); color: #92400e; margin-top: 10px; }
.backup-notes { margin: 8px 0 0; padding-left: 18px; font-size: 12.5px; line-height: 1.6; }
.backup-check { display: flex; gap: 8px; align-items: center; font-size: 13px; margin: 6px 0; cursor: pointer; }
.backup-undo { font-size: 12.5px; line-height: 1.6; background: rgba(0,0,0,0.04); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
.backup-help { font-size: 12px; color: var(--muted); line-height: 1.7; }
.cloze-sentence { font-size: clamp(16px, 5vw, 20px); font-weight: 600; line-height: 1.6; margin-bottom: 8px; word-break: break-word; }
mark { background: rgba(201, 160, 92, 0.35); color: inherit; border-radius: 3px; padding: 0 2px; }
.speak-btn { background: none; border: none; cursor: pointer; font-size: 0.7em; padding: 2px 6px; margin-left: 4px; vertical-align: middle; }
.speak-row { margin-top: 8px; display: flex; justify-content: center; gap: 8px; }
.speak-row .speak-btn { font-size: 14px; margin: 0; padding: 8px 14px; min-height: 36px; border: 1px solid rgba(0,0,0,0.15); border-radius: 18px; color: var(--ink); }
.stat-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid rgba(201, 160, 92, 0.2); font-size: 14px; }
.stat-label { color: var(--muted); flex-shrink: 0; }
.stat-value { text-align: right; }
.stat-bars { display: flex; gap: 4px; height: 80px; margin: 16px 0 4px; }
.stat-bar-col { flex: 1; height: 100%; display: flex; align-items: flex-end; }
.stat-bar { width: 100%; background: var(--gold); border-radius: 3px 3px 0 0; }
.stat-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 12px; }
.toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 200; max-width: calc(100% - 32px); background: var(--paper); color: var(--ink); padding: 8px 14px; border-radius: 20px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); transition: opacity 0.4s; }
.toast.hide { opacity: 0; }
.weak-badge {
  background: var(--seal);
  color: white;
  border-radius: 10px;
  padding: 2px 6px;
  font-size: 10px;
  vertical-align: middle;
  margin-left: 4px;
}
.card.flash-mode {
  flex: 1;
  cursor: pointer;
  perspective: 1000px;
  padding: 0;
  background: transparent;
  box-shadow: none;
  border: none;
  min-height: 200px;
  overflow: visible;
}
.card.flash-mode > * { margin: 0; }
.flip-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 200px;
  text-align: center;
  transition: transform 0.6s;
  transform-style: preserve-3d;
}
.card.flash-mode.flipped .flip-card-inner {
  transform: rotateY(180deg);
}
.card-face {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  min-height: 200px;
  overflow-y: auto;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  background: var(--paper);
  color: var(--ink);
  border-radius: 16px;
  padding: 20px 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.card-back {
  transform: rotateY(180deg);
}

/* Grammar Part 5 styles */
.grammar-card {
  text-align: left !important;

<script>
// localStorage が壊れていたり使えなかったり（プライベートモードなど）しても起動できるようにする
function loadJSON(key, fallback) {
  try {
    const v = JSON.parse(localStorage.getItem(key));
    if (v === null || typeof v !== typeof fallback || Array.isArray(v) !== Array.isArray(fallback)) return fallback;
    return v;
  } catch (e) {
    return fallback;
  }
}

function saveJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    // 保存できなくても学習は続けられるので無視する
  }
}

// ==================== 苦手の間隔復習 ====================

const DAY_MS = 24 * 60 * 60 * 1000;
// 復習の間隔（日）。復習日以降に正解するたびに次の間隔へ進み、最後の間隔のあとも正解したら苦手から外れる
const REVIEW_INTERVALS = [1, 3, 7];

// 苦手1件の形を確かめる。前のバージョンの記録（復習日なし）は「今すぐ復習」からやり直し、直せないものは null
function normalizeWeakEntry(e) {
  if (!e || typeof e !== 'object' || Array.isArray(e)) return null;
  const added = Number.isFinite(e.added) && e.added > 0 ? e.added : Date.now();
  if (e.due === undefined) return { streak: 0, added, due: 0 };
  if (typeof e.due !== 'number' || !Number.isFinite(e.due) || e.due < 0) return null;
  if (!Number.isInteger(e.streak) || e.streak < 0 || e.streak > REVIEW_INTERVALS.length) return null;
  return { streak: e.streak, added, due: e.due };
}

// 苦手データのキー: 単語は綴り、文法は問題番号
function isWordKey(k) {
  return k !== '' && k.length <= 200 && k !== '__proto__';
}

function isGrammarKey(k) {
  return /^[1-9]\d{0,8}$/.test(k);
}

// 苦手データ全体を確かめ、形の正しくない件は除いて数を返す（起動時の読み込みとバックアップの復元で共通）
function sanitizeWeakData(raw, isValidKey) {
  const data = {};
  let invalid = 0;
  Object.keys(raw).forEach(k => {
    const entry = isValidKey(k) ? normalizeWeakEntry(raw[k]) : null;
    if (entry) data[k] = entry;
    else invalid++;
  });
  return { data, invalid };
}

function loadWeakData(key, isValidKey) {
  return sanitizeWeakData(loadJSON(key, {}), isValidKey).data;
}

function startOfToday() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

function isDue(entry) {
  return entry.due <= Date.now();
}

// 回答結果を苦手データに反映する（単語・文法共通）。間違えたら今すぐ復習対象に戻す
function updateWeakEntry(store, key, isCorrect) {
  const entry = store[key];
  if (!isCorrect) {
    store[key] = { streak: 0, added: entry ? entry.added : Date.now(), due: Date.now() };
    return;
  }
  // 苦手でない問題や、復習日より前の正解では記録を進めない
  if (!entry || !isDue(entry)) return;
  if (entry.streak >= REVIEW_INTERVALS.length) {
    delete store[key];
  } else {
    entry.streak++;
    entry.due = startOfToday() + REVIEW_INTERVALS[entry.streak - 1] * DAY_MS;
  }
}

// 苦手リストに出す「次の復習」の表示
function dueLabel(entry) {
  if (isDue(entry)) return '<div class="weak-due now">要復習</div>';
  const days = Math.round((entry.due - startOfToday()) / DAY_MS);
  const d = new Date(entry.due);
  return `<div class="weak-due">次の復習 ${d.getMonth()+1}/${d.getDate()}（${days === 1 ? '明日' : `${days}日後`}）</div>`;
}

// ==================== 単語の記録（モードごと） ====================
// 苦手と学習済みの単語は、英→日・日→英・カード・タイプのモードごとに別々に記録する

const VOCAB_MODES = ['e2j', 'j2e', 'flash', 'type', 'cloze'];
const MODE_LABELS = { e2j: '英→日', j2e: '日→英', flash: 'カード', type: 'タイプ', cloze: '穴埋め' };
const WEAK_WORDS_KEY = 'toeic_weak_words_by_mode';
const SEEN_WORDS_KEY = 'toeic_seen_words_by_mode';
// モード共通だったころの記録。初めて開いたときに移し替え、元の記録は消さずに残す
const LEGACY_WEAK_WORDS_KEY = 'toeic_weak_words';
const LEGACY_SEEN_WORDS_KEY = 'toeic_seen_words';

// どのモードで間違えたか分からない記録は、4モード全部に（復習日と段階もそのまま）写す
function copyToAllModes(value) {
  return Object.fromEntries(VOCAB_MODES.map(m => [m, JSON.parse(JSON.stringify(value))]));
}

// { e2j: {綴り: 苦手1件}, … } を確かめる。知らないモード名や形の正しくない件は除いて数を返す
function sanitizeWeakByMode(raw) {
  const data = {};
  let invalid = Object.keys(raw).filter(k => !VOCAB_MODES.includes(k)).length;
  VOCAB_MODES.forEach(m => {
    if (raw[m] === undefined) {
      data[m] = {};
    } else if (isPlainObject(raw[m])) {
      const r = sanitizeWeakData(raw[m], isWordKey);
      data[m] = r.data;
      invalid += r.invalid;
    } else {
      data[m] = {};
      invalid++;
    }
  });
  return { data, invalid };
}

// { e2j: [綴り, …], … } を確かめる。文字列以外は除き、重複はまとめる
function sanitizeSeenByMode(raw) {
  const data = {};
  let invalid = Object.keys(raw).filter(k => !VOCAB_MODES.includes(k)).length;
  VOCAB_MODES.forEach(m => {
    const list = raw[m] === undefined ? [] : raw[m];
    if (!Array.isArray(list)) {
      data[m] = [];
      invalid++;
      return;
    }
    const valid = list.filter(w => typeof w === 'string' && isWordKey(w));
    invalid += list.length - valid.length;
    data[m] = [...new Set(valid)];
  });
  return { data, invalid };
}

function loadWeakByMode() {
  const saved = loadJSON(WEAK_WORDS_KEY, null);
  if (saved !== null) return sanitizeWeakByMode(saved).data;
  const byMode = copyToAllModes(loadWeakData(LEGACY_WEAK_WORDS_KEY, isWordKey));
  saveJSON(WEAK_WORDS_KEY, byMode);
  return byMode;
}

function loadSeenByMode() {
  const saved = loadJSON(SEEN_WORDS_KEY, null);
  const lists = saved !== null
    ? sanitizeSeenByMode(saved).data
    : copyToAllModes(loadJSON(LEGACY_SEEN_WORDS_KEY, []).filter(w => typeof w === 'string'));
  if (saved === null) saveJSON(SEEN_WORDS_KEY, lists);
  return Object.fromEntries(VOCAB_MODES.map(m => [m, new Set(lists[m])]));
}

// ==================== 学習ログ ====================
// 日ごとの回答数と正解数。{ '2026-10-21': { v: [回答, 正解], g: [回答, 正解] } }（v は単語、g は文法）。
// 連続日数と学習統計はここから計算する

const DAILY_LOG_KEY = 'toeic_daily_log';
const DAILY_LOG_MAX_DAYS = 400;

// 端末のローカル日付を YYYY-MM-DD にする
function dateKey(d = new Date()) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

// [回答, 正解] を確かめる。回答も正解も 0 以上の整数で、正解は回答を超えない
function isCountPair(p) {
  return Array.isArray(p) && p.length === 2 && p.every(n => Number.isInteger(n) && n >= 0) && p[1] <= p[0];
}

// 日付キーが実在する日か（2026-13-40 などを弾く）
function isRealDateKey(k) {
  return /^\d{4}-\d{2}-\d{2}$/.test(k) && dateKey(parseLocalDate(k)) === k;
}

// 学習ログ全体を確かめ、形の正しくない日は除いて数を返す。新しい400日分だけ残す（古い分は件数に数えない）
function sanitizeDailyLog(raw) {
  const data = {};
  let invalid = 0;
  Object.keys(raw).forEach(k => {
    const day = raw[k];
    const ok = isRealDateKey(k) && day && typeof day === 'object' && !Array.isArray(day)
      && (day.v === undefined || isCountPair(day.v)) && (day.g === undefined || isCountPair(day.g));
    if (ok) data[k] = { v: day.v || [0, 0], g: day.g || [0, 0] };
    else invalid++;
  });
  Object.keys(data).sort().slice(0, -DAILY_LOG_MAX_DAYS).forEach(k => delete data[k]);
  return { data, invalid };
}

function loadDailyLog() {
  return sanitizeDailyLog(loadJSON(DAILY_LOG_KEY, {})).data;
}

// 回答を1件、今日の記録に足す（「わからない」は不正解として数える）
function recordActivity(app, isCorrect, now = new Date()) {
  const key = dateKey(now);
  const day = state.dailyLog[key] || (state.dailyLog[key] = { v: [0, 0], g: [0, 0] });
  const pair = day[app === 'grammar' ? 'g' : 'v'];
  pair[0]++;
  if (isCorrect) pair[1]++;
  Object.keys(state.dailyLog).sort().slice(0, -DAILY_LOG_MAX_DAYS).forEach(k => delete state.dailyLog[k]);
  saveJSON(DAILY_LOG_KEY, state.dailyLog);
}

// その日の回答数（単語と文法の合計）
function dayCount(log, key) {
  const day = log[key];
  return day ? day.v[0] + day.g[0] : 0;
}

// 連続して学習した日数。今日まだ学習していなければ、昨日から数える
function streakDays(log, todayKey) {
  const d = parseLocalDate(todayKey);
  if (dayCount(log, dateKey(d)) === 0) d.setDate(d.getDate() - 1);
  let n = 0;
  while (dayCount(log, dateKey(d)) > 0) {
    n++;
    d.setDate(d.getDate() - 1);
  }
  return n;
}

const GOALS = [10, 20, 50, 100];

// 画面上部の「🔥3日連続 ・ 今日 12/20」。今日の目標に届いたら done クラスを付ける
function updateStreakBar() {
  const bar = document.getElementById('streak-bar');
  if (!bar) return;
  const today = dateKey();
  const count = dayCount(state.dailyLog, today);
  bar.textContent = `🔥${streakDays(state.dailyLog, today)}日連続 ・ 今日 ${count}/${state.goal}`;
  bar.classList.toggle('done', count >= state.goal);
}

// 1日の目標を次の値にする（100 の次は 10）
function cycleGoal() {
  state.goal = GOALS[(GOALS.indexOf(state.goal) + 1) % GOALS.length];
  saveSettings();
  updateStreakBar();
  showToast(`今日の目標を${state.goal}問にしました`);
}

let state = {
  app: 'vocab', // 'vocab' or 'grammar'
  dailyLog: loadDailyLog(), // 日ごとの回答数と正解数
  goal: 20, // 1日の目標問題数（GOALS のどれか）
  priority: 'due_first', // 出題順: 'due_first'（要復習を先に）か 'random'

  // Vocab state
  mode: 'e2j',
  sourceFilter: 'all',
  rangeFilter: null,
  dateFilter: [],
  posFilter: 'all',
  weakFilter: 'all',
  pool: [],
  currentIndex: 0,
  score: 0,
  answeredCount: 0,
  weakByMode: loadWeakByMode(), // { e2j: {綴り: 苦手1件}, … }
  seenByMode: loadSeenByMode(), // { e2j: Set(綴り), … }
  currentOptions: [],
  answered: false,

  // Grammar state
  grammarBook: 'all',
  grammarChapter: 'all',
  grammarWeakFilter: 'all',
  grammarRule: null, // 金のルール番号で絞り込み中なら数値
  guideChapter: 'all',
  grammarPool: [],
  currentGrammarIndex: 0,
  grammarScore: 0,
  grammarAnsweredCount: 0,
  grammarWeakData: loadWeakData('toeic_weak_grammar', isGrammarKey),
  grammarAnswered: false,

  weakSort: 'new', // 苦手リストの並び順
  weakListMode: 'e2j' // 単語の苦手リストで表示しているモード
};

// 今のモード（または指定したモード）の単語の苦手・学習済み
function wordWeak(mode = state.mode) {
  return state.weakByMode[mode];
}

function wordSeen(mode = state.mode) {
  return state.seenByMode[mode];
}

// "2026-06-22" を現地時間の日付として読む（new Date("2026-06-22") は UTC 扱いで、日本より西の地域では前日になる）
function parseLocalDate(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function getWeekLabel(dateStr) {
  const d = parseLocalDate(dateStr);
  const day = d.getDay();
  d.setDate(d.getDate() - (day === 0 ? 6 : day - 1)); // その週の月曜
  return `${d.getMonth()+1}/${d.getDate()}〜`;
}

// ラベルのまま並べると "7/13〜" が "7/6〜" より前に来るので、元の日付順に並べてからラベルにする
const DATES = [...new Set(RAW_WORDS.filter(x => x.d).map(x => x.d).sort().map(getWeekLabel))];

function saveWeakData() {
  saveJSON(WEAK_WORDS_KEY, state.weakByMode);

}

function seenSnapshot() {
  return Object.fromEntries(VOCAB_MODES.map(m => [m, [...state.seenByMode[m]]]));

function setBadge(id, count) {
  const badge = document.getElementById(id);
  if (!badge) return;
  badge.style.display = count > 0 ? 'inline-block' : 'none';
  badge.innerText = count;
}

function updateWeakBadge() {
  // 「苦手のみ」「要復習」を押したときに出る問題数（今のモードの記録で、出典・日付・品詞・範囲の絞り込みを反映）
  const data = wordWeak();
  const weak = dedupeWords(RAW_WORDS.filter(w => data[w.w] !== undefined && wordMatchesBaseFilters(w)));
  setBadge('weak-badge', weak.length);
  setBadge('due-badge', weak.filter(w => isDue(data[w.w])).length);
}

// TEPPAN の番号を100語ずつに区切った範囲
const TEPPAN_MAX_NO = RAW_WORDS.reduce((max, w) => (w.s === 'teppan' && w.no ? Math.max(max, w.no) : max), 0);
const TEPPAN_RANGES = [];
for (let start = 1; start <= TEPPAN_MAX_NO; start += 100) {
  TEPPAN_RANGES.push({ start, end: Math.min(start + 99, TEPPAN_MAX_NO) });
}

function initRangeFilters() {
  const rf = document.getElementById('range-filters');
  if (!rf) return;
  let html = `<button class="chip active" data-range="all">全番号 (1〜${TEPPAN_MAX_NO})</button>`;
  TEPPAN_RANGES.forEach(({ start, end }) => {
    html += `<button class="chip" data-range="${start}-${end}">${start}〜${end}</button>`;
  });
  rf.innerHTML = html;

  rf.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', e => {
      rf.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      const val = e.currentTarget.dataset.range;
      if (val === 'all') {
        state.rangeFilter = null;
      } else {
        const [start, end] = val.split('-').map(Number);
        state.rangeFilter = { start, end };
      }
      applyFilters();
    });
  });
}

function saveGrammarWeakData() {

function updateGrammarWeakBadge() {
  // 「苦手のみ」「要復習」を押したときに出る問題数（今の本・章・ルールの絞り込みを反映）
  const weak = RAW_GRAMMAR.filter(ex => state.grammarWeakData[ex.id] !== undefined && grammarMatchesBaseFilters(ex));
  setBadge('grammar-weak-badge', weak.length);
  setBadge('grammar-due-badge', weak.filter(ex => isDue(state.grammarWeakData[ex.id])).length);
}

function getGrammarChaptersList() {
  const book = state.grammarBook || 'all';
  const pool = book === 'all' ? RAW_GRAMMAR : RAW_GRAMMAR.filter(g => (g.b || 'sekai') === book);
  
  if (book === 'kin') {
    const kinChaps = [];
    const seen = new Set();
    RAW_GRAMMAR.filter(g => g.b === 'kin').forEach(g => {
      if (!seen.has(g.ch)) {
        seen.add(g.ch);
        const count = RAW_GRAMMAR.filter(x => x.b === 'kin' && x.ch === g.ch).length;
        kinChaps.push({ ch: g.ch, title: `第${g.ch}章 ${g.ch_title} (${count}問)` });
      }
    });
    return [{ ch: 'all', title: `金の文法 全7章 (${pool.length}問)` }, ...kinChaps];
  } else if (book === 'sekai') {
    const sekaiChaps = [];
    const seen = new Set();
    RAW_GRAMMAR.filter(g => (g.b || 'sekai') === 'sekai').forEach(g => {
      if (!seen.has(g.ch)) {
        seen.add(g.ch);
        const count = RAW_GRAMMAR.filter(x => (x.b || 'sekai') === 'sekai' && x.ch === g.ch).length;
        sekaiChaps.push({ ch: g.ch, title: `第${g.ch}章 ${g.ch_title} (${count}問)` });
      }
    });
    return [{ ch: 'all', title: `世界一 全14章 (${pool.length}問)` }, ...sekaiChaps];
  } else {
    return [
      { ch: 'all', title: `全問 (${pool.length}問)` }
    ];
  }
}

// 苦手フィルタ以外の絞り込み（本・章・ルール）
function grammarMatchesBaseFilters(ex) {
  const itemBook = ex.b || 'sekai';
  if (state.grammarBook !== 'all' && itemBook !== state.grammarBook) return false;
  if (state.grammarChapter !== 'all' && ex.ch !== state.grammarChapter) return false;
  if (state.grammarRule !== null && ex.rule?.number !== state.grammarRule) return false;
  return true;
}

function applyGrammarFilters() {
  let filtered = RAW_GRAMMAR.filter(ex => {
    if (!grammarMatchesBaseFilters(ex)) return false;
    const entry = state.grammarWeakData[ex.id];
    if (state.grammarWeakFilter === 'weak_only' && !entry) return false;
    if (state.grammarWeakFilter === 'due' && !(entry && isDue(entry))) return false;
    return true;
  });

  state.grammarPool = state.priority === 'due_first' && state.grammarWeakFilter === 'all'
    ? orderByDue(filtered, ex => { const e = state.grammarWeakData[ex.id]; return !!e && isDue(e); })
    : shuffle(filtered);
  state.currentGrammarIndex = 0;
  state.grammarScore = 0;
  state.grammarAnsweredCount = 0;
  updateGrammarWeakBadge();
  updateFilterSummary();
  renderCurrentGrammar();
}

function renderCurrentGrammar() {
  resetActionBar();
  document.getElementById('choices-container').classList.remove('compact');
  const container = document.getElementById('quiz-container');
  const choicesDiv = document.getElementById('choices-container');
  const nextBtn = document.getElementById('next-btn');

  if (state.grammarPool.length === 0) {
    container.innerHTML = `<div class="card"><div class="meaning-display">条件に合う文法問題がありません</div></div>`;
    choicesDiv.innerHTML = '';
    nextBtn.style.display = 'none';
    updateFooter();
    return;
  }

  if (state.currentGrammarIndex >= state.grammarPool.length) {
    container.innerHTML = `<div class="card"><div class="meaning-display">文法ドリル完了！ 🎉</div><div style="font-size:14px;color:var(--muted);margin-top:8px;">正答: ${state.grammarScore} / ${state.grammarAnsweredCount}</div></div>`;
    choicesDiv.innerHTML = '';
    nextBtn.style.display = 'none';
    updateFooter();
    return;
  }

  const ex = state.grammarPool[state.currentGrammarIndex];
  state.grammarAnswered = false;
  choicesDiv.innerHTML = '';
  nextBtn.style.display = 'none';

  // Highlight blank in question
  const formattedQ = ex.q.replace(/-{3,}/g, '<span style="color:var(--seal);font-weight:bold;text-decoration:underline;">_______</span>');

  const isKin = ex.b === 'kin';
  const bookBadgeHtml = isKin 
    ? '<span class="grammar-book-badge badge-kin">👑 金の文法</span>'
    : '<span class="grammar-book-badge badge-sekai">📖 世界一</span>';

  const ruleHtml = (ex.rule && ex.rule.number) ? `
    <div class="grammar-rule-card">
      <div class="grammar-rule-header">
        <span class="grammar-rule-icon">👑</span>
        <span class="grammar-rule-badge-text">金のルール ${ex.rule.number}</span>
        ${ex.rule.category && ex.rule.category !== `第${ex.ch}章 ${ex.ch_title}` ? `<span class="grammar-rule-cat">${ex.rule.category}</span>` : ''}
      </div>
      <div class="grammar-rule-title">${ex.rule.title}</div>
    </div>
  ` : '';

  const phaseInfo = isKin ? (typeof KIN_PHASES !== 'undefined' ? KIN_PHASES.find(p => p.chapter === ex.ch) : null) : null;
  const phaseHtml = (phaseInfo && phaseInfo.phases) ? `
    <details class="grammar-phase-details">
      <summary>💡 第${ex.ch}章 (${escapeHtml(phaseInfo.chapter_title)}) の解き方手順を見る</summary>
      ${renderPhaseSteps(phaseInfo.phases)}
    </details>
  ` : '';

  container.innerHTML = `
    <div class="card grammar-card" id="main-card">
      <div class="grammar-meta">
        <span class="grammar-badge">Part 5</span>
        ${bookBadgeHtml}
      </div>
      <div class="grammar-question">${formattedQ}</div>
      <div class="grammar-exp-container" id="grammar-exp-box" style="display:none;">
        <div class="grammar-correct-ans">正解: (${['A','B','C','D'][ex.a]}) ${ex.c[ex.a]}</div>
        <div class="grammar-your-ans" id="grammar-your-ans" style="display:none;"></div>
        <div class="grammar-theme-revealed">第${ex.ch}章 ${ex.ch_title} ・${ex.th_title}</div>
        ${ruleHtml}
        ${phaseHtml}
        <div class="grammar-exp-text">${ex.exp}</div>
        ${ex.v && ex.v.length > 0 ? `
          <div class="grammar-vocab-list">
            <div class="grammar-vocab-title">📌 重要語彙</div>
            <div class="grammar-vocab-items">
              ${ex.v.map(v => `<span class="grammar-vocab-item"><strong>${v.word}</strong>: ${v.meaning}</span>`).join('')}
            </div>
          </div>
        ` : ''}
      </div>

  ex.c.forEach((choice, idx) => {

function handleGrammarAnswer(selectedIdx, btn) {
  if (state.grammarAnswered) return;
  const ex = state.grammarPool[state.currentGrammarIndex];
  const isCorrect = selectedIdx === ex.a;

  if (!isCorrect) {
    btn.classList.add('wrong');
    shakeCard();
    const yours = document.getElementById('grammar-your-ans');
    yours.textContent = `あなたの回答: (${['A','B','C','D'][selectedIdx]}) ${ex.c[selectedIdx]}`;
    yours.style.display = 'block';
    recordWeakGrammar(ex, false);
  } else {
    state.grammarScore++;
    recordWeakGrammar(ex, true);
  }
  revealGrammarAnswer(ex);
}

// 「わからない」: 正解と解説を見せて苦手に登録。スコアは増やさず、赤表示や揺れは出さない
function handleGrammarDontKnow() {
  if (state.grammarAnswered) return;
  const ex = state.grammarPool[state.currentGrammarIndex];
  recordWeakGrammar(ex, false);
  revealGrammarAnswer(ex);
}

function revealGrammarAnswer(ex) {
  state.grammarAnswered = true;
  setDontKnowVisible(false);

  const choicesDiv = document.getElementById('choices-container');
  choicesDiv.querySelectorAll('.choice-btn').forEach((b, i) => {
    if (i === ex.a) b.classList.add('correct');
    const mark = i === ex.a ? '✓' : (b.classList.contains('wrong') ? '✗' : '');
    if (mark) b.insertAdjacentHTML('beforeend', `<span class="choice-mark">${mark}</span>`);
    // 回答後は全文表示のまま。タップで記号だけの1行に縮めて解説を広く読める（再タップで戻る）
    b.onclick = () => choicesDiv.classList.toggle('compact');
  });

  const expBox = document.getElementById('grammar-exp-box');
  if (expBox) expBox.style.display = 'block';

  showNextButton(() => {
    state.currentGrammarIndex++;
    renderCurrentGrammar();
  });
  updateFooter();
}

function recordWeakGrammar(ex, isCorrect) {
  state.grammarAnsweredCount++;
  recordActivity('grammar', isCorrect);
  updateWeakEntry(state.grammarWeakData, ex.id, isCorrect);
  saveGrammarWeakData();
}

// 単語／文法の切り替え。前回の続きが保存されていればそこから、なければ今の絞り込みで出題し直す
function setApp(app) {
  state.app = app;
  const isGrammar = app === 'grammar';
  document.querySelectorAll('#app-type-segments .segment').forEach(b => b.classList.toggle('active', b.dataset.app === app));
  document.querySelector('.header .title').innerText = isGrammar ? '文法ドリル (Part 5)' : '単語ドリル';
  document.getElementById('rule-guide-link').style.display = isGrammar ? 'inline' : 'none';
  document.getElementById('mode-segments').style.display = isGrammar ? 'none' : 'flex';
  document.getElementById('vocab-filters').style.display = isGrammar ? 'none' : 'block';
  document.getElementById('grammar-filters').style.display = isGrammar ? 'block' : 'none';
  resetActionBar();

  if (isGrammar) {
    if (!restoreSession('grammar')) return applyGrammarFilters();
    updateGrammarWeakBadge();
    updateFilterSummary();
    renderCurrentGrammar();
  } else {
    if (!restoreSession('vocab')) return applyFilters();
    updateWeakBadge();
    updateFilterSummary();
    renderCurrent();
  }
}

// TEPPAN は番号範囲で、それ以外は日付・品詞で絞る

  const teppan = state.sourceFilter === 'teppan';
  document.getElementById('date-filters').style.display = teppan ? 'none' : 'flex';

// ボタンの選択表示を state に合わせる（保存していた設定を復元したときなど）
function syncFilterUI() {
  const mark = (selector, isActive) =>
    document.querySelectorAll(selector).forEach(b => b.classList.toggle('active', isActive(b.dataset)));
  const range = state.rangeFilter ? `${state.rangeFilter.start}-${state.rangeFilter.end}` : 'all';
  mark('#source-segments .segment', d => d.source === state.sourceFilter);
  mark('#date-filters .chip', d => d.date === 'all' ? state.dateFilter.length === 0 : state.dateFilter.includes(d.date));
  mark('#pos-filters .chip', d => d.pos === state.posFilter);
  mark('#range-filters .chip', d => d.range === range);

  mark('#priority-segments .segment', d => d.priority === state.priority);
  mark('#grammar-book-segments .segment', d => d.gbook === state.grammarBook);
  mark('#grammar-weak-segments .segment', d => d.gweak === state.grammarWeakFilter);
  renderGrammarChapterFilters();
  updateSourceRows();

    btn.addEventListener('click', e => setApp(e.currentTarget.dataset.app));
  });

  initGrammarFilters();
  initRangeFilters();

  document.querySelectorAll('#source-segments .segment').forEach(btn => {
    btn.addEventListener('click', e => {
      document.querySelectorAll('#source-segments .segment').forEach(b => b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      state.sourceFilter = e.currentTarget.dataset.source;
      updateSourceRows();
      applyFilters();
    });
  });

  const df = document.getElementById('date-filters');
  df.innerHTML = `<button class="chip active" data-date="all">すべて</button>`;
  DATES.forEach(d => {
    df.innerHTML += `<button class="chip" data-date="${d}">${d}</button>`;
  });
  
  document.querySelectorAll('#date-filters .chip').forEach(btn => {
    btn.addEventListener('click', e => {
      const val = e.currentTarget.dataset.date;
      if (val === 'all') {
        state.dateFilter = [];
      } else if (state.dateFilter.includes(val)) {
        state.dateFilter = state.dateFilter.filter(x => x !== val);
      } else {
        state.dateFilter.push(val);
      }
      syncFilterUI();
      applyFilters();
    });
  });

  document.querySelectorAll('#pos-filters .chip').forEach(btn => {
    btn.addEventListener('click', e => {
      document.querySelectorAll('#pos-filters .chip').forEach(b => b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      state.posFilter = e.currentTarget.dataset.pos;
      applyFilters();
    });
  });

  document.querySelectorAll('#weak-segments .segment').forEach(btn => {
    btn.addEventListener('click', e => {
      document.querySelectorAll('#weak-segments .segment').forEach(b => b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      state.weakFilter = e.currentTarget.dataset.weak;
      applyFilters();
    });
  });

  document.querySelectorAll('#priority-segments .segment').forEach(btn => {
    btn.addEventListener('click', e => {
      state.priority = e.currentTarget.dataset.priority;
      syncFilterUI();
      saveSettings();
      if (state.app === 'grammar') applyGrammarFilters();
      else applyFilters();
    });
  });

  document.querySelectorAll('#mode-segments .segment').forEach(btn => {
    btn.addEventListener('click', e => {
      document.querySelectorAll('#mode-segments .segment').forEach(b => b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      const previous = state.mode;
      state.mode = e.currentTarget.dataset.mode;
      updateWeakBadge();
      // 苦手・未学習で絞っているときと、穴埋めに出入りするときは出題範囲が変わるので出題し直す。それ以外なら並びはそのまま
      if (state.weakFilter !== 'all' || previous === 'cloze' || state.mode === 'cloze') applyFilters();
      else renderCurrent();

  const toggle = document.getElementById('filter-toggle');
  const drawer = document.getElementById('filter-drawer');

    toggle.setAttribute('aria-expanded', String(open));
  });
}

function updateFilterSummary() {
  let n = 0;
  if (state.app === 'grammar') {
    if (state.grammarBook !== 'all') n++;
    if (state.grammarChapter !== 'all') n++;
    if (state.grammarRule !== null) n++;
    if (state.grammarWeakFilter !== 'all') n++;
  } else {
    if (state.sourceFilter !== 'all') n++;
    if (state.sourceFilter === 'teppan') {
      if (state.rangeFilter) n++;
    } else {
      n += state.dateFilter.length;
      if (state.posFilter !== 'all') n++;
    }
    if (state.weakFilter !== 'all') n++;
  }
  const el = document.getElementById('filter-count');
  if (!el) return;
  el.style.display = n > 0 ? 'inline-block' : 'none';
  el.innerText = n;
}

function shuffle(array) {
  let currentIndex = array.length, randomIndex;
  while (currentIndex !== 0) {
    randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
  }
  return array;
}

// 期限の来たものを先頭に、残りを後ろに、それぞれシャッフルして並べる（元の配列は変えない）
function orderByDue(items, isDueFn) {
  const due = items.filter(isDueFn);
  const rest = items.filter(x => !isDueFn(x));
  return [...shuffle(due), ...shuffle(rest)];
}

// 品詞「句・表現」に含める品詞（TEPPAN はそのまま「句・表現」で登録されている）
const PHRASE_POS = ['名詞句', '動詞句', '形容詞句', '副詞句', '表現', '句・表現'];

// 苦手フィルタ以外の絞り込み（出典・範囲・日付・品詞）
function wordMatchesBaseFilters(w) {
  // 穴埋めは、例文の見出し語を空欄にできる語だけ出題する
  if (state.mode === 'cloze' && !findBlank(w)) return false;

  // source
  if (state.sourceFilter !== 'all' && w.s !== state.sourceFilter) return false;

  // range filter (for TEPPAN)
  if (state.sourceFilter === 'teppan' && state.rangeFilter) {
    if (!w.no || w.no < state.rangeFilter.start || w.no > state.rangeFilter.end) return false;
  }

  // date (for daily words or all)
  if (state.sourceFilter !== 'teppan' && state.dateFilter.length > 0) {
    if (!w.d || !state.dateFilter.includes(getWeekLabel(w.d))) return false;
  }

  // pos (for daily words or all)
  if (state.sourceFilter !== 'teppan' && state.posFilter !== 'all') {
    if (state.posFilter === '句・表現') {
      if (!PHRASE_POS.includes(w.p)) return false;
    } else {
      if (w.p !== state.posFilter) return false;
    }
  }
  return true;
}

// 日々の単語と TEPPAN の両方にある単語は1問にまとめる（苦手記録は綴りで共通なので）
function dedupeWords(words) {
  const seen = new Set();
  return words.filter(w => {
    if (seen.has(w.w)) return false;
    seen.add(w.w);
    return true;
  });
}

function applyFilters() {
  let filtered = RAW_WORDS.filter(w => {
    if (!wordMatchesBaseFilters(w)) return false;

    // weak
    const entry = wordWeak()[w.w];
    if (state.weakFilter === 'weak_only' && !entry) return false;
    if (state.weakFilter === 'weak_unlearned' && !entry && wordSeen().has(w.w)) return false;
    if (state.weakFilter === 'due' && !(entry && isDue(entry))) return false;

    return true;
  });
  
  // 苦手で絞っているときは出題範囲がもともと苦手の語なので、並びは変えない
  const deduped = dedupeWords(filtered);
  state.pool = state.priority === 'due_first' && state.weakFilter === 'all'
    ? orderByDue(deduped, w => { const e = wordWeak()[w.w]; return !!e && isDue(e); })
    : shuffle(deduped);
  state.currentIndex = 0;
  state.score = 0;
  state.answeredCount = 0;
  updateWeakBadge();
  updateFilterSummary();
  renderCurrent();
}

// 4択の「わからない」ボタン。次へボタンと同じ枠を回答前だけ使う
function setDontKnowVisible(visible) {
  const dk = document.getElementById('dont-know-btn');
  if (dk) dk.style.display = visible ? 'block' : 'none';
}

// 下のボタンを両方隠し、カードモードで書き換えた文言を元に戻す
function resetActionBar() {
  const dk = document.getElementById('dont-know-btn');
  const nextBtn = document.getElementById('next-btn');
  dk.style.display = 'none';
  dk.innerText = 'わからない';
  nextBtn.style.display = 'none';
  nextBtn.innerText = '次へ';
}

function showNextButton(onNext) {
  const nextBtn = document.getElementById('next-btn');
  nextBtn.style.display = 'block';
  nextBtn.onclick = onNext;
}

function nextWord() {
  state.currentIndex++;
  renderCurrent();
}

// 不正解のときにカードを揺らす。揺らしたカードそのものを戻すので、0.4秒以内に次へ進んでも問題ない
function shakeCard() {
  const card = document.getElementById('main-card');
  if (!card) return;
  card.classList.add('shake');
  setTimeout(() => card.classList.remove('shake'), 400);
}

// 品詞は答えの推測材料になるので回答前は隠す。No.しか無いときは品詞の枠ごと隠す
function posTagHtml(word, showPos) {
  const no = word.no ? `<span style="font-weight:700;margin-right:6px;color:var(--gold);">No.${word.no}</span>` : '';
  return `<div class="pos-tag" id="pos-tag"${!no && !showPos ? ' hidden' : ''}>${no}<span id="pos-text"${showPos ? '' : ' hidden'}>${word.p}</span></div>`;
}

function revealPos() {
  const tag = document.getElementById('pos-tag');
  const text = document.getElementById('pos-text');
  if (tag) tag.hidden = false;
  if (text) text.hidden = false;
}

// 選択肢を選ぶときは「名詞」と「名詞句」などを同じ品詞として扱う
const POS_GROUPS = { '名詞句': '名詞', '動詞句': '動詞', '形容詞句': '形容詞', '副詞句': '副詞', '句・表現': '表現' };
function posGroup(p) {
  return POS_GROUPS[p] || p;
}

// 4択の選択肢。品詞だけで正解が分からないよう、出題範囲 → 全単語の順に同じ品詞の単語を優先して選ぶ
function buildOptions(word) {
  const options = [word];
  const samePos = w => posGroup(w.p) === posGroup(word.p);
  const candidateLists = [state.pool.filter(samePos), RAW_WORDS.filter(samePos), state.pool, RAW_WORDS];
  for (const list of candidateLists) {
    for (const w of shuffle([...list])) {
      if (options.length >= 4) return shuffle(options);
      if (!options.some(x => x.w === w.w || x.m === w.m)) options.push(w);
    }
  }
  return shuffle(options);
}

// ==================== 穴埋め ====================
// 例文の見出し語を空欄にして、英単語の4択で答える

const CLOZE_BLANK = '-------';
const clozeCache = new Map();

// 日本語訳（…）を同じ長さの空白に置き換える。空欄の位置を元の例文の添字のまま探せる
function maskGloss(text) {
  return text.replace(/（[^）]*）/g, m => ' '.repeat(m.length));
}

function escapeRegExp(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// 例文の中で空欄にする範囲 { start, end }（例文の添字）。見出し語がそのまま、なければ語幹で探し、無ければ null
function findBlank(word) {
  const example = word.e || '';
  const key = `${word.w}\u0000${example}`;
  if (!clozeCache.has(key)) clozeCache.set(key, computeBlank(word.w, example));
  return clozeCache.get(key);
}

function computeBlank(headword, example) {
  if (!headword || !example) return null;
  const text = maskGloss(example);
  const exact = new RegExp(`\\b${escapeRegExp(headword)}\\b`, 'i').exec(text);
  if (exact) return { start: exact.index, end: exact.index + exact[0].length };
  // 活用していそうなら、5文字以上の語の語尾(ion/ing/ed/es/s/e/y)を落とした語幹で探す
  const stem = headword.split(' ').map(t => (t.length > 4 ? t.replace(/(ion|ing|ed|es|s|e|y)$/, '') : t)).join(' ');
  const loose = new RegExp(`\\b${escapeRegExp(stem)}\\w*`, 'i').exec(text);
  return loose ? { start: loose.index, end: loose.index + loose[0].length } : null;
}

// 空欄にした例文。revealed なら元の例文（日本語訳つき）で、空欄だった部分を mark で囲む
function clozeSentenceHtml(word, revealed) {
  const example = word.e || '';
  const blank = findBlank(word);
  if (!blank) return escapeHtml(example);
  const gloss = t => t.replace(/（[^）]*）/g, '');
  const before = example.slice(0, blank.start);
  const after = example.slice(blank.end);
  if (revealed) return `${escapeHtml(before)}<mark>${escapeHtml(example.slice(blank.start, blank.end))}</mark>${escapeHtml(after)}`;
  return `${escapeHtml(gloss(before))}${CLOZE_BLANK}${escapeHtml(gloss(after))}`;
}

function clozeCardHtml(word) {
  return `
      <div class="card" id="main-card">
        ${posTagHtml(word, false)}
        <div class="cloze-sentence">${clozeSentenceHtml(word, false)}</div>
        <div class="example-display" id="example-box">${clozeSentenceHtml(word, true)}<br><br>${word.m}${speakRowHtml(word)}</div>
      </div>
    `;
}

// ==================== 発音 ====================
// 端末の読み上げ（speechSynthesis）を使う。使えない端末ではボタンを出さない

function speechAvailable() {
  return !!window.speechSynthesis && typeof window.SpeechSynthesisUtterance === 'function';
}

// 読み上げる文字列。日本語訳の（…）と、入力不要の ~ は読まない
function speechText(text) {
  return String(text).replace(/（[^）]*）/g, '').replace(/[~～]/g, '').replace(/\s+/g, ' ').trim();
}

function speak(text) {
  if (!speechAvailable()) return;
  const utterance = new SpeechSynthesisUtterance(speechText(text));
  utterance.lang = 'en-US';
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utterance);
}

// label を渡すと「🔊 単語」のようにラベルを付ける（単語と例文が並ぶときに区別するため）
function speakBtnHtml(text, label = '') {
  if (!speechAvailable() || !speechText(text)) return '';
  return `<button type="button" class="speak-btn" data-speak="${escapeHtml(text)}" aria-label="発音を聞く">🔊${label ? ` ${label}` : ''}</button>`;
}

// 単語と例文の 🔊（回答後の例文欄とカードの裏面に置く）
function speakRowHtml(word) {
  return `<div class="speak-row">${speakBtnHtml(word.w, '単語')}${speakBtnHtml(word.e || '', '例文')}</div>`;
}

// キャプチャ段階で受けて止める。カードの onclick が先に動いてめくれてしまわないようにする
document.addEventListener('click', e => {
  const btn = e.target.closest && e.target.closest('.speak-btn');
  if (!btn) return;
  e.stopPropagation();
  speak(btn.dataset.speak);
}, true);

function renderCurrent() {
  resetActionBar();
  document.getElementById('choices-container').classList.remove('compact');
  const container = document.getElementById('quiz-container');
  const choicesDiv = document.getElementById('choices-container');

  if (state.pool.length === 0) {
    container.innerHTML = `<div class="card"><div class="meaning-display">条件に合う単語がありません</div></div>`;
    choicesDiv.innerHTML = '';
    updateFooter();
    return;
  }

  if (state.currentIndex >= state.pool.length) {
    container.innerHTML = `<div class="card"><div class="meaning-display">完了！</div><div style="font-size:14px;color:var(--muted);margin-top:8px;">正答: ${state.score} / ${state.answeredCount}</div></div>`;
    choicesDiv.innerHTML = '';
    updateFooter();
    return;
  }

  const word = state.pool[state.currentIndex];
  state.answered = false;
  choicesDiv.innerHTML = '';

  if (state.mode === 'e2j' || state.mode === 'j2e' || state.mode === 'cloze') {
    container.innerHTML = state.mode === 'cloze' ? clozeCardHtml(word) : `
      <div class="card" id="main-card">
        ${posTagHtml(word, false)}
        <div class="${state.mode === 'e2j' ? 'word-display' : 'meaning-display'}">${state.mode === 'e2j' ? word.w + speakBtnHtml(word.w) : word.m}</div>
        <div class="example-display" id="example-box">${word.e ? word.e : '<span style="opacity:0.45; font-style:italic;">（例文なし）</span>'}<br><br>${state.mode === 'e2j' ? word.m : word.w}${speakRowHtml(word)}</div>
      </div>
    `;

    const options = buildOptions(word);
    state.currentOptions = options;

    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerText = state.mode === 'e2j' ? opt.m : opt.w;
      btn.onclick = () => handleAnswer(opt, btn);
      choicesDiv.appendChild(btn);
    });
    setDontKnowVisible(true);
    document.getElementById('dont-know-btn').onclick = handleDontKnow;
  } else if (state.mode === 'flash') {
    container.innerHTML = `
      <div class="card flash-mode" id="flash-card">
        <div class="flip-card-inner">
          <div class="card-face">
            ${posTagHtml(word, false)}
            <div class="word-display">${word.w}${speakBtnHtml(word.w)}</div>
          </div>
          <div class="card-face card-back">
            <div class="pos-tag">${word.p}</div>
            <div class="meaning-display">${word.m}</div>
            <div style="font-size: 14px; line-height: 1.5; color: ${word.e ? '#555' : 'var(--muted)'}; font-style: ${word.e ? 'normal' : 'italic'};">${word.e || '（例文なし）'}</div>
            ${speakRowHtml(word)}
          </div>
        </div>
      </div>
    `;
    document.getElementById('flash-card').onclick = flipCard;
    document.getElementById('next-btn').innerText = 'めくる';
    showNextButton(flipCard);
  } else if (state.mode === 'type') {
    container.innerHTML = `
      <div class="card" id="main-card">
        ${posTagHtml(word, false)}
        <div class="meaning-display">${word.m}</div>
        <div class="type-input-container">
          <input type="text" id="type-input" class="type-input" placeholder="英語で入力" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
          <button class="type-check-btn" id="type-check-btn">答え合わせ</button>
        </div>
        <div class="type-result" id="type-result" style="display:none;"></div>
        <div class="example-display" id="example-box">${word.e ? word.e : '<span style="opacity:0.45; font-style:italic;">（例文なし）</span>'}${speakRowHtml(word)}</div>
      </div>
    `;
    const input = document.getElementById('type-input');
    input.focus();
    input.addEventListener('keydown', e => {
      // 日本語入力の変換確定の Enter では答え合わせしない
      if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229 || state.answered) return;
      e.preventDefault();
      e.stopPropagation(); // 同じ Enter でキーボード操作の「次へ」まで進まないようにする
      handleTypeAnswer(input.value);
    });
    document.getElementById('type-check-btn').onclick = () => handleTypeAnswer(input.value);
    setDontKnowVisible(true);
    document.getElementById('dont-know-btn').onclick = handleTypeDontKnow;
  }

  updateFooter();
}

function handleAnswer(selectedOpt, btn) {
  const word = state.pool[state.currentIndex];
  answerChoice(selectedOpt.w === word.w, btn);
}

// 「わからない」: 正解を見せて苦手に登録。スコアは増やさず、赤表示や揺れは出さない
function handleDontKnow() {
  answerChoice(false, null);
}

function answerChoice(isCorrect, selectedBtn) {
  if (state.answered) return;
  state.answered = true;
  setDontKnowVisible(false);

  const word = state.pool[state.currentIndex];
  document.querySelectorAll('#choices-container .choice-btn').forEach((b, i) => {
    if (state.currentOptions[i] && state.currentOptions[i].w === word.w) {
      b.classList.add('correct');
    }
  });

  if (isCorrect) {
    state.score++;
  } else if (selectedBtn) {
    selectedBtn.classList.add('wrong');
    shakeCard();
  }
  recordWeak(word, isCorrect);
  showAnswerDetails();
}

// 回答後に品詞と例文を見せて次へボタンを出す（4択・タイプ共通）
function showAnswerDetails() {
  revealPos();
  document.getElementById('example-box').style.display = 'block';
  showNextButton(nextWord);
  updateFooter();
}

// カードモード: めくって答えを確かめてから「覚えた／まだ」で自己採点する
function flipCard() {
  const card = document.getElementById('flash-card');
  if (!card) return;
  card.classList.toggle('flipped');
  if (state.answered) return;
  const dk = document.getElementById('dont-know-btn');
  dk.innerText = 'まだ';
  dk.onclick = () => gradeFlash(false);
  setDontKnowVisible(true);
  document.getElementById('next-btn').innerText = '覚えた';
  showNextButton(() => gradeFlash(true));
}

function gradeFlash(known) {
  if (state.answered) return;
  state.answered = true;
  if (known) state.score++;
  recordWeak(state.pool[state.currentIndex], known);
  nextWord();
}

// 見出し語の「~」は入力不要、空白の揺れは無視して比較する
function normalizeTyped(str) {
  return str.replace(/[~～]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
}

function handleTypeAnswer(val) {
  if (state.answered) return;
  if (!val.trim()) return; // 空のまま送信しても不正解にしない

  const word = state.pool[state.currentIndex];
  const isCorrect = word.w.split('/').map(normalizeTyped).includes(normalizeTyped(val));

  if (isCorrect) {
    state.score++;
  } else {
    shakeCard();
  }
  recordWeak(word, isCorrect);
  revealTypeAnswer(word, isCorrect, val);
}

function handleTypeDontKnow() {
  if (state.answered) return;
  const word = state.pool[state.currentIndex];
  recordWeak(word, false);
  revealTypeAnswer(word, false, '');
}

function revealTypeAnswer(word, isCorrect, typed) {
  state.answered = true;
  setDontKnowVisible(false);

  const input = document.getElementById('type-input');
  input.disabled = true;
  input.blur();
  document.getElementById('type-check-btn').style.display = 'none';

  const result = document.getElementById('type-result');
  result.className = `type-result ${isCorrect ? 'ok' : 'ng'}`;
  result.innerHTML = isCorrect
    ? `<span class="type-result-label">正解</span><span class="type-result-answer">${escapeHtml(word.w)}</span>`
    : `${typed ? `<div><span class="type-result-label">あなた</span><span class="type-result-yours">${escapeHtml(typed)}</span></div>` : ''}
       <div><span class="type-result-label">正解</span><span class="type-result-answer">${escapeHtml(word.w)}</span></div>`;
  result.style.display = 'block';

  showAnswerDetails();
}

function recordWeak(word, isCorrect) {
  state.answeredCount++;
  recordActivity('vocab', isCorrect);
  updateWeakEntry(wordWeak(), word.w, isCorrect);
  if (!wordSeen().has(word.w)) {
    wordSeen().add(word.w);
    saveJSON(SEEN_WORDS_KEY, seenSnapshot());
  }
  saveWeakData();
}

function updateFooter() {
  const isGrammar = state.app === 'grammar';
  const pool = isGrammar ? state.grammarPool : state.pool;
  const index = isGrammar ? state.currentGrammarIndex : state.currentIndex;
  const score = isGrammar ? state.grammarScore : state.score;
  const answered = isGrammar ? state.grammarAnsweredCount : state.answeredCount;
  document.getElementById('progress-text').innerText = pool.length > 0 ? `${Math.min(index + 1, pool.length)} / ${pool.length}` : '0 / 0';
  const rate = answered > 0 ? `（${Math.round(score / answered * 100)}%）` : '';
  document.getElementById('score-text').innerText = `正答 ${score} / ${answered}${rate}`;
  // 進捗バーは「回答済み（次へ進んだ）問題数 / プール全体」
  const done = Math.min(index, pool.length);
  document.getElementById('progress-fill').style.width = pool.length > 0 ? `${done / pool.length * 100}%` : '0';

  // 表示が変わるたびに呼ばれるので、ここで連続日数の表示を更新し、設定と進み具合を保存しておく
  updateStreakBar();
  saveSettings();
  saveSession();
}

// ==================== 設定・進み具合の保存 ====================
// 絞り込みやモードと、出題中の問題の並び・何問目か・正答数を保存し、開き直しても続きから始める

const SETTINGS_KEY = 'toeic_settings';
const SESSION_KEY = 'toeic_session';
const WORD_INDEX = new Map(RAW_WORDS.map((w, i) => [w, i]));
const GRAMMAR_BY_ID = new Map(RAW_GRAMMAR.map(g => [g.id, g]));

function settingsSnapshot() {
  const keys = ['app', 'mode', 'sourceFilter', 'rangeFilter', 'dateFilter', 'posFilter', 'weakFilter',
                'grammarBook', 'grammarChapter', 'grammarWeakFilter', 'grammarRule', 'weakSort', 'goal', 'priority'];
  return Object.fromEntries(keys.map(k => [k, state[k]]));
}

function saveSettings() {
  saveJSON(SETTINGS_KEY, settingsSnapshot());
}

// 保存された値のうち、今のデータで有効なものだけを state に戻す
function restoreSettings() {
  const saved = loadJSON(SETTINGS_KEY, {});
  const pick = (value, allowed, fallback) => (allowed.includes(value) ? value : fallback);
  state.app = pick(saved.app, ['vocab', 'grammar'], 'vocab');
  state.mode = pick(saved.mode, VOCAB_MODES, 'e2j');
  state.sourceFilter = pick(saved.sourceFilter, ['all', 'daily', 'teppan'], 'all');
  const range = saved.rangeFilter;
  state.rangeFilter = range && TEPPAN_RANGES.some(r => r.start === range.start && r.end === range.end)
    ? { start: range.start, end: range.end } : null;
  state.dateFilter = Array.isArray(saved.dateFilter) ? saved.dateFilter.filter(d => DATES.includes(d)) : [];
  state.posFilter = pick(saved.posFilter, ['all', '名詞', '動詞', '形容詞', '副詞', '句・表現'], 'all');
  state.weakFilter = pick(saved.weakFilter, ['all', 'weak_unlearned', 'weak_only', 'due'], 'all');
  state.grammarBook = pick(saved.grammarBook, ['all', 'kin', 'sekai'], 'all');
  state.grammarChapter = pick(saved.grammarChapter, getGrammarChaptersList().map(c => c.ch), 'all');
  state.grammarRule = KIN_RULES.some(r => r.number === saved.grammarRule) ? saved.grammarRule : null;
  state.grammarWeakFilter = pick(saved.grammarWeakFilter, ['all', 'weak_only', 'due'], 'all');
  state.weakSort = pick(saved.weakSort, ['new', 'old', 'due', 'order'], 'new');
  state.goal = pick(saved.goal, GOALS, 20);
  state.priority = pick(saved.priority, ['due_first', 'random'], 'due_first');
}

// 出題順が「ランダム」のときだけ署名に足す（初期設定の署名を変えず、保存済みの出題の続きをそのまま使うため）
function priorityTerm() {
  return state.priority === 'random' ? ['random'] : [];
}

// 今の絞り込みを表す値。保存した出題順はこれが一致するときだけ使う（データが増減したときも作り直す）
function sessionSignature(app) {
  return JSON.stringify(app === 'grammar'
    ? [RAW_GRAMMAR.length, state.grammarBook, state.grammarChapter, state.grammarRule, state.grammarWeakFilter,
       ...priorityTerm()]
    : [RAW_WORDS.length, state.sourceFilter, state.rangeFilter, state.dateFilter, state.posFilter, state.weakFilter,
       ...(state.weakFilter !== 'all' || state.mode === 'cloze' ? [state.mode] : []), // 苦手で絞るとき・穴埋めのときは出題範囲がモードで変わる
       ...priorityTerm()]);
}

function sessionSnapshot() {
  const sessions = loadJSON(SESSION_KEY, {});
  // 回答済みの問題は開き直したときに出し直さないよう、次の問題から再開する
  if (state.app === 'grammar') {
    sessions.grammar = {
      sig: sessionSignature('grammar'),
      pool: state.grammarPool.map(g => g.id),
      index: Math.min(state.currentGrammarIndex + (state.grammarAnswered ? 1 : 0), state.grammarPool.length),
      score: state.grammarScore,
      answered: state.grammarAnsweredCount,
    };
  } else {
    sessions.vocab = {
      sig: sessionSignature('vocab'),
      pool: state.pool.map(w => WORD_INDEX.get(w)),
      index: Math.min(state.currentIndex + (state.answered ? 1 : 0), state.pool.length),
      score: state.score,
      answered: state.answeredCount,
    };
  }
  return sessions;
}

function saveSession() {
  saveJSON(SESSION_KEY, sessionSnapshot());
}

// 保存した続きを戻せたら true。絞り込みが変わっていたり、最後まで解き終えていたら false（新しく出題し直す）
function restoreSession(app) {
  const saved = loadJSON(SESSION_KEY, {})[app];
  if (!saved || saved.sig !== sessionSignature(app) || !Array.isArray(saved.pool)) return false;
  const pool = saved.pool.map(k => (app === 'grammar' ? GRAMMAR_BY_ID.get(k) : RAW_WORDS[k]));
  const index = Number.isInteger(saved.index) ? saved.index : 0;
  if (pool.length === 0 || pool.some(x => !x) || index < 0 || index >= pool.length) return false;
  const score = Number.isInteger(saved.score) ? saved.score : 0;
  const answered = Number.isInteger(saved.answered) ? saved.answered : 0;
  if (app === 'grammar') {
    Object.assign(state, { grammarPool: pool, currentGrammarIndex: index, grammarScore: score, grammarAnsweredCount: answered });
  } else {
    Object.assign(state, { pool, currentIndex: index, score, answeredCount: answered });
  }
  return true;
}

// 今日・直近7日・累計の回答数(n)と正解数(c)、直近14日の日ごとの回答数。単語と文法の合計
function statsSummary(log, todayKey) {
  const sum = keys => keys.reduce((t, k) => {
    const day = log[k];
    if (day) {
      t.n += day.v[0] + day.g[0];
      t.c += day.v[1] + day.g[1];
    }
    return t;
  }, { n: 0, c: 0 });
  const d = parseLocalDate(todayKey);
  const keys = [];
  for (let i = 0; i < 14; i++) {
    keys.unshift(dateKey(d));
    d.setDate(d.getDate() - 1);
  }
  return {
    today: sum([todayKey]),
    week: sum(keys.slice(-7)),
    total: sum(Object.keys(log)),
    days: keys.map(k => ({ key: k, n: dayCount(log, k) })),
  };
}

// 学習済みの単語数と、苦手・要復習の数。単語は全モードをまとめて重複なしで数える
function learnedStats() {
  const known = new Set(RAW_WORDS.map(w => w.w));
  const unionOf = lists => new Set(lists.flatMap(l => [...l]).filter(w => known.has(w)));
  const seen = unionOf(VOCAB_MODES.map(m => state.seenByMode[m]));
  const weak = unionOf(VOCAB_MODES.map(m => Object.keys(state.weakByMode[m])));
  const due = unionOf(VOCAB_MODES.map(m => Object.keys(state.weakByMode[m]).filter(w => isDue(state.weakByMode[m][w]))));
  const grammar = Object.values(state.grammarWeakData);
  return {
    learned: seen.size,
    total: known.size,
    weak: weak.size,
    due: due.size,
    gWeak: grammar.length,
    gDue: grammar.filter(isDue).length,
  };
}

function statRate(t) {
  return t.n === 0 ? '0問' : `${t.n}問 ・ 正答率 ${Math.round(t.c / t.n * 100)}%`;
}

function renderStatsSheet() {
  const s = statsSummary(state.dailyLog, dateKey());
  const l = learnedStats();
  const row = (label, value) => `<div class="stat-row"><span class="stat-label">${label}</span><span class="stat-value">${value}</span></div>`;
  const dayLabel = key => `${Number(key.slice(5, 7))}/${Number(key.slice(8))}`;
  const max = Math.max(...s.days.map(d => d.n), 1);
  const bars = s.days.map(d => {
    const label = `${dayLabel(d.key)} ${d.n}問`;
    const height = d.n === 0 ? '2px' : `${Math.max(4, d.n / max * 100)}%`;
    return `<div class="stat-bar-col" title="${label}" aria-label="${label}"><div class="stat-bar" style="height:${height}"></div></div>`;
  }).join('');
  document.getElementById('weak-list-content').innerHTML =
    row('今日', statRate(s.today)) +
    row('直近7日', statRate(s.week)) +
    row('累計', statRate(s.total)) +
    `<div class="stat-bars">${bars}</div>` +
    `<div class="stat-axis"><span>${dayLabel(s.days[0].key)}</span><span>${dayLabel(s.days[13].key)}</span></div>` +
    row('学習済み', `${l.learned} / ${l.total}語（${Math.round(l.learned / l.total * 100)}%）`) +
    row('単語', `苦手 ${l.weak}語 ・ 要復習 ${l.due}語`) +
    row('文法', `苦手 ${l.gWeak}問 ・ 要復習 ${l.gDue}問`);
}

// 章ごとの解説メモ。{ 1: "本文…", 2: "…" } の形で書くとガイドの各章の先頭に表示される（改行はそのまま反映）。
const KIN_CHAPTER_NOTES = {};

// 問題データから 金のルール の一覧を組み立てる（番号順、各ルールの問題idつき）
const KIN_RULES = (() => {
  const map = new Map();
  RAW_GRAMMAR.filter(g => g.b === 'kin' && g.rule && g.rule.number).forEach(g => {
    if (!map.has(g.rule.number)) {
      map.set(g.rule.number, { number: g.rule.number, title: g.rule.title, ch: g.ch, ids: [] });
    }
    map.get(g.rule.number).ids.push(g.id);
  });
  return [...map.values()].sort((a, b) => a.number - b.number);
})();

const KIN_CHAPTERS = (() => {
  const map = new Map();
  RAW_GRAMMAR.filter(g => g.b === 'kin').forEach(g => {
    if (!map.has(g.ch)) map.set(g.ch, { ch: g.ch, title: g.ch_title, sections: {} });
    // th_title は「必修問題 (Q114)」の形なので、括弧の前をセクション名として数える
    const section = (g.th_title || '').replace(/\s*\(.*$/, '');
    const sections = map.get(g.ch).sections;
    if (section) sections[section] = (sections[section] || 0) + 1;
  });
  return [...map.values()].sort((a, b) => a.ch - b.ch);
})();

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 解き方フェーズの手順（章ガイドと解説欄の両方で使う）
function renderPhaseSteps(phases) {
  return `<div class="phase-steps">${phases.map(p => `
    <div class="phase-step">
      <span class="phase-step-no">${p.phase}</span>
      <div>
        <div class="phase-step-title">${escapeHtml(p.title)}</div>
        ${p.action ? `<div class="phase-step-action">${escapeHtml(p.action)}</div>` : ''}
        ${p.detail ? `<div class="phase-step-detail">${escapeHtml(p.detail)}</div>` : ''}

}

// 章ごとに持っている補足リスト（章によってキー名が違う）
const PHASE_EXTRA_LISTS = [
  ['points', '押さえる視点'],
  ['steps', '解き方のステップ'],
  ['major_patterns', '主な出題パターン'],
];

function renderPhaseGuide(pi) {
  let html = '';

function renderRuleGuide() {
  const container = document.getElementById('weak-list-content');
  let html = `<div class="filter-row" style="flex-wrap:wrap;">
    <button class="chip ${state.guideChapter === 'all' ? 'active' : ''}" data-guide-ch="all">すべて</button>

document.getElementById('weak-list-content').addEventListener('click', e => {
  const backupBtn = e.target.closest('[data-backup]');
