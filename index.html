eir flight time.", "c": ["with", "under", "at", "through"], "a": 3, "exp": "throughは「貫通」のイメージ\n解説：「検問所を通り抜ける」という文意を考え、(D) through を選びます。proceed through 〜 で、直訳「〜を通って（through）進む（proceed）」→「〜の中を進む・〜を通る」という表現です。(A) with を使った proceed with 〜「〜を進める」という表現もよく使われますが、今回は文意に合いません。ちなみに空所後の well は「強調」を表し、well in advance of 〜「〜の十分前に・十分前もって」となっています。\n和訳：乗客は、フライト時間よりも十分前に検問所を通らなければならない。\n語句：passenger「乗客」、be requested to 原形「〜するよう頼まれる」、security checkpoint「検問所」、in advance of 〜「〜より前に」", "v": [], "b": "sekai"}, {"id": 140, "ch": 15, "ch_title": "前置詞", "th_title": "その他の前置詞②", "q": "The Vortex Pinnacle BB is ------- the fastest Wi-Fi routers on the market today.", "c": ["among", "in", "on", "of"], "a": 0, "exp": "be among 〜 ≒ be one of 〜\n解説：空所直前の is に注目して、be among 〜「〜のうちの1つ」の形にします。among は「たくさんのものに囲まれて」というイメージで、そこから「〜のうちの1つ」という意味が生まれました（今回は「いくつかある高速の Wi-Fi ルーターに囲まれた中の1つ」という感じ）。be among 〜 ≒ be one of 〜 です。\n和訳：Vortex Pinnacle BB は、現在市場に出回っているものの中で最も高速のWi-Fiルーターの1つだ。\n語句：router「ルーター」、on the market「市場に出て」", "v": [], "b": "sekai"}, {"id": 141, "ch": 15, "ch_title": "前置詞", "th_title": "その他の前置詞②", "q": "------- the year-end clearance sale, most items in the store will be 20 percent off.", "c": ["In", "While", "During", "For"], "a": 2, "exp": "during vs. for vs. while\n解説：空所直後に名詞のカタマリ（the year-end clearance sale）がきているので、空所には「前置詞」が入ります（この時点で接続詞 (B) While は消去できます）。今回は直後に the year-end clearance sale という「特定期間（いつ？）」がきているので、(C) During「〜の間」が正解です。(D) For の後ろは「特定できない期間（どのくらいの期間？）」がきます。\n和訳：年末大売り出しセール中は、店内のほとんどの商品が20パーセント割引になります。\n語句：year-end「年末の」、clearance「除去・一掃」", "v": [], "b": "sekai"}, {"id": 1001, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "解き方の基本 (Q1)", "q": "The ------- of a new digital marketing strategy is on the agenda for this afternoon's meeting.", "c": ["develop", "develops", "developed", "development"], "a": 3, "exp": "① 選択肢をチェック\nこのように、同じつづりで始まる派生語が選択肢に並んでいたら、「品詞問題」です。この時点で選択肢の意味を考える必要はありません。ちらっと見て「品詞問題」だと判断したら、すばやく問題文に目を移しましょう。\n\n② 文構造 (SVOC) をチェック\nまず、文の骨格となる主語 (S) と述語動詞 (V) を確認します。冠詞 The の後が空所で、直後の of a new digital marketing strategy は空所を説明する修飾語 (「前置詞＋名詞」のカタマリは文の要素になりません)、is が述語動詞です。つまり、この問題文には主語が欠けています。\n空所には、主語になる名詞が必要なので、(D) development (立案) が正解です。(A)「開発する」は動詞、(B) はその3人称単数現在形、(C) は過去形・過去分詞で、いずれも主語になりません。\n\n和訳: 新たなデジタルマーケティング戦略の立案が、今日の午後の会議の議題に上がっている。", "v": [{"word": "strategy", "meaning": "名 戦略"}, {"word": "agenda", "meaning": "名 議題 (のリスト)"}, {"word": "development", "meaning": "名 立案、開発"}], "rule": {"number": 1, "title": "品詞問題では、主語には名詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1002, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "解き方の基本 (Q2)", "q": "The Berovo Institute ------- publishes the results of its research in renowned scientific journals.", "c": ["regularly", "regulate", "regularity", "regular"], "a": 0, "exp": "① 選択肢をチェック\n選択肢に同じつづりで始まる派生語が並んでいるので、「品詞問題」です。\n\n② 文構造 (SVOC) をチェック\nThe Berovo Institute が主語 (S)、publishes が述語動詞 (V)、the results が目的語 (O)、of から文末までは修飾語です。文の要素がそろっていて、空所がなくても「Berovo 研究所は結果を公表する」という SVO の文が成立しています。つまり、空所に入るのは修飾語です。\n\n③ 空所が何を修飾しているかをチェック\n最後に、空所が何を修飾しているのか、を考えます。ここでは、「S ------- V」のカタチになっていて、空所は直後の述語動詞 publishes を修飾しています。動詞を修飾するのは副詞なので、(A) regularly (定期的に、ひんばんに) が正解です。(B)「規制する」は動詞、(C)「規則性」は名詞、(D) は「定期的な」という形容詞または「常連客」という名詞です。いずれも動詞を修飾しません。\n\n和訳: Berovo 研究所は、著名な科学誌で定期的に研究結果を公表している。", "v": [{"word": "publish", "meaning": "動 公表する、出版する"}, {"word": "renowned", "meaning": "形 著名な"}, {"word": "scientific journal", "meaning": "名 科学誌"}], "rule": {"number": 2, "title": "品詞問題で、空所が名詞以外を修飾していたら副詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1003, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q3)", "q": "Full-scale ------- of the lightweight aircraft is set to begin in the spring of next year.", "c": ["developments", "developed", "develop", "development"], "a": 3, "exp": "文頭の Full-scale (全面的な) は形容詞で、空所には主語になる名詞が必要 (of the lightweight aircraft は修飾語) です。この問題では、語尾が -ments の (A) に飛びついてはいけません。他の選択肢をよく見ると、(D) も語尾が -ment で名詞です。違いは、複数形か単数形か、です。このように、主語になる名詞の単数形と複数形が選択肢に並んでいたら、必ず述語動詞を確認しましょう。ここでは、述語動詞が is です。つまり、主語は単数形、ということになるので、(D) development (開発) が正解です。複数形の (A)「(新たな) 出来事」は、述語動詞が are でないと主述が合いません。(B) は、動詞の (C)「〜を開発する」の過去形・過去分詞です。\n\n和訳: その軽量の航空機の全面的な開発は、来春始まりそうだ。", "v": [{"word": "aircraft", "meaning": "名 航空機"}, {"word": "be set to do", "meaning": "〜しそうだ、〜するだろう"}], "rule": {"number": 3, "title": "主語を選ぶ品詞問題では、名詞の単複に注意。", "category": "第1章 品詞問題"}}, {"id": 1004, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q4)", "q": "A ------- from Shaffer University will be discussing her latest research on food additives.", "c": ["nutrition", "nutritional", "nutritionist", "nutritionally"], "a": 2, "exp": "一見して、主語の位置が空所なので、名詞が正解だとわかりますが、語尾が -tion の (A) nutrition (栄養) を反射的に選んではいけません。語尾が「人」を表す -ist の (C) nutritionist (栄養士) も名詞だからです。このように、「人」と「人以外」を表す名詞がどちらも正解候補になる品詞問題は、必ず意味を考えましょう。ここでは、空所が主語で、from Shaffer University は空所に対する修飾語 (「前置詞＋名詞」)、will be discussing (話す予定だ) が述語動詞です。話をするのは当然「人」ですから、正解は (C) nutritionist (栄養士) です。(A) は意味が通じない上、不可算名詞なので、冠詞の a が付きません。(B)「栄養の」は形容詞、(D)「栄養的に」は副詞です。なお、冠詞 (a/an/the) と前置詞の間の空所には、100%名詞が入ります。\n\n和訳: Shaffer 大学の栄養士が、食品添加物に関する彼女の最新の研究について話す予定だ。", "v": [{"word": "latest", "meaning": "形 最新の"}, {"word": "additive", "meaning": "名 添加物"}], "rule": {"number": 4, "title": "名詞を選ぶ品詞問題では、「人」「人以外」の選択肢に注意。", "category": "第1章 品詞問題"}}, {"id": 1005, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q5)", "q": "Ms. Hopkins shared her ------- regarding the company's overseas operations with the other executive committee members.", "c": ["observe", "observable", "observations", "observably"], "a": 2, "exp": "Ms. Hopkins が主語、shared が述語動詞です。空所前に人称代名詞の所有格 her (彼女の) があり、空所後の前置詞 regarding (〜に関する) 以降は修飾語です。空所には目的語の名詞が必要なので、語尾が -tions の複数形の名詞 (C) observations が正解です。observation は、「観察、(観察の結果得られた) 気づき、見解」という意味です。ここでは、Hopkins さんが、自社の海外事業について注意深く観察した結果、自らが得た気づきを他の執行役員たちと共有した、といった文脈になります。(A)「観察する、順守する」は動詞、(B)「観察可能な」は形容詞、(D)「明らかに」は副詞です。\n\n和訳: Hopkins さんは、会社の海外業務に関する自らの気づきを他の執行役員たちと共有した。", "v": [{"word": "regarding", "meaning": "前 〜に関する"}, {"word": "executive committee", "meaning": "執行役員会"}], "rule": {"number": 5, "title": "品詞問題では、他動詞の目的語には名詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1006, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q6)", "q": "Making an online ------- with Paymodia is fast, easy, and safe.", "c": ["pay", "payment", "paying", "pays"], "a": 1, "exp": "空所には、主語の動名詞 making の目的語の名詞が必要です (online は形容詞)。したがって、名詞の (B) payment (支払い) が正解です。(A) は「支払う」という動詞か、「給料」という名詞です。名詞の pay は不可算名詞なので、冠詞の a/an が付かず、意味も通じません。(C) は動詞の現在分詞・動名詞、(D) は動詞の3人称単数現在形です。なお、動作を表す動名詞は数えられないので、a/an が付きません。\n\n和訳: Paymodia でのオンラインのお支払いは、速くて簡単で安全です。", "v": [], "rule": {"number": 6, "title": "名詞が正解になる品詞問題では、何となく動名詞を選ばない。", "category": "第1章 品詞問題"}}, {"id": 1007, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q7)", "q": "Without written ------- from the patient, we are unable to release his medical records.", "c": ["authorize", "authorized", "authorization", "to authorize"], "a": 2, "exp": "文頭が前置詞 without で、written は形容詞として空所を修飾する過去分詞、空所後の from the patient は空所に対する修飾語で、前置詞 without の目的語が欠けています。したがって、名詞の (C) authorization (許可) が正解です。without written authorization は「書面による許可なしに」という重要表現です。(A)「〜を許可する」は動詞、(B) はその過去形・過去分詞、または「公認の」という形容詞、(D) は不定詞です。いずれも前置詞の目的語になりません。\n\n和訳: その患者からの書面による許可なしに、当院は彼の医療記録を公開できません。", "v": [{"word": "release", "meaning": "動 公開する、発売する"}, {"word": "medical record", "meaning": "医療記録"}], "rule": {"number": 7, "title": "品詞問題では、前置詞の目的語には名詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1008, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q8)", "q": "Mr. Gideon's article was revised for length and ------- before it was published in the newspaper.", "c": ["clarify", "clarity", "clear", "clearly"], "a": 1, "exp": "文全体は、接続詞 before が、SV before SV. と、2つの節 (SV) をつなぐカタチです。空所が入った前半の節では、「S was revised for X and Y」と、接続詞 and が、前置詞 for の目的語となる2つの名詞をつないでいます。空所には2つ目の目的語が入るので、語尾が -ty の名詞 (B) clarity (明快さ) が正解です。(A)「はっきりさせる」は動詞、(C) は「明快な、きれいな」という形容詞か、「きれいにする」という動詞または「(近づかずに) 離れて」という副詞、(D)「はっきりと」は副詞です。\n\n和訳: Gideon さんの記事は、新聞で公表される前に、長さと明快さを見直された。", "v": [{"word": "revise", "meaning": "動 見直す"}, {"word": "length", "meaning": "名 長さ"}, {"word": "publish", "meaning": "動 公表する、出版する"}], "rule": {"number": 8, "title": "接続詞andを見たら、何と何をつないでいるのかを確認する。", "category": "第1章 品詞問題"}}, {"id": 1009, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q9)", "q": "When the community garden opened, locals were ------- about having a place to grow their own vegetables.", "c": ["enthusiast", "enthusiastically", "enthusiasm", "enthusiastic"], "a": 3, "exp": "文全体は、文頭の接続詞 when が2つの節 (SV) をつなぐカタチです。カンマ後の節は、locals (地元の人たち) が主語で、were が述語動詞、空所後の about から先は修飾語で、補語が欠けています。補語になるのは形容詞か名詞なので、副詞の (B)「熱心に」を除く (A)(C)(D) が正解候補です。このうち、文意が通るのは、語尾が -tic の形容詞 (D) enthusiastic (熱心な、熱狂的な) です。be enthusiastic about X は「X に夢中になる、熱中する」という意味です。(A)「熱心な人、ファン」は文意が通じず、可算名詞なので単数形なら冠詞等が必要です。(C)「熱心さ」は、主語である「人」とイコールにならず意味が通りません。\n\n和訳: コミュニティガーデンがオープンした時、地元の人たちは、自分自身の野菜を育てる場所を持つことに夢中になった。", "v": [{"word": "local", "meaning": "名 地元の人"}], "rule": {"number": 9, "title": "品詞問題では、補語には形容詞が最優先。", "category": "第1章 品詞問題"}}, {"id": 1010, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q10)", "q": "All three candidates for the management position are ------- in their ability to perform the job effectively.", "c": ["confided", "confident", "confidential", "confidently"], "a": 1, "exp": "All three candidates が主語、for the management position は主語に対する修飾語で、are が述語動詞です。空所後の前置詞 in から先は修飾語なので、空所には be 動詞 are の補語が必要です。選択肢中、副詞 (D)「自信を持って」を除く、過去分詞の (A)、形容詞の (B)(C) が正解候補です。動詞 confide (打ち明ける) の過去分詞の (A) は意味が通じません。残る2つの形容詞のうち、意味が通るのは、(B) confident (自信がある、確信している) です。be confident in X で、「X に自信がある、X に自信を持っている」という意味です。(C)「機密の」は、ここでは意味が通じません。\n\n和訳: その管理職の3人の候補者は全員、仕事を効果的に行う自らの能力に自信を持っている。", "v": [{"word": "candidate", "meaning": "名 候補者"}, {"word": "management position", "meaning": "管理職"}, {"word": "ability", "meaning": "名 能力"}, {"word": "effectively", "meaning": "副 効果的に"}], "rule": {"number": 10, "title": "品詞問題では、「副詞から-lyを取ったら形容詞」と頭に入れる。", "category": "第1章 品詞問題"}}, {"id": 1011, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q11)", "q": "ZhaoFlex Textile is now the world's leading ------- of bamboo fiber products.", "c": ["manufacture", "manufacturer", "manufacturing", "manufactures"], "a": 1, "exp": "ZhaoFlex Textile が主語、is が述語動詞で、空所には補語が必要です (of 以降は空所に対する修飾語)。品詞問題では、補語には形容詞を優先するのが鉄則ですが、ここでは、「S is the world's leading ------- (S は世界のトップ〜だ)」の空所に入る名詞が必要です (leading は「トップの、主要な」という意味の TOEIC 頻出形容詞)。選択肢はすべて名詞の働きを持つので、意味を考えます。主語の「会社」とイコールになり、空所に入れて文意が通るのは、(B) manufacturer (製造業者、メーカー) です。「製造」という意味の (A)(C)、「製造物」という意味の (D) は、いずれも主語とイコールにならず、意味が通じません。\n\n和訳: ZhaoFlex 繊維は、今や竹繊維製品の、世界のトップメーカーだ。", "v": [{"word": "textile", "meaning": "名 繊維"}, {"word": "leading", "meaning": "形 トップの、主要な"}, {"word": "bamboo fiber", "meaning": "竹繊維"}], "rule": {"number": 11, "title": "補語を選ぶ品詞問題では、主語とイコールになる答えを選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1012, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q12)", "q": "Hybotech Corporation has built a ------- reputation as a leading developer of hybrid-electric engines.", "c": ["solid", "solidly", "solidify", "solidity"], "a": 0, "exp": "Hybotech Corporation が主語、has built が述語動詞、空所後の名詞 reputation が目的語です。文の要素がそろっているので、空所に入るのは修飾語です。冠詞と名詞の間の空所に入り、直後の名詞を修飾するのは形容詞なので、(A) solid (確固たる、しっかりした) が正解です。a solid reputation は「確固たる評判」という意味です。仮にこの単語を知らなくても、副詞の (B)「強固に」から -ly を取った (A) が形容詞だと、語尾で品詞を判別できます。(C)「固める」は動詞、(D)「強固さ」は名詞です。\n\n和訳: Hybotech 社は、電気式ハイブリッドエンジンの主要な開発会社として、確固たる評判を築いた。", "v": [{"word": "reputation", "meaning": "名 評判"}, {"word": "developer", "meaning": "名 開発者"}, {"word": "hybrid-electric", "meaning": "形 電気式ハイブリッドの"}], "rule": {"number": 12, "title": "品詞問題で、空所が名詞を修飾していたら形容詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1013, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q13)", "q": "The annual All-Telecom Show is one of the most ------- events in the telecommunications industry.", "c": ["anticipate", "anticipated", "anticipating", "anticipation"], "a": 1, "exp": "空所の前後が、「one of the most ------- events」で、空所には、前置詞 of の目的語の名詞 events を修飾し、最もどんなイベントだったのか、を表す形容詞が必要です。選択肢中、形容詞の機能を持つのは、分詞の (B)(C) です。名詞を修飾する分詞を選ぶ際は、名詞と分詞との間の関係を考えましょう。「する」という能動の関係があれば -ing (現在分詞)、「される」という受動の関係があれば -ed (過去分詞) を選ぶのが原則です。ここでは、events と anticipate (期待する) との間には、「期待される」という受動の関係があるので、過去分詞の (B) anticipated が正解です。イベントは期待する側ではないので、現在分詞の (C) は意味が通じません。(A)「期待する」は動詞、(D)「期待」は名詞です。\n\n和訳: 年に1度の All-Telecom Show は、遠隔通信産業で、最も待ち望まれているイベントの1つだ。", "v": [{"word": "annual", "meaning": "形 年に1度の"}, {"word": "telecommunications", "meaning": "名 遠隔通信"}], "rule": {"number": 13, "title": "名詞を修飾する分詞を選ぶ際は、「する・される」の関係を考える。", "category": "第1章 品詞問題"}}, {"id": 1014, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q14)", "q": "We are looking to hire a motivated individual who can build ------- relationships with our customers.", "c": ["endure", "endured", "enduring", "endures"], "a": 2, "exp": "空所前が can build という述語動詞、後がその目的語の名詞 relationships です。文の要素がそろっているので、空所に入るのは名詞を修飾する形容詞です。選択肢中、形容詞の機能を持つのは、分詞の (B)(C) です。ここで、「する」「される」の関係を考えたいところですが、endure (長続きする、〜に耐える) という単語の意味がわからなければ、この問題を解くことはできません。その場合は、時間を浪費せず、思い切って直感で答えを選びましょう。ここでは、現在分詞が形容詞化した (C) enduring (永続的な) を空所に入れると、enduring relationships (永続的な関係) となり文意が通ります。過去分詞の (B) は、「耐えられた関係」となり文意が通りません。(A) は動詞、(D) はその3人称単数現在形です。\n\n和訳: 当社では、お客様と永続的な関係を築ける、やる気のある方を雇おうとしています。", "v": [{"word": "look to do", "meaning": "〜しようとする"}, {"word": "motivated", "meaning": "形 やる気のある"}, {"word": "individual", "meaning": "名 人"}, {"word": "relationship", "meaning": "名 関係"}], "rule": {"number": 14, "title": "名詞を前から修飾する分詞は、意味がわからなければ解けない。", "category": "第1章 品詞問題"}}, {"id": 1015, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q15)", "q": "Sisson Labs continually integrates new technologies into the workplace so its employees can work more -------.", "c": ["productively", "productive", "production", "produce"], "a": 0, "exp": "空所前の動詞 work は、「働く」という意味の自動詞 (目的語をとらない動詞) です。自動詞を後ろから修飾するのは副詞なので、語尾が -ly の (A) productively (生産的に) が正解です (more はこの副詞を修飾する副詞)。自動詞 work の後の空所に副詞を選ぶ品詞問題は定期的に出題されます。work closely (密に働く)、work comfortably (快適に働く)、work independently (単独で働く)、work industriously (勤勉に働く)、work steadily (着実に働く) といった組み合わせは頭に入れておきましょう。(B)「生産的な」は形容詞、(C)「生産、(プロデュースされた) 作品」は名詞、(D) は「生産する」という動詞または「農産物」という名詞です。\n\n和訳: Sisson Labs は、社員がより生産的に働けるよう、継続的に新しい技術を職場に取り入れています。", "v": [{"word": "continually", "meaning": "副 継続的に"}, {"word": "integrate X into Y", "meaning": "XをYに取り入れる"}, {"word": "so (that)", "meaning": "接 〜するために、〜できるように"}], "rule": {"number": 15, "title": "品詞問題では、自動詞の後の空所には副詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1016, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q16)", "q": "The Genesis 8-B Griller is ------- regarded as the best gas barbecue on the market.", "c": ["generally", "generalizing", "generalization", "general"], "a": 0, "exp": "The Genesis 8-B Griller が主語、空所の前後 is regarded は、「be動詞＋過去分詞」の受動態の述語動詞です。文の要素がそろっているので、空所に入るのは修飾語です。述語動詞を修飾するのは副詞なので、(A) generally (一般的に) が正解です。be動詞と過去分詞の間の空所に副詞を選ぶ品詞問題は定番です。本試験で見かけたら秒速で解きましょう。be regarded as X (Xとしてみなされている) は重要表現です。(B) は動詞 generalize (一般化する) の現在分詞・動名詞、(C)「一般化」は名詞です。(D) は、「一般的な、全体的な」という形容詞です。\n\n和訳: Genesis 8-B Griller は、市場で1番のガスバーベキュー台だと一般的にみなされている。", "v": [], "rule": {"number": 16, "title": "品詞問題では、述語動詞の間の空所には副詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1017, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q17)", "q": "Since all the townhouses on Moore Street are ------- identical, Ms. Caldwell accidentally knocked on the wrong door.", "c": ["nearer", "nearness", "nearest", "nearly"], "a": 3, "exp": "文全体は、文頭の接続詞 since が2つの節 (SV) をつなぐカタチです。前半の節の中を見ると、all the townhouses が主語で、are が述語動詞、空所後の形容詞 identical (同一の) が補語で文の要素がそろっています (-ical は形容詞に多い語尾の1つ)。したがって、空所に入るのは修飾語です。空所後の形容詞 identical を修飾するのは副詞なので、(D) nearly (= almost : ほとんど、もう少しで) が正解です。(A) は、「近い」という形容詞か「近くに」という副詞の比較級、(B)「近さ」は名詞、(C) は形容詞・副詞の最上級です。なお、形容詞 identical は、比較級や最上級では用いられません。\n\n和訳: Moore 通りのすべての集合住宅はほとんど同じなので、Caldwell さんはうっかり間違ったドアをノックした。", "v": [{"word": "townhouse", "meaning": "名 (側面の壁を隣接する家と共有するタイプの) 集合住宅"}, {"word": "identical", "meaning": "形 同一の"}, {"word": "accidentally", "meaning": "副 うっかり"}], "rule": {"number": 17, "title": "品詞問題では、be動詞と形容詞の間の空所には副詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1018, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q18)", "q": "With obesity rates on the rise, food companies must promote their breakfast cereals and snack items -------.", "c": ["responsibly", "respond", "responsible", "responded"], "a": 0, "exp": "文のカタチを見ると、文頭の前置詞 with からカンマまでが副詞のカタマリで修飾語です。food companies が主語、must promote が述語動詞、their breakfast cereals and snack items が目的語です。文の要素がそろっているので、空所に入るのは修飾語です。文の要素がそろったカタチの後に置き、述語動詞を後ろから修飾するのは副詞なので、(A) responsibly (責任を持って) が正解です。この副詞は、must responsibly promote... と、助動詞と原形動詞の間に置くことも可能です。(B)「返事をする」は動詞、(C)「責任がある」は形容詞、(D) は動詞の過去形・過去分詞です。\n\n和訳: 肥満率が上昇中なので、食品会社は自社の朝食用シリアルや軽食の品物を、責任を持って販売促進すべきだ。", "v": [{"word": "obesity", "meaning": "名 肥満"}, {"word": "rate", "meaning": "名 率"}, {"word": "on the rise", "meaning": "上昇中で"}, {"word": "promote", "meaning": "動 販売促進する"}], "rule": {"number": 18, "title": "品詞問題では、文の要素がそろった文末の空所には副詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1019, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q19)", "q": "Dr. Hendrick's lecture will explore ------- to current methods of supplying livestock with fresh water.", "c": ["alternatives", "alternatively", "alternate", "alternated"], "a": 0, "exp": "Dr. Hendrick's lecture が主語、will explore が述語動詞、空所後の前置詞 to から先は修飾語です。動詞 explore は、ここでは、「(可能性やテーマ、考え等) を探る」という意味の他動詞で、空所には「何」を探るのか、という目的語の名詞が必要です。選択肢中、名詞は、alternative (代替案、代替品) の複数形 (A) alternatives です。alternative to X は「X の代替」という意味です。語尾が形容詞に多い -tive ですが、名詞の用法があるのに注意しましょう。(B)「もしくは」は副詞です。(C) は、「交互に行う」という動詞か「代わりの」という形容詞、もしくは「代役」という名詞です。(D) は動詞の過去形・過去分詞です。\n\n和訳: Hendrick 博士の講義では、家畜に淡水を供給する現在の方法に対する代替案を探る。", "v": [{"word": "supply", "meaning": "動 供給する"}, {"word": "livestock", "meaning": "名 家畜"}, {"word": "fresh water", "meaning": "淡水"}], "rule": {"number": 19, "title": "品詞問題で、注意が必要な語尾が-iveの名詞。", "category": "第1章 品詞問題"}}, {"id": 1020, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q20)", "q": "The festival coordinator will assign duties to each of the volunteers according to their task -------.", "c": ["preferring", "preference", "preferred", "preferable"], "a": 1, "exp": "The festival coordinator が主語、will assign が述語動詞、duties が目的語で、その後は修飾語です。空所前の according to は、ここでは、「〜にしたがって」という意味の前置詞です。their task をその目的語と考えると、ここで文が完結しているので、空所には副詞が入るはずです。ところが、選択肢に語尾が -ly の副詞が見当たりません。そこで、前の名詞が形容詞的に後の名詞を修飾する「名詞＋名詞」の可能性を考えます。名詞 (B) preference (希望、好み) を空所に入れると、task preference (業務希望) となり意味が通ります。(A) は動詞 prefer (〜の方を好む) の現在分詞・動名詞、(C) は過去形・過去分詞、(D)「好ましい」は形容詞です。\n\n和訳: そのフェスティバルの調整役は、各自の業務希望にしたがって、ボランティア1人1人に任務を割り当てる予定だ。", "v": [{"word": "assign", "meaning": "動 割り当てる"}, {"word": "duty", "meaning": "名 任務"}, {"word": "task", "meaning": "名 業務"}], "rule": {"number": 20, "title": "品詞問題では、「名詞＋名詞」の可能性も頭に入れる。", "category": "第1章 品詞問題"}}, {"id": 1021, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q21)", "q": "Vintage toy sellers must be as ------- as possible when detailing the condition of items in online auctions.", "c": ["thorough", "thoroughly", "thoroughness", "more thoroughly"], "a": 0, "exp": "こうした as と as の間が空所になった品詞問題の解き方のコツは、「as と as 以降を取って考える」です。ここでも、前の as を取り、後ろの as 以降を消すと、「S must be -------」となります。この空所には、be動詞の補語の形容詞が必要なので、(A) thorough (徹底的な、完全な) が正解です。thorough は TOEIC 重要語で、「細部まで漏らさずきっちりした」「隅から隅まで徹底的な」といったニュアンスの形容詞です。副詞の (B)「徹底的に」から -ly を取った (A) が形容詞だと、語尾でも品詞を判別できます。(C)「徹底していること」は名詞、(D) は副詞の比較級です。\n\n和訳: ビンテージ玩具の売り手は、オンラインオークションで品物の状態を説明する際、できる限り漏れなくきっちりしなければならない。", "v": [{"word": "seller", "meaning": "名 売り手"}, {"word": "detail", "meaning": "動 くわしく説明する"}], "rule": {"number": 21, "title": "asとasの間が空所の品詞問題は、asとas以降を取って考える。", "category": "第1章 品詞問題"}}, {"id": 1022, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q22)", "q": "Pangflo Corp's new software program makes it easier for small businesses to ------- record sales and expenses.", "c": ["accurately", "accurate", "accuracy", "accuracies"], "a": 0, "exp": "Pangflo Corp's new software program が主語、makes が述語動詞、it が目的語、形容詞の比較級 easier が補語の SVOC のカタチです。S make(s) it easier for X to do で「SはXが〜することをより簡単にする」という意味です。この問題文では、不定詞の to と原形動詞 record の間が空所です。不定詞を修飾するのは副詞なので、(A) accurately (正確に) が正解です。こうした、不定詞の to と原形動詞の間に副詞が入る形は、文法用語で分離不定詞と呼ばれるカタチで、TOEIC でも出ます。(B)「正確な」は形容詞、(C)「正確さ」は名詞、(D) は名詞の複数形です。\n\n和訳: Pangflo 社の新ソフトプログラムは、小さな会社が正確に売り上げと経費を記録するのを簡単にします。", "v": [], "rule": {"number": 22, "title": "品詞問題で、空所が準動詞を修飾していたら副詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1023, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q23)", "q": "------- after he joined the company, Shigeru Iwata created a best-selling video game.", "c": ["Short", "Shortness", "Shortly", "Shorten"], "a": 2, "exp": "空所後の接続詞 after からカンマまでが、after he joined the company という副詞節 (SV) です。こうした節を修飾するのは副詞なので、(C) Shortly (すぐに) が正解です。shortly after SV で、「SがVした後すぐに」という意味です。このように、副詞は、節や文全体なども修飾します。品詞問題では、空所が名詞を修飾していたら形容詞を、名詞以外を修飾していたら副詞を選ぶ、とシンプルに頭に入れましょう。(A)「短い」は形容詞、(B)「短さ」は名詞、(D)「短くする」は動詞です。\n\n和訳: 会社に加わってすぐに、Shigeru Iwata はビデオゲームのヒット作を作った。", "v": [{"word": "best-selling", "meaning": "形 ベストセラーの、ヒット商品の"}], "rule": {"number": 23, "title": "品詞問題で、空所が節や文全体を修飾していたら副詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1024, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q24)", "q": "Although the painting depicts an eighteenth-century tea party, it is still ------- a contemporary piece of art.", "c": ["recognition", "recognizably", "recognizable", "recognize"], "a": 1, "exp": "この問題のような、be動詞と冠詞の間の空所に副詞を選ぶ品詞問題は、定期的に出題されます。文法の基本ルールとして、形容詞は、冠詞の外から名詞を修飾することはできません。文全体は、文頭の接続詞 although が2つの節 (SV) をつなぐカタチです。カンマ後の節を見ると、it が主語、is が述語動詞、空所後の名詞 a piece (作品) が補語で、文の要素がそろっています (still は副詞)。したがって、空所に入るのは修飾語です。「S is ------- a 〜 .」のような、冠詞の外の空所に入るのは、文全体に補足情報を加える文修飾の副詞なので、(B) recognizably (明らかに、一目瞭然で) が正解です。(A)「認知、称賛」は名詞、(C)「一目でわかる、明らかな」は形容詞、(D)「認識する、称える」は動詞です。\n\n和訳: その絵画が描写しているのは、18世紀のティーパーティーだが、それでも現代の芸術作品であることは一目瞭然だ。", "v": [{"word": "depict", "meaning": "動 描写する"}, {"word": "contemporary", "meaning": "形 現代の"}, {"word": "piece", "meaning": "名 作品"}], "rule": {"number": 24, "title": "形容詞は、冠詞を飛び越えて名詞を修飾できない。", "category": "第1章 品詞問題"}}, {"id": 1025, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q25)", "q": "Salcom Media announced today that it has ------- bid to purchase the Austin Starlings baseball team.", "c": ["successful", "success", "succeeded", "successfully"], "a": 3, "exp": "Salcom Media が主語、announced が述語動詞、that 節 (SV) が目的語です。that 節の中を見ると、it が主語です。ここで、has を述語動詞、bid を「入札」という意味の名詞で目的語と考え、空所に名詞を修飾する形容詞の (A)「成功した」を入れたいところですが、bid は可算名詞なので、単数形の場合、it has a successful bid と、冠詞 a が必要です。同様に、過去分詞の (C)「引き継いだ」を空所に入れ、has succeeded を現在完了形の述語動詞と考えても、やはり目的語の名詞 bid には冠詞が必要です。そこで、空所の前後 has bid を、動詞 bid (入札する) の現在完了形の V と考え、V を修飾する副詞の (D) successfully (うまく) を空所に入れると、正しい英文が完成します。(動詞 bid は、過去形・過去分詞ともに bid です)。(B)「成功」は名詞です。\n\n和訳: Salcom Media は、Austin Starlings 球団を買収する入札に成功したことを今日、発表した。", "v": [{"word": "bid", "meaning": "動 入札する"}, {"word": "purchase", "meaning": "動 購入する"}], "rule": {"number": 25, "title": "可算名詞は、単数形なら冠詞等が必要。", "category": "第1章 品詞問題"}}, {"id": 1026, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q26)", "q": "------- with this letter are a map of Cedarville and a pamphlet with information about the town's history.", "c": ["Include", "Included", "Includes", "Inclusion"], "a": 1, "exp": "主語になる名詞の (D) Inclusion (含めること) を空所に入れると、述語動詞が are なので、主述が合いません。そこで、補語の位置にあった過去分詞が文頭に出た倒置形と考え、(B) Included (含まれて) を空所に入れると、正しい英文が完成します。元々のカタチは、A map of Cedarville and a pamphlet with information about the town's history are included with this letter. です。これだと主語が長すぎるので、過去分詞 included から letter までのカタマリを文頭に移動し、その後を VS の語順にしたのが、倒置形の Included with X are A and B. (Xに同封されているのはAとBだ) です。(A)「含む」は動詞、(C) はその3人称単数現在形です。\n\n和訳: この手紙に同封されているのは、Cedarville の地図と、町の歴史ついての情報が掲載された小冊子です。", "v": [], "rule": {"number": 26, "title": "押さえておきたいPart 5で狙われる倒置のパターン。", "category": "第1章 品詞問題"}}, {"id": 1027, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q27)", "q": "Although the company was split into two separate firms, they continued to enjoy a ------- working relationship.", "c": ["prosperously", "prosperity", "prosperous", "prosper"], "a": 2, "exp": "文全体は、文頭の接続詞 although が2つの節 (SV) をつなぐカタチです。カンマ後の節を見ると、they が主語、continued が述語動詞、to enjoy 以降が目的語 (不定詞の名詞的用法) です。不定詞の中を見ると、空所後の working は「仕事上の」という意味の形容詞で、名詞 relationship は enjoy の目的語です。つまり、「a ------- 形 名」のカタチです。ここで、直後の形容詞を修飾する副詞の (A)「好調に」を空所に入れると、「好調に仕事上の関係」となり、意味が通じません。そこで、形容詞の (C) prosperous (好調な) を空所に入れると、working relationship という名詞のカタマリを修飾し、「好調な仕事上の関係」となり、文意が通ります。prosperous は、rich and successful (儲かっていて、成功している) という意味です。(B)「繁栄」は名詞、(D)「繁栄する」は動詞です。\n\n和訳: その会社は、2つの別々の会社に分割されたが、好調な仕事上の関係を維持した。", "v": [{"word": "although", "meaning": "接 〜だが"}, {"word": "split", "meaning": "動 分割する"}, {"word": "separate", "meaning": "形 別々の"}, {"word": "firm", "meaning": "名 会社"}], "rule": {"number": 27, "title": "「冠 ------- 形 名」の空所には、形容詞が入る場合もある。", "category": "第1章 品詞問題"}}, {"id": 1028, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q28)", "q": "Ms. Flynn proposed several environmental solutions during the ------- debate on pesticide use in agriculture.", "c": ["liveliness", "lived", "living", "lively"], "a": 3, "exp": "空所後の名詞 debate (討論会) は前置詞 during の目的語で、空所には名詞を修飾する形容詞が必要です。選択肢中、空所に入れて意味が通じる形容詞は、(D) lively (活発な) です。lively は、語尾が副詞に多い -ly ですが、「活発な、活気のある」といった意味の形容詞です。TOEIC では、lively discussion (活発な議論) や lively restaurants (活気のあるレストラン) といったカタチで出ます。(A)「活気」は名詞、(B) は動詞 live (住む) の過去形・過去分詞です。(C) を、形容詞の役割をする現在分詞として空所に入れると、「生きている討論会」となり意味が通りません。また、living は、「生活のための」の意味の動名詞として、living room や living expenses (生活費) のようなカタチで名詞を修飾しますが、ここでは意味が通じません。\n\n和訳: Flynn さんは、農業における殺虫剤の使用に関する活発な討論会で、いくつかの環境問題の解決策を提案した。", "v": [{"word": "solution", "meaning": "名 解決策"}, {"word": "debate", "meaning": "名 討論会"}, {"word": "pesticide", "meaning": "名 殺虫剤"}], "rule": {"number": 28, "title": "品詞問題で、注意が必要な語尾が-lyの形容詞。", "category": "第1章 品詞問題"}}, {"id": 1029, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q29)", "q": "Ms. Li's colleagues find her approach to designing architectural spaces quite -------.", "c": ["inspirational", "inspirationally", "inspiration", "inspire"], "a": 0, "exp": "Ms. Li's colleagues が主語、find が述語動詞、her approach が目的語です。動詞 find には、SVO のカタチで、「S は O を見つける」という意味がありますが、「Li さんの同僚は彼女の手法を見つける」では文意が通じません。そこで、SVOC のカタチで、「S は O が C だと思う、わかる」の意味だと考え、読み進めます。前置詞 to から spaces までは、her approach を修飾する形容詞のカタマリ (approach to doing で「〜する手法」という意味)、副詞 quite (かなり) は空所に対する修飾語で、空所には補語の形容詞が必要です。したがって、形容詞 (A) inspirational (刺激的な) が正解です。S find her approach inspirational. で、「S は彼女の手法を刺激的だと思っている」となり、文意も通ります (Her approach is inspirational. の O = C の関係が成立します)。(B)「刺激的に」は副詞、(C)「刺激」は名詞、(D)「刺激を与える」は動詞です。\n\n和訳: Li さんの同僚は、建築空間をデザインする彼女の手法を、とても刺激的だと思っている。", "v": [{"word": "colleague", "meaning": "名 同僚"}, {"word": "architectural space", "meaning": "建築空間"}], "rule": {"number": 29, "title": "findとmakeはSVOCのカタチに注意。", "category": "第1章 品詞問題"}}, {"id": 1030, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "必修問題 (Q30)", "q": "Please be aware that express delivery is available upon request but subject to ------- shipping charges.", "c": ["additionally", "add", "additive", "additional"], "a": 3, "exp": "文全体は、Please be aware that SV. のカタチで、that 節の中では、express delivery is available but subject to 〜 . と、接続詞 but が2つの補語 (形容詞 available と subject) をつないでいます。空所前の subject to の to は前置詞で、空所後の shipping charges (送料) はその目的語 (「名詞＋名詞」のカタチ) です。「名詞＋名詞」のカタチを修飾するのは形容詞なので、(D) additional (追加の) が正解です。be subject to X は「X の対象となる、X になる場合がある」という意味で、Prices are subject to change. (値段は変更になる場合がある) といったカタチで頻出します (この change は名詞)。(A)「加えて」は副詞、(B)「加える」は動詞、(C)「添加物」は名詞です。\n\n和訳: リクエストがあれば速達がご利用いただけますが、追加の送料の対象となりますことをご承知おきください。", "v": [{"word": "aware", "meaning": "形 気づいている"}, {"word": "upon request", "meaning": "リクエストがあれば"}, {"word": "be subject to", "meaning": "〜の対象となる、〜になる場合がある"}], "rule": {"number": 30, "title": "Part 5で注意したいtoの見分け。", "category": "第1章 品詞問題"}}, {"id": 1031, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q31)", "q": "The chamber of commerce's annual business plan ------- is a wonderful opportunity for emerging entrepreneurs.", "c": ["competitive", "competition", "competitor", "competitively"], "a": 1, "exp": "「商工会議所の年に 1 度のビジネスプラン ------- は」の空所に入る主語が必要です。主語になる名詞 (B)(C) のうち、述語動詞 is の補語である a wonderful opportunity（素晴らしい機会）とイコールになるのは、(B) competition（コンテスト、競技会）です。competition は、「競争」以外に、この「コンテスト、競技会」の意味でも TOEIC に頻出します。(C)「競争相手」は補語とイコールにならず意味が通じません。(A)「他に負けない」は形容詞、(D)「他に負けないように」は副詞です。SV の間が空所と考え、(D) を入れると文意が通じません。\n\n和訳: 商工会議所の年に1度のビジネスプランコンテストは、新進気鋭の起業家にとって、素晴らしい機会だ。", "v": [{"word": "chamber of commerce", "meaning": "商工会議所"}, {"word": "annual", "meaning": "形 年に1度の"}, {"word": "emerging", "meaning": "形 新進気鋭の、新興の"}, {"word": "entrepreneur", "meaning": "名 起業家"}], "rule": {"number": 1, "title": "品詞問題では、主語には名詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1032, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q32)", "q": "Mr. Hudson purchased the flooring and tiles for his kitchen ------- before installing them.", "c": ["separately", "separation", "separate", "separating"], "a": 0, "exp": "Mr. Hudson が主語、purchased が述語動詞、the flooring and tiles が目的語で、空所がなくても文の要素がそろっています（前置詞 before 以降は修飾語）。こうした文の要素がそろったカタチの後に置き、述語動詞を後ろから修飾するのは副詞なので、(A) separately（別々に）が正解です。(B)「分離」は名詞、(C) は「別々の」という形容詞か「分ける」という動詞、(D) は現在分詞・動名詞です。「文の要素がそろったカタチの後の空所には副詞を選ぶ」のが、品詞問題を解く際の基本です。\n\n和訳: Hudson さんは、キッチン用の床材とタイルを、設置する前に別々に購入した。", "v": [{"word": "purchase", "meaning": "動 購入する"}, {"word": "flooring", "meaning": "名 床材"}, {"word": "install", "meaning": "動 設置する、インストールする"}], "rule": {"number": 18, "title": "品詞問題では、文の要素がそろった文末の空所には副詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1033, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q33)", "q": "Beginning on December 1, Rhomtel Media will use a new system for sending news updates to its -------.", "c": ["subscription", "subscribe", "subscribers", "subscribing"], "a": 2, "exp": "空所には、前置詞 to の目的語になる名詞が必要（its は「その」という意味の所有格）です。選択肢中、(A)(C) が名詞なので、意味を考えます。news updates（最新ニュース）を送る相手は「人」なので、(C) subscribers（購読者）が正解です。(A)「購読、長期契約」は意味が通じません。(B)「購読する、長期契約する」は動詞、(D) はその現在分詞・動名詞です。名詞が正解になる品詞問題で、選択肢に「人」「人以外」が並んでいたら、必ず意味を考えましょう。\n\n和訳: 12月1日から、Rhomtel Media は、最新ニュースを購読者に送るための新しいシステムを使う予定だ。", "v": [], "rule": {"number": 4, "title": "名詞を選ぶ品詞問題では、「人」「人以外」の選択肢に注意。", "category": "第1章 品詞問題"}}, {"id": 1034, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q34)", "q": "We apologize for the delay and will ship the ------- items by February 1.", "c": ["remained", "remain", "remaining", "remains"], "a": 2, "exp": "文全体は、接続詞 and が apologize と will ship という 2 つの述語動詞をつなぐカタチです。空所後の名詞 items は、will ship の目的語で、空所には名詞を修飾する形容詞が必要です。選択肢中、形容詞の機能を持つのは、分詞の (A)(C) です。このうち、現在分詞の (C) remaining を空所に入れると、「残りの品物、残っている品物」となり文意が通ります。なお、名詞を修飾する過去分詞は通常、boiled egg（ゆで卵）のように、「受け身」の意味を表します。「受け身」にならない自動詞の過去分詞が名詞を修飾するのは、fallen leaves（落ち葉）のような、「状態の変化」を表す場合に限られます。したがって、自動詞 remain（〜のままでいる）の過去分詞の (A) も名詞を修飾しません。(B) は動詞、(D) はその 3 人称単数現在形です。\n\n和訳: 当社は遅れをお詫びし、残りの品物を2月1日までに出荷します。", "v": [{"word": "apologize", "meaning": "動 お詫びする"}, {"word": "delay", "meaning": "名 遅れ"}], "rule": {"number": 13, "title": "名詞を修飾する分詞を選ぶ際は、「する・される」の関係を考える。", "category": "第1章 品詞問題"}}, {"id": 1035, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q35)", "q": "The new racing game developed by Bliztech Arts is expected to be extremely -------.", "c": ["excite", "exciting", "excitement", "excited"], "a": 1, "exp": "The new racing game が主語で、developed by Bliztech Arts は主語を説明する形容詞のカタマリ（developed は過去分詞）です。is expected が述語動詞で、空所には、be 動詞 be の補語になる形容詞が必要です。選択肢中、形容詞の機能を持つのは、分詞の (B)(D) です。「する・される」の関係を考えると、ゲームは人を興奮させる側なので、能動の意味を表す現在分詞の (B) exciting（エキサイティングな）が正解です。受動の意味を表す過去分詞の (D)「興奮して」は意味が通じません。(A)「興奮させる」は動詞、(C)「興奮」は名詞です。\n\n和訳: Bliztech Arts が開発した新しいレーシングゲームは、非常にエキサイティングだろうと期待されている。", "v": [{"word": "develop", "meaning": "動 開発する"}, {"word": "be expected to be", "meaning": "〜だと期待されている"}, {"word": "extremely", "meaning": "副 きわめて"}], "rule": {"number": 13, "title": "名詞を修飾する分詞を選ぶ際は、「する・される」の関係を考える。", "category": "第1章 品詞問題"}}, {"id": 1036, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q36)", "q": "Among the paralegals at Rubin Law Offices, Marissa Perkins is one of the -------.", "c": ["competency", "competently", "more competency", "most competent"], "a": 3, "exp": "Marissa Perkins が主語、is が述語動詞、one が補語です。空所に前置詞 of の目的語が必要と考え、名詞の (A)「能力」や (C)「より多くの能力」を空所に入れると、主語とイコールにならず意味が通じません（one of the の後には必ず複数形の名詞が入るので、数も合いません）。そこで、反復する名詞 paralegals が空所後に省略された「one of the ------- (paralegals)」のカタチと考え、空所に形容詞の最上級 (D) most competent（最も有能な）を入れると正しい英文が完成します。意味が明らかな場合に、最上級の形容詞の後の名詞が省略されるこのカタチは、何度か出題例があります。(B)「上手に」は副詞です。\n\n和訳: Rubin 法律事務所の法律事務員の中で、Marissa Perkins は、最も有能な1人だ。", "v": [{"word": "paralegal", "meaning": "名 法律事務員（弁護士の補助業務を行う人）"}], "rule": {"number": 12, "title": "品詞問題で、空所が名詞を修飾していたら形容詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1037, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q37)", "q": "Adanni Engineering appointed a contractor to carry out repairs and other ------- work at its factory.", "c": ["maintain", "maintained", "maintenance", "maintains"], "a": 2, "exp": "Adanni Engineering が主語、appointed が述語動詞、a contractor が目的語です。目的を表す不定詞の部分は、to carry out X and Y のカタチで、空所後の work は、carry out の目的語の名詞です。この名詞を修飾する形容詞が正解候補ですが、選択肢にありません。また、形容詞の機能を持つ、動詞 (A) maintain（保守点検する）の過去分詞の (B) を空所に入れると、「保守点検された作業」となり意味が通じません。そこで、「名詞＋名詞」のカタチと考え、(C) maintenance（保守点検）を空所に入れると、maintenance work（保守点検作業）となり、文意が通じます。(D) は動詞の 3 人称単数現在形です。\n\n和訳: Adanni Engineering は、自社工場で補修やその他の保守点検作業を行うため、請負業者を指名した。", "v": [{"word": "appoint", "meaning": "動 指名する"}, {"word": "contractor", "meaning": "名 請負業者"}, {"word": "carry out", "meaning": "実行する"}], "rule": {"number": 20, "title": "品詞問題では、「名詞＋名詞」の可能性も頭に入れる。", "category": "第1章 品詞問題"}}, {"id": 1038, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q38)", "q": "Job seekers must ------- demonstrate their skills and experience to potential employers.", "c": ["effective", "effect", "effectively", "effected"], "a": 2, "exp": "Job seekers が主語、空所前が助動詞の must、後が原形動詞 demonstrate です。助動詞と原形動詞はセットで述語動詞です。間に入るのは述語動詞を修飾する副詞なので、(C) effectively（効果的に）が正解です。demonstrate は TOEIC 頻出動詞で、「〜をはっきり示す、実演する」という意味です。(A)「効果的な」は形容詞、(B) は、「効果、影響」という名詞か、「〜をもたらす」という動詞、(D) は動詞の過去形・過去分詞です。助動詞と原形動詞の間の空所に副詞を選ぶ問題は、品詞問題の定番の出題パターンの 1 つです。\n\n和訳: 求職者は、潜在的な雇用主に対し、自らのスキルや経験を効果的に示さなければならない。", "v": [{"word": "job seeker", "meaning": "求職者"}, {"word": "potential", "meaning": "形 潜在的な"}, {"word": "employer", "meaning": "名 雇用主、雇用者"}], "rule": {"number": 16, "title": "品詞問題では、述語動詞の間の空所には副詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1039, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q39)", "q": "A color illustration of the blender will be added to the instruction manual, with all parts ------- labeled.", "c": ["clear", "cleared", "clearly", "clearer"], "a": 2, "exp": "空所前が、前置詞 with の目的語の all parts、後が過去分詞 labeled（ラベルを付けられた）です。この「with O 分詞」のカタチは、「O が〜した・された状態で」という同時状況を表します。ここでは、「すべてのパーツにラベルが付けられた状態で」という意味です。つまり、空所がなくても文が成立しているので、空所に入るのは修飾語です。直後の過去分詞 labeled を修飾するのは副詞なので、(C) clearly（はっきりと）が正解です。(A) は「明快な、きれいな」という形容詞か、「きれいにする」という動詞、または「（近づかずに）離れて」という副詞、(B) は動詞の過去形・過去分詞、(D) は形容詞の比較級です。(A) を副詞として空所に入れると意味が通じません。\n\n和訳: すべてのパーツの名前をはっきりラベルで示したカラーイラストが、ミキサーの取扱説明書に追加される。", "v": [{"word": "blender", "meaning": "名（料理用の）ミキサー"}, {"word": "label", "meaning": "動 ラベルを付ける"}], "rule": {"number": 22, "title": "品詞問題で、空所が準動詞を修飾していたら副詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1040, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q40)", "q": "------- alert a factory manager when a mechanical problem occurs on the assembly line.", "c": ["Promptly", "Prompt", "Prompting", "Prompts"], "a": 0, "exp": "空所後の alert には、「警報、アラート」という名詞、「警戒して」という形容詞、「〜に通報する」という動詞の 3 つの品詞があります。ここでは、「〜に通報してください」という意味の命令文の文頭の原形動詞で、その後 の a factory manager が目的語です。したがって、空所に入るのは、述語動詞を修飾する副詞の (A) Promptly（すぐに、すばやく）です。(B) は、「すばやい」という形容詞か、「促す」という動詞、または「（画面上で入力を促す）プロンプト」という名詞です。(C) は動詞の現在分詞・動名詞、(D) は、動詞の 3 人称単数現在形または名詞の複数形です。(D) を、主語の名詞として空所に入れると意味が通じません。\n\n和訳: 組み立てラインで機械の問題が起こったら、すぐに工場長に通報してください。", "v": [{"word": "occur", "meaning": "動 起こる"}, {"word": "assembly", "meaning": "名 組み立て"}], "rule": {"number": 2, "title": "品詞問題で、空所が名詞以外を修飾していたら副詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1041, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q41)", "q": "The shipping ------- for your package depends on its weight and the distance to the delivery destination.", "c": ["rates", "rater", "rate", "rated"], "a": 2, "exp": "空所には、主語になる名詞が必要です。選択肢中、名詞の機能を持つのは (A)(B)(C) です。このうち、3 単現の s が付いた述語動詞 depends on（〜によって決まる、〜次第である）と主述が一致し、意味が通じるのは、単数形の名詞 (C) rate（料金）です。shipping rate は「送料」という意味です（「名詞＋名詞」のカタチ）。複数形の (A) は述語動詞と主述が合いません。(B)「評価者」は意味が通じません。(D) は動詞 rate（評価する）の過去形・過去分詞です。主語を選ぶ品詞問題で、単数形と複数形の名詞が選択肢に並んでいたら、主述の一致に注意しましょう。\n\n和訳: あなたの荷物の送料は、重さと配達先までの距離によって決まります。", "v": [{"word": "shipping", "meaning": "名 出荷、配送"}, {"word": "depend on", "meaning": "〜によって決まる、〜次第である"}, {"word": "destination", "meaning": "名 目的地"}], "rule": {"number": 3, "title": "主語を選ぶ品詞問題では、名詞の単複に注意。", "category": "第1章 品詞問題"}}, {"id": 1042, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q42)", "q": "The store manager was extremely ------- about the shipping delay and offered a full refund.", "c": ["apologize", "apology", "apologetic", "apologetically"], "a": 2, "exp": "The store manager が主語、was が述語動詞で、空所には補語が必要（about 以降は修飾語）です。補語になるのは形容詞なので、(C) apologetic（申し訳なさそうな）が正解です（-tic は形容詞に多い語尾の 1 つ）。be extremely apologetic about X は、「X に関して非常に申し訳なさそうな」という意味です。この、「be 動詞 副詞 -------」の空所に補語の形容詞を選ぶ品詞問題は定期的に出題されます。(A)「お詫びする」は動詞、(B)「お詫び」は名詞です。名詞は補語になりますが、ここでは主語とイコールにならず意味が通じません。(D)「申し訳なさそうに」は副詞です。\n\n和訳: 店長は出荷の遅れに関して非常に申し訳なさそうで、全額返金を申し出た。", "v": [{"word": "extremely", "meaning": "副 きわめて、非常に"}, {"word": "delay", "meaning": "名 遅れ"}, {"word": "full refund", "meaning": "全額返金"}], "rule": {"number": 9, "title": "品詞問題では、補語には形容詞が最優先。", "category": "第1章 品詞問題"}}, {"id": 1043, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q43)", "q": "A variety of discounts are currently being offered ------- to members of Zavala Clothier's loyalty program.", "c": ["excluding", "exclusively", "exclusion", "exclusive"], "a": 1, "exp": "A variety が主語、are being offered が現在進行形の受動態の述語動詞で、空所後の前置詞 to 以降は修飾語です。文の要素がそろっているので、空所に入るのは修飾語です。空所後の前置詞 to 以降の副詞のカタマリを修飾するのは、副詞の (B) exclusively（限定で）です。副詞はこうした句（SV を含まないカタマリ）も修飾します。exclusively は only の意味で頻出するので、意味も覚えましょう。(A)「〜を除いて」は前置詞、(C)「除外」は名詞、(D)「限定の、高級な」は形容詞です。\n\n和訳: さまざまな割引が、Zavala 洋品店のロイヤルティ・プログラムの会員のみに現在提供されている。", "v": [{"word": "a variety of", "meaning": "さまざまな"}, {"word": "currently", "meaning": "副 現在"}, {"word": "clothier", "meaning": "名 洋品店"}, {"word": "loyalty program", "meaning": "ロイヤルティ・プログラム（顧客の忠誠心を高めるためのプログラム）"}], "rule": {"number": 2, "title": "品詞問題で、空所が名詞以外を修飾していたら副詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1044, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q44)", "q": "Nicki Harris agreed to star in the film after ------- reviewing the script.", "c": ["careful", "care", "carefully", "cared"], "a": 2, "exp": "文頭から film までが節（SV）、空所後の reviewing は動名詞で、reviewing the script（台本を検討すること）は、前置詞 after の目的語となる名詞のカタマリです。文の要素がそろっているので、空所に入るのは修飾語です。空所後の動名詞 reviewing を修飾するのは、副詞の (C) carefully（慎重に）です。(A)「慎重な」は形容詞で、after a careful review of the script（台本の慎重な検討後）のように名詞を修飾します。名詞を修飾するのは形容詞、動名詞を修飾するのは副詞、という基本を押さえましょう。(B) は「ケア」という名詞か、「関心を持つ、心配する」という動詞、(D) は動詞の過去形・過去分詞です。\n\n和訳: Nicki Harris は、慎重に台本を検討した後で、その映画に主演することに同意した。", "v": [{"word": "agree", "meaning": "動 同意する"}, {"word": "star", "meaning": "動 主演する"}, {"word": "review", "meaning": "動 検討する"}, {"word": "script", "meaning": "名 台本"}], "rule": {"number": 22, "title": "品詞問題で、空所が準動詞を修飾していたら副詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1045, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q45)", "q": "According to its president, Icaro Avionics is planning to open a second assembly ------- in Brandenburg.", "c": ["planted", "planting", "plants", "plant"], "a": 3, "exp": "Icaro Avionics が主語、is planning が述語動詞で、続く不定詞 to open（〜をオープンすること）の目的語の名詞が空所に必要です。空所前に冠詞 a があるので、単数形の名詞 (D) plant（工場）が正解です。assembly plant（組立工場）は、前の名詞が形容詞的に後の名詞を修飾する「名詞＋名詞」のカタチです（assembly は語尾が -ly ですが、副詞ではなく名詞です）。(A) は動詞 plant（植える）の過去形・過去分詞、(B) はその現在分詞・動名詞です。(C) は名詞の複数形か、動詞の 3 人称単数現在形です。\n\n和訳: 社長によると、Icaro 航空電子は、Brandenburg に2つ目の組立工場をオープンする計画だ。", "v": [{"word": "according to", "meaning": "〜によると"}, {"word": "avionics", "meaning": "名 航空電子機器、航空電子工学"}, {"word": "assembly", "meaning": "名 組立"}], "rule": {"number": 5, "title": "品詞問題では、他動詞の目的語には名詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1046, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q46)", "q": "The president asked the directors for innovative yet ------- suggestions for dealing with the company's public relations issues.", "c": ["sensible", "sensibly", "sensibility", "senses"], "a": 0, "exp": "The president が主語、asked が述語動詞、the directors が目的語で、for 以降は修飾語です。空所後の名詞 suggestions（提案）は、前置詞 for の目的語で、空所には名詞を修飾する形容詞が必要です。したがって、(A) sensible（実用的な、妥当な）が正解です。(B)「分別をもって」は副詞、(C)「感受性」は名詞、(D) は名詞 sense（感覚）の複数形です。空所前の yet には、but の意味で同じカタチをつなぐ等位接続詞の用法があるのに注意しましょう。ここでは、innovative yet sensible で、「斬新だが実用的な」という意味です。\n\n和訳: 会社の広報の課題に対処するための斬新でありつつも実用的な提案を、社長は取締役に求めた。", "v": [{"word": "director", "meaning": "名 取締役"}, {"word": "innovative", "meaning": "形 斬新な"}, {"word": "yet", "meaning": "接 だが"}, {"word": "deal with", "meaning": "〜に対処する"}, {"word": "public relations", "meaning": "広報"}, {"word": "issue", "meaning": "名 課題"}], "rule": {"number": 12, "title": "品詞問題で、空所が名詞を修飾していたら形容詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1047, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q47)", "q": "The Pritchard Inn in Birmingham ------- ranks highest for guest satisfaction in the region.", "c": ["predictably", "prediction", "predictable", "predictability"], "a": 0, "exp": "The Pritchard Inn が主語で、空所後の ranks は、名詞（順位）の複数形か動詞（順位を占める）の 3 人称単数現在形です。ここでは、空所以降に述語動詞が見当たらないので、述語動詞と判断します。主語と述語動詞の間の空所に入るのは、述語動詞を修飾する副詞なので、(A) predictably（予想通り）が正解です（highest は ranks を修飾する最上級の副詞）。品詞問題では、document（名 書類 動 記録する）や produce（名 農産物 動 生産する）のように、名詞と動詞両方の用法を持つ単語が設問文や選択肢に入っている場合があるので、落ち着いて文のカタチを確認しましょう。(B)「予言」は名詞、(C)「予想可能な」は形容詞、(D)「予測可能性」は名詞です。\n\n和訳: Birmingham にある Pritchard インは、顧客満足度で、予想通りその地域で1位にランクインしている。", "v": [{"word": "rank", "meaning": "動 ランクインする、順位を占める"}, {"word": "satisfaction", "meaning": "名 満足"}, {"word": "region", "meaning": "名 地域"}], "rule": {"number": 2, "title": "品詞問題で、空所が名詞以外を修飾していたら副詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1048, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q48)", "q": "The salesperson quoted an amount that was ------- higher than what Mr. Garneau had expected.", "c": ["slight", "slightly", "slightness", "slighter"], "a": 1, "exp": "The salesperson が主語、quoted が述語動詞、an amount が目的語です。続く that は、主格の関係代名詞で、amount を後ろから説明する形容詞のカタマリ（形容詞節）を作っています。that 以降の節を見ると、was が述語動詞で、空所後の higher は形容詞の比較級で補語です。be 動詞と補語の形容詞の間の空所に入るのは、形容詞を修飾する副詞なので、(B) slightly（わずかに）が正解です。(A)「わずかな」は形容詞、(C)「わずかなこと」は名詞、(D) は形容詞の比較級です。\n\n和訳: その営業担当者は、Garneau さんが予想していたより、わずかに高い金額を提示した。", "v": [{"word": "quote", "meaning": "動（見積もりを）提示する"}], "rule": {"number": 17, "title": "品詞問題では、be動詞と形容詞の間の空所には副詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1049, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q49)", "q": "Atanas Electric uses the highest quality parts and materials to ensure that our equipment operates as ------- as possible.", "c": ["efficient", "efficiency", "efficiently", "efficiencies"], "a": 2, "exp": "「as ------- as possible」の空所に入るのは形容詞か副詞なので、(A)(C) が正解候補です。「as と as の間が空所の品詞問題は、as と as 以降を取って考える」の鉄則に従うと、不定詞 to ensure に続く that 節（SV）の中は、「our equipment operates -------.」となります。この空所に入り、述語動詞 operates（作動する）を修飾するのは副詞なので、(C) efficiently（効率的に）が正解です。動詞 operate は補語をとらないので、空所に形容詞の (A)「効率的な」は入れられません。(B)「効率」は名詞、(D) はその複数形です。\n\n和訳: Atanas Electric は、当社の機器ができるだけ効率的に作動することを保証するため、最高品質の部品と材料を使用しています。", "v": [{"word": "ensure", "meaning": "動 保証する"}, {"word": "operate", "meaning": "動 作動する"}], "rule": {"number": 21, "title": "asとasの間が空所の品詞問題は、asとas以降を取って考える。", "category": "第1章 品詞問題"}}, {"id": 1050, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q50)", "q": "Jarafi Designs has a wide selection of ------- crafted furniture in its new showroom on Fifth Avenue.", "c": ["beauty", "beautifully", "beautify", "beautified"], "a": 1, "exp": "Jarafi Designs が主語、has が述語動詞、selection が目的語で、of 以降は修飾語です。空所後の crafted（作られた）は、直後の名詞 furniture（家具）を修飾する形容詞として機能する過去分詞です（furniture は前置詞 of の目的語）。空所には、この過去分詞を修飾する副詞が必要なので、(B) beautifully（美しく）が正解です。(A)「美しさ」は名詞、(C)「美化する」は動詞、(D)「美化された」は動詞の過去形・過去分詞です。\n\n和訳: Jarafi Designs の5番通りの新しいショールームには、美しく作り上げられた幅広い種類の家具がある。", "v": [{"word": "a wide selection of", "meaning": "幅広い種類の"}, {"word": "craft", "meaning": "動（手で精巧に）作る"}], "rule": {"number": 22, "title": "品詞問題で、空所が準動詞を修飾していたら副詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1051, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q51)", "q": "From January to March, ------- handbags can be found in the clearance section of all Brocker Fashion stores.", "c": ["discontinued", "discontinue", "discontinuing", "discontinues"], "a": 0, "exp": "文頭の From January to March は修飾語（副詞のカタマリ）で、空所後の名詞 handbags が主語です。空所に入るのは名詞を修飾する形容詞なので、形容詞の機能を持つ分詞の (A)(C) が正解候補です。次に、分詞と名詞との間の関係を考えると、handbags は「製造中止にされる」側なので、受動の意味を表す過去分詞の (A) discontinued（製造が中止された）が正解です。handbags は製造中止にする側ではないので、能動の意味を表す現在分詞の (C)「製造中止にしている」は意味が通じません。(B)「（製造・生産・販売等）を中止する」は動詞、(D) はその 3 人称単数現在形です。\n\n和訳: 1月から3月まで、製造中止になったハンドバッグは、Brocker Fashion の全店舗の在庫一掃コーナーで見つかります。", "v": [], "rule": {"number": 13, "title": "名詞を修飾する分詞を選ぶ際は、「する・される」の関係を考える。", "category": "第1章 品詞問題"}}, {"id": 1052, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q52)", "q": "Vamasoft is currently advertising several job ------- for software engineers based in San Francisco.", "c": ["opens", "openings", "openness", "opened"], "a": 1, "exp": "Vamasoft が主語、is advertising が述語動詞です。続く形容詞 several（いくつかの）は、必ず複数形の名詞を伴うので、単数形の job が目的語ではありません。空所に複数形の名詞 (B) openings を入れると、job openings（仕事の空き、求人）という「名詞＋名詞」のカタチの目的語ができて、正しい英文が完成します。(A) は、動詞 open（開ける、開く）の 3 人称単数現在形です。open は動詞または形容詞で、名詞ではありません（「店のオープン」は和製英語で、英語では a store opening または the opening of a store です）。(C) は、「（気持ちを隠さない）オープンさ」といった意味の不可算名詞です。several とカタチが合わず、意味も通じません。(D) は動詞の過去形・過去分詞です。\n\n和訳: Vamasoft は現在、San Francisco を拠点とするソフトウェア技術者の求人をいくつか出している。", "v": [{"word": "currently", "meaning": "副 現在"}, {"word": "based in", "meaning": "〜に拠点がある"}], "rule": {"number": 5, "title": "品詞問題では、他動詞の目的語には名詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1053, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q53)", "q": "Center Park's sprinkler irrigation system will be upgraded in an effort to reduce water -------.", "c": ["consume", "consumable", "consumed", "consumption"], "a": 3, "exp": "文末に置いて述語動詞を後ろから修飾する副詞が選択肢にないので、「名詞＋名詞」のカタチではないかと考えます。空所に名詞 (D) consumption（消費）を入れると、water consumption（水の消費）という、動詞 reduce（減らす）の目的語となる名詞のカタマリができて文意が通ります。(A)「消費する」は動詞、(B) は「消費可能な」という形容詞か「消費財」という名詞、(C) は動詞の過去形・過去分詞です。(B) は、名詞として空所に入れると意味が通じず、形容詞は 1 語の場合、consumable goods（消費財）のように名詞を前から修飾します。\n\n和訳: 中央公園のスプリンクラーによる散水システムは、水の消費を減らすため、改良される予定だ。", "v": [{"word": "sprinkler irrigation system", "meaning": "スプリンクラーによる散水システム"}, {"word": "in an effort to do", "meaning": "〜するために"}], "rule": {"number": 20, "title": "品詞問題では、「名詞＋名詞」の可能性も頭に入れる。", "category": "第1章 品詞問題"}}, {"id": 1054, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q54)", "q": "After multiple failed ------- to log in to her account, Ms. Fischer contacted the newspaper's subscription department.", "c": ["attempt", "attempted", "attempts", "attempting"], "a": 2, "exp": "空所には、文頭の前置詞 after の目的語になる名詞が必要なので、(A)(C) が正解候補です（multiple と failed は空所を修飾する形容詞）。形容詞 multiple（複数の）は、「2 以上」を表すので、複数形の (C) attempts（試み）が正解です。(A) は「試み」という名詞か「試みる」という動詞です。単数名詞の attempt は数が合わず、可算名詞なので、単数形なら冠詞等が必要です。(B) は動詞の過去形・過去分詞、(D) は現在分詞・動名詞です。multiple は、長文で正解の根拠にもなるので、「2 以上」と頭に入れましょう。\n\n和訳: 自分のアカウントへのログインに複数回失敗した後、Fischer さんはその新聞の購読部に連絡した。", "v": [{"word": "multiple", "meaning": "形 複数の"}, {"word": "failed", "meaning": "形 失敗した"}, {"word": "subscription", "meaning": "名 購読"}, {"word": "department", "meaning": "名 部"}], "rule": {"number": 7, "title": "品詞問題では、前置詞の目的語には名詞を選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1055, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q55)", "q": "Our Web site offers customers an ------- how-to section on maintaining and repairing Norleigh bicycles.", "c": ["extend", "extension", "extensively", "extensive"], "a": 3, "exp": "Our Web site が主語、offers が述語動詞、customers と section が目的語の SVOO のカタチです。空所後の how-to（ハウツーの、やり方の）は形容詞なので、空所の前後は、「an ------- 形 名」のカタチです。この空所に入るのは、副詞か形容詞です。直後の形容詞を修飾する副詞の (C)「広範囲に」を空所に入れると、「広範囲にハウツーのコーナー」となり意味が通じません。そこで、形容詞の (D) extensive（くわしい、広範囲の）を空所に入れると、「くわしいハウツーのコーナー」となり意味が通ります。(A)「延長する」は動詞、(B)「内線、延長」は名詞です。\n\n和訳: 当社のウェブサイトでは、Norleigh 自転車の維持管理と修理に関するくわしいハウツーコーナーをお客様に提供しています。", "v": [], "rule": {"number": 27, "title": "「冠 ------- 形 名」の空所には、形容詞が入る場合もある。", "category": "第1章 品詞問題"}}, {"id": 1056, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q56)", "q": "Attleberton Hotel is located near Lake Claire and Mount Garber, both ------- from the top-floor observation deck.", "c": ["visible", "vision", "visibility", "visibly"], "a": 0, "exp": "Attleberton Hotel からカンマまでが文の要素がそろった節（SV）です。カンマ以降は、代名詞 both（両方）の後に、現在分詞 being が省略されている独立分詞構文と呼ばれるカタチです。分詞構文では、接続詞を使わずに、分詞が副詞のカタマリを作り、節に補足情報を加えます。そこで、この問題文に接続詞を足し、分詞を be 動詞に戻して考えます。すると、「〜, and both are ------- from 〜.」となり、空所には補語になる形容詞が必要だとわかるので、(A) visible（目に見える）が正解です。(B)「視力、展望」と (C)「視界」は名詞、(D)「目に見えて」は副詞です。名詞も補語になりますが、「both（＝湖と山の両方）」とイコールにならず、意味が通じません。\n\n和訳: Attleberton ホテルは、Claire 湖と Garber 山の近くにあり、どちらも最上階の展望台から見える。", "v": [{"word": "observation deck", "meaning": "展望台"}], "rule": {"number": 9, "title": "品詞問題では、補語には形容詞が最優先。", "category": "第1章 品詞問題"}}, {"id": 1057, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q57)", "q": "Headquartered in Berlin, Seidel Fidelity is a top ------- of high-end stereo equipment.", "c": ["producer", "product", "produce", "production"], "a": 0, "exp": "文頭の Headquartered in Berlin は副詞のカタマリで修飾語（分詞構文）です。Seidel Fidelity が主語、is が述語動詞で、空所には補語になる名詞が必要（top は形容詞）です。選択肢中、主語の会社とイコールになり、意味が通じる名詞は、(A) producer（生産者）です。producer は、日本語では「人」を表しますが、英語では、「（番組等の）プロデューサー」以外に、「（会社・地域・国等、モノを生産・栽培する）生産者、生産地」も表します。(B)「製品」、(C)「農産物」、(D)「生産、（プロデュースされた）作品」は、主語とイコールにならず、意味が通じません。(D) は、「芸能プロダクション」のような和製英語に注意しましょう。英語では会社は表しません。\n\n和訳: Berlin に本社を置く Seidel Fidelity は、最高級ステレオ機器のトップのメーカーだ。", "v": [{"word": "headquartered in", "meaning": "〜に本社を置いて"}, {"word": "high-end", "meaning": "形 最高級の"}], "rule": {"number": 11, "title": "補語を選ぶ品詞問題では、主語とイコールになる答えを選ぶ。", "category": "第1章 品詞問題"}}, {"id": 1058, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q58)", "q": "The designer added some space between the company name and logo to make the packaging more -------.", "c": ["attract", "attractive", "attraction", "attractively"], "a": 1, "exp": "この問題のポイントは、動詞 make の語法です。make の後の名詞 the packaging（パッケージ）が目的語の SVO のカタチと考え、空所に副詞の (D)「魅力的に」を入れると意味が通じません（dress attractively のように、主に見た目が魅力的な様子を表し、make のような行為は表しません）。そこで、make OC（O を C にする）のカタチと考え、補語になる形容詞 (B) attractive（魅力的な）を空所に入れると、「パッケージをより魅力的にするために」となり文意が通じます（The packaging is attractive. の O ＝ C の関係が成立します）。(A)「〜を引き付ける」は動詞、(C)「魅力」は名詞です。名詞も補語になりますが、O ＝ C にならず、意味が通じません。\n\n和訳: そのデザイナーは、パッケージをより魅力的にするため、会社の名前とロゴの間にスペースを加えた。", "v": [], "rule": {"number": 29, "title": "findとmakeはSVOCのカタチに注意。", "category": "第1章 品詞問題"}}, {"id": 1059, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q59)", "q": "Barry's Tackle not only sells a range of lures but also repairs ------- fishing equipment.", "c": ["specializing", "specially", "specialty", "specialize"], "a": 2, "exp": "空所後の fishing equipment（釣具）は、「名詞＋名詞」のカタチで、空所前の述語動詞 repairs の目的語です。空所には名詞を修飾する形容詞が必要ですが、現在分詞の (A) を空所に入れると、「専門としている釣具」となり文意が通じません。そこで、名詞の (C) specialty（専門）を空所に入れると、「専門釣具」となり文意が通ります。こうした名詞が 3 つ並ぶカタチは、「spring fashion show」「chocolate ice cream」のように普通に用いられるので、頭に入れておきましょう。副詞の (B)「特別に」は名詞を修飾しません。(D)「専門とする」は動詞です。\n\n和訳: Barry's Tackle は、さまざまなルアーの販売だけでなく、専門釣具の修理も行っている。", "v": [{"word": "a range of", "meaning": "さまざまな"}, {"word": "lure", "meaning": "名 ルアー"}, {"word": "fishing equipment", "meaning": "釣具"}], "rule": {"number": 20, "title": "品詞問題では、「名詞＋名詞」の可能性も頭に入れる。", "category": "第1章 品詞問題"}}, {"id": 1060, "b": "kin", "ch": 1, "ch_title": "品詞問題", "th_title": "実戦問題 (Q60)", "q": "The company name must always be displayed in legible characters and the logo ------- in the corporate colors.", "c": ["print", "prints", "printed", "printing"], "a": 2, "exp": "この問題文は、The company name must be displayed in 〜 and the logo (must be) ------- in ... と、接続詞 and が 2 つの節（SV）をつなぎ、反復する must be が省略されたカタチです。後の節の主語の logo は印刷される側なので、空所に過去分詞 (C) printed を入れると、the logo (must be) printed の受動態が完成し、文意が通ります。接続詞 and に続く部分では、語句の反復を避けるため、共通語句が省略されることがあります。(A) は、「印刷する」という動詞か「印刷（物）」という名詞、(B) は、動詞の 3 人称単数現在形か名詞の複数形、(D) は、「印刷」という名詞か現在分詞・動名詞です。\n\n和訳: 社名は常に読める文字で表示し、ロゴは会社のイメージカラーで印刷しなければならない。", "v": [{"word": "legible", "meaning": "形 読める"}, {"word": "character", "meaning": "名 文字"}, {"word": "corporate color", "meaning": "会社のイメージカラー"}], "rule": {"number": 8, "title": "接続詞andを見たら、何と何をつないでいるのかを確認する。", "category": "第1章 品詞問題"}}, {"id": 1061, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "解き方の基本 (Q61)", "q": "The CEO of Relayal Holdings ------- restructuring of the bank to be completed by August.", "c": ["expecting", "expects", "to expect", "expect"], "a": 1, "exp": "文の骨格となる主語 (S) と述語動詞 (V) を確認します。この問題文の主語は、The CEO (CEO は Chief Executive Officer の略で、「最高経営責任者」という意味) です。続く of Relayal Holdings は、主語を説明する形容詞のカタマリ (「前置詞＋名詞」は常に修飾語) です。問題を解く際は、空所の直前の名詞だけを見て、主語と見間違えないよう気を付けましょう。次に、述語動詞を探すと、空所以外に見当たりません。つまり、空所部分が述語動詞だとわかります。この時点で、現在分詞・動名詞の (A) と、不定詞の (C) は正解候補から外れます。※動名詞・分詞・不定詞は準動詞と呼ばれ、名詞・形容詞・副詞といった動詞以外の役割をします。述語動詞にはなりません。最後のチェックポイントは、「3単現のs」です。英語には、「主語が3人称 (Iとweとyou以外) の単数形 (1人・1つ) の場合、現在形の述語動詞にはsを付ける」というルールがあります。ここでは主語が、The CEO という3人称単数です。したがって、現在形なら述語動詞にsが必要なので、(B) expects が正解です。(D) は3単現のsが付いていないため、主述が一致しません。なお、Part 5 では、I や you が主語になることは少ないので、「主語が単数形なら現在形の述語動詞にはsを付ける」とシンプルなカタチで頭に入れましょう。\n\n和訳: RelayalホールディングズのCEOは、銀行の組織再編が8月までに完了すると期待している。", "v": [{"word": "restructuring", "meaning": "名 組織再編、組織替え"}], "rule": {"number": 31, "title": "動詞問題では、「SVの確認」「3単現のs」を意識する。", "category": "第2章 動詞問題"}}, {"id": 1062, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "解き方の基本 (Q62)", "q": "The following suggestions were ------- from members of the local community.", "c": ["solicit", "soliciting", "solicited", "solicits"], "a": 2, "exp": "この問題文の主語 (S) は The following suggestions (以下の提案) で、be動詞 were の直後が空所です。原形・現在形の (A) と、3人称単数現在形の (D) は、be動詞と一緒に使えないので、正解候補から外れます。次に、「態」の視点で (B)(C) を見ます。現在分詞の (B) を空所に入れると、「〜しているところだった」という意味を表す過去進行形の能動態です。過去分詞の (C) を空所に入れると、「〜された」という意味を表す過去形の受動態です。主語の「提案」と動詞 solicit (求める) との間には、「求められる」という受動の関係があります。したがって、過去分詞の (C) solicited が正解です。「be動詞＋過去分詞」はワンセットで受動態の述語動詞です。しっかりカタチを頭に入れましょう。動詞 solicit は難易度の高い単語ですが、「態」がポイントの動詞問題は、空所後の目的語の有無が解答のヒントになります。動詞問題では、選択肢の動詞の意味がわからない場合、「空所後に目的語 (名詞) があれば能動態、なければ受動態を選ぶ」のが鉄則です。この問題文では、空所後が前置詞 from で目的語がないので、目的語が主語の位置に移動した受動態が正解だと判断できます。\n\n和訳: 以下の提案が、地元のコミュニティのメンバーから求められた。", "v": [{"word": "following", "meaning": "形 以下の、次の"}], "rule": {"number": 32, "title": "動詞問題では、「する・されるの関係」「目的語の有無」を意識する。", "category": "第2章 動詞問題"}}, {"id": 1063, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "解き方の基本 (Q63)", "q": "Last year, the Peralto Company ------- approximately fifty thousand bicycles in Europe alone.", "c": ["selling", "sold", "has sold", "to sell"], "a": 1, "exp": "この問題文の主語 (S) は、the Peralto Company です。空所後に述語動詞 (V) が見当たらないので、空所が述語動詞です。したがって、現在分詞・動名詞の (A) と、不定詞の (D) は正解候補から外れます (どちらも述語動詞にならない準動詞です)。(B)(C) は述語動詞になるカタチで、3人称単数形の主語と主述が一致しています。また、どちらも能動態です。「主述の一致」「態」の視点では、正解を選ぶことはできません。そこで、「時制」の視点で問題文を見ると、文頭に Last year (昨年) という、「過去を表すキーワード」が見つかります。したがって、過去形の (B) sold が正解です。現在完了形の (C) has sold は、「過去＋現在」を表す時制なので、last year のような、過去の時点を表すキーワードと合わせて用いることはできません。\n\n和訳: 昨年、Peralto社は、欧州だけで約5万台の自転車を販売した。", "v": [{"word": "approximately", "meaning": "副 約"}, {"word": "alone", "meaning": "形 〜だけで"}], "rule": {"number": 33, "title": "動詞問題では、「時のキーワード」に注目する。", "category": "第2章 動詞問題"}}, {"id": 1064, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "必修問題 (Q64)", "q": "There are several factors ------- in selecting the location of your business.", "c": ["are considered", "considering", "consider", "to consider"], "a": 3, "exp": "選択肢に動詞 consider (考慮する) の異なるカタチが並んでいます。文全体のSVを確認すると、空所前に述語動詞 are があります (factors が主語の There VS のカタチ)。すでに V があるので、空所に V は入れられません。したがって、V になるカタチの現在形の受動態の (A)、原形・現在形の (C) は正解候補から外れます。残る (B)(D) のうち、不定詞の (D) to consider を空所に入れると、正しい英文が完成します。不定詞が名詞を後ろから説明する、不定詞の形容詞的用法と呼ばれるカタチで、factors to consider で「考慮すべき要素」という意味です。現在分詞・動名詞の (B) を空所に入れると、「要素が考慮する」という能動の意味になり、文意が通じません。\n\n和訳: 自分の会社の立地を選ぶ際、いくつか考慮すべき要素がある。", "v": [{"word": "factor", "meaning": "名 要素、要因"}], "rule": {"number": 34, "title": "動詞問題では、空所に入るのが述語動詞(V)か準動詞かを見極める。", "category": "第2章 動詞問題"}}, {"id": 1065, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "必修問題 (Q65)", "q": "All visitors must put on safety glasses and a helmet before ------- the construction zone.", "c": ["enter", "entered", "entering", "enters"], "a": 2, "exp": "選択肢に動詞 enter (〜に入る) の異なるカタチが並んでいます。空所前の before は、節 (SV) を伴う接続詞と、名詞 (のカタマリ) を伴う前置詞の両方の用法があります。ここでは、before の後が節ではないので、この before は前置詞です。選択肢中、空所後の名詞 the construction zone (工事区域) を目的語にとりつつ、前置詞 before の目的語になる名詞のカタマリを作るのが、動名詞の (C) entering です。before entering the construction zone で、「工事区域に入る前に」という意味です。原形・現在形の (A)、過去形・過去分詞の (B)、3人称単数現在形の (D) は、いずれも前置詞 before の直後に置くことはできません。〜 before they enter the construction zone. のように、主語が必要です。\n\n和訳: 工事区域に入る前に、訪問者は全員、安全メガネとヘルメットを着用しなければならない。", "v": [], "rule": {"number": 35, "title": "動詞問題では、前置詞の目的語には動名詞を選ぶ。", "category": "第2章 動詞問題"}}, {"id": 1066, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "必修問題 (Q66)", "q": "The laboratory director gave a speech ------- Dr. Marquez's contribution to the development of antiviral medications.", "c": ["praise", "praised", "praising", "praises"], "a": 2, "exp": "選択肢に動詞 praise (〜を称賛する、ほめる) の異なるカタチが並んでいます。文のSVを確認すると、The laboratory director が主語 (S)、gave が述語動詞 (V) です。すでに V があるので、空所に入るのは準動詞 (動名詞・分詞・不定詞) です。V になる原形・現在形の (A)(D) は正解候補から外れ、分詞の (B)(C) が残ります。次に、空所後の、Dr. Marquez's contribution という名詞に注目します。この名詞を目的語にとりつつ、「スピーチ ⇦ Marquez 博士の貢献を称賛するような」と、名詞 speech を後ろから修飾する形容詞のカタマリを作るのは、能動の意味を表す現在分詞の (C) praising です。受動の意味を表す過去分詞の (B) は、目的語を伴いません。a highly praised novel (非常に称賛されている小説) のように、通常名詞を前から修飾します。\n\n和訳: その研究所の所長は、抗ウイルス薬の開発に対する Marquez 博士の貢献を称賛するスピーチを行った。", "v": [{"word": "contribution", "meaning": "名 貢献"}, {"word": "antiviral medication", "meaning": "抗ウイルス薬"}], "rule": {"number": 36, "title": "名詞の後ろに分詞を選ぶ際は、空所後の目的語の有無に注目。", "category": "第2章 動詞問題"}}, {"id": 1067, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "必修問題 (Q67)", "q": "For the proposed energy project, investors will not ------- unless the government provides its support.", "c": ["commit", "committed", "commits", "committing"], "a": 0, "exp": "空所前に助動詞 will の否定形 will not があります。助動詞は原形動詞とセットで用いられるので、(A) commit が正解です。commit (全面的に関わる) は、「何かにすべてを捧げる」イメージの動詞です。(B) は過去形・過去分詞、(C) は3人称単数現在形、(D) は現在分詞・動名詞です。主語の人称や時制とは関係なく、助動詞は常に原形動詞とセットです。また、本試験では、「will not actively -------」のように、助動詞と空所の間に副詞を挟んだカタチで出題されることもあります。間に副詞を挟んでも、空所に入るのは原形動詞です。\n\n和訳: そのエネルギープロジェクト案に、投資家は、政府が支援をしない限り、全面的に関わろうとはしないだろう。", "v": [{"word": "proposed", "meaning": "形 提案された"}, {"word": "investor", "meaning": "名 投資家"}, {"word": "unless", "meaning": "接 〜しない限り"}, {"word": "provide", "meaning": "動 提供する"}], "rule": {"number": 37, "title": "動詞問題で、原形動詞が正解になる基本パターンは7つ。", "category": "第2章 動詞問題"}}, {"id": 1068, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "必修問題 (Q68)", "q": "When Rosa's Cocina opens in September, the first 100 customers ------- a free taco and drink.", "c": ["received", "have received", "receive", "will receive"], "a": 3, "exp": "文全体は、When SV, SV. のカタチです。when 節の中の V を見ると、opens と、3単現の s が付いた現在形です。when のような時を表す接続詞に続く副詞節 (副詞のカタマリを作る SV のこと) の中では、未来のことも現在形で表すというルールがあります。つまり、V が現在形なので、Rosa's Cocina が開店するのは未来の話です。したがって、空所には、未来を表す形の述語動詞 (D) will receive が入ります。過去形の (A)、現在完了形の (B)、現在形の (C) は時制が合いません。もし、when 節の V が opened と過去形なら、開店したのは過去のことなので、空所にも過去形の (A) received が入ります。\n\n和訳: Rosa's Cocina が9月にオープンする際、最初の100名のお客様は、無料のタコスとドリンクを受け取ります。", "v": [], "rule": {"number": 38, "title": "時や条件を表す副詞節では、未来のことも現在形で表す。", "category": "第2章 動詞問題"}}, {"id": 1069, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "必修問題 (Q69)", "q": "Dr. Evans requested that the walls ------- light blue so patients will feel calm in the lobby.", "c": ["must paint", "be painted", "painting", "paint"], "a": 1, "exp": "文全体は、S requested that SV so (that) SV. のカタチです。前半部分の requested に続く that 節 (SV) の中は、the walls が S で、空所が V です。選択肢中、現在分詞・動名詞の (C) を除く (A)(B)(D) が V になるカタチです。次に、「態」の視点で見ると、the walls と動詞 paint との間には、「壁が paint される」という受動の関係があるので、「be 動詞＋過去分詞」の受動態 (B) be painted が正解です。(A)(D) は能動態です。動詞 request (〜を依頼する) は、request that SV のカタチでは、that 節中の述語動詞が原形になる、というルールがあります。このため、ここでも be painted という原形が使われています。わかりづらければ、should be painted と、助動詞 should を補って考えましょう。\n\n和訳: Evans 医師は、患者がロビーで落ち着いた気持ちになるよう、壁をライトブルーで塗るよう依頼した。", "v": [{"word": "so (that)", "meaning": "接 〜するために、〜できるように"}, {"word": "calm", "meaning": "形 落ち着いた"}], "rule": {"number": 39, "title": "依頼・提案等を表す動詞のthat節ではVが原形になる。", "category": "第2章 動詞問題"}}, {"id": 1070, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "必修問題 (Q70)", "q": "The machinery installation was very fast, and the follow-up service ------- to be exceptional so far.", "c": ["has proven", "will prove", "had proven", "must prove"], "a": 0, "exp": "文全体は、SV, and SV. のカタチです。and の後の節を見ると、the follow-up service が主語 (S) で、空所が述語動詞 (V) です。選択肢はすべて V になるカタチで、主述が一致し、能動態です。つまり、「主述の一致」「態」の観点で解くことはできません。そこで、「時制」がポイントではないかと考え、「時のキーワード」を探すと、文末に so far が見つかります。so far は until now (今までのところ) の意味で、過去から現在までの継続を表す現在完了形のキーワードです。したがって、(A) has proven が正解です。prove to be は「〜だとわかる、判明する」という意味です。未来を表す形の (B)、過去のある時点より前の完了や継続を表す過去完了形の (C)、「〜だとわからなければならない」という意味を表す (D) は、時制が合わず、文意が通りません。\n\n和訳: 機械の設置はとても速く、その後のサービスもこれまでのところ、素晴らしいことがわかった。", "v": [{"word": "machinery", "meaning": "名 機械類"}, {"word": "installation", "meaning": "名 設置"}, {"word": "follow-up", "meaning": "形 その後の"}, {"word": "exceptional", "meaning": "形 並外れた、素晴らしい"}], "rule": {"number": 40, "title": "押さえておきたい現在完了形のキーワード。", "category": "第2章 動詞問題"}}, {"id": 1071, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "必修問題 (Q71)", "q": "Windle Corp ------- its hiring policy before the government announced it would be changing the labor standards act.", "c": ["was revised", "is revising", "had revised", "will revise"], "a": 2, "exp": "選択肢に動詞 revise (〜を見直す、修正する) の異なるカタチが並んでいます。文全体は、SV before SV. のカタチです。前半の節は、Windle Corp が主語 (S) で、空所が述語動詞 (V)、空所後の its hiring policy が目的語 (O) です。空所後に O があるので、空所に入るのは能動態です。受動態の (A) は正解候補から外れます。次に、「時のキーワード」を探して読み進めると、before the government announced 〜 . とあり、Windle 社が採用規定を修正したのは、政府が発表を行った過去の時点よりさらに前だとわかります。こうした過去のある時点より前の完了を表す時制が、「had＋過去分詞」の過去完了形 (C) had revised です。(B) は現在進行形、(D) は未来を表す形です。なお、この問題文のように、時の前後関係が明らかな場合、過去完了形の代わりに過去形を用いることもできるので、(A) は revised という能動態なら正解です。\n\n和訳: 政府が労働基準法を変更すると発表する以前に、Windle 社は採用規定を修正していた。", "v": [{"word": "hiring policy", "meaning": "採用規定"}, {"word": "labor standards act", "meaning": "労働基準法"}], "rule": {"number": 41, "title": "過去完了形は、過去形とセット。", "category": "第2章 動詞問題"}}, {"id": 1072, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "必修問題 (Q72)", "q": "Executives at the two companies, ------- an agreement, will form a joint venture to develop an electric vehicle battery.", "c": ["have reached", "to be reached", "reached", "having reached"], "a": 3, "exp": "選択肢に動詞 reach (〜に達する) の異なるカタチが並んでいます。文全体のSVを確認すると、文頭の Executives が主語 (S)、カンマに挟まれた部分は修飾語で、will form が述語動詞 (V) です。すでに V があるので、空所に入るのは準動詞です。現在完了形の (A) と過去形の (C) は V になるカタチなので、正解候補から外れます。残る (B)(D) のうち、空所後に目的語の名詞 an agreement があるので、能動態の (D) having reached が正解です。不定詞の (B) は受動態なので、目的語を伴いません。この「having＋過去分詞」のカタチは、完了分詞構文と呼ばれ、分詞が表す出来事が、述語動詞より前であることをはっきり示す用法です。ここでも、「合意に達したので→合弁会社を結成することになった」と、時の前後関係を明示しています。なお、分詞構文では、分詞が作る副詞のカタマリは、文頭、文中、文末のいずれの位置にも来ます。合わせて頭に入れましょう。\n\n和訳: その2社の役員は、合意に達したので、電気自動車用の電池を開発するため合弁会社を結成する予定だ。", "v": [{"word": "joint venture", "meaning": "合弁会社"}, {"word": "electric vehicle", "meaning": "電気自動車"}], "rule": {"number": 42, "title": "覚えておきたい現在分詞の3つの用法。", "category": "第2章 動詞問題"}}, {"id": 1073, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "必修問題 (Q73)", "q": "------- within a short walking distance of the downtown area, the apartment is close to numerous shopping and dining options.", "c": ["Location", "Located", "Locating", "Locate"], "a": 1, "exp": "文頭からカンマまでが副詞のカタマリで、カンマ後が節 (SV) です。こうした副詞のカタマリを作ることができるのが分詞で、分詞構文と呼ばれるカタチです。分詞構文では、文の主語と分詞との間に SV の関係があります。能動の関係があれば現在分詞、受動の関係があれば過去分詞を用いるのが原則です。ここでは、文の主語 the apartment と分詞との間に、The apartment is located within 〜 (そのアパートは〜の範囲内に位置している) という受動の関係があるので、過去分詞の (B) Located が正解です。能動の関係を表す現在分詞の (C) は意味が通じません。(A)「場所」は名詞、(D)「〜を見つける、〜の場所を特定する」は動詞の原形・現在形です。\n\n和訳: 中心地から徒歩すぐの圏内にあり、そのアパートは、多数のショッピングや食事の選択肢に近い。", "v": [{"word": "within a short walking distance", "meaning": "徒歩ですぐ行ける範囲内"}, {"word": "numerous", "meaning": "形 多数の"}], "rule": {"number": 43, "title": "分詞構文では、主語と分詞との間にSVの関係がある。", "category": "第2章 動詞問題"}}, {"id": 1074, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "必修問題 (Q74)", "q": "When ------- of waste materials and recyclables, make sure you place the items in the correct bins.", "c": ["dispose", "disposed", "disposing", "disposes"], "a": 2, "exp": "選択肢に動詞 dispose (処分する) の異なるカタチが並んでいます。文頭の接続詞 when の後には節 (SV) が続くはずですが、主語がありません。これは、when がつなぐ2つの節の主語が同じ場合、直後の「主語＋be動詞」をまとめて省略できるためです。そこで、カンマ後の命令文の意味上の主語である you を、When (you are) ------- of のカタチに戻すと、空所に入るのは、能動の意味を表す現在分詞の (C) disposing だとわかります (接続詞の直後に分詞が置かれるこのカタチは、分詞構文の意味をわかりやすくするため、接続詞を加えたカタチと考えることもできます)。(B) を過去分詞と考え空所に入れると、「あなたが処分される」という受動の意味を表し、文意が通じません。原形・現在形の (A)、3人称単数現在形の (D) は、接続詞 when の直後に置けません。\n\n和訳: 廃棄物や再利用可能な物を処分する際は、必ず正しい容器に入れてください。", "v": [{"word": "waste material", "meaning": "廃棄物"}, {"word": "recyclable", "meaning": "名 再利用可能な物"}, {"word": "correct", "meaning": "形 正しい"}, {"word": "bin", "meaning": "名 容器"}], "rule": {"number": 44, "title": "動詞問題では、when/whileの直後には分詞を選ぶ。", "category": "第2章 動詞問題"}}, {"id": 1075, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "必修問題 (Q75)", "q": "During Thursday's meeting, city officials decided to have the old railroad buildings -------.", "c": ["demolish", "demolishing", "demolishes", "demolished"], "a": 3, "exp": "選択肢に動詞 demolish (〜を取り壊す) の異なるカタチが並んでいます。文のSVを確認すると、city officials が主語 (S)、decided が述語動詞 (V) です。続く不定詞 to の後の動詞 have には、「have O 原形動詞 (O に〜させる) / 過去分詞 (O を〜してもらう)」の使役と呼ばれる用法があります。このカタチでは、「O が〜する」という能動の関係があれば原形動詞、「O が〜される」という受動の関係があれば過去分詞が O の後に置かれます。ここでは、the old railroad buildings と動詞 demolish との間には、「取り壊される」という受動の関係があるので、過去分詞の (D) demolished が正解です。能動の意味を表す原形動詞の (A) は意味が通じず、demolish は他動詞なので、能動態なら目的語が必要です。(B) は現在分詞・動名詞、(C) は動詞の3人称単数現在形です。なお、「have O 現在分詞」のカタチで、「O に〜させておく」という意味を表す用法もありますが、その場合も、「O が〜している」という能動の関係があります。\n\n和訳: 木曜日の会議中、市幹部は、その鉄道の古い建物を取り壊してもらうことに決めた。", "v": [{"word": "city official", "meaning": "市幹部"}], "rule": {"number": 45, "title": "Part 5で狙われるhaveとletの使役の用法。", "category": "第2章 動詞問題"}}, {"id": 1076, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "必修問題 (Q76)", "q": "Had the deal gone through, the combined company ------- one of the nation's largest exporters of agricultural products.", "c": ["will be becoming", "is becoming", "would have become", "has become"], "a": 2, "exp": "文頭の Had the deal gone through は、If the deal had gone through の If が省略され、had が文頭に出た倒置形です。if 節の V が「had＋過去分詞」の過去完了形になっているこのカタチは、「もし、あの時〜だったら (実際はそうではなかったが)」という過去の状況に対する願望・仮定を表す「仮定法過去完了」と呼ばれる用法です。仮定法過去完了では、主節 (if が付いていない方の節) の V が、「助動詞の過去形 (would/could/might 等)＋have＋過去分詞」のカタチになるというルールがあるので、(C) would have become が正解です。「もしあの時、取引が成立していたなら、〜になっていただろう (実際はそうならなかったが)」という意味です。仮定法過去完了は何度か出題例があるので、カタチを頭に入れましょう。\n\n和訳: もし取引が成立していたら、その合併会社は、農業用製品の、国で最大の輸出会社の1つになっていただろう。", "v": [{"word": "go through", "meaning": "(取引等が) 成立する"}, {"word": "combined company", "meaning": "合併会社"}, {"word": "exporter", "meaning": "名 輸出業者"}], "rule": {"number": 46, "title": "頭に入れておきたい仮定法の公式。", "category": "第2章 動詞問題"}}, {"id": 1077, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "実戦問題 (Q77)", "q": "The presentation ------- by Ms. Batista on password protection and encryption lasted about 75 minutes.", "c": ["given", "was given", "has given", "gave"], "a": 0, "exp": "文のSVを確認すると、主語が The presentation で、文後半の lasted (続いた) が過去形の述語動詞です。つまり、空所には、述語動詞ではない準動詞が入るので、過去分詞の (A) given が正解です。The presentation given by Ms. Batista on X and Y (プレゼン⇦XとYに関してBatistaさんが行った) と、given 以降は主語を説明する形容詞のカタマリです。過去形の受動態の (B)、現在完了形の (C)、過去形の (D) は述語動詞になるカタチです。空所で目を止めて (B) を選ばないよう、動詞問題ではしっかり文全体のSVを確認しましょう。\n\n和訳: パスワード保護と暗号化に関してBatistaさんが行ったプレゼンは、約75分続いた。", "v": [{"word": "encryption", "meaning": "名 暗号化"}, {"word": "last", "meaning": "動 続く"}], "rule": {"number": 31, "title": "動詞問題では、「SVの確認」「3単現のs」を意識する。", "category": "第2章 動詞問題"}}, {"id": 1078, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "実戦問題 (Q78)", "q": "Ms. O'Connell received a confirmation e-mail from the prospective employer immediately after ------- her job application.", "c": ["submit", "submitting", "submits", "submitted"], "a": 1, "exp": "空所前の after は、接続詞の場合は節 (SV)、前置詞の場合は名詞 (のカタマリ) を伴います。ここでは、空所以降が節ではないので、この after は前置詞です。前置詞の直後に動詞を入れる際は、目的語になる動名詞に変えるのが原則ですから、動詞 submit (〜を提出する) の動名詞 (B) submitting が正解です。submitting her job application という名詞のカタマリが、前置詞 after の目的語として機能しています。原形・現在形の (A)、3人称単数現在形の (C)、過去形・過去分詞の (D) は、after の直後に置くことはできません。after 同様、before も、節または名詞 (のカタマリ) を伴います。合わせて頭に入れましょう。\n\n和訳: 仕事の応募書類を提出した後すぐに、O'Connellさんは、将来の雇用主から確認メールを受け取った。", "v": [{"word": "prospective", "meaning": "形 見込みのある、将来の"}, {"word": "employer", "meaning": "名 雇用主"}, {"word": "immediately", "meaning": "副 ただちに"}], "rule": {"number": 35, "title": "動詞問題では、前置詞の目的語には動名詞を選ぶ。", "category": "第2章 動詞問題"}}, {"id": 1079, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "実戦問題 (Q79)", "q": "------- the work week of our sales representatives will allow for a better work-life balance.", "c": ["Shorten", "Shortening", "Shortness", "Shortened"], "a": 1, "exp": "文のSVを確認すると、空所から representatives までが主語のカタマリで、will allow が述語動詞です。空所後の名詞 the work week (週の労働時間) を目的語にとりつつ、主語になる名詞のカタマリを作るのが、動名詞の (B) Shortening (短くすること) です。原形動詞の (A)「短くする」は、命令文の文頭に置くことは可能ですが、ここではすでに述語動詞があるので空所には入れられません。名詞の (C)「不足」は、shortness of breath (息切れ) のように、前置詞 of がないと名詞をつなげられません。(D) は動詞の過去形・過去分詞です。\n\n和訳: 当社の営業担当者の週の労働時間を短縮することは、ワークライフバランスの改善を可能にするだろう。", "v": [{"word": "sales representative", "meaning": "営業担当者"}, {"word": "allow for", "meaning": "〜を可能にする"}], "rule": {"number": 34, "title": "動詞問題では、空所に入るのが述語動詞(V)か準動詞かを見極める。", "category": "第2章 動詞問題"}}, {"id": 1080, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "実戦問題 (Q80)", "q": "The program director congratulated Ms. Kaufman on being ------- as the new host of the morning show.", "c": ["choose", "choosing", "choses", "chosen"], "a": 3, "exp": "空所前の being は、前置詞 on の目的語の動名詞です。この being の後に置き、「〜されること」という受動の意味を表すのが、過去分詞の (D) chosen です。ここでは、congratulate Ms. Kaufman on being chosen as X で、「KaufmanさんがXに選ばれたことを祝う」という意味です。原形・現在形の (A)、現在分詞・動名詞の (B)、3人称単数現在形の (C) は、いずれも being の直後に置くことはできません。being は、動名詞以外に、現在分詞として、A car is being washed. (車が洗われているところだ) のような進行形でも頻出します。「beingの直後は過去分詞」と頭に入れましょう。\n\n和訳: 番組ディレクターは、Kaufmanさんが朝の番組の新司会者として選ばれたことを祝った。", "v": [{"word": "host", "meaning": "名 司会者"}], "rule": {"number": 32, "title": "動詞問題では、「する・されるの関係」「目的語の有無」を意識する。", "category": "第2章 動詞問題"}}, {"id": 1081, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "実戦問題 (Q81)", "q": "An analysis of the sales report for July ------- management's belief that sales will continue to pick up.", "c": ["was reinforced", "reinforce", "reinforcing", "has reinforced"], "a": 3, "exp": "An analysis が主語 (S)、空所が述語動詞 (V) で、management's belief が目的語 (O) です (接続詞 that 以降は、belief の内容を説明する同格節)。空所には V が入るので、現在分詞・動名詞の (C) を除く (A)(B)(D) が正解候補です。まず、主語が3人称単数なので、3単現の s がない (B) は主述が一致しません。残る (A)(D) を見ると、(A) が受動態で、(D) が能動態です。空所後に目的語があるので、能動態の現在完了形 (D) has reinforced (強固にした) が正解です。(A) は、過去形の受動態で、目的語を伴いません。\n\n和訳: 7月の販売報告書の分析で、売り上げが継続的に上向くだろうという経営陣の確信がより強固なものになった。", "v": [{"word": "analysis", "meaning": "名 分析"}, {"word": "pick up", "meaning": "上向く、改善する"}], "rule": {"number": 31, "title": "動詞問題では、「SVの確認」「3単現のs」を意識する。", "category": "第2章 動詞問題"}}, {"id": 1082, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "実戦問題 (Q82)", "q": "Earlier this year, Alkem Logistics ------- for the Best Workplace Environment award.", "c": ["was nominated", "is nominating", "nominates", "nominated"], "a": 0, "exp": "Alkem Logistics が主語で、空所には述語動詞が必要です。まず、文頭の Earlier this year (今年の今より早い時期) は、過去の時点を示すキーワードなので、過去形の (A)(D) が正解候補です。現在進行形の (B)、現在形の (C) は正解候補から外れます。次に、他動詞 nominate (〜をノミネートする、候補に挙げる) の目的語が空所後にないので、受動態の (A) was nominated (ノミネートされた) が正解です。主語の会社は賞にノミネートされる側なので、文意も通じます。能動態の (D) は、They nominated Alkem Logistics for the award. のように、目的語が必要です。\n\n和訳: 今年、Alkem Logistics は、最優秀職場環境賞にノミネートされた。", "v": [{"word": "award", "meaning": "名 賞"}], "rule": {"number": 32, "title": "動詞問題では、「する・されるの関係」「目的語の有無」を意識する。", "category": "第2章 動詞問題"}}, {"id": 1083, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "実戦問題 (Q83)", "q": "For the past decade, Somersol Industries ------- to reduce carbon emissions from its factories.", "c": ["has been striving", "is striving", "striving", "will strive"], "a": 0, "exp": "文頭の For the past X (過去Xにわたって) は、過去から現在までの継続期間を表し、動詞問題で、現在完了形を正解として選ぶキーワードです。したがって、現在完了進行形の (A) has been striving (努力し続けている) が正解です。現在進行形の (B) と、未来を表す形の (D) は時制が合いません。(C) は、述語動詞にならない現在分詞・動名詞です。現在完了時制のキーワードとして、over the past X (過去Xにわたって) と、so far (今までのところ) も合わせて押さえましょう。\n\n和訳: 過去10年間にわたって、Somersol Industries は、自社工場からの二酸化炭素の排出を減らすために努力し続けている。", "v": [{"word": "decade", "meaning": "名 10年"}, {"word": "reduce", "meaning": "動 減らす"}, {"word": "carbon emission", "meaning": "二酸化炭素の排出"}], "rule": {"number": 40, "title": "押さえておきたい現在完了形のキーワード。", "category": "第2章 動詞問題"}}, {"id": 1084, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "実戦問題 (Q84)", "q": "Revenues for the e-commerce company were up 54 percent, with book sales ------- for 24 percent of the total.", "c": ["accounts", "accounting", "accounted", "account"], "a": 1, "exp": "空所前の前置詞 with は、「with O 分詞」のカタチで、「Oが〜した・された状態で」という同時状況を表します (付帯状況の with と呼ばれる分詞構文の一種)。O と分詞との間に、「する」という能動の関係があれば現在分詞、「される」という受動の関係があれば過去分詞が置かれます。account for X は「Xの割合を占める」という意味です。ここでは、book sales account for 24 percent of the total (本の売り上げが総額の24%を占める) という能動の関係があるので、現在分詞の (B) accounting が正解です。account for はこの意味では受動態にならないので、過去分詞の (C) は空所に入れられません。(A)(D) は、動詞または「アカウント、口座」という名詞です。\n\n和訳: そのインターネット販売の会社の収入は54%増え、本の売り上げが総額の24%を占めている。", "v": [{"word": "revenue", "meaning": "名 (会社の) 収入"}], "rule": {"number": 43, "title": "分詞構文では、主語と分詞との間にSVの関係がある。", "category": "第2章 動詞問題"}}, {"id": 1085, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "実戦問題 (Q85)", "q": "The design team created twelve cardboard boxes ------- properly for each of the new action figures.", "c": ["sizing", "having sized", "to size", "that are sized"], "a": 3, "exp": "文頭から空所前が文の要素がそろった節 (SV) で、空所以降は補足説明です。選択肢はいずれも形容詞や副詞のカタマリを作る機能を持ち、答えが絞りづらいので、「態」に視点を切り替えます。空所前の boxes (箱) は特定のサイズで「作られる」側なので、受動態の (D) that are sized (〜サイズで作られている) が正解です (that は形容詞のカタマリを作る主格の関係代名詞)。他動詞 size (〜サイズで作る) の目的語の名詞が空所後にないことも、受動態を選ぶ根拠になります。(A)(B)(C) はいずれも能動態で、目的語が必要です。\n\n和訳: デザインチームは、1つ1つの新しいアクションフィギュアに適切にサイズを合わせた12個の段ボール箱を作った。", "v": [{"word": "cardboard box", "meaning": "段ボール箱"}, {"word": "properly", "meaning": "副 適切に"}], "rule": {"number": 32, "title": "動詞問題では、「する・されるの関係」「目的語の有無」を意識する。", "category": "第2章 動詞問題"}}, {"id": 1086, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "実戦問題 (Q86)", "q": "Chen Media will release its third-quarter financial results sooner than previously -------.", "c": ["announced", "announce", "announces", "announcing"], "a": 0, "exp": "接続詞 than の後が空所になった動詞問題です。空所に過去分詞の (A) announced を入れると、「以前発表されたより早く」という受動の意味を表し文意が通ります。「〜 than (they were) previously announced (to be released).」が省略されたカタチと考えられますが、「than 過去分詞」のカタチで、「〜されたより」とシンプルに押さえましょう。Part 5 で狙われる表現として、than expected/planned/predicted/scheduled (期待・計画・予想・予定より) と、as announced/expected/planned/predicted/scheduled (発表・期待・計画・予想・予定通り) も合わせて押さえましょう。\n\n和訳: Chen Media は、第3四半期の決算を、以前発表したより早く公表する予定だ。", "v": [{"word": "release", "meaning": "動 公表する"}, {"word": "third-quarter", "meaning": "形 第3四半期の"}, {"word": "financial results", "meaning": "決算"}, {"word": "previously", "meaning": "副 以前"}], "rule": {"number": 32, "title": "動詞問題では、「する・されるの関係」「目的語の有無」を意識する。", "category": "第2章 動詞問題"}}, {"id": 1087, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "実戦問題 (Q87)", "q": "By the time the tourism season begins, the contractor ------- construction of a second terminal at Nowak Airport.", "c": ["will have completed", "are completing", "has been completing", "had completed"], "a": 0, "exp": "接続詞 by the time に続く節 (SV) の述語動詞が現在形 begins です。時を表す接続詞に続く副詞節では、未来のことも現在形で表すというルールがあるので、観光シーズンが始まるのは未来の時点です。こうした未来の時点までの完了・継続を表す時制が、未来完了形の (A) will have completed (完了しているだろう) です。現在進行形の (B)、現在完了進行形の (C)、過去完了形の (D) はいずれも時制が合いません。未来完了形はときどき出題されるので、カタチ (will have 過去分詞) と用法を頭に入れておきましょう。\n\n和訳: 観光シーズンが始まるまでには、その請負業者は、Nowak空港での2つ目のターミナルの建設を完了しているだろう。", "v": [{"word": "tourism", "meaning": "名 観光業"}, {"word": "contractor", "meaning": "名 請負業者、契約業者"}], "rule": {"number": 38, "title": "時や条件を表す副詞節では、未来のことも現在形で表す。", "category": "第2章 動詞問題"}}, {"id": 1088, "b": "kin", "ch": 2, "ch_title": "動詞問題", "th_title": "実戦問題 (Q88)", "q": "When -------, over half of the shoppers indicated that they are familiar with the Accelestar brand of sports drinks.", "c": ["survey", "surveys", "surveying", "surveyed"], "a": 3, "exp": "when の直後が空所の動詞問題では、空所に入るのは分詞です。主語と分詞との間に、「する」という能動の関係があれば現在分詞、「される」という受動の関係があれば過去分詞を選ぶのが基本です。ここでは、主語 over half of the shoppers と動詞 survey (〜にアンケート調査を行う) との間には、the shoppers were surveyed という受動の関係があるので、過去分詞の (D) surveyed が正解です。現在分詞の (C) は意味が通じず、survey は他動詞なので目的語が必要です (空所後に目的語の名詞がないことも過去分詞を選ぶヒントになります)。(A) は、動詞の原形・現在形か「アンケート調査」という名詞、(B) は、動詞の3人称単数現在形か名詞の複数形です。\n\n和訳: アンケート調査を受けた際、買い物客の半数以上が、Accelestarブランドのスポーツドリンクをよく知っていることを示した。", "v": [{"word": "be familiar with", "meaning": "〜をよく知っている"}], "rule": {"number": 44, "title": "動詞問題では、when/whileの直後には分詞を選ぶ。", "category": "第2章 動詞問題"}}, {"id": 1089, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "解き方の基本 (Q89)", "q": "The food at the Bluewater Café is both wholesome and tasty, ------- the service is rather slow.", "c": ["also", "or", "but", "through"], "a": 2, "exp": "【解き方の手順】\n① 選択肢をチェック\n選択肢を見ると、それぞれの品詞は以下の通りです。\n(A) also 副詞\n(B) or 接続詞\n(C) but 接続詞\n(D) through 前置詞\nこの選択肢の並びから、「前置詞 or 接続詞」問題だと判断します。\n\n② 文のカタチをチェック\n文頭からカンマまでと空所後が共に、主語（S）と述語動詞（V）を含む節（SV）です。\n2つの節（SV）をつなげるのは、接続詞です。したがって、選択肢中、(B)(C) が正解候補として残り、接続機能を持たない副詞の (A)「また」と、節（SV）を伴わない前置詞の (D)「〜を通して」は正解候補から外れます。\n\n③ 意味のつながりをチェック\n接続詞が2つ残ったので、意味のつながりを考えます。文頭からカンマまでの節は、「Bluewater Café の食事は健康に良くて美味しい」、空所後の節は、「サービスはかなり遅い」です。こうした「プラスとマイナス」の情報をうまくつなげられるのは、(C) but（しかし、だが）です。話の流れを想定と逆方向につなぐので、「逆接」の接続詞と呼ばれます。(B) or は、2つの節をつなぐ場合、「さもなければ」という意味を表すので、ここでは文意が通じません。\n\n和訳: Bluewater Café の食事は健康に良くて美味しいが、サービスはかなり遅い。", "v": [{"word": "wholesome", "meaning": "形 健康に良い"}, {"word": "tasty", "meaning": "形 美味しい"}, {"word": "rather", "meaning": "副 かなり"}], "rule": {"number": 47, "title": "「前置詞 or 接続詞」問題は、「文のカタチ」「意味のつながり」を考える。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1090, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "必修問題 (Q90)", "q": "The Lobster Hut is currently offering discounts on meals ------- off-peak hours at its three locations.", "c": ["while", "otherwise", "during", "afterward"], "a": 2, "exp": "選択肢の並びから、「前置詞 or 接続詞」問題と判断し、文のカタチを見ます。文頭から空所前が節（The Lobster Hut が S、is offering が V）で、空所後は、off-peak hours という名詞のカタマリです（V がないので節ではありません）。空所後の名詞のカタマリと結びつくのは前置詞なので、(C) during（〜の間）が正解です。ここでは、during off-peak hours（ピーク時ではない時間帯に）という副詞のカタマリが、述語動詞 is offering を修飾し、割引が提供されている時間帯を具体的に示しています。(A)「〜する間、〜する一方で」は、節（SV）を伴う接続詞です。during と while の品詞の違いをしっかり頭に入れましょう。(B)「さもなければ」と (D)「その後で」は接続機能がない副詞です。\n\n和訳: Lobster Hut は、現在、3 店舗でピーク時ではない時間帯に食事の割引を提供している。", "v": [{"word": "off-peak hours", "meaning": "ピーク時ではない時間帯、混雑していない時間帯"}], "rule": {"number": 48, "title": "whileは接続詞、duringは前置詞。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 10
