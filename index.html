  renderCurrent();
}

// 不正解のときにカードを揺らす。揺らしたカードそのものを戻すので、0.4秒以内に次へ進んでも問題ない
function shakeCard() {
  const card = document.getElementById('main-card');
  if (!card) return;
  card.classList.add('shake');
  setTimeout(() => card.classList.remove('shake'), 400);
}

// 品詞は答えの推測材料になるので回答前は隠す。No.や正誤履歴しか無いときは品詞だけ隠し、すべて無ければ枠ごと隠す
function posTagHtml(word, showPos) {
  const no = word.no ? `<span style="font-weight:700;color:var(--gold);">No.${word.no}</span>` : '';
  const st = state.wordStats[word.w];
  const stText = statLabelText(st);
  const statHtml = `<span id="item-stat-text" class="item-stat-inline"${stText ? '' : ' hidden'}>${stText}</span>`;
  const hasVisible = Boolean(no || showPos || stText);
  return `<div class="pos-tag" id="pos-tag"${hasVisible ? '' : ' hidden'}>${no}<span id="pos-text"${showPos ? '' : ' hidden'}>${word.p}</span>${statHtml}</div>`;
}

function revealPos() {
  const tag = document.getElementById('pos-tag');
  const text = document.getElementById('pos-text');
  if (tag) tag.hidden = false;
  if (text) text.hidden = false;
}

// 選択肢を選ぶときは「名詞」と「名詞句」などを同じ品詞として扱う
const POS_GROUPS = { '名詞句': '名詞', '動詞句': '動詞', '形容詞句': '形容詞', '副詞句': '副詞', '句・表現': '表現' };
function posGroup(p) {
  return POS_GROUPS[p] || p;
}

// 4択の選択肢。品詞だけで正解が分からないよう、出題範囲 → 全単語の順に同じ品詞の単語を優先して選ぶ
function buildOptions(word) {
  const options = [word];
  const samePos = w => posGroup(w.p) === posGroup(word.p);
  const candidateLists = [state.pool.filter(samePos), RAW_WORDS.filter(samePos), state.pool, RAW_WORDS];
  for (const list of candidateLists) {
    for (const w of shuffle([...list])) {
      if (options.length >= 4) return shuffle(options);
      if (!options.some(x => x.w === w.w || x.m === w.m)) options.push(w);
    }
  }
  return shuffle(options);
}

function renderCurrent() {
  resetActionBar();
  document.getElementById('choices-container').classList.remove('compact');
  const container = document.getElementById('quiz-container');
  const choicesDiv = document.getElementById('choices-container');

  if (state.pool.length === 0) {
    container.innerHTML = `<div class="card"><div class="meaning-display">条件に合う単語がありません</div></div>`;
    choicesDiv.innerHTML = '';
    updateFooter();
    return;
  }

  if (state.currentIndex >= state.pool.length) {
    container.innerHTML = `<div class="card"><div class="meaning-display">完了！</div><div style="font-size:14px;color:var(--muted);margin-top:8px;">正答: ${state.score} / ${state.answeredCount}</div></div>`;
    choicesDiv.innerHTML = '';
    updateFooter();
    return;
  }

  const word = state.pool[state.currentIndex];
  state.answered = false;
  choicesDiv.innerHTML = '';

  if (state.mode === 'e2j' || state.mode === 'j2e') {
    container.innerHTML = `
      <div class="card" id="main-card">
        ${posTagHtml(word, false)}
        <div class="${state.mode === 'e2j' ? 'word-display' : 'meaning-display'}">${state.mode === 'e2j' ? word.w : word.m}</div>
        <div class="example-display" id="example-box">${word.e ? word.e : '<span style="opacity:0.45; font-style:italic;">（例文なし）</span>'}<br><br>${state.mode === 'e2j' ? word.m : word.w}</div>
      </div>
    `;

    const options = buildOptions(word);
    state.currentOptions = options;

    options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerHTML = `<span class="choice-key">${idx + 1}</span><span class="choice-text">${state.mode === 'e2j' ? opt.m : opt.w}</span>`;
      btn.onclick = () => handleAnswer(opt, btn);
      choicesDiv.appendChild(btn);
    });
    setDontKnowVisible(true);
    document.getElementById('dont-know-btn').onclick = handleDontKnow;
  } else if (state.mode === 'flash') {
    container.innerHTML = `
      <div class="card flash-mode" id="flash-card">
        <div class="flip-card-inner">
          <div class="card-face">
            ${posTagHtml(word, false)}
            <div class="word-display">${word.w}</div>
          </div>
          <div class="card-face card-back">
            <div class="pos-tag">${word.p}</div>
            <div class="meaning-display">${word.m}</div>
            <div style="font-size: 14px; line-height: 1.5; color: ${word.e ? '#555' : 'var(--muted)'}; font-style: ${word.e ? 'normal' : 'italic'};">${word.e || '（例文なし）'}</div>
          </div>
        </div>
      </div>
    `;
    document.getElementById('flash-card').onclick = flipCard;
    document.getElementById('next-btn').innerText = 'めくる';
    showNextButton(flipCard);
  } else if (state.mode === 'type') {
    container.innerHTML = `
      <div class="card" id="main-card">
        ${posTagHtml(word, false)}
        <div class="meaning-display">${word.m}</div>
        <div class="type-input-container">
          <input type="text" id="type-input" class="type-input" placeholder="英語で入力" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
          <button class="type-check-btn" id="type-check-btn">答え合わせ</button>
        </div>
        <div class="type-result" id="type-result" style="display:none;"></div>
        <div class="example-display" id="example-box">${word.e ? word.e : '<span style="opacity:0.45; font-style:italic;">（例文なし）</span>'}</div>
      </div>
    `;
    const input = document.getElementById('type-input');
    input.focus();
    input.addEventListener('keydown', e => {
      // 日本語入力の変換確定の Enter では答え合わせしない
      if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229 || state.answered) return;
      e.preventDefault();
      e.stopPropagation(); // 同じ Enter でキーボード操作の「次へ」まで進まないようにする
      handleTypeAnswer(input.value);
    });
    document.getElementById('type-check-btn').onclick = () => handleTypeAnswer(input.value);
    setDontKnowVisible(true);
    document.getElementById('dont-know-btn').onclick = handleTypeDontKnow;
  }

  updateFooter();
}

function handleAnswer(selectedOpt, btn) {
  const word = state.pool[state.currentIndex];
  answerChoice(selectedOpt.w === word.w, btn);
}

// 「わからない」: 正解を見せて苦手に登録。スコアは増やさず、赤表示や揺れは出さない
function handleDontKnow() {
  answerChoice(false, null);
}

function answerChoice(isCorrect, selectedBtn) {
  if (state.answered) return;
  state.answered = true;
  setDontKnowVisible(false);

  const word = state.pool[state.currentIndex];
  document.querySelectorAll('#choices-container .choice-btn').forEach((b, i) => {
    if (state.currentOptions[i] && state.currentOptions[i].w === word.w) {
      b.classList.add('correct');
    }
  });

  if (isCorrect) {
    state.score++;
  } else if (selectedBtn) {
    selectedBtn.classList.add('wrong');
    shakeCard();
  }
  recordWeak(word, isCorrect);
  showAnswerDetails();
}

// 回答後に品詞と例文を見せて次へボタンを出す（4択・タイプ共通）
function showAnswerDetails() {
  revealPos();
  document.getElementById('example-box').style.display = 'block';
  showNextButton(nextWord);
  updateFooter();
}

// カードモード: めくって答えを確かめてから「覚えた／まだ」で自己採点する
function flipCard() {
  const card = document.getElementById('flash-card');
  if (!card) return;
  card.classList.toggle('flipped');
  if (state.answered) return;
  const dk = document.getElementById('dont-know-btn');
  dk.innerText = 'まだ';
  dk.onclick = () => gradeFlash(false);
  setDontKnowVisible(true);
  document.getElementById('next-btn').innerText = '覚えた';
  showNextButton(() => gradeFlash(true));
}

function gradeFlash(known) {
  if (state.answered) return;
  state.answered = true;
  if (known) state.score++;
  recordWeak(state.pool[state.currentIndex], known);
  nextWord();
}

// 見出し語の「~」は入力不要、空白の揺れは無視して比較する
function normalizeTyped(str) {
  return str.replace(/[~～]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
}

function handleTypeAnswer(val) {
  if (state.answered) return;
  if (!val.trim()) return; // 空のまま送信しても不正解にしない

  const word = state.pool[state.currentIndex];
  const isCorrect = word.w.split('/').map(normalizeTyped).includes(normalizeTyped(val));

  if (isCorrect) {
    state.score++;
  } else {
    shakeCard();
  }
  recordWeak(word, isCorrect);
  revealTypeAnswer(word, isCorrect, val);
}

function handleTypeDontKnow() {
  if (state.answered) return;
  const word = state.pool[state.currentIndex];
  recordWeak(word, false);
  revealTypeAnswer(word, false, '');
}

function revealTypeAnswer(word, isCorrect, typed) {
  state.answered = true;
  setDontKnowVisible(false);

  const input = document.getElementById('type-input');
  input.disabled = true;
  input.blur();
  document.getElementById('type-check-btn').style.display = 'none';

  const result = document.getElementById('type-result');
  result.className = `type-result ${isCorrect ? 'ok' : 'ng'}`;
  result.innerHTML = isCorrect
    ? `<span class="type-result-label">正解</span><span class="type-result-answer">${escapeHtml(word.w)}</span>`
    : `${typed ? `<div><span class="type-result-label">あなた</span><span class="type-result-yours">${escapeHtml(typed)}</span></div>` : ''}
       <div><span class="type-result-label">正解</span><span class="type-result-answer">${escapeHtml(word.w)}</span></div>`;
  result.style.display = 'block';

  showAnswerDetails();
}

function recordWeak(word, isCorrect) {
  state.answeredCount++;
  recordItemStat(state.wordStats, WORD_STATS_KEY, word.w, isCorrect);
  const statEl = document.getElementById('item-stat-text');
  const tagEl = document.getElementById('pos-tag');
  if (statEl) {
    statEl.textContent = statLabelText(state.wordStats[word.w]);
    statEl.hidden = false;
  }
  if (tagEl) tagEl.hidden = false;
  updateWeakEntry(wordWeak(), word.w, isCorrect);
  if (!wordSeen().has(word.w)) {
    wordSeen().add(word.w);
    saveJSON(SEEN_WORDS_KEY, seenSnapshot());
  }
  saveWeakData();
}

function updateFooter() {
  const isGrammar = state.app === 'grammar';
  const pool = isGrammar ? state.grammarPool : state.pool;
  const index = isGrammar ? state.currentGrammarIndex : state.currentIndex;
  const score = isGrammar ? state.grammarScore : state.score;
  const answered = isGrammar ? state.grammarAnsweredCount : state.answeredCount;
  document.getElementById('progress-text').innerText = pool.length > 0 ? `${Math.min(index + 1, pool.length)} / ${pool.length}` : '0 / 0';
  const rate = answered > 0 ? `（${Math.round(score / answered * 100)}%）` : '';
  document.getElementById('score-text').innerText = `正答 ${score} / ${answered}${rate}`;
  // 進捗バーは「回答済み（次へ進んだ）問題数 / プール全体」
  const done = Math.min(index, pool.length);
  document.getElementById('progress-fill').style.width = pool.length > 0 ? `${done / pool.length * 100}%` : '0';

  // 表示が変わるたびに呼ばれるので、ここで設定と進み具合を保存しておく
  saveSettings();
  saveSession();
}

// ==================== 設定・進み具合の保存 ====================
// 絞り込みやモードと、出題中の問題の並び・何問目か・正答数を保存し、開き直しても続きから始める

const SETTINGS_KEY = 'toeic_settings';
const SESSION_KEY = 'toeic_session';
const WORD_INDEX = new Map(RAW_WORDS.map((w, i) => [w, i]));
const GRAMMAR_BY_ID = new Map(RAW_GRAMMAR.map(g => [g.id, g]));

function settingsSnapshot() {
  const keys = ['app', 'mode', 'sourceFilter', 'rangeFilter', 'dateFilter', 'posFilter', 'weakFilter',
                'grammarBook', 'grammarChapter', 'grammarWeakFilter', 'grammarRule', 'weakSort'];
  return Object.fromEntries(keys.map(k => [k, state[k]]));
}

function saveSettings() {
  saveJSON(SETTINGS_KEY, settingsSnapshot());
}

// 保存された値のうち、今のデータで有効なものだけを state に戻す
function restoreSettings() {
  const saved = loadJSON(SETTINGS_KEY, {});
  const pick = (value, allowed, fallback) => (allowed.includes(value) ? value : fallback);
  state.app = pick(saved.app, ['vocab', 'grammar'], 'vocab');
  state.mode = pick(saved.mode, ['e2j', 'j2e', 'flash', 'type'], 'e2j');
  state.sourceFilter = pick(saved.sourceFilter, ['all', 'daily', 'teppan'], 'all');
  const range = saved.rangeFilter;
  state.rangeFilter = range && TEPPAN_RANGES.some(r => r.start === range.start && r.end === range.end)
    ? { start: range.start, end: range.end } : null;
  state.dateFilter = Array.isArray(saved.dateFilter) ? saved.dateFilter.filter(d => DATES.includes(d)) : [];
  state.posFilter = pick(saved.posFilter, ['all', '名詞', '動詞', '形容詞', '副詞', '句・表現'], 'all');
  state.weakFilter = pick(saved.weakFilter, ['all', 'weak_unlearned', 'weak_only', 'due'], 'all');
  state.grammarBook = pick(saved.grammarBook, ['all', 'kin', 'sekai'], 'all');
  state.grammarChapter = pick(saved.grammarChapter, getGrammarChaptersList().map(c => c.ch), 'all');
  state.grammarRule = KIN_RULES.some(r => r.number === saved.grammarRule) ? saved.grammarRule : null;
  state.grammarWeakFilter = pick(saved.grammarWeakFilter, ['all', 'weak_only', 'due'], 'all');
  state.weakSort = pick(saved.weakSort, ['new', 'old', 'due', 'order'], 'new');
}

// 今の絞り込みを表す値。保存した出題順はこれが一致するときだけ使う（データが増減したときも作り直す）
function sessionSignature(app) {
  return JSON.stringify(app === 'grammar'
    ? [RAW_GRAMMAR.length, state.grammarBook, state.grammarChapter, state.grammarRule, state.grammarWeakFilter]
    : [RAW_WORDS.length, state.sourceFilter, state.rangeFilter, state.dateFilter, state.posFilter, state.weakFilter,
       ...(state.weakFilter !== 'all' ? [state.mode] : [])]); // 苦手で絞るときは出題範囲がモードで変わる
}

function sessionSnapshot() {
  const sessions = loadJSON(SESSION_KEY, {});
  // 回答済みの問題は開き直したときに出し直さないよう、次の問題から再開する
  if (state.app === 'grammar') {
    sessions.grammar = {
      sig: sessionSignature('grammar'),
      pool: state.grammarPool.map(g => g.id),
      index: Math.min(state.currentGrammarIndex + (state.grammarAnswered ? 1 : 0), state.grammarPool.length),
      score: state.grammarScore,
      answered: state.grammarAnsweredCount,
    };
  } else {
    sessions.vocab = {
      sig: sessionSignature('vocab'),
      pool: state.pool.map(w => WORD_INDEX.get(w)),
      index: Math.min(state.currentIndex + (state.answered ? 1 : 0), state.pool.length),
      score: state.score,
      answered: state.answeredCount,
    };
  }
  return sessions;
}

function saveSession() {
  saveJSON(SESSION_KEY, sessionSnapshot());
}

// 保存した続きを戻せたら true。絞り込みが変わっていたり、最後まで解き終えていたら false（新しく出題し直す）
function restoreSession(app) {
  const saved = loadJSON(SESSION_KEY, {})[app];
  if (!saved || saved.sig !== sessionSignature(app) || !Array.isArray(saved.pool)) return false;
  const pool = saved.pool.map(k => (app === 'grammar' ? GRAMMAR_BY_ID.get(k) : RAW_WORDS[k]));
  const index = Number.isInteger(saved.index) ? saved.index : 0;
  if (pool.length === 0 || pool.some(x => !x) || index < 0 || index >= pool.length) return false;
  const score = Number.isInteger(saved.score) ? saved.score : 0;
  const answered = Number.isInteger(saved.answered) ? saved.answered : 0;
  if (app === 'grammar') {
    Object.assign(state, { grammarPool: pool, currentGrammarIndex: index, grammarScore: score, grammarAnsweredCount: answered });
  } else {
    Object.assign(state, { pool, currentIndex: index, score, answeredCount: answered });
  }
  return true;
}

let activeSheetRender = null; // 今シートに出している画面の描画関数

function isSheetOpen() {
  return document.getElementById('bottom-sheet').classList.contains('open');
}

function closeSheet() {
  document.getElementById('bottom-sheet').classList.remove('open');
  document.getElementById('sheet-overlay').classList.remove('open');
}

function openSheet(title, render) {
  document.getElementById('sheet-title').innerText = title;
  activeSheetRender = render;
  render();
  const sheet = document.getElementById('bottom-sheet');
  sheet.scrollTop = 0;
  sheet.classList.add('open');
  document.getElementById('sheet-overlay').classList.add('open');
}

function toggleWeakList() {
  if (document.getElementById('bottom-sheet').classList.contains('open')) return closeSheet();
  state.weakListMode = state.mode; // 単語の苦手リストは、まず今のモードの記録を見せる
  openSheet('苦手リスト', renderWeakList);
}

function toggleRuleGuide() {
  if (isSheetOpen() && activeSheetRender === renderRuleGuide) return closeSheet();
  openSheet('金の文法 章ガイド', renderRuleGuide);
}

function toggleDataManager() {
  if (isSheetOpen() && activeSheetRender === renderBackupSheet) return closeSheet();
  backupView = { step: 'home' };
  openSheet('学習記録のバックアップ', renderBackupSheet);
}

// ==================== 金のルール・章ガイド ====================

// 章ごとの解説メモ。{ 1: "本文…", 2: "…" } の形で書くとガイドの各章の先頭に表示される（改行はそのまま反映）。
const KIN_CHAPTER_NOTES = {};

// 問題データから 金のルール の一覧を組み立てる（番号順、各ルールの問題idつき）
const KIN_RULES = (() => {
  const map = new Map();
  RAW_GRAMMAR.filter(g => g.b === 'kin' && g.rule && g.rule.number).forEach(g => {
    if (!map.has(g.rule.number)) {
      map.set(g.rule.number, { number: g.rule.number, title: g.rule.title, ch: g.ch, ids: [] });
    }
    map.get(g.rule.number).ids.push(g.id);
  });
  return [...map.values()].sort((a, b) => a.number - b.number);
})();

const KIN_CHAPTERS = (() => {
  const map = new Map();
  RAW_GRAMMAR.filter(g => g.b === 'kin').forEach(g => {
    if (!map.has(g.ch)) map.set(g.ch, { ch: g.ch, title: g.ch_title, sections: {} });
    // th_title は「必修問題 (Q114)」の形なので、括弧の前をセクション名として数える
    const section = (g.th_title || '').replace(/\s*\(.*$/, '');
    const sections = map.get(g.ch).sections;
    if (section) sections[section] = (sections[section] || 0) + 1;
  });
  return [...map.values()].sort((a, b) => a.ch - b.ch);
})();

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 解き方フェーズの手順（章ガイドと解説欄の両方で使う）
function renderPhaseSteps(phases) {
  return `<div class="phase-steps">${phases.map(p => `
    <div class="phase-step">
      <span class="phase-step-no">${p.phase}</span>
      <div>
        <div class="phase-step-title">${escapeHtml(p.title)}</div>
        ${p.action ? `<div class="phase-step-action">${escapeHtml(p.action)}</div>` : ''}
        ${p.detail ? `<div class="phase-step-detail">${escapeHtml(p.detail)}</div>` : ''}
      </div>
    </div>`).join('')}</div>`;
}

// 章ごとに持っている補足リスト（章によってキー名が違う）
const PHASE_EXTRA_LISTS = [
  ['points', '押さえる視点'],
  ['steps', '解き方のステップ'],
  ['major_patterns', '主な出題パターン'],
];

function renderPhaseGuide(pi) {
  let html = '';
  if (pi.overview) html += `<div class="phase-overview">${escapeHtml(pi.overview)}</div>`;
  if (pi.types && pi.types.length) {
    html += `<div class="guide-label">問題のタイプ</div><div class="phase-cards">${pi.types.map(t =>
      `<div class="phase-card"><strong>${escapeHtml(t.name)}</strong>${escapeHtml(t.desc || '')}</div>`).join('')}</div>`;
  }
  PHASE_EXTRA_LISTS.forEach(([key, label]) => {
    if (pi[key] && pi[key].length) {
      html += `<div class="guide-label">${label}</div><ul class="phase-list">${pi[key].map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul>`;
    }
  });
  if (pi.phases && pi.phases.length) {
    html += `<div class="guide-label">解き方フェーズ</div>${renderPhaseSteps(pi.phases)}`;
  }
  if (pi.tips && pi.tips.length) {
    html += `<div class="phase-tips"><div class="phase-tips-title">🎯 鉄則</div><ul class="phase-list">${pi.tips.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul></div>`;
  }
  return html;
}

function renderRuleGuide() {
  const container = document.getElementById('weak-list-content');
  let html = `<div class="filter-row" style="flex-wrap:wrap;">
    <button class="chip ${state.guideChapter === 'all' ? 'active' : ''}" data-guide-ch="all">すべて</button>
    ${KIN_CHAPTERS.map(c => `<button class="chip ${state.guideChapter === c.ch ? 'active' : ''}" data-guide-ch="${c.ch}">第${c.ch}章</button>`).join('')}
  </div>`;

  KIN_CHAPTERS.filter(c => state.guideChapter === 'all' || state.guideChapter === c.ch).forEach(c => {
    const notes = KIN_CHAPTER_NOTES[c.ch];
    const phaseInfo = typeof KIN_PHASES !== 'undefined' ? KIN_PHASES.find(p => p.chapter === c.ch) : null;
    const rules = KIN_RULES.filter(r => r.ch === c.ch);
    html += `<div class="guide-chapter">
      <h3>第${c.ch}章 ${escapeHtml(c.title)}</h3>
      ${phaseInfo
        ? renderPhaseGuide(phaseInfo)
        : notes
          ? `<div class="guide-notes">${escapeHtml(notes)}</div>`
          : `<div class="guide-notes empty">章の解説はまだ登録されていません</div>`}
      <div class="guide-themes">${Object.entries(c.sections).map(([name, n]) => `<span class="guide-theme">${escapeHtml(name)} ${n}問</span>`).join('')}</div>
      <div class="guide-label">金のルール（${rules.length}）</div>
      ${rules.map(r => {
        const weak = r.ids.filter(id => state.grammarWeakData[id] !== undefined).length;
        return `<div class="guide-rule">
          <span class="guide-rule-no">No.${r.number}</span>
          <span class="guide-rule-title">${escapeHtml(r.title)}
            <span class="guide-rule-meta">${r.ids.length}問${weak > 0 ? ` ・ <span class="guide-rule-weak">苦手 ${weak}</span>` : ''}</span>
          </span>
          <button class="guide-solve-btn" data-solve-rule="${r.number}">解く</button>
        </div>`;
      }).join('')}
    </div>`;
  });
  container.innerHTML = html;
}

function startRuleDrill(number) {
  state.grammarBook = 'kin';
  state.grammarChapter = 'all';
  state.grammarWeakFilter = 'all';
  state.grammarRule = number;
  syncFilterUI();
  applyGrammarFilters();
  closeSheet();
}

document.getElementById('weak-list-content').addEventListener('click', e => {
  const backupBtn = e.target.closest('[data-backup]');
  if (backupBtn) return handleBackupAction(backupBtn.dataset.backup);

  const chBtn = e.target.closest('[data-guide-ch]');
  if (chBtn) {
    const v = chBtn.dataset.guideCh;
    state.guideChapter = v === 'all' ? 'all' : Number(v);
    renderRuleGuide();
    return;
  }
  const solveBtn = e.target.closest('[data-solve-rule]');
  if (solveBtn) return startRuleDrill(Number(solveBtn.dataset.solveRule));

  const modeBtn = e.target.closest('[data-weak-mode]');
  if (modeBtn) {
    state.weakListMode = modeBtn.dataset.weakMode;
    renderWeakList();
    return;
  }
  const sortBtn = e.target.closest('[data-weak-sort]');
  if (sortBtn) {
    state.weakSort = sortBtn.dataset.weakSort;
    saveSettings();
    renderWeakList();
    return;
  }
  const delBtn = e.target.closest('[data-remove-weak]');
  if (delBtn) removeWeak(delBtn.dataset.removeWeak);
  if (e.target.closest('[data-obsidian-export]')) exportObsidianGrammarSync();
  if (e.target.closest('[data-obsidian-import]')) importObsidianGrammarSync();
});

function exportObsidianGrammarSync() {
  const payload = {
    app: 'toeic_practice',
    exportedAt: new Date().toISOString(),
    weak: state.grammarWeakData
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'obsidian_grammar_sync.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function applyObsidianSyncPayload(data) {
  const weakObj = (data && typeof data.weak === 'object' && data.weak) ? data.weak : data;
  const masteredList = (data && Array.isArray(data.mastered)) ? data.mastered : [];
  if (!weakObj || typeof weakObj !== 'object') return;
  Object.entries(weakObj).forEach(([k, v]) => {
    if (!/^\d+$/.test(k) || !v || typeof v !== 'object') return;
    state.grammarWeakData[k] = {
      streak: Number(v.streak) || 0,
      added: Number(v.added) || Date.now(),
      due: Number(v.due) || Date.now()
    };
  });
  masteredList.forEach(id => {
    delete state.grammarWeakData[String(id)];
  });
  saveGrammarWeakData();
  renderGrammarWeakList();
}

async function importObsidianGrammarSync() {
  try {
    const res = await fetch('data/obsidian_grammar_sync.json?t=' + Date.now());
    if (res.ok) {
      const data = await res.json();
      applyObsidianSyncPayload(data);
      return;
    }
  } catch (e) {}
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.onchange = ev => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = re => {
      try {
        applyObsidianSyncPayload(JSON.parse(re.target.result));
      } catch (err) {}
    };
    reader.readAsText(file);
  };
  inp.click();
}

// ==================== 苦手リスト ====================

function renderWeakList() {
  if (state.app === 'grammar') renderGrammarWeakList();
  else renderWordWeakList();
  document.getElementById('weak-list-content').insertAdjacentHTML('afterbegin', backupEntryHtml());
}

// items は { entry } を持つ配列。order は「ABC順」「本・章順」の比べ方
function sortWeakItems(items, order) {
  const compare = {
    new: (a, b) => b.entry.added - a.entry.added,
    old: (a, b) => a.entry.added - b.entry.added,
    due: (a, b) => a.entry.due - b.entry.due,
    order,
  }[state.weakSort] || order;
  return items.sort(compare);
}

// 件数・要復習数と並び替えボタン（単語・文法共通）
function weakListHeader(items, orderLabel) {
  const due = items.filter(x => isDue(x.entry)).length;
  const sorts = [['new', '新しい順'], ['old', '古い順'], ['due', '復習日順'], ['order', orderLabel]];
  return `
    <div class="weak-list-summary">
      苦手 ${items.length}件 ・ 要復習 <strong>${due}</strong>件<br>
      復習日以降に正解するたびに ${REVIEW_INTERVALS.join('日→')}日後 と間隔が延び、最後も正解すると苦手から外れます
    </div>
    <div class="filter-row" style="flex-wrap:wrap;margin-bottom:4px;">
      ${sorts.map(([k, label]) => `<button class="chip ${state.weakSort === k ? 'active' : ''}" data-weak-sort="${k}">${label}</button>`).join('')}
    </div>`;
}

function renderWordWeakList() {
  const container = document.getElementById('weak-list-content');
  const mode = state.weakListMode;
  const data = wordWeak(mode);
  const items = Object.keys(data)
    .map(k => ({ key: k, entry: data[k], word: RAW_WORDS.find(x => x.w === k) }))
    .filter(x => x.word);
  document.getElementById('sheet-title').innerText = `苦手リスト ${MODE_LABELS[mode]}（${items.length}）`;
  // 苦手はモードごとに記録しているので、他のモードの記録も切り替えて見られるようにする
  let html = `<div class="filter-row weak-mode-row">
    ${VOCAB_MODES.map(m => `<button class="chip ${m === mode ? 'active' : ''}" data-weak-mode="${m}">${MODE_LABELS[m]} ${Object.keys(wordWeak(m)).length}</button>`).join('')}
  </div>`;
  if (items.length === 0) {
    container.innerHTML = html + `<p>${MODE_LABELS[mode]}の苦手な単語はありません。</p>`;
    return;
  }
  sortWeakItems(items, (a, b) => a.key.localeCompare(b.key, 'en', { sensitivity: 'base' }));

  html += weakListHeader(items, 'ABC順');
  items.forEach(({ key, entry, word }) => {
    const stText = statLabelText(state.wordStats[key]);
    html += `
      <div class="weak-item">
        <div>
          <div class="weak-word">${escapeHtml(word.w)}${stText ? ` <span style="font-family:sans-serif;font-size:11px;font-weight:normal;color:var(--muted);">（${stText}）</span>` : ''}</div>
          <div class="weak-meaning">${escapeHtml(word.m)}</div>
          ${dueLabel(entry)}
        </div>
        <button class="del-btn" data-remove-weak="${escapeHtml(key)}">削除</button>
      </div>
    `;
  });
  container.innerHTML = html;
}

function removeWeak(key) {
  if (state.app === 'grammar') {
    delete state.grammarWeakData[key];
    saveGrammarWeakData();
  } else {
    delete wordWeak(state.weakListMode)[key];
    saveWeakData();
  }
  renderWeakList();
}

// ==================== 学習記録のバックアップ・復元 ====================
// 苦手リスト（復習日を含む）・学習済みの単語・設定・出題の続きを1つの JSON ファイルに書き出し、別の端末などで復元する

const BACKUP_APP_ID = 'toeic-drill';
// ファイル形式の版。形式を変えたら上げて、BACKUP_MIGRATIONS に1つ前の版からの変換を足す
// 版1: 単語の苦手・学習済みがモード共通 / 版2: モードごと / 版3: 通算成績（問題別正誤カウント）を含む
const BACKUP_FORMAT = 3;
// 版 n のファイルを版 n+1 に直す変換
const BACKUP_MIGRATIONS = {
  // どのモードの記録か分からないので、4モード全部に写す。
  // 形の正しくない件は写す前に除いて数えておく（写したあとに数えると4倍になる）
  1: backup => {
    const d = backup.data;
    if (!isPlainObject(d)) return { ...backup, format: 2 };
    let invalid = 0;
    let weakWords = d.weakWords;
    let seenWords = d.seenWords;
    if (isPlainObject(weakWords)) {
      const r = sanitizeWeakData(weakWords, isWordKey);
      invalid += r.invalid;
      weakWords = copyToAllModes(r.data);
    }
    if (Array.isArray(seenWords)) {
      const valid = seenWords.filter(w => typeof w === 'string' && isWordKey(w));
      invalid += seenWords.length - valid.length;
      seenWords = copyToAllModes([...new Set(valid)]);
    }
    return { ...backup, format: 2, invalidBeforeMigration: invalid, data: { ...d, weakWords, seenWords } };
  },
  2: backup => {
    const d = backup.data;
    return {
      ...backup,
      format: 3,
      data: isPlainObject(d) ? {
        ...d,
        wordStats: isPlainObject(d.wordStats) ? d.wordStats : {},
        grammarStats: isPlainObject(d.grammarStats) ? d.grammarStats : {},
      } : d
    };
  },
};
const BACKUP_MAX_BYTES = 2 * 1024 * 1024;
// ファイルの中の名前 → この端末の保存先
const RECORD_KEYS = {
  weakWords: WEAK_WORDS_KEY,
  weakGrammar: 'toeic_weak_grammar',
  seenWords: SEEN_WORDS_KEY,
  wordStats: WORD_STATS_KEY,
  grammarStats: GRAMMAR_STATS_KEY,
  settings: SETTINGS_KEY,
  session: SESSION_KEY,
};
const RECORD_STORAGE_KEYS = Object.values(RECORD_KEYS);
const BACKUP_UNDO_KEY = 'toeic_backup_undo';     // 直前の復元を取り消すための、復元する前の記録（1回分）
const BACKUP_META_KEY = 'toeic_backup_meta';     // 最後に書き出した日時
const RESTORE_STAMP_KEY = 'toeic_restore_stamp'; // 復元したことを別のタブに知らせる
const NOTICE_KEY = 'toeic_notice';               // 読み込み直したあとに出すお知らせ（sessionStorage）

let backupView = { step: 'home', restoreMode: 'merge' }; // home / confirm（復元の確認）/ undo（取り消しの確認）

function isPlainObject(v) {
  return v !== null && typeof v === 'object' && !Array.isArray(v);
}

function formatDateTime(ms) {
  const d = new Date(ms);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ---- 書き出し ----

function buildBackup() {
  return {
    app: BACKUP_APP_ID,
    format: BACKUP_FORMAT,
    exportedAt: new Date().toISOString(),
    appData: { words: RAW_WORDS.length, grammar: RAW_GRAMMAR.length },
    data: {
      weakWords: state.weakByMode,
      weakGrammar: state.grammarWeakData,
      seenWords: seenSnapshot(),
      wordStats: state.wordStats,
      grammarStats: state.grammarStats,
      settings: settingsSnapshot(),
      session: sessionSnapshot(),
    },
  };
}

function backupFile() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const stamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
  return new File([JSON.stringify(buildBackup(), null, 2)], `toeic-drill-backup-${stamp}.json`, { type: 'application/json' });
}

function markExported() {
  saveJSON(BACKUP_META_KEY, { ...loadJSON(BACKUP_META_KEY, {}), lastExportAt: Date.now() });
}

function downloadBackup() {
  const file = backupFile();
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url;
  a.download = file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  markExported();
}

// スマホの共有シート（「ファイルに保存」や別の端末へ送る）でファイルを渡せる端末か
function canShareBackup() {
  try {
    return !!(navigator.canShare && navigator.canShare({ files: [new File(['{}'], 'backup.json', { type: 'application/json' })] }));
  } catch (e) {
    return false;
  }
}

async function shareBackup() {
  try {
    await navigator.share({ files: [backupFile()], title: 'TOEIC Drill の学習記録' });
    markExported();
    backupView = { step: 'home', success: '共有しました。' };
  } catch (e) {
    if (e.name === 'AbortError') return; // 共有シートを閉じただけ
    backupView = { step: 'home', error: '共有できませんでした。「バックアップを書き出す」を使ってください。' };
  }
  refreshBackupSheet();
}

// ---- 読み込みと検証（ここでは何も書き込まない） ----

function fail(error) {
  return { ok: false, error };
}

// 別の端末の時計がずれていても、追加日が未来になったり復習日がずっと先になったりしないようにする
function clampImportedTimes(data) {
  const latestDue = startOfToday() + (REVIEW_INTERVALS[REVIEW_INTERVALS.length - 1] + 1) * DAY_MS;
  Object.values(data).forEach(e => {
    e.added = Math.min(e.added, Date.now());
    e.due = Math.min(e.due, latestDue);
  });
  return data;
}

function sanitizeStatsMap(raw) {
  const data = {};
  let invalid = 0;
  if (!isPlainObject(raw)) return { data, invalid: 0 };
  Object.keys(raw).forEach(k => {
    const e = raw[k];
    if (e && typeof e === 'object' && Number.isFinite(Number(e.a)) && Number(e.a) > 0) {
      const a = Math.max(1, Math.floor(Number(e.a)));
      const c = Math.min(a, Math.max(0, Math.floor(Number(e.c) || 0)));
      data[String(k)] = { a, c };
    } else {
      invalid++;
    }
  });
  return { data, invalid };
}

// バックアップの中身を確かめ、復元に使う記録と確認画面に出す件数を返す。全体の形が違えばファイルごと断る
function parseBackup(text) {
  let backup;
  try {
    backup = JSON.parse(text);
  } catch (e) {
    return fail('JSON として読めないファイルです。');
  }
  if (!isPlainObject(backup) || (backup.app !== BACKUP_APP_ID && backup.app !== 'toeic_practice_backup')) {
    return fail('TOEIC Drill のバックアップファイルではありません。');
  }

  // 独自形式や互換形式の変換
  if (backup.app === 'toeic_practice_backup') {
    const rawData = backup.data || {};
    backup = {
      app: BACKUP_APP_ID,
      format: BACKUP_FORMAT,
      exportedAt: backup.exportedAt || new Date().toISOString(),
      data: {
        weakWords: isPlainObject(rawData.weakWords) ? copyToAllModes(rawData.weakWords) : {},
        weakGrammar: rawData.weakGrammar || {},
        seenWords: Array.isArray(rawData.seenWords) ? copyToAllModes(rawData.seenWords) : {},
        wordStats: rawData.wordStats || {},
        grammarStats: rawData.grammarStats || {},
        settings: rawData.settings,
        session: rawData.session,
      }
    };
  }

  if (!Number.isInteger(backup.format) || backup.format < 1) return fail('ファイル形式の版が読み取れません。');
  if (backup.format > BACKUP_FORMAT) {
    return fail('新しいバージョンのアプリで書き出したファイルです。アプリを最新にしてから読み込んでください。');
  }
  let invalidBeforeMigration = 0; // 古い版を変換したときに除いた件数（変換を通ったときだけ数える）
  while (backup.format < BACKUP_FORMAT) {
    const migrate = BACKUP_MIGRATIONS[backup.format];
    if (!migrate) return fail('この古い形式のファイルには対応していません。');
    backup = migrate(backup);
    invalidBeforeMigration += Number.isInteger(backup.invalidBeforeMigration) ? backup.invalidBeforeMigration : 0;
  }

  const d = backup.data;
  if (!isPlainObject(d)) return fail('学習記録のデータが入っていません。');
  if (!isPlainObject(d.weakWords) || !isPlainObject(d.weakGrammar) || !isPlainObject(d.seenWords)) {
    return fail('苦手リストか学習済みの単語の記録が欠けているか、形が正しくありません。');
  }
  if (d.settings !== undefined && !isPlainObject(d.settings)) return fail('設定の記録の形が正しくありません。');
  if (d.session !== undefined && !isPlainObject(d.session)) return fail('出題の続きの記録の形が正しくありません。');

  const words = sanitizeWeakByMode(d.weakWords);
  const grammar = sanitizeWeakData(d.weakGrammar, isGrammarKey);
  const seen = sanitizeSeenByMode(d.seenWords);
  const wordStats = sanitizeStatsMap(d.wordStats);
  const grammarStats = sanitizeStatsMap(d.grammarStats);
  const knownWords = new Set(RAW_WORDS.map(w => w.w));
  const weakWordKeys = new Set(VOCAB_MODES.flatMap(m => Object.keys(words.data[m])));
  const exportedAt = Date.parse(backup.exportedAt);

  return {
    ok: true,
    exportedAt: Number.isFinite(exportedAt) ? exportedAt : null,
    // 設定と出題の続きの中身は、読み込んだあとに restoreSettings / restoreSession が1項目ずつ確かめる
    records: {
      weakWords: Object.fromEntries(VOCAB_MODES.map(m => [m, clampImportedTimes(words.data[m])])),
      weakGrammar: clampImportedTimes(grammar.data),
      seenWords: seen.data,
      wordStats: wordStats.data,
      grammarStats: grammarStats.data,
      settings: d.settings,
      session: d.session,
    },
    invalid: words.invalid + grammar.invalid + seen.invalid + wordStats.invalid + grammarStats.invalid + invalidBeforeMigration,
    // 今のデータに無い単語・問題も、別の端末のほうがデータが新しい場合に備えて消さずに残す
    unknownWords: [...weakWordKeys].filter(k => !knownWords.has(k)).length,
    unknownGrammar: Object.keys(grammar.data).filter(k => !GRAMMAR_BY_ID.has(Number(k))).length,
  };
}

async function readBackupFile(file) {
  if (file.size === 0) return fail('空のファイルです。');
  if (file.size > BACKUP_MAX_BYTES) return fail('ファイルが大きすぎます（2MB まで）。TOEIC Drill のバックアップファイルか確かめてください。');
  try {
    return parseBackup(await file.text());
  } catch (e) {
    return fail('ファイルを読み込めませんでした。');
  }
}

// ---- 復元と取り消し ----

function writeRaw(rawByKey) {
  Object.entries(rawByKey).forEach(([k, raw]) => {
    if (raw === null) localStorage.removeItem(k);
    else localStorage.setItem(k, raw);
  });
}

// 記録をまとめて書き換える。途中で失敗したら書き換える前に戻し、理由を Error で知らせる。
// saveUndo が true なら、書き換える前の記録を「直前の復元を取り消す」用に残す（残せなければ何も変えずに中止）
function replaceRecords(rawByKey, saveUndo, label) {
  let before;
  let undoBefore; // 前の復元で残した取り消し用の記録。失敗したときはこれも元に戻す
  try {
    before = Object.fromEntries(RECORD_STORAGE_KEYS.map(k => [k, localStorage.getItem(k)]));
    undoBefore = localStorage.getItem(BACKUP_UNDO_KEY);
  } catch (e) {
    throw new Error(`このブラウザでは記録を読み書きできないため、${label}できません。`);
  }
  if (saveUndo) {
    try {
      localStorage.setItem(BACKUP_UNDO_KEY, JSON.stringify({ savedAt: Date.now(), records: before }));
    } catch (e) {
      throw new Error(`空き容量が足りないため、${label}を中止しました。記録は元のままです。`);
    }
  }
  try {
    writeRaw(rawByKey);
  } catch (e) {
    try {
      // 先に取り消し用の記録を外して空きを作ってから、元の記録を書き戻す
      if (saveUndo) localStorage.removeItem(BACKUP_UNDO_KEY);
      writeRaw(before);
      if (saveUndo) writeRaw({ [BACKUP_UNDO_KEY]: undoBefore });
    } catch (e2) {
      throw new Error(`${label}に失敗し、元の記録にも戻せませんでした。書き出しておいたバックアップファイルから、もう一度復元してください。`);
    }
    throw new Error(`保存できなかったため（空き容量不足など）、${label}を中止しました。記録は元のままです。`);
  }
}

// 書き換えた記録を読み込み直して画面に反映し、別のタブにも知らせる
function reloadRecordsFromStorage() {
  state.weakByMode = loadWeakByMode();
  state.grammarWeakData = loadWeakData('toeic_weak_grammar', isGrammarKey);
  state.seenByMode = loadSeenByMode();
  state.wordStats = loadStatsData(WORD_STATS_KEY);
  state.grammarStats = loadStatsData(GRAMMAR_STATS_KEY);
  restoreSettings();
  syncFilterUI();
  setApp(state.app);
  updateWeakBadge();
  updateGrammarWeakBadge();
  try {
    localStorage.setItem(RESTORE_STAMP_KEY, String(Date.now()));
  } catch (e) {
    // 別のタブに知らせられなくても、この画面の復元は終わっている
  }
}

function mergeWeakByMode(cur, inc) {
  const out = {};
  VOCAB_MODES.forEach(m => {
    out[m] = { ...(cur[m] || {}) };
    Object.entries(inc[m] || {}).forEach(([k, entry]) => {
      const c = out[m][k];
      if (!c) {
        out[m][k] = entry;
      } else if (entry.streak > c.streak || (entry.streak === c.streak && entry.due > c.due)) {
        out[m][k] = entry;
      }
    });
  });
  return out;
}

function mergeSeenByMode(cur, inc) {
  const out = {};
  VOCAB_MODES.forEach(m => {
    const curList = cur[m] ? [...cur[m]] : [];
    const incList = inc[m] || [];
    out[m] = [...new Set([...curList, ...incList])];
  });
  return out;
}

function mergeStatsMap(cur, inc) {
  const out = { ...(cur || {}) };
  Object.entries(inc || {}).forEach(([k, st]) => {
    const c = out[k];
    if (!c || st.a > c.a || (st.a === c.a && st.c > c.c)) {
      out[k] = { a: st.a, c: st.c };
    }
  });
  return out;
}

function runRestore() {
  const pending = backupView.pending;
  if (!pending) return;
  const preExport = document.getElementById('backup-pre-export');
  if (preExport && preExport.checked) downloadBackup();

  const isOverwrite = backupView.restoreMode === 'overwrite';
  let targetRecords;

  if (isOverwrite) {
    targetRecords = pending.records;
  } else {
    // 統合モード: 既存の記録とファイルの内容を合わせる
    const curWeakByMode = state.weakByMode;
    const curSeenByMode = seenSnapshot();
    const curWeakGrammar = state.grammarWeakData;
    const curWordStats = state.wordStats;
    const curGrammarStats = state.grammarStats;

    const mergedWeakWords = mergeWeakByMode(curWeakByMode, pending.records.weakWords || {});
    const mergedSeenWords = mergeSeenByMode(curSeenByMode, pending.records.seenWords || {});
    const mergedWeakGrammar = { ...curWeakGrammar };
    Object.entries(pending.records.weakGrammar || {}).forEach(([k, inc]) => {
      const cur = mergedWeakGrammar[k];
      if (!cur || inc.streak > cur.streak || (inc.streak === cur.streak && inc.due > cur.due)) {
        mergedWeakGrammar[k] = inc;
      }
    });
    const mergedWordStats = mergeStatsMap(curWordStats, pending.records.wordStats || {});
    const mergedGrammarStats = mergeStatsMap(curGrammarStats, pending.records.grammarStats || {});

    targetRecords = {
      ...pending.records,
      weakWords: mergedWeakWords,
      weakGrammar: mergedWeakGrammar,
      seenWords: mergedSeenWords,
      wordStats: mergedWordStats,
      grammarStats: mergedGrammarStats,
      settings: pending.records.settings || loadJSON(SETTINGS_KEY, {}),
      session: pending.records.session || loadJSON(SESSION_KEY, {}),
    };
  }

  const rawByKey = {};
  Object.entries(RECORD_KEYS).forEach(([name, key]) => {
    if (targetRecords[name] !== undefined) rawByKey[key] = JSON.stringify(targetRecords[name]);
  });
  try {
    replaceRecords(rawByKey, true, isOverwrite ? '上書き復元' : '統合復元');
  } catch (e) {
    backupView = { step: 'home', error: e.message };
    renderBackupSheet();
    return;
  }
  reloadRecordsFromStorage();
  backupView = { step: 'home', success: isOverwrite ? 'バックアップから上書き復元しました。' : 'バックアップデータを統合して復元しました。' };
  renderBackupSheet();
}

function loadUndo() {
  const undo = loadJSON(BACKUP_UNDO_KEY, {});
  if (!Number.isFinite(undo.savedAt) || !isPlainObject(undo.records)) return null;
  const valid = RECORD_STORAGE_KEYS.every(k => undo.records[k] === null || typeof undo.records[k] === 'string');
  return valid ? undo : null;
}

function runUndo() {
  const undo = loadUndo();
  if (!undo) {
    backupView = { step: 'home', error: '取り消せる復元がありません。' };
    return renderBackupSheet();
  }
  try {
    replaceRecords(Object.fromEntries(RECORD_STORAGE_KEYS.map(k => [k, undo.records[k]])), false, '取り消し');
  } catch (e) {
    backupView = { step: 'home', error: e.message };
    return renderBackupSheet();
  }
  try {
    localStorage.removeItem(BACKUP_UNDO_KEY);
  } catch (e) {
    // 消せなくても、もう一度取り消すと同じ記録に戻るだけ
  }
  reloadRecordsFromStorage();
  backupView = { step: 'home', success: '復元する前の記録に戻しました。' };
  renderBackupSheet();
}

// ---- 画面 ----

// 単語の苦手はモードごとの件数、学習済みはどれかのモードで答えた単語の数
function wordCounts(weakByMode, seenByMode) {
  const list = x => (Array.isArray(x) || x instanceof Set ? [...x] : []);
  return {
    words: Object.fromEntries(VOCAB_MODES.map(m => [m, isPlainObject(weakByMode[m]) ? Object.keys(weakByMode[m]).length : 0])),
    seen: new Set(VOCAB_MODES.flatMap(m => list(seenByMode[m]))).size,
  };
}

function currentCounts() {
  const dueCount = data => Object.values(data).filter(isDue).length;
  return {
    ...wordCounts(state.weakByMode, state.seenByMode),
    wordsDue: Object.fromEntries(VOCAB_MODES.map(m => [m, dueCount(state.weakByMode[m])])),
    grammar: Object.keys(state.grammarWeakData).length,
    grammarDue: dueCount(state.grammarWeakData),
    wordStats: summarizeStats(state.wordStats),
    grammarStats: summarizeStats(state.grammarStats),
  };
}

// 取り消し用に残した記録（保存されている文字列のまま）の件数
function countsFromRaw(records) {
  const parse = raw => {
    try {
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  };
  const words = parse(records[RECORD_KEYS.weakWords]);
  const grammar = parse(records[RECORD_KEYS.weakGrammar]);
  const seen = parse(records[RECORD_KEYS.seenWords]);
  const wordStats = parse(records[RECORD_KEYS.wordStats]);
  const grammarStats = parse(records[RECORD_KEYS.grammarStats]);
  return {
    ...wordCounts(isPlainObject(words) ? words : {}, isPlainObject(seen) ? seen : {}),
    grammar: isPlainObject(grammar) ? Object.keys(grammar).length : 0,
    wordStats: summarizeStats(isPlainObject(wordStats) ? wordStats : {}),
    grammarStats: summarizeStats(isPlainObject(grammarStats) ? grammarStats : {}),
  };
}

function compareTable(leftLabel, rightLabel, left, right, extraRows = '') {
  return `
    <table class="backup-table compare">
      <tr><th></th><th>${leftLabel}</th><th>${rightLabel}</th></tr>
      ${VOCAB_MODES.map(m => `<tr><td>単語の苦手（${MODE_LABELS[m]}）</td><td>${left.words[m]}件</td><td>${right.words[m]}件</td></tr>`).join('')}
      <tr><td>文法の苦手</td><td>${left.grammar}件</td><td>${right.grammar}件</td></tr>
      <tr><td>学習済みの単語</td><td>${left.seen}語</td><td>${right.seen}語</td></tr>
      <tr><td>単語 累計解答数</td><td>${left.wordStats ? `${left.wordStats.totalA}問 (${left.wordStats.rate}%)` : '—'}</td><td>${right.wordStats ? `${right.wordStats.totalA}問 (${right.wordStats.rate}%)` : '—'}</td></tr>
      <tr><td>文法 累計解答数</td><td>${left.grammarStats ? `${left.grammarStats.totalA}問 (${left.grammarStats.rate}%)` : '—'}</td><td>${right.grammarStats ? `${right.grammarStats.totalA}問 (${right.grammarStats.rate}%)` : '—'}</td></tr>
      ${extraRows}
    </table>`;
}

    <div style="background:rgba(255,255,255,0.4);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:12px;line-height:1.6;">
      📘 <strong>単語ドリル通算:</strong> ${c.wordStats.totalA.toLocaleString()}問解答（正答率 ${c.wordStats.rate}%・学習済み ${c.seen}語）<br>
      👑 <strong>文法ドリル通算:</strong> ${c.grammarStats.totalA.toLocaleString()}問解答（正答率 ${c.grammarStats.rate}%・苦手 ${c.grammar}問）
    </div>
    <table class="backup-table">
      ${VOCAB_MODES.map(m => `<tr><td>単語の苦手（${MODE_LABELS[m]}）</td><td>${c.words[m]}件（要復習 ${c.wordsDue[m]}件）</td></tr>`).join('')}
      <tr><td>文法の苦手</td><td>${c.grammar}件（要復習 ${c.grammarDue}件）</td></tr>
      <tr><td>学習済みの単語</td><td>${c.seen}語</td></tr>
    </table>
    <div class="backup-note">最後に書き出した日時: ${Number.isFinite(meta.lastExportAt) ? formatDateTime(meta.lastExportAt) : 'まだ書き出していません'}</div>
    <div class="backup-actions">
      <button class="backup-btn primary" data-backup="export">💾 バックアップを書き出す</button>
      <button class="backup-btn" data-backup="copy">📋 クリップボードにコピー</button>
      ${canShareBackup() ? '<button class="backup-btn" data-backup="share">共有して保存・送る</button>' : ''}
      <button class="backup-btn" data-backup="pick">📂 ファイルから復元…</button>
    </div>
    <!-- accept で絞ると iPhone で .json が選べないことがあるので絞らず、読み込んでから確かめる -->

    <div style="margin-top:14px;border-top:1px dashed rgba(0,0,0,0.15);padding-top:10px;">
      <div class="guide-label">テキストを貼り付けて復元・引き継ぎ</div>
      <textarea id="backup-paste-input" class="backup-paste-area" placeholder="ここにバックアップJSONテキストを貼り付けて復元できます"></textarea>
      <button class="backup-btn small" data-backup="paste-confirm" style="width:100%;text-align:center;">📥 貼り付けたテキストから復元…</button>
    </div>
    ${undo ? `
      <div class="backup-undo" style="margin-top:14px;">
        ${formatDateTime(undo.savedAt)} の復元より前の記録を残しています。
        <button class="backup-btn small" data-backup="undo">直前の復元を取り消す</button>
      </div>` : ''}
    <div class="backup-help" style="margin-top:14px;">
      苦手リスト（復習日を含む。単語はモードごと）・学習済みの単語・通算の正誤カウント・設定・出題の続きを1つのファイルに保存します。
      別の端末やブラウザで復元すると、同じ記録で続けられます（統合と上書きを選べます）。
      記録はこの端末の中にしか無いので、ときどき書き出しておくと安心です。
    </div>`;
}

function backupConfirmHtml(v) {
  const p = v.pending;
  const r = p.records;
  const notes = [];
  if (p.invalid > 0) notes.push(`形の正しくない記録 ${p.invalid}件は読み込みません。`);
  if (p.unknownWords + p.unknownGrammar > 0) {
    notes.push(`今の単語・問題データに無い記録（単語 ${p.unknownWords}件・問題 ${p.unknownGrammar}件）も、消さずに残します。`);
  }
  const fromFile = name => (r[name] === undefined ? 'なし（今のまま）' : 'あり');
  const fileCounts = {
    ...wordCounts(r.weakWords, r.seenWords),
    grammar: Object.keys(r.weakGrammar).length,
    wordStats: summarizeStats(r.wordStats),
    grammarStats: summarizeStats(r.grammarStats),
  };
  const isOverwrite = v.restoreMode === 'overwrite';
  return `
    <div class="guide-label">復元するファイル・テキスト</div>
    <div class="backup-file-name">${escapeHtml(v.fileName)}</div>
    <div class="backup-note">書き出した日時: ${p.exportedAt ? formatDateTime(p.exportedAt) : '不明'}</div>
    ${compareTable('今の記録', 'ファイル・テキスト', currentCounts(), fileCounts,
      `<tr><td>設定</td><td>あり</td><td>${fromFile('settings')}</td></tr>
       <tr><td>出題の続き</td><td>あり</td><td>${fromFile('session')}</td></tr>`)}
    ${notes.length ? `<ul class="backup-notes">${notes.map(n => `<li>${escapeHtml(n)}</li>`).join('')}</ul>` : ''}
    
    <div class="guide-label" style="margin-top:12px;">復元方法</div>
    <div class="filter-row" style="flex-wrap:wrap;margin-bottom:6px;">
      <button class="chip ${!isOverwrite ? 'active' : ''}" data-backup="mode-merge">今の記録に統合（おすすめ）</button>
      <button class="chip ${isOverwrite ? 'active' : ''}" data-backup="mode-overwrite">上書きして置き換え</button>
    </div>
    <div class="backup-note" style="margin-bottom:10px;">
      ${isOverwrite
        ? '⚠️ この端末の記録はバックアップの内容に完全に入れ替わります。'
        : '💡 苦手・学習済み・問題ごとの正誤カウントを両方合わせ、より進んでいる記録を残します。'}
    </div>

    <div class="backup-msg warn">${isOverwrite ? '復元すると、この端末の学習記録はバックアップの内容に置き換わります。' : '復元すると、バックアップのデータが現在の記録に合算・統合されます。'}</div>
    <label class="backup-check"><input type="checkbox" id="backup-pre-export" checked> 復元の前に、今の記録を書き出しておく</label>
    <div class="backup-actions">
      <button class="backup-btn danger" data-backup="restore">${isOverwrite ? '上書き復元する' : '統合して復元する'}</button>
      <button class="backup-btn" data-backup="cancel">やめる</button>
    </div>`;
}

function backupUndoHtml() {
  const undo = loadUndo();
  if (!undo) return backupHomeHtml({ error: '取り消せる復元がありません。' });
  return `
    <div class="guide-label">直前の復元を取り消す</div>
    <div class="backup-note">${formatDateTime(undo.savedAt)} に復元する前の記録に戻します。</div>
    ${compareTable('今の記録', '戻す記録', currentCounts(), countsFromRaw(undo.records))}
    <div class="backup-msg warn">復元したあとに学習した分は、取り消すと消えます。</div>
    <div class="backup-actions">
      <button class="backup-btn danger" data-backup="undo-confirm">取り消す</button>
      <button class="backup-btn" data-backup="cancel">やめる</button>
    </div>`;
}

function renderBackupSheet() {
  const v = backupView;
  let html = '<button class="backup-back" data-backup="back">‹ 苦手リストに戻る</button>';
  if (v.step === 'confirm') html += backupConfirmHtml(v);
  else if (v.step === 'undo') html += backupUndoHtml();
  else html += backupHomeHtml(v);
  document.getElementById('weak-list-content').innerHTML = html;
  const input = document.getElementById('backup-file');
  if (input) input.onchange = onBackupFileChosen;
}

// ファイル選択や共有のあと、バックアップの画面がまだ開いていれば描き直す
function refreshBackupSheet() {
  if (isSheetOpen() && activeSheetRender === renderBackupSheet) renderBackupSheet();
}

async function onBackupFileChosen(e) {
  const input = e.target;
  const file = input.files && input.files[0];
  input.value = ''; // 同じファイルを選び直しても反応するように
  if (!file) return;
  const result = await readBackupFile(file);
  backupView = result.ok
    ? { step: 'confirm', pending: result, fileName: file.name, restoreMode: 'merge' }
    : { step: 'home', error: result.error };
  refreshBackupSheet();
}

function backupEntryHtml() {
  return '<button class="backup-open-btn" data-backup="open">💾 学習記録のバックアップ・復元</button>';
}

async function copyBackup() {
  const json = JSON.stringify(buildBackup(), null, 2);
  try {
    await navigator.clipboard.writeText(json);
    markExported();
    backupView = { ...backupView, success: 'バックアップのJSONテキストをクリップボードにコピーしました。' };
  } catch (e) {
    const area = document.getElementById('backup-paste-input');
    if (area) {
      area.value = json;
      area.focus();
      area.select();
      markExported();
      backupView = { ...backupView, success: '下のテキスト欄にバックアップ内容を出力しました。コピーしてご利用ください。' };
    } else {
      backupView = { ...backupView, error: 'クリップボードにコピーできませんでした。' };
    }
  }
  refreshBackupSheet();
}

function onBackupPasteConfirm() {
  const area = document.getElementById('backup-paste-input');
  const text = area ? area.value.trim() : '';
  if (!text) {
    backupView = { ...backupView, error: 'テキスト欄にバックアップJSONを貼り付けてください。' };
    return refreshBackupSheet();
  }
  const result = parseBackup(text);
  backupView = result.ok
    ? { step: 'confirm', pending: result, fileName: '貼り付けたテキスト', restoreMode: 'merge' }
    : { step: 'home', error: result.error };
  refreshBackupSheet();
}

function handleBackupAction(action) {
  switch (action) {
    case 'open':
      backupView = { step: 'home', restoreMode: 'merge' };
      return openSheet('学習記録のバックアップ', renderBackupSheet);
    case 'back':
      return openSheet('苦手リスト', renderWeakList);
    case 'export':
      downloadBackup();
      backupView = { step: 'home', success: '書き出しました。ダウンロードしたファイル（iPhone は「ファイル」アプリ）を保管してください。' };
      return renderBackupSheet();
    case 'copy':
      return copyBackup();
    case 'share':
      return shareBackup();
    case 'pick':
      return document.getElementById('backup-file').click();
    case 'paste-confirm':
      return onBackupPasteConfirm();
    case 'mode-merge':
      backupView.restoreMode = 'merge';
      return refreshBackupSheet();
    case 'mode-overwrite':
      backupView.restoreMode = 'overwrite';
      return refreshBackupSheet();
    case 'restore':
      return runRestore();
    case 'undo':
      backupView = { step: 'undo' };
      return renderBackupSheet();
    case 'undo-confirm':
      return runUndo();
    case 'cancel':
      backupView = { step: 'home', restoreMode: 'merge' };
      return renderBackupSheet();
  }
}

function showToast(message) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  el.textContent = message;
  document.getElementById('app').appendChild(el);
  setTimeout(() => el.classList.add('hide'), 3500);
  setTimeout(() => el.remove(), 4000);
}

// ==================== キーボード操作（PC 向け） ====================
// 1〜4 (テンキー・全角・A〜D): 選択肢 / 0: わからない / Enter・スペース: 次へ
// カードモード: スペース: めくる / Enter: めくる・覚えた / 1・←: まだ / 2・→: 覚えた
// Esc: 下から出るシートを閉じる

function isShown(el) {
  return el && el.style.display !== 'none' && el.offsetParent !== null;
}

document.addEventListener('keydown', e => {
  // 修飾キー（Command, Ctrl, Alt）が押されている時はブラウザ操作を優先
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  if (document.getElementById('bottom-sheet').classList.contains('open')) {
    if (e.key === 'Escape') closeSheet();
    return;
  }
  const t = e.target;
  // テキスト入力中はキーボードショートカットを発火させない
  if ((t.tagName === 'INPUT' && !t.disabled) || t.tagName === 'TEXTAREA' || t.isContentEditable) return;

  const dk = document.getElementById('dont-know-btn');
  const nextBtn = document.getElementById('next-btn');
  const press = btn => {
    e.preventDefault();
    btn.click();
  };

  // 全角数字やテンキー対応のための正規化
  const fullToHalf = { '１': '1', '２': '2', '３': '3', '４': '4', '０': '0' };
  const rawKey = fullToHalf[e.key] || e.key;

  // 単語カードモード
  if (state.app === 'vocab' && state.mode === 'flash' && document.getElementById('flash-card')) {
    if (rawKey === ' ' || e.code === 'Space') return press(document.getElementById('flash-card'));
    if ((rawKey === '1' || e.code === 'Digit1' || e.code === 'Numpad1' || e.key === 'ArrowLeft') && isShown(dk)) return press(dk);
    if ((rawKey === '2' || e.code === 'Digit2' || e.code === 'Numpad2' || e.key === 'ArrowRight' || e.key === 'Enter') && isShown(nextBtn)) return press(nextBtn);
    return;
  }

  // 選択肢インデックス判定（1〜4, テンキー1〜4, A〜Dキー）
  let choiceIdx = -1;
  if (/^[1-4]$/.test(rawKey)) {
    choiceIdx = Number(rawKey) - 1;
  } else if (/^Digit[1-4]$/.test(e.code)) {
    choiceIdx = Number(e.code.replace('Digit', '')) - 1;
  } else if (/^Numpad[1-4]$/.test(e.code)) {
    choiceIdx = Number(e.code.replace('Numpad', '')) - 1;
  } else if (/^[a-dA-D]$/.test(rawKey)) {
    const map = { a: 0, b: 1, c: 2, d: 3, A: 0, B: 1, C: 2, D: 3 };
    choiceIdx = map[rawKey];
  }

  // 回答前かどうか判定（内部フラグまたは「わからない」ボタンの表示）
  const isAnswering = state.app === 'grammar'
    ? !state.grammarAnswered
    : (!state.answered && (state.mode === 'e2j' || state.mode === 'j2e'));

  if (choiceIdx >= 0) {
    const buttons = document.querySelectorAll('#choices-container .choice-btn');
    const btn = buttons[choiceIdx];
    if (btn && (isAnswering || isShown(dk))) {
      press(btn);
    }
  } else if ((rawKey === '0' || e.code === 'Digit0' || e.code === 'Numpad0') && (isAnswering || isShown(dk))) {
    if (isShown(dk)) press(dk);
  } else if ((e.key === 'Enter' || rawKey === ' ' || e.code === 'Space') && isShown(nextBtn)) {
    press(nextBtn);
  }
});

// ==================== 起動 ====================

restoreSettings();
initFilters();
syncFilterUI();
setApp(state.app);

// 別のタブで復元・取り消しをしたら、古い記録で上書きしないよう読み込み直す
window.addEventListener('storage', e => {
  if (e.key !== RESTORE_STAMP_KEY) return;
  try {
    sessionStorage.setItem(NOTICE_KEY, '別のタブで学習記録が復元されたため、読み込み直しました。');
  } catch (err) {
    // お知らせを出せなくても読み込み直しは行う
  }
  location.reload();
});

try {
  const notice = sessionStorage.getItem(NOTICE_KEY);
  if (notice) {
    sessionStorage.removeItem(NOTICE_KEY);
    showToast(notice);
  }
} catch (e) {
  // sessionStorage が使えなければお知らせを出さないだけ
}

// オフラインでも開けるようにする（ファイルを直接開いたときは使えないので登録しない）
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
