function updateFilterSummary() {
  let n = 0;
  if (state.app === 'grammar') {
    if (state.grammarChapter !== 'all') n++;
    if (state.grammarWeakFilter !== 'all') n++;
  } else {
    if (state.sourceFilter !== 'all') n++;
    if (state.sourceFilter === 'teppan') {
      if (state.rangeFilter) n++;
    } else {
      n += state.dateFilter.length;
      if (state.posFilter !== 'all') n++;
    }
    if (state.weakFilter !== 'all') n++;
  }
  const el = document.getElementById('filter-count');
  if (!el) return;
  el.style.display = n > 0 ? 'inline-block' : 'none';
  el.innerText = n;
}

function shuffle(array) {
  let currentIndex = array.length, randomIndex;
  while (currentIndex !== 0) {
    randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
  }
  return array;
}

function applyFilters() {
  let filtered = RAW_WORDS.filter(w => {
    // source
    if (state.sourceFilter !== 'all' && w.s !== state.sourceFilter) return false;
    
    // range filter (for TEPPAN)
    if (state.sourceFilter === 'teppan' && state.rangeFilter) {
      if (!w.no || w.no < state.rangeFilter.start || w.no > state.rangeFilter.end) return false;
    }
    
    // date (for daily words or all)
    if (state.sourceFilter !== 'teppan' && state.dateFilter.length > 0) {
      if (!w.d || !state.dateFilter.includes(getWeekLabel(w.d))) return false;
    }
    
    // pos (for daily words or all)
    if (state.sourceFilter !== 'teppan' && state.posFilter !== 'all') {
      if (state.posFilter === '句・表現') {
        if (!['名詞句','動詞句','形容詞句','表現','副詞句'].includes(w.p)) return false;
      } else {
        if (w.p !== state.posFilter) return false;
      }
    }
    
    // weak
    const isWeak = state.weakData[w.w] !== undefined;
    const isLearned = state.weakData[w.w]?.learned;
    if (state.weakFilter === 'weak_only' && !isWeak) return false;
    if (state.weakFilter === 'weak_unlearned' && isLearned) return false;
    
    return true;
  });
  
  state.pool = shuffle(filtered);
  state.currentIndex = 0;
  state.score = 0;
  updateFilterSummary();
  renderCurrent();
}

function renderCurrent() {
  const container = document.getElementById('quiz-container');
  const choicesDiv = document.getElementById('choices-container');
  const nextBtn = document.getElementById('next-btn');
  
  if (state.pool.length === 0) {
    container.innerHTML = `<div class="card"><div class="meaning-display">条件に合う単語がありません</div></div>`;
    choicesDiv.innerHTML = '';
    nextBtn.style.display = 'none';
    updateFooter();
    return;
  }
  
  if (state.currentIndex >= state.pool.length) {
    container.innerHTML = `<div class="card"><div class="meaning-display">完了！</div></div>`;
    choicesDiv.innerHTML = '';
    nextBtn.style.display = 'none';
    updateFooter();
    return;
  }

  const word = state.pool[state.currentIndex];
  state.answered = false;
  choicesDiv.innerHTML = '';
  nextBtn.style.display = 'none';
  
  if (state.mode === 'e2j' || state.mode === 'j2e') {
    container.innerHTML = `
      <div class="card" id="main-card">
        <div class="pos-tag">${word.no ? `<span style="font-weight:700;margin-right:6px;color:var(--gold);">No.${word.no}</span>` : ''}${word.p}</div>
        <div class="${state.mode === 'e2j' ? 'word-display' : 'meaning-display'}">${state.mode === 'e2j' ? word.w : word.m}</div>
        <div class="example-display" id="example-box">${word.e ? word.e : '<span style="opacity:0.45; font-style:italic;">（例文なし）</span>'}<br><br>${state.mode === 'e2j' ? word.m : word.w}</div>
      </div>
    `;
    
    let options = [word];
    let poolCopy = shuffle(state.pool.length >= 4 ? [...state.pool] : [...RAW_WORDS]);
    for (let w of poolCopy) {
      if (options.length >= 4) break;
      if (w.w !== word.w && !options.find(x => x.w === w.w)) {
        options.push(w);
      }
    }
    options = shuffle(options);
    state.currentOptions = options;
    
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerText = state.mode === 'e2j' ? opt.m : opt.w;
      btn.onclick = () => handleAnswer(opt, btn);
      choicesDiv.appendChild(btn);
    });
  } else if (state.mode === 'flash') {
    container.innerHTML = `
      <div class="card flash-mode" onclick="this.classList.toggle('flipped')">
        <div class="flip-card-inner">
          <div class="card-face">
            <div class="pos-tag">${word.no ? `<span style="font-weight:700;margin-right:6px;color:var(--gold);">No.${word.no}</span>` : ''}${word.p}</div>
            <div class="word-display">${word.w}</div>
          </div>
          <div class="card-face card-back">
            <div class="meaning-display">${word.m}</div>
            <div style="font-size: 14px; line-height: 1.5; color: ${word.e ? '#555' : 'var(--muted)'}; font-style: ${word.e ? 'normal' : 'italic'};">${word.e || '（例文なし）'}</div>
          </div>
        </div>
      </div>
    `;
    nextBtn.style.display = 'block';
    nextBtn.onclick = () => { state.currentIndex++; renderCurrent(); };
  } else if (state.mode === 'type') {
    container.innerHTML = `
      <div class="card" id="main-card">
        <div class="pos-tag">${word.no ? `<span style="font-weight:700;margin-right:6px;color:var(--gold);">No.${word.no}</span>` : ''}${word.p}</div>
        <div class="meaning-display">${word.m}</div>
        <div class="type-input-container">
          <input type="text" id="type-input" class="type-input" placeholder="Type English here..." autocomplete="off">
        </div>
        <div class="example-display" id="example-box">${word.e ? word.e : '<span style="opacity:0.45; font-style:italic;">（例文なし）</span>'}<br><br>${word.w}</div>
      </div>
    `;
    const input = document.getElementById('type-input');
    input.focus();
    input.onkeypress = (e) => {
      if (e.key === 'Enter') handleTypeAnswer(input.value);
    };
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerText = 'Check';
    btn.style.textAlign = 'center';
    btn.onclick = () => handleTypeAnswer(input.value);
    choicesDiv.appendChild(btn);
  }
  
  updateFooter();
}

function handleAnswer(selectedOpt, btn) {
  if (state.answered) return;
  state.answered = true;
  
  const word = state.pool[state.currentIndex];
  const isCorrect = selectedOpt.w === word.w;
  
  document.querySelectorAll('.choice-btn').forEach((b, i) => {
    if (state.currentOptions[i].w === word.w) {
      b.classList.add('correct');
    }
  });
  
  if (!isCorrect) {
    btn.classList.add('wrong');
    document.getElementById('main-card').classList.add('shake');
    setTimeout(() => document.getElementById('main-card').classList.remove('shake'), 400);
    recordWeak(word, false);
  } else {
    state.score++;
    recordWeak(word, true);
  }
  
  document.getElementById('example-box').style.display = 'block';
  const nextBtn = document.getElementById('next-btn');
  nextBtn.style.display = 'block';
  nextBtn.onclick = () => { state.currentIndex++; renderCurrent(); };
  updateFooter();
}

function handleTypeAnswer(val) {
  if (state.answered) return;
  state.answered = true;
  
  const word = state.pool[state.currentIndex];
  const isCorrect = val.trim().toLowerCase() === word.w.toLowerCase();
  
  const choicesDiv = document.getElementById('choices-container');
  choicesDiv.innerHTML = `<div class="choice-btn ${isCorrect ? 'correct' : 'wrong'}" style="text-align:center;">${isCorrect ? 'Correct!' : 'Wrong!'}</div>`;
  
  if (!isCorrect) {
    document.getElementById('main-card').classList.add('shake');
    setTimeout(() => document.getElementById('main-card').classList.remove('shake'), 400);
    recordWeak(word, false);
  } else {
    state.score++;
    recordWeak(word, true);
  }
  
  document.getElementById('example-box').style.display = 'block';
  const nextBtn = document.getElementById('next-btn');
  nextBtn.style.display = 'block';
  nextBtn.onclick = () => { state.currentIndex++; renderCurrent(); };
  updateFooter();
}

function recordWeak(word, isCorrect) {
  if (isCorrect) {
    if (state.weakData[word.w]) {
      state.weakData[word.w].streak = (state.weakData[word.w].streak || 0) + 1;
      if (state.weakData[word.w].streak >= 2) {
        delete state.weakData[word.w];
      }
    }
  } else {
    if (!state.weakData[word.w]) {
      state.weakData[word.w] = { streak: 0, added: Date.now() };
    } else {
      state.weakData[word.w].streak = 0;
    }
  }
  saveWeakData();
}

function updateFooter() {
  document.getElementById('progress-text').innerText = state.pool.length > 0 ? `${Math.min(state.currentIndex + 1, state.pool.length)} / ${state.pool.length}` : '0 / 0';
  document.getElementById('score-text').innerText = `👍 ${state.score}`;
  
  const stampsContainer = document.getElementById('stamps');
  stampsContainer.innerHTML = '';
  const totalStamps = 12;
  const filled = state.score % totalStamps;
  for (let i = 0; i < totalStamps; i++) {
    stampsContainer.innerHTML += `<div class="stamp ${i < filled ? 'filled' : ''}"></div>`;
  }
}

function toggleWeakList() {
  const sheet = document.getElementById('bottom-sheet');
  const overlay = document.getElementById('sheet-overlay');
  if (sheet.classList.contains('open')) {
    sheet.classList.remove('open');
    overlay.classList.remove('open');
  } else {
    renderWeakList();
    sheet.classList.add('open');
    overlay.classList.add('open');
  }
}

function renderWeakList() {
  const container = document.getElementById('weak-list-content');
  const keys = Object.keys(state.weakData);
  if (keys.length === 0) {
    container.innerHTML = '<p>苦手な単語はありません。</p>';
    return;
  }
  
  let html = '';
  keys.forEach(k => {
    const w = RAW_WORDS.find(x => x.w === k);
    if (!w) return;
    html += `
      <div class="weak-item">
        <div>
          <div class="weak-word">${w.w}</div>
          <div class="weak-meaning">${w.m}</div>
        </div>
        <button class="del-btn" onclick="removeWeak('${w.w}')">削除</button>
      </div>
    `;
  });
  container.innerHTML = html;
}

window.removeWeak = function(w) {
  delete state.weakData[w];
  saveWeakData();
  renderWeakList();
}

initFilters();
updateWeakBadge();
applyFilters();
</script>
</body>
</html>
