<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEIC Drill</title>
<meta name="theme-color" content="#1b1712">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TOEIC Drill">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root {
  --ink: #1b1712;
  --paper: #f2e6c9;
  --seal: #b3382a;
  --gold: #c9a05c;
  --jade: #4f7a68;
  --ivory: #f0e6d2;
  --muted: #8a7f6e;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
body {
  margin: 0; padding: 0;
  background-color: var(--ink);
  background-image: radial-gradient(circle at 50% 0%, #2a241d, var(--ink));
  color: var(--paper);
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
#app {
  max-width: 540px;
  margin: 0 auto;
  width: 100%;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  position: relative;
  overflow: hidden;
}
.header {
  padding: 10px 20px 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
}
.title-wrap { text-align: left; line-height: 1.15; }
.eyebrow {
  color: var(--gold);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin: 0;
}
.title {
  font-size: 17px;
  font-weight: bold;
  margin: 0;
}
.subtitle { display: none; }
.filter-toggle {
  flex-shrink: 0;
  background: rgba(242, 230, 201, 0.08);
  border: 1px solid rgba(242, 230, 201, 0.25);
  color: var(--paper);
  font-size: 12px;
  font-family: inherit;
  padding: 6px 12px;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.filter-toggle.active {
  background: var(--paper);
  color: var(--ink);
  border-color: var(--paper);
  font-weight: 600;
}
.filter-toggle .caret { font-size: 9px; transition: transform 0.25s; }
.filter-toggle.active .caret { transform: rotate(180deg); }
.filter-count {
  background: var(--seal);
  color: #fff;
  border-radius: 10px;
  min-width: 16px;
  padding: 1px 5px;
  font-size: 10px;
  font-weight: 700;
  display: none;
}
.filters {
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex-shrink: 0;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height 0.25s ease, opacity 0.2s ease, padding 0.25s ease;
}
.filters.open {
  max-height: 290px;
  opacity: 1;
  padding: 2px 20px 8px;
}
.filter-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.filter-row::-webkit-scrollbar { display: none; }
.chip {
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--muted);
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
  background: transparent;
  cursor: pointer;
  transition: all 0.2s;
}
.chip.active {
  background: var(--paper);
  color: var(--ink);
  border-color: var(--paper);
  font-weight: 600;
}
.segments {
  display: flex;
  background: rgba(242, 230, 201, 0.1);
  border-radius: 10px;
  padding: 3px;
  margin: 0 20px 6px;
  flex-shrink: 0;
}
.filters .segments { margin: 0; }
#mode-segments { margin: 2px 20px 8px; }
.segment {
  flex: 1;
  text-align: center;
  padding: 6px 4px;
  font-size: 12px;
  border-radius: 7px;
  color: var(--muted);
  cursor: pointer;
  transition: 0.3s;
}
.segment.active {
  background: var(--paper);
  color: var(--ink);
  font-weight: bold;
}
.main-area {
  flex: 1;
  min-height: 0;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#quiz-container {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.card {
  background: var(--paper);
  color: var(--ink);
  border-radius: 16px;
  padding: 14px 18px;
  text-align: center;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  margin-bottom: 10px;
  position: relative;
  transition: transform 0.3s, opacity 0.3s;
  flex: 0 1 auto;
  min-height: clamp(120px, 26vh, 240px);
  max-height: 100%;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform-style: preserve-3d;
}
.card > * { flex-shrink: 0; }
.card::before, .card::after { content: ''; flex: 1 0 0; }
.card.flash-mode::before, .card.flash-mode::after { content: none; }
.card.shake {
  animation: shake 0.4s;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
.word-display {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: clamp(22px, 7vw, 32px);
  font-weight: bold;
  margin-bottom: 8px;
  line-height: 1.2;
  word-break: break-word;
}
.pos-tag {
  background: rgba(0,0,0,0.06);
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  color: var(--ink);
  margin-bottom: 8px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.pos-tag[hidden] { display: none !important; }
.item-stat-inline {
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 600;
}
.item-stat-badge {
  background: rgba(0,0,0,0.06);
  color: var(--muted);
  padding: 2px 7px;
  border-radius: 8px;
  font-size: 10.5px;
  font-weight: 600;
  margin-left: auto;
}
.backup-paste-area {
  width: 100%;
  min-height: 72px;
  margin: 8px 0;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid rgba(0,0,0,0.2);
  background: rgba(255,255,255,0.7);
  color: var(--ink);
  font-family: ui-monospace, SFMono-Regular, monospace;
  font-size: 11px;
  box-sizing: border-box;
}
.meaning-display {
  font-size: clamp(16px, 5vw, 20px);
  font-weight: 600;
  margin-bottom: 8px;
  line-height: 1.35;
}
.example-display {
  font-size: 13px;
  color: #555;
  line-height: 1.45;
  margin-top: 10px;
  border-top: 1px dashed rgba(0,0,0,0.1);
  padding-top: 10px;
  display: none;
}
.choices {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 10px;
  flex-shrink: 0;
}
.choice-btn {
  background: rgba(242, 230, 201, 0.05);
  border: 1px solid rgba(242, 230, 201, 0.2);
  color: var(--paper);
  font-family: inherit;
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.35;
  text-align: left;
  cursor: pointer;
  transition: 0.2s;
}
.choice-btn:active { background: rgba(242, 230, 201, 0.1); }
.choice-btn.correct {
  background: var(--jade);
  border-color: var(--jade);
  color: white;
}
.choice-btn.wrong {
  background: var(--seal);
  border-color: var(--seal);
  color: white;
}
.action-bar {
  flex-shrink: 0;
  height: 54px;
  padding: 0 20px 8px;
  display: flex;
  gap: 8px;
}
.next-btn {
  background: var(--gold);
  color: var(--ink);
  border: none;
  font-family: inherit;
  padding: 13px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  flex: 1;
  display: none;
}
.dont-know-btn {
  background: transparent;
  color: var(--muted);
  border: 1px dashed rgba(242, 230, 201, 0.35);
  font-family: inherit;
  padding: 13px;
  border-radius: 12px;
  font-size: 14px;
  cursor: pointer;
  flex: 1;
  display: none;
  transition: 0.2s;
}
.dont-know-btn:active { background: rgba(242, 230, 201, 0.08); color: var(--paper); }
.type-input-container {
  width: 100%;
  margin-top: 12px;
}
.type-input {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 2px solid var(--ink);
  font-family: ui-monospace, SFMono-Regular, monospace;
  font-size: 24px;
  text-align: center;
  padding: 8px;
  color: var(--ink);
  outline: none;
}
.type-input::placeholder { color: rgba(0,0,0,0.2); }
.footer {
  padding: 8px 20px 12px;
  border-top: 1px solid rgba(242, 230, 201, 0.1);
  flex-shrink: 0;
}
.stats {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
}
.progress-track {
  height: 4px;
  border-radius: 2px;
  background: rgba(242, 230, 201, 0.15);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0;
  background: var(--gold);
  transition: width 0.3s;
}
.sheet-close {
  position: sticky;
  top: 0;
  float: right;
  margin: -8px -8px 0 0;
  z-index: 1;
  width: 32px; height: 32px;
  border-radius: 50%;
  border: none;
  background: rgba(0,0,0,0.08);
  color: var(--ink);
  font-size: 16px;
  cursor: pointer;
}
/* 文法: 回答後は選択肢を1行に縮めて解説に縦を譲る */
.choices.compact { flex-direction: row; }
.choices.compact .choice-btn {
  flex: 1;
  padding: 8px 4px;
  text-align: center;
  font-size: 13px;
}
.choices.compact .choice-text { display: none; }
.choice-mark { margin-left: 6px; font-weight: 700; }
.choices.compact .choice-btn.correct .choice-label,
.choices.compact .choice-btn.wrong .choice-label { color: #fff; }
.grammar-your-ans {
  font-size: 13px;
  color: var(--seal);
  font-weight: 600;
  margin: -4px 0 8px;
}
/* タイプモード */
.type-check-btn {
  width: 100%;
  margin-top: 10px;
  background: var(--ink);
  color: var(--paper);
  border: none;
  border-radius: 10px;
  padding: 10px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.type-input:disabled { opacity: 1; -webkit-text-fill-color: var(--ink); }
.type-result {
  width: 100%;
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  text-align: left;
  font-size: 14px;
  line-height: 1.6;
}
.type-result.ok { background: rgba(79, 122, 104, 0.15); }
.type-result.ng { background: rgba(179, 56, 42, 0.1); }
.type-result-label { font-size: 11px; color: var(--muted); margin-right: 6px; }
.type-result-yours { text-decoration: line-through; color: var(--seal); font-family: ui-monospace, SFMono-Regular, monospace; }
.type-result-answer { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 20px; font-weight: bold; color: var(--jade); }
.bottom-sheet {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: var(--paper);
  color: var(--ink);
  border-radius: 24px 24px 0 0;
  padding: 24px;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  max-height: 80vh;
  overflow-y: auto;
  z-index: 100;
}
.bottom-sheet.open { transform: translateY(0); }
.bottom-sheet .chip { border-color: rgba(0,0,0,0.25); color: var(--muted); }
.bottom-sheet .chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.guide-chapter { margin-top: 20px; }
.guide-chapter h3 { font-size: 15px; margin: 0 0 8px; padding-bottom: 6px; border-bottom: 2px solid var(--gold); }
.guide-notes { font-size: 13px; line-height: 1.7; white-space: pre-wrap; background: rgba(255,255,255,0.45); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
.guide-notes.empty { color: var(--muted); font-style: italic; }
.guide-label { font-size: 11px; font-weight: bold; color: var(--muted); margin: 10px 0 4px; }
.guide-themes { display: flex; flex-wrap: wrap; gap: 4px; }
.guide-theme { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: rgba(0,0,0,0.06); }
.guide-rule { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.08); }
.guide-rule-no { flex-shrink: 0; min-width: 34px; font-size: 12px; font-weight: bold; color: #b45309; }
.guide-rule-title { flex: 1; font-size: 13px; line-height: 1.5; }
.guide-rule-meta { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.guide-rule-weak { color: var(--seal); font-weight: bold; }
.guide-solve-btn { flex-shrink: 0; background: transparent; border: 1px solid var(--jade); color: var(--jade); border-radius: 12px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
.phase-overview { font-size: 13px; line-height: 1.7; margin-bottom: 10px; }
.phase-cards { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
.phase-card { background: rgba(255,255,255,0.5); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.6; }
.phase-card strong { display: block; color: #b45309; font-size: 13px; }
.phase-list { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.7; }
.phase-steps { display: flex; flex-direction: column; gap: 8px; }
.phase-step { display: flex; gap: 10px; background: rgba(234,179,8,0.08); border-left: 3px solid #eab308; border-radius: 6px; padding: 8px 10px; }
.phase-step-no { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: #b45309; color: #fff; font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
.phase-step-title { font-size: 13px; font-weight: bold; color: #b45309; }
.phase-step-action { font-size: 12.5px; font-weight: 600; margin-top: 2px; line-height: 1.6; }
.phase-step-detail { font-size: 12px; color: #555; margin-top: 4px; line-height: 1.65; white-space: pre-line; }
.phase-tips { margin-top: 10px; background: rgba(234,179,8,0.12); border-radius: 8px; padding: 8px 10px; }
.phase-tips-title { font-size: 12px; font-weight: bold; color: #b45309; margin-bottom: 2px; }
.grammar-phase-details { margin: 10px 0; padding: 10px 12px; background: rgba(234,179,8,0.08); border: 1px solid rgba(234,179,8,0.25); border-radius: 8px; }
.grammar-phase-details summary { cursor: pointer; font-weight: 600; color: #b45309; font-size: 13px; }
.grammar-phase-details .phase-steps { margin-top: 10px; }
.chip.rule-filter-chip { border-color: #b45309; color: #b45309; }
.sheet-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
  z-index: 99;
}
.sheet-overlay.open { opacity: 1; pointer-events: auto; }
.weak-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid rgba(0,0,0,0.1);
}
.weak-word {
  font-family: monospace;
  font-size: 16px;
  font-weight: bold;
}
.weak-meaning {
  font-size: 13px;
  color: #555;
  margin-top: 4px;
}
.del-btn {
  background: transparent;
  border: 1px solid var(--seal);
  color: var(--seal);
  border-radius: 12px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
}
.weak-list-summary { font-size: 12px; color: var(--muted); margin: -4px 0 8px; }
.weak-mode-row { flex-wrap: wrap; margin-bottom: 10px; }
.weak-list-summary strong { color: var(--seal); }
.weak-due { font-size: 11px; color: var(--muted); margin-top: 4px; }
.weak-due.now { color: var(--seal); font-weight: bold; }
/* 学習記録のバックアップ */
.backup-open-btn { width: 100%; margin: 0 0 12px; padding: 9px 12px; border-radius: 10px; border: 1px dashed rgba(0,0,0,0.3); background: rgba(255,255,255,0.4); color: var(--ink); font-family: inherit; font-size: 13px; text-align: left; cursor: pointer; }
.backup-back { background: none; border: none; padding: 0; margin: 0 0 8px; color: var(--muted); font-family: inherit; font-size: 13px; cursor: pointer; }
.backup-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.backup-table td, .backup-table th { padding: 6px 4px; border-bottom: 1px solid rgba(0,0,0,0.08); text-align: left; }
.backup-table th { font-size: 11px; color: var(--muted); }
.backup-table.compare td + td, .backup-table.compare th + th { text-align: right; }
.backup-note { font-size: 12px; color: var(--muted); margin: 6px 0 10px; }
.backup-file-name { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; word-break: break-all; }
.backup-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.backup-btn { flex: 1 1 auto; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--ink); background: transparent; color: var(--ink); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.backup-btn.primary { background: var(--ink); color: var(--paper); }
.backup-btn.danger { background: var(--seal); border-color: var(--seal); color: #fff; }
.backup-btn.small { display: block; margin-top: 6px; padding: 6px 10px; font-size: 12px; }
.backup-msg { font-size: 13px; line-height: 1.6; border-radius: 8px; padding: 8px 10px; margin: 0 0 10px; }
.backup-msg.ok { background: rgba(79,122,104,0.15); color: var(--jade); }
.backup-msg.ng { background: rgba(179,56,42,0.1); color: var(--seal); }
.backup-msg.warn { background: rgba(234,179,8,0.15); color: #92400e; margin-top: 10px; }
.backup-notes { margin: 8px 0 0; padding-left: 18px; font-size: 12.5px; line-height: 1.6; }
.backup-check { display: flex; gap: 8px; align-items: center; font-size: 13px; margin: 6px 0; cursor: pointer; }
.backup-undo { font-size: 12.5px; line-height: 1.6; background: rgba(0,0,0,0.04); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
.backup-help { font-size: 12px; color: var(--muted); line-height: 1.7; }
.toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 200; max-width: calc(100% - 32px); background: var(--paper); color: var(--ink); padding: 8px 14px; border-radius: 20px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); transition: opacity 0.4s; }
.toast.hide { opacity: 0; }
.weak-badge {
  background: var(--seal);
  color: white;
  border-radius: 10px;
  padding: 2px 6px;
  font-size: 10px;
  vertical-align: middle;
  margin-left: 4px;
}
.card.flash-mode {
  flex: 1;
  cursor: pointer;
  perspective: 1000px;
  padding: 0;
  background: transparent;
  box-shadow: none;
  border: none;
  min-height: 200px;
  overflow: visible;
}
.card.flash-mode > * { margin: 0; }
.flip-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 200px;
  text-align: center;
  transition: transform 0.6s;
  transform-style: preserve-3d;
}
.card.flash-mode.flipped .flip-card-inner {
  transform: rotateY(180deg);
}
.card-face {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  min-height: 200px;
  overflow-y: auto;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  background: var(--paper);
  color: var(--ink);
  border-radius: 16px;
  padding: 20px 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.card-back {
  transform: rotateY(180deg);
}

/* Grammar Part 5 styles */
.grammar-card {
  text-align: left !important;
  align-items: flex-start !important;
  padding: 16px 18px !important;
  min-height: 180px;
  max-height: 100%;
  overflow-y: auto;
}
.grammar-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-bottom: 10px;
  font-size: 11px;
}
/* Book and Rule Badges */
.grammar-book-badge {
  padding: 2px 7px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 10px;
  display: inline-flex;
  align-items: center;
}
.badge-kin {
  background: rgba(234, 179, 8, 0.2);
  color: #b45309;
  border: 1px solid rgba(234, 179, 8, 0.4);
}
.badge-sekai {
  background: rgba(59, 130, 246, 0.15);

<script>
// localStorage が壊れていたり使えなかったり（プライベートモードなど）しても起動できるようにする
function loadJSON(key, fallback) {
  try {
    const v = JSON.parse(localStorage.getItem(key));
    if (v === null || typeof v !== typeof fallback || Array.isArray(v) !== Array.isArray(fallback)) return fallback;
    return v;
  } catch (e) {
    return fallback;
  }
}

function saveJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    // 保存できなくても学習は続けられるので無視する
  }
}

// ==================== 苦手の間隔復習 ====================

const DAY_MS = 24 * 60 * 60 * 1000;
// 復習の間隔（日）。復習日以降に正解するたびに次の間隔へ進み、最後の間隔のあとも正解したら苦手から外れる
const REVIEW_INTERVALS = [1, 3, 7];

// 苦手1件の形を確かめる。前のバージョンの記録（復習日なし）は「今すぐ復習」からやり直し、直せないものは null
function normalizeWeakEntry(e) {
  if (!e || typeof e !== 'object' || Array.isArray(e)) return null;
  const added = Number.isFinite(e.added) && e.added > 0 ? e.added : Date.now();
  if (e.due === undefined) return { streak: 0, added, due: 0 };
  if (typeof e.due !== 'number' || !Number.isFinite(e.due) || e.due < 0) return null;
  if (!Number.isInteger(e.streak) || e.streak < 0 || e.streak > REVIEW_INTERVALS.length) return null;
  return { streak: e.streak, added, due: e.due };
}

// 苦手データのキー: 単語は綴り、文法は問題番号
function isWordKey(k) {
  return k !== '' && k.length <= 200 && k !== '__proto__';
}

function isGrammarKey(k) {
  return /^[1-9]\d{0,8}$/.test(k);
}

// 苦手データ全体を確かめ、形の正しくない件は除いて数を返す（起動時の読み込みとバックアップの復元で共通）
function sanitizeWeakData(raw, isValidKey) {
  const data = {};
  let invalid = 0;
  Object.keys(raw).forEach(k => {
    const entry = isValidKey(k) ? normalizeWeakEntry(raw[k]) : null;
    if (entry) data[k] = entry;
    else invalid++;
  });
  return { data, invalid };
}

function loadWeakData(key, isValidKey) {
  return sanitizeWeakData(loadJSON(key, {}), isValidKey).data;
}

function startOfToday() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

function isDue(entry) {
  return entry.due <= Date.now();
}

// 回答結果を苦手データに反映する（単語・文法共通）。間違えたら今すぐ復習対象に戻す
function updateWeakEntry(store, key, isCorrect) {
  const entry = store[key];
  if (!isCorrect) {
    store[key] = { streak: 0, added: entry ? entry.added : Date.now(), due: Date.now() };
    return;
  }
  // 苦手でない問題や、復習日より前の正解では記録を進めない
  if (!entry || !isDue(entry)) return;
  if (entry.streak >= REVIEW_INTERVALS.length) {
    delete store[key];
  } else {
    entry.streak++;
    entry.due = startOfToday() + REVIEW_INTERVALS[entry.streak - 1] * DAY_MS;
  }
}

// 苦手リストに出す「次の復習」の表示
function dueLabel(entry) {
  if (isDue(entry)) return '<div class="weak-due now">要復習</div>';
  const days = Math.round((entry.due - startOfToday()) / DAY_MS);
  const d = new Date(entry.due);
  return `<div class="weak-due">次の復習 ${d.getMonth()+1}/${d.getDate()}（${days === 1 ? '明日' : `${days}日後`}）</div>`;
}

// ==================== 単語の記録（モードごと） ====================
// 苦手と学習済みの単語は、英→日・日→英・カード・タイプのモードごとに別々に記録する

const VOCAB_MODES = ['e2j', 'j2e', 'flash', 'type'];
const MODE_LABELS = { e2j: '英→日', j2e: '日→英', flash: 'カード', type: 'タイプ' };
const WEAK_WORDS_KEY = 'toeic_weak_words_by_mode';
const SEEN_WORDS_KEY = 'toeic_seen_words_by_mode';
// モード共通だったころの記録。初めて開いたときに移し替え、元の記録は消さずに残す
const LEGACY_WEAK_WORDS_KEY = 'toeic_weak_words';
const LEGACY_SEEN_WORDS_KEY = 'toeic_seen_words';

// 問題ごとの正誤カウント { [key]: { a: 解答数, c: 正解数 } }
const WORD_STATS_KEY = 'toeic_word_stats';
const GRAMMAR_STATS_KEY = 'toeic_grammar_stats';

function loadStatsData(key) {
  const data = loadJSON(key, {});
  Object.keys(data).forEach(k => {
    const e = data[k];
    if (!e || typeof e !== 'object' || !Number.isFinite(e.a) || e.a <= 0) {
      delete data[k];
    } else {
      const a = Math.max(1, Math.floor(e.a));
      const c = Math.min(a, Math.max(0, Math.floor(Number(e.c) || 0)));
      data[k] = { a, c };
    }
  });
  return data;
}

function recordItemStat(store, storageKey, itemKey, isCorrect) {
  const k = String(itemKey);
  const cur = store[k] || { a: 0, c: 0 };
  store[k] = { a: cur.a + 1, c: cur.c + (isCorrect ? 1 : 0) };
  saveJSON(storageKey, store);
}

function statLabelText(stat) {
  if (!stat || !stat.a) return '';
  return `過去 ${stat.c}/${stat.a} 正解`;
}

function summarizeStats(statsObj) {
  let totalA = 0;
  let totalC = 0;
  let items = 0;
  if (statsObj && typeof statsObj === 'object') {
    Object.values(statsObj).forEach(st => {
      if (st && st.a > 0) {
        totalA += st.a;
        totalC += st.c;
        items++;
      }
    });
  }
  return { totalA, totalC, items, rate: totalA > 0 ? Math.round((totalC / totalA) * 100) : 0 };
}

// どのモードで間違えたか分からない記録は、4モード全部に（復習日と段階もそのまま）写す
function copyToAllModes(value) {
  return Object.fromEntries(VOCAB_MODES.map(m => [m, JSON.parse(JSON.stringify(value))]));
}

// { e2j: {綴り: 苦手1件}, … } を確かめる。知らないモード名や形の正しくない件は除いて数を返す
function sanitizeWeakByMode(raw) {
  const data = {};
  let invalid = Object.keys(raw).filter(k => !VOCAB_MODES.includes(k)).length;
  VOCAB_MODES.forEach(m => {
    if (raw[m] === undefined) {
      data[m] = {};
    } else if (isPlainObject(raw[m])) {
      const r = sanitizeWeakData(raw[m], isWordKey);
      data[m] = r.data;
      invalid += r.invalid;
    } else {
      data[m] = {};
      invalid++;
    }
  });
  return { data, invalid };
}

// { e2j: [綴り, …], … } を確かめる。文字列以外は除き、重複はまとめる
function sanitizeSeenByMode(raw) {
  const data = {};
  let invalid = Object.keys(raw).filter(k => !VOCAB_MODES.includes(k)).length;
  VOCAB_MODES.forEach(m => {
    const list = raw[m] === undefined ? [] : raw[m];
    if (!Array.isArray(list)) {
      data[m] = [];
      invalid++;
      return;
    }
    const valid = list.filter(w => typeof w === 'string' && isWordKey(w));
    invalid += list.length - valid.length;
    data[m] = [...new Set(valid)];
  });
  return { data, invalid };
}

function loadWeakByMode() {
  const saved = loadJSON(WEAK_WORDS_KEY, null);
  if (saved !== null) return sanitizeWeakByMode(saved).data;
  const byMode = copyToAllModes(loadWeakData(LEGACY_WEAK_WORDS_KEY, isWordKey));
  saveJSON(WEAK_WORDS_KEY, byMode);
  return byMode;
}

function loadSeenByMode() {
  const saved = loadJSON(SEEN_WORDS_KEY, null);
  const lists = saved !== null
    ? sanitizeSeenByMode(saved).data
    : copyToAllModes(loadJSON(LEGACY_SEEN_WORDS_KEY, []).filter(w => typeof w === 'string'));
  if (saved === null) saveJSON(SEEN_WORDS_KEY, lists);
  return Object.fromEntries(VOCAB_MODES.map(m => [m, new Set(lists[m])]));
}

let state = {
  app: 'vocab', // 'vocab' or 'grammar'

  // Vocab state
  mode: 'e2j',
  sourceFilter: 'all',
  rangeFilter: null,
  dateFilter: [],
  posFilter: 'all',
  weakFilter: 'all',
  pool: [],
  currentIndex: 0,
  score: 0,
  answeredCount: 0,
  weakByMode: loadWeakByMode(), // { e2j: {綴り: 苦手1件}, … }
  seenByMode: loadSeenByMode(), // { e2j: Set(綴り), … }
  wordStats: loadStatsData(WORD_STATS_KEY),
  currentOptions: [],
  answered: false,

  // Grammar state
  grammarBook: 'all',
  grammarChapter: 'all',
  grammarWeakFilter: 'all',
  grammarRule: null, // 金のルール番号で絞り込み中なら数値
  guideChapter: 'all',
  grammarPool: [],
  currentGrammarIndex: 0,
  grammarScore: 0,
  grammarAnsweredCount: 0,
  grammarWeakData: loadWeakData('toeic_weak_grammar', isGrammarKey),
  grammarStats: loadStatsData(GRAMMAR_STATS_KEY),
  grammarAnswered: false,

  weakSort: 'new', // 苦手リストの並び順
  weakListMode: 'e2j' // 単語の苦手リストで表示しているモード
};

// 今のモード（または指定したモード）の単語の苦手・学習済み
function wordWeak(mode = state.mode) {
  return state.weakByMode[mode];
}

function wordSeen(mode = state.mode) {
  return state.seenByMode[mode];
}

// "2026-06-22" を現地時間の日付として読む（new Date("2026-06-22") は UTC 扱いで、日本より西の地域では前日になる）
function parseLocalDate(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function getWeekLabel(dateStr) {
  const d = parseLocalDate(dateStr);
  const day = d.getDay();
  d.setDate(d.getDate() - (day === 0 ? 6 : day - 1)); // その週の月曜
  return `${d.getMonth()+1}/${d.getDate()}〜`;
}

// ラベルのまま並べると "7/13〜" が "7/6〜" より前に来るので、元の日付順に並べてからラベルにする
const DATES = [...new Set(RAW_WORDS.filter(x => x.d).map(x => x.d).sort().map(getWeekLabel))];

function saveWeakData() {
  saveJSON(WEAK_WORDS_KEY, state.weakByMode);
  updateWeakBadge();
}

function seenSnapshot() {
  return Object.fromEntries(VOCAB_MODES.map(m => [m, [...state.seenByMode[m]]]));
}

function setBadge(id, count) {
  const badge = document.getElementById(id);
  if (!badge) return;
  badge.style.display = count > 0 ? 'inline-block' : 'none';
  badge.innerText = count;
}

function updateWeakBadge() {
  // 「苦手のみ」「要復習」を押したときに出る問題数（今のモードの記録で、出典・日付・品詞・範囲の絞り込みを反映）
  const data = wordWeak();
  const weak = dedupeWords(RAW_WORDS.filter(w => data[w.w] !== undefined && wordMatchesBaseFilters(w)));
  setBadge('weak-badge', weak.length);
  setBadge('due-badge', weak.filter(w => isDue(data[w.w])).length);
}

// TEPPAN の番号を100語ずつに区切った範囲
const TEPPAN_MAX_NO = RAW_WORDS.reduce((max, w) => (w.s === 'teppan' && w.no ? Math.max(max, w.no) : max), 0);
const TEPPAN_RANGES = [];
for (let start = 1; start <= TEPPAN_MAX_NO; start += 100) {
  TEPPAN_RANGES.push({ start, end: Math.min(start + 99, TEPPAN_MAX_NO) });
}

function initRangeFilters() {
  const rf = document.getElementById('range-filters');
  if (!rf) return;
  let html = `<button class="chip active" data-range="all">全番号 (1〜${TEPPAN_MAX_NO})</button>`;
  TEPPAN_RANGES.forEach(({ start, end }) => {
    html += `<button class="chip" data-range="${start}-${end}">${start}〜${end}</button>`;
  });
  rf.innerHTML = html;

  rf.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', e => {
      rf.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      const val = e.currentTarget.dataset.range;
      if (val === 'all') {
        state.rangeFilter = null;
      } else {
        const [start, end] = val.split('-').map(Number);
        state.rangeFilter = { start, end };
      }
      applyFilters();
    });
  });
}


// ==================== GRAMMAR LOGIC ====================

function saveGrammarWeakData() {
  saveJSON('toeic_weak_grammar', state.grammarWeakData);
  updateGrammarWeakBadge();
}

function updateGrammarWeakBadge() {
  // 「苦手のみ」「要復習」を押したときに出る問題数（今の本・章・ルールの絞り込みを反映）
  const weak = RAW_GRAMMAR.filter(ex => state.grammarWeakData[ex.id] !== undefined && grammarMatchesBaseFilters(ex));
  setBadge('grammar-weak-badge', weak.length);
  setBadge('grammar-due-badge', weak.filter(ex => isDue(state.grammarWeakData[ex.id])).length);
}

function getGrammarChaptersList() {
  const book = state.grammarBook || 'all';
  const pool = book === 'all' ? RAW_GRAMMAR : RAW_GRAMMAR.filter(g => (g.b || 'sekai') === book);
  
  if (book === 'kin') {
    const kinChaps = [];
    const seen = new Set();
    RAW_GRAMMAR.filter(g => g.b === 'kin').forEach(g => {
      if (!seen.has(g.ch)) {
        seen.add(g.ch);
        const count = RAW_GRAMMAR.filter(x => x.b === 'kin' && x.ch === g.ch).length;
        kinChaps.push({ ch: g.ch, title: `第${g.ch}章 ${g.ch_title} (${count}問)` });
      }
    });
    return [{ ch: 'all', title: `金の文法 全7章 (${pool.length}問)` }, ...kinChaps];
  } else if (book === 'sekai') {
    const sekaiChaps = [];
    const seen = new Set();
    RAW_GRAMMAR.filter(g => (g.b || 'sekai') === 'sekai').forEach(g => {
      if (!seen.has(g.ch)) {
        seen.add(g.ch);
        const count = RAW_GRAMMAR.filter(x => (x.b || 'sekai') === 'sekai' && x.ch === g.ch).length;
        sekaiChaps.push({ ch: g.ch, title: `第${g.ch}章 ${g.ch_title} (${count}問)` });
      }
    });
    return [{ ch: 'all', title: `世界一 全14章 (${pool.length}問)` }, ...sekaiChaps];
  } else {
    return [
      { ch: 'all', title: `全問 (${pool.length}問)` }
    ];
  }
}

function renderGrammarChapterFilters() {
  const gcf = document.getElementById('grammar-chapter-filters');
  if (!gcf) return;
  
  const chapters = getGrammarChaptersList();
  let html = '';
  if (state.grammarRule !== null) {
    html += `<button class="chip active rule-filter-chip" data-clear-rule="1">金のルール ${state.grammarRule} で絞り込み中 ✕</button>`;
  }
  chapters.forEach((c, idx) => {
    const isActive = state.grammarRule === null && ((state.grammarChapter === c.ch) || (idx === 0 && state.grammarChapter === 'all'));
    html += `<button class="chip ${isActive ? 'active' : ''}" data-gchapter="${c.ch}">${c.title}</button>`;
  });
  gcf.innerHTML = html;

  gcf.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', e => {
      const val = e.currentTarget.dataset.gchapter;
      state.grammarRule = null;
      state.grammarChapter = val === undefined || val === 'all' ? 'all' : Number(val);
      renderGrammarChapterFilters();
      applyGrammarFilters();
    });

}

function initGrammarFilters() {
  // Book segments
  const gbs = document.getElementById('grammar-book-segments');
  if (gbs) {
    gbs.querySelectorAll('.segment').forEach(btn => {
      btn.addEventListener('click', e => {
        gbs.querySelectorAll('.segment').forEach(b => b.classList.remove('active'));
        const target = e.currentTarget;
        target.classList.add('active');
        state.grammarBook = target.dataset.gbook;
        state.grammarChapter = 'all';
        state.grammarRule = null;
        renderGrammarChapterFilters();
        applyGrammarFilters();
      });
    });
  }

  renderGrammarChapterFilters();

  document.querySelectorAll('#grammar-weak-segments .segment').forEach(btn => {
    btn.addEventListener('click', e => {
      document.querySelectorAll('#grammar-weak-segments .segment').forEach(b => b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      state.grammarWeakFilter = e.currentTarget.dataset.gweak;
      applyGrammarFilters();
    });
  });
}

// 苦手フィルタ以外の絞り込み（本・章・ルール）
function grammarMatchesBaseFilters(ex) {
  const itemBook = ex.b || 'sekai';
  if (state.grammarBook !== 'all' && itemBook !== state.grammarBook) return false;
  if (state.grammarChapter !== 'all' && ex.ch !== state.grammarChapter) return false;
  if (state.grammarRule !== null && ex.rule?.number !== state.grammarRule) return false;
  return true;
}

function applyGrammarFilters() {
  let filtered = RAW_GRAMMAR.filter(ex => {
    if (!grammarMatchesBaseFilters(ex)) return false;
    const entry = state.grammarWeakData[ex.id];
    if (state.grammarWeakFilter === 'weak_only' && !entry) return false;
    if (state.grammarWeakFilter === 'due' && !(entry && isDue(entry))) return false;
    return true;
  });

  state.grammarPool = shuffle(filtered);
  state.currentGrammarIndex = 0;
  state.grammarScore = 0;
  state.grammarAnsweredCount = 0;
  updateGrammarWeakBadge();
  updateFilterSummary();
  renderCurrentGrammar();
}

function renderCurrentGrammar() {
  resetActionBar();
  document.getElementById('choices-container').classList.remove('compact');
  const container = document.getElementById('quiz-container');
  const choicesDiv = document.getElementById('choices-container');
  const nextBtn = document.getElementById('next-btn');

  if (state.grammarPool.length === 0) {
    container.innerHTML = `<div class="card"><div class="meaning-display">条件に合う文法問題がありません</div></div>`;
    choicesDiv.innerHTML = '';
    nextBtn.style.display = 'none';
    updateFooter();
    return;
  }

  if (state.currentGrammarIndex >= state.grammarPool.length) {
    container.innerHTML = `<div class="card"><div class="meaning-display">文法ドリル完了！ 🎉</div><div style="font-size:14px;color:var(--muted);margin-top:8px;">正答: ${state.grammarScore} / ${state.grammarAnsweredCount}</div></div>`;
    choicesDiv.innerHTML = '';
    nextBtn.style.display = 'none';
    updateFooter();
    return;
  }

  const ex = state.grammarPool[state.currentGrammarIndex];
  state.grammarAnswered = false;
  choicesDiv.innerHTML = '';
  nextBtn.style.display = 'none';

  // Highlight blank in question
  const formattedQ = ex.q.replace(/-{3,}/g, '<span style="color:var(--seal);font-weight:bold;text-decoration:underline;">_______</span>');

  const isKin = ex.b === 'kin';
  const bookBadgeHtml = isKin 
    ? '<span class="grammar-book-badge badge-kin">👑 金の文法</span>'
    : '<span class="grammar-book-badge badge-sekai">📖 世界一</span>';

  const ruleHtml = (ex.rule && ex.rule.number) ? `
    <div class="grammar-rule-card">
      <div class="grammar-rule-header">
        <span class="grammar-rule-icon">👑</span>
        <span class="grammar-rule-badge-text">金のルール ${ex.rule.number}</span>
        ${ex.rule.category && ex.rule.category !== `第${ex.ch}章 ${ex.ch_title}` ? `<span class="grammar-rule-cat">${ex.rule.category}</span>` : ''}
      </div>
      <div class="grammar-rule-title">${ex.rule.title}</div>
    </div>
  ` : '';

  const phaseInfo = isKin ? (typeof KIN_PHASES !== 'undefined' ? KIN_PHASES.find(p => p.chapter === ex.ch) : null) : null;
  const phaseHtml = (phaseInfo && phaseInfo.phases) ? `
    <details class="grammar-phase-details">
      <summary>💡 第${ex.ch}章 (${escapeHtml(phaseInfo.chapter_title)}) の解き方手順を見る</summary>
      ${renderPhaseSteps(phaseInfo.phases)}
    </details>
  ` : '';

  const gStat = state.grammarStats[String(ex.id)];
  const gStatHtml = `<span id="grammar-stat-badge" class="item-stat-badge"${gStat && gStat.a ? '' : ' hidden'}>${statLabelText(gStat)}</span>`;

  container.innerHTML = `
    <div class="card grammar-card" id="main-card">
      <div class="grammar-meta" style="width:100%;">
        <span class="grammar-badge">Part 5</span>
        ${bookBadgeHtml}
        ${gStatHtml}
      </div>
      <div class="grammar-question">${formattedQ}</div>
      <div class="grammar-exp-container" id="grammar-exp-box" style="display:none;">
        <div class="grammar-correct-ans">正解: (${['A','B','C','D'][ex.a]}) ${ex.c[ex.a]}</div>
        <div class="grammar-your-ans" id="grammar-your-ans" style="display:none;"></div>
        <div class="grammar-theme-revealed">第${ex.ch}章 ${ex.ch_title} ・${ex.th_title}</div>
        ${ruleHtml}
        ${phaseHtml}
        <div class="grammar-exp-text">${ex.exp}</div>
        ${ex.v && ex.v.length > 0 ? `
          <div class="grammar-vocab-list">
            <div class="grammar-vocab-title">📌 重要語彙</div>
            <div class="grammar-vocab-items">
              ${ex.v.map(v => `<span class="grammar-vocab-item"><strong>${v.word}</strong>: ${v.meaning}</span>`).join('')}
            </div>
          </div>
        ` : ''}
      </div>
    </div>
  `;

  const labels = ['A', 'B', 'C', 'D'];
  ex.c.forEach((choice, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-key">${idx + 1}</span><span class="choice-label">${labels[idx]}</span><span class="choice-text">${choice}</span>`;
    btn.onclick = () => handleGrammarAnswer(idx, btn);
    choicesDiv.appendChild(btn);
  });
  setDontKnowVisible(true);
  document.getElementById('dont-know-btn').onclick = handleGrammarDontKnow;

  updateFooter();
}

function handleGrammarAnswer(selectedIdx, btn) {
  if (state.grammarAnswered) return;
  const ex = state.grammarPool[state.currentGrammarIndex];
  const isCorrect = selectedIdx === ex.a;

  if (!isCorrect) {
    btn.classList.add('wrong');
    shakeCard();
    const yours = document.getElementById('grammar-your-ans');
    yours.textContent = `あなたの回答: (${['A','B','C','D'][selectedIdx]}) ${ex.c[selectedIdx]}`;
    yours.style.display = 'block';
    recordWeakGrammar(ex, false);
  } else {
    state.grammarScore++;
    recordWeakGrammar(ex, true);
  }
  revealGrammarAnswer(ex);
}

// 「わからない」: 正解と解説を見せて苦手に登録。スコアは増やさず、赤表示や揺れは出さない
function handleGrammarDontKnow() {
  if (state.grammarAnswered) return;
  const ex = state.grammarPool[state.currentGrammarIndex];
  recordWeakGrammar(ex, false);
  revealGrammarAnswer(ex);
}

function revealGrammarAnswer(ex) {
  state.grammarAnswered = true;
  setDontKnowVisible(false);

  const choicesDiv = document.getElementById('choices-container');
  choicesDiv.querySelectorAll('.choice-btn').forEach((b, i) => {
    if (i === ex.a) b.classList.add('correct');
    const mark = i === ex.a ? '✓' : (b.classList.contains('wrong') ? '✗' : '');
    if (mark) b.insertAdjacentHTML('beforeend', `<span class="choice-mark">${mark}</span>`);
    // 回答後は全文表示のまま。タップで記号だけの1行に縮めて解説を広く読める（再タップで戻る）
    b.onclick = () => choicesDiv.classList.toggle('compact');
  });

  const expBox = document.getElementById('grammar-exp-box');
  if (expBox) expBox.style.display = 'block';

  showNextButton(() => {
    state.currentGrammarIndex++;
    renderCurrentGrammar();
  });
  updateFooter();
}

function recordWeakGrammar(ex, isCorrect) {
  state.grammarAnsweredCount++;
  recordItemStat(state.grammarStats, GRAMMAR_STATS_KEY, ex.id, isCorrect);
  const badge = document.getElementById('grammar-stat-badge');
  if (badge) {
    badge.textContent = statLabelText(state.grammarStats[String(ex.id)]);
    badge.hidden = false;
  }
  updateWeakEntry(state.grammarWeakData, ex.id, isCorrect);
  saveGrammarWeakData();
}

// 単語／文法の切り替え。前回の続きが保存されていればそこから、なければ今の絞り込みで出題し直す
function setApp(app) {
  state.app = app;
  const isGrammar = app === 'grammar';
  document.querySelectorAll('#app-type-segments .segment').forEach(b => b.classList.toggle('active', b.dataset.app === app));
  document.querySelector('.header .title').innerText = isGrammar ? '文法ドリル (Part 5)' : '単語ドリル';
  document.getElementById('rule-guide-link').style.display = isGrammar ? 'inline' : 'none';
  document.getElementById('mode-segments').style.display = isGrammar ? 'none' : 'flex';
  document.getElementById('vocab-filters').style.display = isGrammar ? 'none' : 'block';
  document.getElementById('grammar-filters').style.display = isGrammar ? 'block' : 'none';
  resetActionBar();

  if (isGrammar) {
    if (!restoreSession('grammar')) return applyGrammarFilters();
    updateGrammarWeakBadge();
    updateFilterSummary();
    renderCurrentGrammar();
  } else {
    if (!restoreSession('vocab')) return applyFilters();
    updateWeakBadge();
    updateFilterSummary();
    renderCurrent();
  }
}

// TEPPAN は番号範囲で、それ以外は日付・品詞で絞る
function updateSourceRows() {
  const teppan = state.sourceFilter === 'teppan';
  document.getElementById('date-filters').style.display = teppan ? 'none' : 'flex';
  document.getElementById('pos-filters').style.display = teppan ? 'none' : 'flex';

}

// ボタンの選択表示を state に合わせる（保存していた設定を復元したときなど）
function syncFilterUI() {
  const mark = (selector, isActive) =>
    document.querySelectorAll(selector).forEach(b => b.classList.toggle('active', isActive(b.dataset)));
  const range = state.rangeFilter ? `${state.rangeFilter.start}-${state.rangeFilter.end}` : 'all';
  mark('#source-segments .segment', d => d.source === state.sourceFilter);
  mark('#date-filters .chip', d => d.date === 'all' ? state.dateFilter.length === 0 : state.dateFilter.includes(d.date));
  mark('#pos-filters .chip', d => d.pos === state.posFilter);
  mark('#range-filters .chip', d => d.range === range);
  mark('#weak-segments .segment', d => d.weak === state.weakFilter);
  mark('#mode-segments .segment', d => d.mode === state.mode);
  mark('#grammar-book-segments .segment', d => d.gbook === state.grammarBook);
  mark('#grammar-weak-segments .segment', d => d.gweak === state.grammarWeakFilter);
  renderGrammarChapterFilters();
  updateSourceRows();
}

function initFilters() {
  document.querySelectorAll('#app-type-segments .segment').forEach(btn => {
    btn.addEventListener('click', e => setApp(e.currentTarget.dataset.app));

    btn.addEventListener('click', e => {
      document.querySelectorAll('#source-segments .segment').forEach(b => b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      state.sourceFilter = e.currentTarget.dataset.source;
      updateSourceRows();
      applyFilters();
    });
  });

  const df = document.getElementById('date-filters');
  df.innerHTML = `<button class="chip active" data-date="all">すべて</button>`;
  DATES.forEach(d => {
    df.innerHTML += `<button class="chip" data-date="${d}">${d}</button>`;
  });
  
  document.querySelectorAll('#date-filters .chip').forEach(btn => {
    btn.addEventListener('click', e => {
      const val = e.currentTarget.dataset.date;
      if (val === 'all') {
        state.dateFilter = [];
      } else if (state.dateFilter.includes(val)) {
        state.dateFilter = state.dateFilter.filter(x => x !== val);
      } else {
        state.dateFilter.push(val);
      }
      syncFilterUI();
      applyFilters();
    });
  });

  document.querySelectorAll('#pos-filters .chip').forEach(btn => {
    btn.addEventListener('click', e => {
      document.querySelectorAll('#pos-filters .chip').forEach(b => b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      state.posFilter = e.currentTarget.dataset.pos;
      applyFilters();
    });
  });

  document.querySelectorAll('#weak-segments .segment').forEach(btn => {
    btn.addEventListener('click', e => {
      document.querySelectorAll('#weak-segments .segment').forEach(b => b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      state.weakFilter = e.currentTarget.dataset.weak;
      applyFilters();
    });
  });

  document.querySelectorAll('#mode-segments .segment').forEach(btn => {
    btn.addEventListener('click', e => {
      document.querySelectorAll('#mode-segments .segment').forEach(b => b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      state.mode = e.currentTarget.dataset.mode;
      updateWeakBadge();
      // 苦手・未学習で絞っているときはモードごとに出題範囲が変わるので出題し直す。「すべて」なら並びはそのまま
      if (state.weakFilter !== 'all') applyFilters();

    toggle.setAttribute('aria-expanded', String(open));

function updateFilterSummary() {
  let n = 0;
  if (state.app === 'grammar') {
    if (state.grammarBook !== 'all') n++;
    if (state.grammarChapter !== 'all') n++;
    if (state.grammarRule !== null) n++;
    if (state.grammarWeakFilter !== 'all') n++;
  } else {
    if (state.sourceFilter !== 'all') n++;
    if (state.sourceFilter === 'teppan') {
      if (state.rangeFilter) n++;
    } else {
      n += state.dateFilter.length;
      if (state.posFilter !== 'all') n++;
    }
    if (state.weakFilter !== 'all') n++;
  }
  const el = document.getElementById('filter-count');
  if (!el) return;
  el.style.display = n > 0 ? 'inline-block' : 'none';
  el.innerText = n;
}

function shuffle(array) {
  let currentIndex = array.length, randomIndex;
  while (currentIndex !== 0) {
    randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
  }
  return array;
}

// 品詞「句・表現」に含める品詞（TEPPAN はそのまま「句・表現」で登録されている）
const PHRASE_POS = ['名詞句', '動詞句', '形容詞句', '副詞句', '表現', '句・表現'];

// 苦手フィルタ以外の絞り込み（出典・範囲・日付・品詞）
function wordMatchesBaseFilters(w) {
  // source
  if (state.sourceFilter !== 'all' && w.s !== state.sourceFilter) return false;

  // range filter (for TEPPAN)
  if (state.sourceFilter === 'teppan' && state.rangeFilter) {
    if (!w.no || w.no < state.rangeFilter.start || w.no > state.rangeFilter.end) return false;
  }

  // date (for daily words or all)
  if (state.sourceFilter !== 'teppan' && state.dateFilter.length > 0) {
    if (!w.d || !state.dateFilter.includes(getWeekLabel(w.d))) return false;
  }

  // pos (for daily words or all)
  if (state.sourceFilter !== 'teppan' && state.posFilter !== 'all') {
    if (state.posFilter === '句・表現') {
      if (!PHRASE_POS.includes(w.p)) return false;
    } else {
      if (w.p !== state.posFilter) return false;
    }
  }
  return true;
}

// 日々の単語と TEPPAN の両方にある単語は1問にまとめる（苦手記録は綴りで共通なので）
function dedupeWords(words) {
  const seen = new Set();
  return words.filter(w => {
    if (seen.has(w.w)) return false;
    seen.add(w.w);
    return true;
  });
}

function applyFilters() {
  let filtered = RAW_WORDS.filter(w => {
    if (!wordMatchesBaseFilters(w)) return false;

    // weak
    const entry = wordWeak()[w.w];
    if (state.weakFilter === 'weak_only' && !entry) return false;
    if (state.weakFilter === 'weak_unlearned' && !entry && wordSeen().has(w.w)) return false;
    if (state.weakFilter === 'due' && !(entry && isDue(entry))) return false;

    return true;
  });
  
  state.pool = shuffle(dedupeWords(filtered));
  state.currentIndex = 0;
  state.score = 0;
  state.answeredCount = 0;
  updateWeakBadge();
  updateFilterSummary();
  renderCurrent();
}
