function renderWeakList() {
  if (state.app === 'grammar') renderGrammarWeakList();
  else renderWordWeakList();
  document.getElementById('weak-list-content').insertAdjacentHTML('afterbegin', backupEntryHtml());
}

// items は { entry } を持つ配列。order は「ABC順」「本・章順」の比べ方
function sortWeakItems(items, order) {
  const compare = {
    new: (a, b) => b.entry.added - a.entry.added,
    old: (a, b) => a.entry.added - b.entry.added,
    due: (a, b) => a.entry.due - b.entry.due,
    order,
  }[state.weakSort] || order;
  return items.sort(compare);
}

// 件数・要復習数と並び替えボタン（単語・文法共通）
function weakListHeader(items, orderLabel) {
  const due = items.filter(x => isDue(x.entry)).length;
  const sorts = [['new', '新しい順'], ['old', '古い順'], ['due', '復習日順'], ['order', orderLabel]];
  return `
    <div class="weak-list-summary">
      苦手 ${items.length}件 ・ 要復習 <strong>${due}</strong>件<br>
      復習日以降に正解するたびに ${REVIEW_INTERVALS.join('日→')}日後 と間隔が延び、最後も正解すると苦手から外れます
    </div>
    <div class="filter-row" style="flex-wrap:wrap;margin-bottom:4px;">
      ${sorts.map(([k, label]) => `<button class="chip ${state.weakSort === k ? 'active' : ''}" data-weak-sort="${k}">${label}</button>`).join('')}
    </div>`;
}

function renderWordWeakList() {
  const container = document.getElementById('weak-list-content');
  const mode = state.weakListMode;
  const data = wordWeak(mode);
  const items = Object.keys(data)
    .map(k => ({ key: k, entry: data[k], word: RAW_WORDS.find(x => x.w === k) }))
    .filter(x => x.word);
  document.getElementById('sheet-title').innerText = `苦手リスト ${MODE_LABELS[mode]}（${items.length}）`;
  // 苦手はモードごとに記録しているので、他のモードの記録も切り替えて見られるようにする
  let html = `<div class="filter-row weak-mode-row">
    ${VOCAB_MODES.map(m => `<button class="chip ${m === mode ? 'active' : ''}" data-weak-mode="${m}">${MODE_LABELS[m]} ${Object.keys(wordWeak(m)).length}</button>`).join('')}
  </div>`;
  if (items.length === 0) {
    container.innerHTML = html + `<p>${MODE_LABELS[mode]}の苦手な単語はありません。</p>`;
    return;
  }
  sortWeakItems(items, (a, b) => a.key.localeCompare(b.key, 'en', { sensitivity: 'base' }));

  html += weakListHeader(items, 'ABC順');
  items.forEach(({ key, entry, word }) => {
    html += `
      <div class="weak-item">
        <div>
          <div class="weak-word">${escapeHtml(word.w)}</div>
          <div class="weak-meaning">${escapeHtml(word.m)}</div>
          ${dueLabel(entry)}
        </div>
        <button class="del-btn" data-remove-weak="${escapeHtml(key)}">削除</button>
      </div>
    `;
  });
  container.innerHTML = html;
}

function removeWeak(key) {
  if (state.app === 'grammar') {
    delete state.grammarWeakData[key];
    saveGrammarWeakData();
  } else {
    delete wordWeak(state.weakListMode)[key];
    saveWeakData();
  }
  renderWeakList();
}

// ==================== 学習記録のバックアップ・復元 ====================
// 苦手リスト（復習日を含む）・学習済みの単語・設定・出題の続きを1つの JSON ファイルに書き出し、別の端末などで復元する

const BACKUP_APP_ID = 'toeic-drill';
// ファイル形式の版。形式を変えたら上げて、BACKUP_MIGRATIONS に1つ前の版からの変換を足す
// 版1: 単語の苦手・学習済みがモード共通 / 版2: モードごと
const BACKUP_FORMAT = 2;
// 版 n のファイルを版 n+1 に直す変換
const BACKUP_MIGRATIONS = {
  // どのモードの記録か分からないので、4モード全部に写す。
  // 形の正しくない件は写す前に除いて数えておく（写したあとに数えると4倍になる）
  1: backup => {
    const d = backup.data;
    if (!isPlainObject(d)) return { ...backup, format: 2 };
    let invalid = 0;
    let weakWords = d.weakWords;
    let seenWords = d.seenWords;
    if (isPlainObject(weakWords)) {
      const r = sanitizeWeakData(weakWords, isWordKey);
      invalid += r.invalid;
      weakWords = copyToAllModes(r.data);
    }
    if (Array.isArray(seenWords)) {
      const valid = seenWords.filter(w => typeof w === 'string' && isWordKey(w));
      invalid += seenWords.length - valid.length;
      seenWords = copyToAllModes([...new Set(valid)]);
    }
    return { ...backup, format: 2, invalidBeforeMigration: invalid, data: { ...d, weakWords, seenWords } };
  },
};
const BACKUP_MAX_BYTES = 2 * 1024 * 1024;
// ファイルの中の名前 → この端末の保存先
const RECORD_KEYS = {
  weakWords: WEAK_WORDS_KEY,
  weakGrammar: 'toeic_weak_grammar',
  seenWords: SEEN_WORDS_KEY,
  settings: SETTINGS_KEY,
  session: SESSION_KEY,
  dailyLog: DAILY_LOG_KEY,
};
const RECORD_STORAGE_KEYS = Object.values(RECORD_KEYS);
const BACKUP_UNDO_KEY = 'toeic_backup_undo';     // 直前の復元を取り消すための、復元する前の記録（1回分）
const BACKUP_META_KEY = 'toeic_backup_meta';     // 最後に書き出した日時
const RESTORE_STAMP_KEY = 'toeic_restore_stamp'; // 復元したことを別のタブに知らせる
const NOTICE_KEY = 'toeic_notice';               // 読み込み直したあとに出すお知らせ（sessionStorage）

let backupView = { step: 'home' }; // home / confirm（復元の確認）/ undo（取り消しの確認）

function isPlainObject(v) {
  return v !== null && typeof v === 'object' && !Array.isArray(v);
}

function formatDateTime(ms) {
  const d = new Date(ms);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ---- 書き出し ----

function buildBackup() {
  return {
    app: BACKUP_APP_ID,
    format: BACKUP_FORMAT,
    exportedAt: new Date().toISOString(),
    appData: { words: RAW_WORDS.length, grammar: RAW_GRAMMAR.length },
    data: {
      weakWords: state.weakByMode,
      weakGrammar: state.grammarWeakData,
      seenWords: seenSnapshot(),
      settings: settingsSnapshot(),
      session: sessionSnapshot(),
      dailyLog: state.dailyLog,
    },
  };
}

function backupFile() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const stamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
  return new File([JSON.stringify(buildBackup(), null, 2)], `toeic-drill-backup-${stamp}.json`, { type: 'application/json' });
}

function markExported() {
  saveJSON(BACKUP_META_KEY, { ...loadJSON(BACKUP_META_KEY, {}), lastExportAt: Date.now() });
}

function downloadBackup() {
  const file = backupFile();
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url;
  a.download = file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  markExported();
}

// スマホの共有シート（「ファイルに保存」や別の端末へ送る）でファイルを渡せる端末か
function canShareBackup() {
  try {
    return !!(navigator.canShare && navigator.canShare({ files: [new File(['{}'], 'backup.json', { type: 'application/json' })] }));
  } catch (e) {
    return false;
  }
}

async function shareBackup() {
  try {
    await navigator.share({ files: [backupFile()], title: 'TOEIC Drill の学習記録' });
    markExported();
    backupView = { step: 'home', success: '共有しました。' };
  } catch (e) {
    if (e.name === 'AbortError') return; // 共有シートを閉じただけ
    backupView = { step: 'home', error: '共有できませんでした。「バックアップを書き出す」を使ってください。' };
  }
  refreshBackupSheet();
}

// ---- 読み込みと検証（ここでは何も書き込まない） ----

function fail(error) {
  return { ok: false, error };
}

// 別の端末の時計がずれていても、追加日が未来になったり復習日がずっと先になったりしないようにする
function clampImportedTimes(data) {
  const latestDue = startOfToday() + (REVIEW_INTERVALS[REVIEW_INTERVALS.length - 1] + 1) * DAY_MS;
  Object.values(data).forEach(e => {
    e.added = Math.min(e.added, Date.now());
    e.due = Math.min(e.due, latestDue);
  });
  return data;
}

// バックアップの中身を確かめ、復元に使う記録と確認画面に出す件数を返す。全体の形が違えばファイルごと断る
function parseBackup(text) {
  let backup;
  try {
    backup = JSON.parse(text);
  } catch (e) {
    return fail('JSON として読めないファイルです。');
  }
  if (!isPlainObject(backup) || backup.app !== BACKUP_APP_ID) return fail('TOEIC Drill のバックアップファイルではありません。');
  if (!Number.isInteger(backup.format) || backup.format < 1) return fail('ファイル形式の版が読み取れません。');
  if (backup.format > BACKUP_FORMAT) {
    return fail('新しいバージョンのアプリで書き出したファイルです。アプリを最新にしてから読み込んでください。');
  }
  let invalidBeforeMigration = 0; // 古い版を変換したときに除いた件数（変換を通ったときだけ数える）
  while (backup.format < BACKUP_FORMAT) {
    const migrate = BACKUP_MIGRATIONS[backup.format];
    if (!migrate) return fail('この古い形式のファイルには対応していません。');
    backup = migrate(backup);
    invalidBeforeMigration += Number.isInteger(backup.invalidBeforeMigration) ? backup.invalidBeforeMigration : 0;
  }

  const d = backup.data;
  if (!isPlainObject(d)) return fail('学習記録のデータが入っていません。');
  if (!isPlainObject(d.weakWords) || !isPlainObject(d.weakGrammar) || !isPlainObject(d.seenWords)) {
    return fail('苦手リストか学習済みの単語の記録が欠けているか、形が正しくありません。');
  }
  if (d.settings !== undefined && !isPlainObject(d.settings)) return fail('設定の記録の形が正しくありません。');
  if (d.session !== undefined && !isPlainObject(d.session)) return fail('出題の続きの記録の形が正しくありません。');
  if (d.dailyLog !== undefined && !isPlainObject(d.dailyLog)) return fail('学習ログの記録の形が正しくありません。');

  const words = sanitizeWeakByMode(d.weakWords);
  const grammar = sanitizeWeakData(d.weakGrammar, isGrammarKey);
  const seen = sanitizeSeenByMode(d.seenWords);
  const log = d.dailyLog === undefined ? null : sanitizeDailyLog(d.dailyLog);
  const knownWords = new Set(RAW_WORDS.map(w => w.w));
  const weakWordKeys = new Set(VOCAB_MODES.flatMap(m => Object.keys(words.data[m])));
  const exportedAt = Date.parse(backup.exportedAt);

  return {
    ok: true,
    exportedAt: Number.isFinite(exportedAt) ? exportedAt : null,
    // 設定と出題の続きの中身は、読み込んだあとに restoreSettings / restoreSession が1項目ずつ確かめる
    records: {
      weakWords: Object.fromEntries(VOCAB_MODES.map(m => [m, clampImportedTimes(words.data[m])])),
      weakGrammar: clampImportedTimes(grammar.data),
      seenWords: seen.data,
      settings: d.settings,
      session: d.session,
      // ファイルに無いときは今の学習ログを残す（キー自体を作らない）
      ...(log ? { dailyLog: log.data } : {}),
    },
    invalid: words.invalid + grammar.invalid + seen.invalid + (log ? log.invalid : 0) + invalidBeforeMigration,
    // 今のデータに無い単語・問題も、別の端末のほうがデータが新しい場合に備えて消さずに残す
    unknownWords: [...weakWordKeys].filter(k => !knownWords.has(k)).length,
    unknownGrammar: Object.keys(grammar.data).filter(k => !GRAMMAR_BY_ID.has(Number(k))).length,
  };
}

async function readBackupFile(file) {
  if (file.size === 0) return fail('空のファイルです。');
  if (file.size > BACKUP_MAX_BYTES) return fail('ファイルが大きすぎます（2MB まで）。TOEIC Drill のバックアップファイルか確かめてください。');
  try {
    return parseBackup(await file.text());
  } catch (e) {
    return fail('ファイルを読み込めませんでした。');
  }
}

// ---- 復元と取り消し ----

function writeRaw(rawByKey) {
  Object.entries(rawByKey).forEach(([k, raw]) => {
    if (raw === null) localStorage.removeItem(k);
    else localStorage.setItem(k, raw);
  });
}

// 記録をまとめて書き換える。途中で失敗したら書き換える前に戻し、理由を Error で知らせる。
// saveUndo が true なら、書き換える前の記録を「直前の復元を取り消す」用に残す（残せなければ何も変えずに中止）
function replaceRecords(rawByKey, saveUndo, label) {
  let before;
  let undoBefore; // 前の復元で残した取り消し用の記録。失敗したときはこれも元に戻す
  try {
    before = Object.fromEntries(RECORD_STORAGE_KEYS.map(k => [k, localStorage.getItem(k)]));
    undoBefore = localStorage.getItem(BACKUP_UNDO_KEY);
  } catch (e) {
    throw new Error(`このブラウザでは記録を読み書きできないため、${label}できません。`);
  }
  if (saveUndo) {
    try {
      localStorage.setItem(BACKUP_UNDO_KEY, JSON.stringify({ savedAt: Date.now(), records: before }));
    } catch (e) {
      throw new Error(`空き容量が足りないため、${label}を中止しました。記録は元のままです。`);
    }
  }
  try {
    writeRaw(rawByKey);
  } catch (e) {
    try {
      // 先に取り消し用の記録を外して空きを作ってから、元の記録を書き戻す
      if (saveUndo) localStorage.removeItem(BACKUP_UNDO_KEY);
      writeRaw(before);
      if (saveUndo) writeRaw({ [BACKUP_UNDO_KEY]: undoBefore });
    } catch (e2) {
      throw new Error(`${label}に失敗し、元の記録にも戻せませんでした。書き出しておいたバックアップファイルから、もう一度復元してください。`);
    }
    throw new Error(`保存できなかったため（空き容量不足など）、${label}を中止しました。記録は元のままです。`);
  }
}

// 書き換えた記録を読み込み直して画面に反映し、別のタブにも知らせる
function reloadRecordsFromStorage() {
  state.weakByMode = loadWeakByMode();
  state.grammarWeakData = loadWeakData('toeic_weak_grammar', isGrammarKey);
  state.seenByMode = loadSeenByMode();
  state.dailyLog = loadDailyLog();
  restoreSettings();
  syncFilterUI();
  setApp(state.app);
  updateWeakBadge();
  updateGrammarWeakBadge();
  try {
    localStorage.setItem(RESTORE_STAMP_KEY, String(Date.now()));
  } catch (e) {
    // 別のタブに知らせられなくても、この画面の復元は終わっている
  }
}

function runRestore() {
  const pending = backupView.pending;
  if (!pending) return;
  const preExport = document.getElementById('backup-pre-export');
  if (preExport && preExport.checked) downloadBackup();

  const rawByKey = {};
  Object.entries(RECORD_KEYS).forEach(([name, key]) => {
    // ファイルに無い設定・出題の続きは今のまま
    if (pending.records[name] !== undefined) rawByKey[key] = JSON.stringify(pending.records[name]);
  });
  try {
    replaceRecords(rawByKey, true, '復元');
  } catch (e) {
    backupView = { step: 'home', error: e.message };
    renderBackupSheet();
    return;
  }
  reloadRecordsFromStorage();
  backupView = { step: 'home', success: 'バックアップから復元しました。' };
  renderBackupSheet();
}

function loadUndo() {
  const undo = loadJSON(BACKUP_UNDO_KEY, {});
  if (!Number.isFinite(undo.savedAt) || !isPlainObject(undo.records)) return null;
  const valid = RECORD_STORAGE_KEYS.every(k => undo.records[k] === null || typeof undo.records[k] === 'string');
  return valid ? undo : null;
}

function runUndo() {
  const undo = loadUndo();
  if (!undo) {
    backupView = { step: 'home', error: '取り消せる復元がありません。' };
    return renderBackupSheet();
  }
  try {
    replaceRecords(Object.fromEntries(RECORD_STORAGE_KEYS.map(k => [k, undo.records[k]])), false, '取り消し');
  } catch (e) {
    backupView = { step: 'home', error: e.message };
    return renderBackupSheet();
  }
  try {
    localStorage.removeItem(BACKUP_UNDO_KEY);
  } catch (e) {
    // 消せなくても、もう一度取り消すと同じ記録に戻るだけ
  }
  reloadRecordsFromStorage();
  backupView = { step: 'home', success: '復元する前の記録に戻しました。' };
  renderBackupSheet();
}

// ---- 画面 ----

// 単語の苦手はモードごとの件数、学習済みはどれかのモードで答えた単語の数
function wordCounts(weakByMode, seenByMode) {
  const list = x => (Array.isArray(x) || x instanceof Set ? [...x] : []);
  return {
    words: Object.fromEntries(VOCAB_MODES.map(m => [m, isPlainObject(weakByMode[m]) ? Object.keys(weakByMode[m]).length : 0])),
    seen: new Set(VOCAB_MODES.flatMap(m => list(seenByMode[m]))).size,
  };
}

function currentCounts() {
  const dueCount = data => Object.values(data).filter(isDue).length;
  return {
    ...wordCounts(state.weakByMode, state.seenByMode),
    wordsDue: Object.fromEntries(VOCAB_MODES.map(m => [m, dueCount(state.weakByMode[m])])),
    grammar: Object.keys(state.grammarWeakData).length,
    grammarDue: dueCount(state.grammarWeakData),
  };
}

// 取り消し用に残した記録（保存されている文字列のまま）の件数
function countsFromRaw(records) {
  const parse = raw => {
    try {
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  };
  const words = parse(records[RECORD_KEYS.weakWords]);
  const grammar = parse(records[RECORD_KEYS.weakGrammar]);
  const seen = parse(records[RECORD_KEYS.seenWords]);
  return {
    ...wordCounts(isPlainObject(words) ? words : {}, isPlainObject(seen) ? seen : {}),
    grammar: isPlainObject(grammar) ? Object.keys(grammar).length : 0,
  };
}

function compareTable(leftLabel, rightLabel, left, right, extraRows = '') {
  return `
    <table class="backup-table compare">
      <tr><th></th><th>${leftLabel}</th><th>${rightLabel}</th></tr>
      ${VOCAB_MODES.map(m => `<tr><td>単語の苦手（${MODE_LABELS[m]}）</td><td>${left.words[m]}件</td><td>${right.words[m]}件</td></tr>`).join('')}
      <tr><td>文法の苦手</td><td>${left.grammar}件</td><td>${right.grammar}件</td></tr>
      <tr><td>学習済みの単語</td><td>${left.seen}語</td><td>${right.seen}語</td></tr>
      ${extraRows}
    </table>`;
}

function backupHomeHtml(v) {
  const c = currentCounts();
  const meta = loadJSON(BACKUP_META_KEY, {});
  const undo = loadUndo();
  return `
    ${v.success ? `<div class="backup-msg ok">${escapeHtml(v.success)}</div>` : ''}
    ${v.error ? `<div class="backup-msg ng">${escapeHtml(v.error)}</div>` : ''}
    <div class="guide-label">この端末の学習記録</div>
    <table class="backup-table">
      ${VOCAB_MODES.map(m => `<tr><td>単語の苦手（${MODE_LABELS[m]}）</td><td>${c.words[m]}件（要復習 ${c.wordsDue[m]}件）</td></tr>`).join('')}
      <tr><td>文法の苦手</td><td>${c.grammar}件（要復習 ${c.grammarDue}件）</td></tr>
      <tr><td>学習済みの単語</td><td>${c.seen}語</td></tr>
    </table>
    <div class="backup-note">最後に書き出した日時: ${Number.isFinite(meta.lastExportAt) ? formatDateTime(meta.lastExportAt) : 'まだ書き出していません'}</div>
    <div class="backup-actions">
      <button class="backup-btn primary" data-backup="export">バックアップを書き出す</button>
      ${canShareBackup() ? '<button class="backup-btn" data-backup="share">共有して保存・送る</button>' : ''}
      <button class="backup-btn" data-backup="pick">ファイルから復元…</button>
    </div>
    <!-- accept で絞ると iPhone で .json が選べないことがあるので絞らず、読み込んでから確かめる -->
    <input type="file" id="backup-file" hidden>
    ${undo ? `
      <div class="backup-undo">
        ${formatDateTime(undo.savedAt)} の復元より前の記録を残しています。
        <button class="backup-btn small" data-backup="undo">直前の復元を取り消す</button>
      </div>` : ''}
    <div class="backup-help">
      苦手リスト（復習日を含む。単語はモードごと）・学習済みの単語・設定・出題の続きを1つのファイルに保存します。
      学習済みの単語は、どれかのモードで答えた単語の数です。
      別の端末やブラウザで「ファイルから復元」すると、同じ記録で続けられます。
      記録はこの端末の中にしか無いので、ときどき書き出しておくと安心です。
    </div>`;
}

function backupConfirmHtml(v) {
  const p = v.pending;
  const r = p.records;
  const notes = [];
  if (p.invalid > 0) notes.push(`形の正しくない記録 ${p.invalid}件は読み込みません。`);
  if (p.unknownWords + p.unknownGrammar > 0) {
    notes.push(`今の単語・問題データに無い記録（単語 ${p.unknownWords}件・問題 ${p.unknownGrammar}件）も、消さずに残します。`);
  }
  const fromFile = name => (r[name] === undefined ? 'なし（今のまま）' : 'あり');
  const fileCounts = { ...wordCounts(r.weakWords, r.seenWords), grammar: Object.keys(r.weakGrammar).length };
  return `
    <div class="guide-label">復元するファイル</div>
    <div class="backup-file-name">${escapeHtml(v.fileName)}</div>
    <div class="backup-note">書き出した日時: ${p.exportedAt ? formatDateTime(p.exportedAt) : '不明'}</div>
    ${compareTable('今の記録', 'ファイル', currentCounts(), fileCounts,
      `<tr><td>設定</td><td>あり</td><td>${fromFile('settings')}</td></tr>
       <tr><td>出題の続き</td><td>あり</td><td>${fromFile('session')}</td></tr>`)}
    ${notes.length ? `<ul class="backup-notes">${notes.map(n => `<li>${escapeHtml(n)}</li>`).join('')}</ul>` : ''}
    <div class="backup-msg warn">復元すると、この端末の学習記録はファイルの内容に置き換わります。</div>
    <label class="backup-check"><input type="checkbox" id="backup-pre-export" checked> 復元の前に、今の記録を書き出しておく</label>
    <div class="backup-actions">
      <button class="backup-btn danger" data-backup="restore">復元する</button>
      <button class="backup-btn" data-backup="cancel">やめる</button>
    </div>`;
}

function backupUndoHtml() {
  const undo = loadUndo();
  if (!undo) return backupHomeHtml({ error: '取り消せる復元がありません。' });
  return `
    <div class="guide-label">直前の復元を取り消す</div>
    <div class="backup-note">${formatDateTime(undo.savedAt)} に復元する前の記録に戻します。</div>
    ${compareTable('今の記録', '戻す記録', currentCounts(), countsFromRaw(undo.records))}
    <div class="backup-msg warn">復元したあとに学習した分は、取り消すと消えます。</div>
    <div class="backup-actions">
      <button class="backup-btn danger" data-backup="undo-confirm">取り消す</button>
      <button class="backup-btn" data-backup="cancel">やめる</button>
    </div>`;
}

function renderBackupSheet() {
  const v = backupView;
  let html = '<button class="backup-back" data-backup="back">‹ 苦手リストに戻る</button>';
  if (v.step === 'confirm') html += backupConfirmHtml(v);
  else if (v.step === 'undo') html += backupUndoHtml();
  else html += backupHomeHtml(v);
  document.getElementById('weak-list-content').innerHTML = html;
  const input = document.getElementById('backup-file');
  if (input) input.onchange = onBackupFileChosen;
}

// ファイル選択や共有のあと、バックアップの画面がまだ開いていれば描き直す
function refreshBackupSheet() {
  if (isSheetOpen() && activeSheetRender === renderBackupSheet) renderBackupSheet();
}

async function onBackupFileChosen(e) {
  const input = e.target;
  const file = input.files && input.files[0];
  input.value = ''; // 同じファイルを選び直しても反応するように
  if (!file) return;
  const result = await readBackupFile(file);
  backupView = result.ok
    ? { step: 'confirm', pending: result, fileName: file.name }
    : { step: 'home', error: result.error };
  refreshBackupSheet();
}

function backupEntryHtml() {
  return '<button class="backup-open-btn" data-backup="open">💾 学習記録のバックアップ・復元</button>';
}

function handleBackupAction(action) {
  switch (action) {
    case 'open':
      backupView = { step: 'home' };
      return openSheet('学習記録のバックアップ', renderBackupSheet);
    case 'back':
      return openSheet('苦手リスト', renderWeakList);
    case 'export':
      downloadBackup();
      backupView = { step: 'home', success: '書き出しました。ダウンロードしたファイル（iPhone は「ファイル」アプリ）を保管してください。' };
      return renderBackupSheet();
    case 'share':
      return shareBackup();
    case 'pick':
      return document.getElementById('backup-file').click();
    case 'restore':
      return runRestore();
    case 'undo':
      backupView = { step: 'undo' };
      return renderBackupSheet();
    case 'undo-confirm':
      return runUndo();
    case 'cancel':
      backupView = { step: 'home' };
      return renderBackupSheet();
  }
}

function showToast(message) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  el.textContent = message;
  document.getElementById('app').appendChild(el);
  setTimeout(() => el.classList.add('hide'), 3500);
  setTimeout(() => el.remove(), 4000);
}

// ==================== キーボード操作（PC 向け） ====================
// 1〜4: 選択肢 / 0: わからない / Enter・スペース: 次へ
// カードモード: スペース: めくる / Enter: めくる・覚えた / 1・←: まだ / 2・→: 覚えた
// Esc: 下から出るシートを閉じる

function isShown(el) {
  return el && el.style.display !== 'none' && el.offsetParent !== null;
}

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
  if (document.getElementById('bottom-sheet').classList.contains('open')) {
    if (e.key === 'Escape') closeSheet();
    return;
  }
  const t = e.target;
  if ((t.tagName === 'INPUT' && !t.disabled) || t.tagName === 'TEXTAREA' || t.isContentEditable) return;

  const dk = document.getElementById('dont-know-btn');
  const nextBtn = document.getElementById('next-btn');
  const press = btn => {
    e.preventDefault();
    btn.click();
  };

  if (state.app === 'vocab' && state.mode === 'flash' && document.getElementById('flash-card')) {
    if (e.key === ' ') return press(document.getElementById('flash-card'));
    if ((e.key === '1' || e.key === 'ArrowLeft') && isShown(dk)) return press(dk);
    if ((e.key === '2' || e.key === 'ArrowRight' || e.key === 'Enter') && isShown(nextBtn)) return press(nextBtn);
    return;
  }

  if (/^[1-4]$/.test(e.key)) {
    // 回答前（わからないボタンが出ている間）だけ選択肢を選べる
    const btn = document.querySelectorAll('#choices-container .choice-btn')[Number(e.key) - 1];
    if (btn && isShown(dk)) press(btn);
  } else if (e.key === '0' && isShown(dk)) {
    press(dk);
  } else if ((e.key === 'Enter' || e.key === ' ') && isShown(nextBtn)) {
    press(nextBtn);
  }
});

// ==================== 起動 ====================

restoreSettings();
initFilters();
syncFilterUI();
setApp(state.app);

// 別のタブで復元・取り消しをしたら、古い記録で上書きしないよう読み込み直す
window.addEventListener('storage', e => {
  if (e.key !== RESTORE_STAMP_KEY) return;
  try {
    sessionStorage.setItem(NOTICE_KEY, '別のタブで学習記録が復元されたため、読み込み直しました。');
  } catch (err) {
    // お知らせを出せなくても読み込み直しは行う
  }
  location.reload();
});

try {
  const notice = sessionStorage.getItem(NOTICE_KEY);
  if (notice) {
    sessionStorage.removeItem(NOTICE_KEY);
    showToast(notice);
  }
} catch (e) {
  // sessionStorage が使えなければお知らせを出さないだけ
}

// オフラインでも開けるようにする（ファイルを直接開いたときは使えないので登録しない）
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
