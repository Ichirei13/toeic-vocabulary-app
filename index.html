y": "第2章 動詞問題"}}, {"id": 1089, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "解き方の基本 (Q89)", "q": "The food at the Bluewater Café is both wholesome and tasty, ------- the service is rather slow.", "c": ["also", "or", "but", "through"], "a": 2, "exp": "【解き方の手順】\n① 選択肢をチェック\n選択肢を見ると、それぞれの品詞は以下の通りです。\n(A) also 副詞\n(B) or 接続詞\n(C) but 接続詞\n(D) through 前置詞\nこの選択肢の並びから、「前置詞 or 接続詞」問題だと判断します。\n\n② 文のカタチをチェック\n文頭からカンマまでと空所後が共に、主語（S）と述語動詞（V）を含む節（SV）です。\n2つの節（SV）をつなげるのは、接続詞です。したがって、選択肢中、(B)(C) が正解候補として残り、接続機能を持たない副詞の (A)「また」と、節（SV）を伴わない前置詞の (D)「〜を通して」は正解候補から外れます。\n\n③ 意味のつながりをチェック\n接続詞が2つ残ったので、意味のつながりを考えます。文頭からカンマまでの節は、「Bluewater Café の食事は健康に良くて美味しい」、空所後の節は、「サービスはかなり遅い」です。こうした「プラスとマイナス」の情報をうまくつなげられるのは、(C) but（しかし、だが）です。話の流れを想定と逆方向につなぐので、「逆接」の接続詞と呼ばれます。(B) or は、2つの節をつなぐ場合、「さもなければ」という意味を表すので、ここでは文意が通じません。\n\n和訳: Bluewater Café の食事は健康に良くて美味しいが、サービスはかなり遅い。", "v": [{"word": "wholesome", "meaning": "形 健康に良い"}, {"word": "tasty", "meaning": "形 美味しい"}, {"word": "rather", "meaning": "副 かなり"}], "rule": {"number": 47, "title": "「前置詞 or 接続詞」問題は、「文のカタチ」「意味のつながり」を考える。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1090, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "必修問題 (Q90)", "q": "The Lobster Hut is currently offering discounts on meals ------- off-peak hours at its three locations.", "c": ["while", "otherwise", "during", "afterward"], "a": 2, "exp": "選択肢の並びから、「前置詞 or 接続詞」問題と判断し、文のカタチを見ます。文頭から空所前が節（The Lobster Hut が S、is offering が V）で、空所後は、off-peak hours という名詞のカタマリです（V がないので節ではありません）。空所後の名詞のカタマリと結びつくのは前置詞なので、(C) during（〜の間）が正解です。ここでは、during off-peak hours（ピーク時ではない時間帯に）という副詞のカタマリが、述語動詞 is offering を修飾し、割引が提供されている時間帯を具体的に示しています。(A)「〜する間、〜する一方で」は、節（SV）を伴う接続詞です。during と while の品詞の違いをしっかり頭に入れましょう。(B)「さもなければ」と (D)「その後で」は接続機能がない副詞です。\n\n和訳: Lobster Hut は、現在、3 店舗でピーク時ではない時間帯に食事の割引を提供している。", "v": [{"word": "off-peak hours", "meaning": "ピーク時ではない時間帯、混雑していない時間帯"}], "rule": {"number": 48, "title": "whileは接続詞、duringは前置詞。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1091, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "必修問題 (Q91)", "q": "------- many challenges facing the financial sector, it will probably remain stable for the foreseeable future.", "c": ["Although", "Meanwhile", "However", "Despite"], "a": 3, "exp": "選択肢の並びから、「前置詞 or 接続詞」問題と判断し、文のカタチを見ます。空所後からカンマまでは、名詞のカタマリです（V がないので、節ではありません）。空所後の名詞のカタマリと結びつき、カンマ後の節（SV）に補足情報を加える副詞のカタマリを作るのは前置詞です。選択肢中、前置詞は、(D) Despite（〜にもかかわらず）です。(A)「〜だが」は節（SV）を伴う接続詞です。(B)「その間」と (C)「しかしながら」は、接続機能のない副詞です。\n\n和訳: 金融部門は、直面する多くの困難にもかかわらず、見通せる範囲の将来、おそらく安定を維持するだろう。", "v": [{"word": "challenge", "meaning": "名 困難さ、大変さ"}, {"word": "face", "meaning": "動 直面する"}, {"word": "financial sector", "meaning": "金融部門"}, {"word": "stable", "meaning": "形 安定した"}, {"word": "foreseeable", "meaning": "形 予見可能な"}], "rule": {"number": 49, "title": "although / though / even thoughは接続詞、despite / in spite of / notwithstandingは前置詞。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1092, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "必修問題 (Q92)", "q": "After ten years, the water pump had to be replaced ------- it was no longer working.", "c": ["due to", "unless", "because", "in fact"], "a": 2, "exp": "選択肢の並びから、「前置詞 or 接続詞」問題と判断し、文のカタチを見ます。空所前は、the water pump が主語、had to be replaced が述語動詞の節（SV）です。空所後も、it が S で was working が V の節です（no longer は副詞）。空所には、2つの節をつなぐ接続詞が必要なので、(B)(C) が正解候補です。このうち、「送水ポンプは交換が必要だった」「それはもはや機能していなかった」の2つの節の文脈がうまくつながるのは、(C) because（〜なので）です。(B)「〜しない限り」は文意が通じません。(A)「〜が理由で」は、意味的にはうまくつながりますが、節ではなく名詞（のカタマリ）を伴う前置詞です。(D)「実際」は接続機能のない副詞です。\n\n和訳: 10 年経過し、その送水ポンプは、もはや機能していなかったので、取り換える必要があった。", "v": [{"word": "no longer", "meaning": "もう〜ない"}], "rule": {"number": 50, "title": "接続詞becauseは必ず節(SV)を伴う。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1093, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "必修問題 (Q93)", "q": "------- the funding is approved, Lombard Hospital will remodel its reception and patient waiting area.", "c": ["Once", "Soon", "Only", "That"], "a": 0, "exp": "空所後からカンマまでは、the funding が主語で、is approved が述語動詞の節（SV）、カンマ以降も、Lombard Hospital が S、will remodel が V の節です。したがって、空所には、2つの節をつなぐ接続詞が必要です。選択肢中、2つの節をつなぐ接続詞の機能を持つのは、(A) Once です。once は接続詞の場合、「〜したらすぐに」という意味を表します（as soon as SV に近いイメージです）。(B)「もうすぐ」と (C)「だけ」は副詞です。(D) That は、接続詞の場合、I can't believe that he's only 25. のように、名詞のカタマリ（名詞節）を作ります。that 単独で副詞節は作らない（カンマで2つの節はつなげない）ことに注意しましょう。\n\n和訳: 資金提供が承認されたらすぐに、Lombard 病院は受付と患者の待合室を改装する予定だ。", "v": [{"word": "funding", "meaning": "名 資金提供"}, {"word": "approve", "meaning": "動 承認する"}, {"word": "remodel", "meaning": "動 改装する"}, {"word": "reception", "meaning": "名 受付"}], "rule": {"number": 51, "title": "onceは接続詞としてもPart 5頻出。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1094, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "必修問題 (Q94)", "q": "------- the directors reach an agreement, the company's advertising budget will increase by 1.5 million dollars.", "c": ["Provided that", "Nevertheless", "Regardless of", "In the event of"], "a": 0, "exp": "空所後は、the directors が主語、reach が述語動詞の節（SV）、カンマ後も、the company's advertising budget が S、will increase が V の節です。空所には 2つの節をつなぐ接続詞が必要なので、(A) Provided that（〜するという条件で）が正解です。provided that は、only if の類義表現です。that が省略された provided や、providing (that) でも同じ意味を表します。(B)「それにもかかわらず」は、接続機能のない副詞です。(C)「〜とは無関係に」は、regardless of the weather（天気とは無関係に）のように名詞（のカタマリ）を伴う前置詞です。(D)「〜の場合には」も、in the event of rain（雨の場合には）のように、名詞（のカタマリ）を伴う前置詞です。\n\n和訳: 役員たちが合意に達するという条件で、その会社の宣伝予算は 150 万ドル増える予定だ。", "v": [{"word": "director", "meaning": "名 役員"}, {"word": "reach", "meaning": "動 達する"}, {"word": "agreement", "meaning": "名 合意"}], "rule": {"number": 52, "title": "thatは接続詞の目印。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1095, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "必修問題 (Q95)", "q": "------- authorized by the finance officer, changes cannot be made to the company's financial documents.", "c": ["Unless", "After", "Because", "During"], "a": 0, "exp": "空所後が、authorized という過去分詞です。節（SV）でも名詞（のカタマリ）でもありません。これは、2つの節の主語が同じ場合に、接続詞の直後の「主語＋ be 動詞（ここでは they are）」が省略されたカタチです。選択肢中、直後に過去分詞を伴う接続詞は、(A) Unless（〜しない限り）です。Unless (they are) authorized by the finance officer, changes cannot be made to 〜 .（財務責任者の許可がない限り、〜の変更はできない）という意味です。(B) は、接続詞の場合、after changes are authorized のように節（SV）を伴います。前置詞の場合、after changing the documents のように、動名詞を伴います。過去分詞は伴わないことを頭に入れましょう。(C)「〜なので」は分詞を伴わず、必ず節（SV）が続きます。(D)「〜の間」は名詞（のカタマリ）を伴う前置詞です。\n\n和訳: 財務責任者の許可がない限り、会社の財務書類の変更はできない。", "v": [{"word": "finance officer", "meaning": "財務責任者"}], "rule": {"number": 53, "title": "Part 5で出題される、分詞を伴う接続詞。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1096, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "必修問題 (Q96)", "q": "Mr. Shin asked ------- the office in Düsseldorf could be open by the end of October.", "c": ["in", "whether", "when", "regarding"], "a": 1, "exp": "文頭の Mr. Shin が主語で asked が述語動詞です。空所後も、the office が S、could be が V です。2つの節（SV）をつなぐ接続詞の (C)「〜するとき」が正解候補ですが、空所に入れると文意が通じません。そこで、asked の目的語となる名詞のカタマリ（名詞節）を作る接続詞 (B) whether（〜かどうか）を空所に入れると文意が通ります。ask whether SV で、「S が V するかどうかを尋ねる」という意味です。ask 以外に、determine whether SV（S が V するかどうかを判断する）と inquire whether SV（S が V するかどうかを問い合わせる）も頭に入れましょう。(A)「〜の中」と (D)「〜に関する」は、名詞（のカタマリ）を伴う前置詞です。(C) には、「いつ〜するか」という名詞節を作る疑問詞の用法もありますが、文意が通じません。\n\n和訳: Shin さんは、Düsseldorf のオフィスが 10 月末までにオープンできるかどうかを尋ねた。", "v": [], "rule": {"number": 54, "title": "名詞節を作る接続詞は、whether、if、thatの3つ。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1097, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "実戦問題 (Q97)", "q": "Our employees are generally satisfied with the cafeteria, ------- some wish it would stay open later.", "c": ["notwithstanding", "although", "furthermore", "initially"], "a": 1, "exp": "文頭からカンマまでは、Our employees が主語、are が述語動詞の節（SV）で、空所後も、代名詞 some が S、wish が V の節です（wish の後に接続詞 that が省略されています）。選択肢中、2つの節をつなぐ接続詞は、(B) although（〜だが）です。(A)「〜にもかかわらず」は、名詞（のカタマリ）を伴う前置詞（despite / in spite of の同義語）です。(C)「さらに」と (D)「初めは」は、接続機能のない副詞です。\n\n和訳: 当社の従業員は全体的に社員食堂に満足しているが、もっと遅くまで開いていることを望む者もいる。", "v": [{"word": "generally", "meaning": "副 全体的に"}, {"word": "satisfied", "meaning": "形 満足して"}, {"word": "cafeteria", "meaning": "名 社員食堂"}], "rule": {"number": 49, "title": "although / though / even thoughは接続詞、despite / in spite of / notwithstandingは前置詞。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1098, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "実戦問題 (Q98)", "q": "You should always wear a properly fitted helmet and reflective clothing ------- riding a bicycle.", "c": ["also", "even", "unlike", "while"], "a": 3, "exp": "文頭から空所前は、You が主語、should wear が述語動詞の節（SV）で、空所後が現在分詞 riding です。選択肢中、直後に分詞を伴うことのできる接続詞 (D) while（〜する間）を空所に入れると、「自転車に乗っている間は」と意味が通り、正しい英文が完成します。接続詞 while は、2つの節の主語が同じ場合、直後の「主語＋ be 動詞」をまとめて省略し、分詞を伴うことができます。ここでも、while (you are) riding a bicycle の you are をまとめて省略したカタチです。(A)「も」と (B)「さえ」は接続機能のない副詞です。空所後の riding を動名詞と考え、前置詞の (C)「〜とは違って」を空所に入れると文意が通りません。\n\n和訳: 自転車に乗っている間は、きちんとサイズの合ったヘルメットと、反射材を使った衣類を常に着用すべきだ。", "v": [{"word": "properly", "meaning": "副 きちんと"}, {"word": "fitted", "meaning": "形 体にぴったり合った"}, {"word": "reflective clothing", "meaning": "反射材を使った衣類"}], "rule": {"number": 53, "title": "Part 5で出題される、分詞を伴う接続詞。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1099, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "実戦問題 (Q99)", "q": "------- predictions by biologists, the algae in the lake did not harm any species of fish.", "c": ["Alike", "In the event that", "As if", "In contrast to"], "a": 3, "exp": "空所後からカンマまでが、predictions by biologists（生物学者たちの予想）という名詞のカタマリで、カンマ後は the algae が主語、did not harm が述語動詞の節（SV）です。選択肢中、名詞と結びつき、節に補足情報を加える副詞のカタマリを作る前置詞は、(D) In contrast to（〜に反して）です。(A) は、「よく似た」という形容詞か、「同様に」という副詞です。副詞を用いた X and Y alike（X も Y も同様に）は重要表現です。(B)「〜した場合」と (C)「まるで〜かのように」は、2つの節（SV）をつなぐ接続詞です。\n\n和訳: 生物学者たちの予想に反して、その湖の藻はどの魚類にも害を与えなかった。", "v": [{"word": "prediction", "meaning": "名 予想"}, {"word": "biologist", "meaning": "名 生物学者"}, {"word": "algae", "meaning": "名 藻"}, {"word": "harm", "meaning": "動 害を与える"}, {"word": "species", "meaning": "名 種"}], "rule": {"number": 47, "title": "「前置詞 or 接続詞」問題は、「文のカタチ」「意味のつながり」を考える。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1100, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "実戦問題 (Q100)", "q": "The mannequins at Milstitch Fashions are dressed in matching accessories, ------- scarves and gloves.", "c": ["such as", "moreover", "in addition", "rather"], "a": 0, "exp": "文頭からカンマまでは、The mannequins が主語、are dressed が述語動詞の節（SV）です。空所後が scarves and gloves という名詞のカタマリなので、空所に入るのは前置詞です。選択肢中、前置詞として機能するのは、(A) such as です。「名詞 such as X」のカタチで、「名詞、たとえば X のような」と、空所前の名詞の具体例を示します。(B)「その上」、(C)「加えて」、(D)「むしろ」は、いずれも接続機能のない副詞です。\n\n和訳: Milstitch Fashions にあるマネキンは、スカーフや手袋のようなそろいの装飾品を身に着けている。", "v": [{"word": "matching", "meaning": "形（色、デザイン等が）同じ、そろいの"}, {"word": "scarf", "meaning": "名 スカーフ、マフラー"}, {"word": "glove", "meaning": "名 手袋"}], "rule": {"number": 47, "title": "「前置詞 or 接続詞」問題は、「文のカタチ」「意味のつながり」を考える。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1101, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "実戦問題 (Q101)", "q": "The Yorkdale Clinic introduced online access to test results ------- paper records were occasionally being misplaced.", "c": ["likewise", "since", "concerning", "until"], "a": 1, "exp": "文頭から空所前は、The Yorkdale Clinic が主語、introduced が述語動詞の節（SV）、空所後も、paper records が S、were being misplaced が V の節です。選択肢中、2つの節をつなぐ接続詞は (B)(D) です。意味のつながりを考えると、空所後の、「紙の記録がときどき置き忘れられていた」という状況は、オンラインシステムを導入した理由なので、(B) since（〜なので）が正解です。(D)「〜までずっと」は文意が通じません。(A)「同様に」は接続機能のない副詞、(C)「〜に関する」は名詞（のカタマリ）を伴う前置詞です。\n\n和訳: 紙の記録がときどき置き忘れられていたので、Yorkdale クリニックは、オンラインで検査結果を照会できるようにした。", "v": [{"word": "occasionally", "meaning": "副 たまに"}, {"word": "misplace", "meaning": "動 置き忘れる、誤った場所に置く"}], "rule": {"number": 47, "title": "「前置詞 or 接続詞」問題は、「文のカタチ」「意味のつながり」を考える。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1102, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "実戦問題 (Q102)", "q": "Some roses in the garden bloom only once a year, ------- other varieties do so about every six months.", "c": ["instead of", "only", "by contrast", "whereas"], "a": 3, "exp": "文頭から空所前は、Some roses が主語、bloom が述語動詞の節（SV）、空所後も、other varieties が S、do が V の節なので、空所に入るのは接続詞です。選択肢中、2つの節をつなぐ接続詞は、(D) whereas（〜であるのに対して）です。対照的な内容の節をつなぐフォーマルな接続詞で、Part 5 で頻出します。(A)「〜の代わりに」は名詞（のカタマリ）を伴う前置詞、(B)「だけ」は接続機能のない副詞です。(C)「対照的に」は、文脈はうまくつながりますが、副詞なので、2つの節をつなげられません。\n\n和訳: その庭園にあるバラの一部は年に 1 度しか咲かないが、一方で、約半年ごとに咲く品種もある。", "v": [{"word": "bloom", "meaning": "動 咲く"}, {"word": "every six months", "meaning": "半年ごとに"}], "rule": {"number": 47, "title": "「前置詞 or 接続詞」問題は、「文のカタチ」「意味のつながり」を考える。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1103, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "実戦問題 (Q103)", "q": "------- a reduction in competition, Pancean Airlines decided to raise its ticket prices and baggage fees.", "c": ["After all", "In case", "Only if", "Because of"], "a": 3, "exp": "空所後からカンマまでが、a reduction in competition（競争の減少）という名詞のカタマリで、カンマ後が、Pancean Airlines が主語、decided が述語動詞の節（SV）です。直後の名詞のカタマリと結びつき、節に補足情報を加える副詞のカタマリを作るのは前置詞なので、(D) Because of（〜が理由で）が正解です。同じ「〜が理由で」の意味を表す前置詞として、due to/owing to/on account of も押さえましょう。(A)「結局」は接続機能のない副詞、(B)「〜した場合に備えて」と (C)「〜した場合のみ」は、2つの節をつなぐ接続詞です。\n\n和訳: 競争が減少したので、Pancean 航空は、チケット価格と手荷物運賃を値上げすることに決めた。", "v": [{"word": "reduction", "meaning": "名 減少"}, {"word": "competition", "meaning": "名 競争"}, {"word": "raise", "meaning": "動 上げる"}, {"word": "baggage fee", "meaning": "手荷物運賃"}], "rule": {"number": 50, "title": "接続詞becauseは必ず節(SV)を伴う。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1104, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "実戦問題 (Q104)", "q": "The next monthly meeting will be held on Friday ------- Monday due to the national holiday.", "c": ["except", "instead of", "whereas", "in particular"], "a": 1, "exp": "文頭から空所前が、The next monthly meeting が主語、will be held が述語動詞の節（SV）、空所後が Monday という名詞なので、空所に入るのは前置詞です（due to 以降は副詞のカタマリで修飾語）。前置詞 (A)(B) のうち、(B) instead of（〜の代わりに、〜ではなく）を空所に入れると、「月曜ではなく金曜」となり文意が通ります。(A)「〜を除いて」は、every day except Monday（月曜を除く毎日）のように、例外を示します。(C)「〜であるのに対して」は 2つの節をつなぐ接続詞です。(D)「特に」は接続機能のない副詞です。\n\n和訳: 次の月例会議は、国民の休日のため、月曜日ではなく金曜日に行われます。", "v": [{"word": "due to", "meaning": "〜が理由で"}], "rule": {"number": 47, "title": "「前置詞 or 接続詞」問題は、「文のカタチ」「意味のつながり」を考える。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1105, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "実戦問題 (Q105)", "q": "------- contractor delays, the opening date for Salmon Creek Bridge has been pushed back from November.", "c": ["If", "Owing to", "Therefore", "Given that"], "a": 1, "exp": "空所後の delay には、名詞（遅れ）と動詞（遅らせる、先延ばしにする）の両方の用法があるので、品詞の識別がポイントです。ここでは、可算名詞の単数形 contractor に冠詞等が付いていないことに着目し、前の名詞が後の名詞を形容詞的に修飾する contractor delays（請負業者の遅れ）という「名詞＋名詞」のカタチと判断します。空所には、名詞（のカタマリ）と結びつき、副詞のカタマリを作る前置詞が必要なので、(B) Owing to（〜が理由で）が正解です。(A)「もし〜なら」と (D)「〜を考慮すると」は、節（SV）を伴う接続詞、(C)「したがって」は接続機能のない副詞です。\n\n和訳: 請負業者の遅れのため、Salmon Creek 橋の開通日は、11 月から先送りになった。", "v": [{"word": "contractor", "meaning": "名 請負業者"}, {"word": "delay", "meaning": "名 遅れ"}, {"word": "push back", "meaning": "先送りにする、延期する"}], "rule": {"number": 47, "title": "「前置詞 or 接続詞」問題は、「文のカタチ」「意味のつながり」を考える。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1106, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "実戦問題 (Q106)", "q": "The Sonava Resort will be built in three phases ------- minimize the impact of construction on local traffic.", "c": ["prior to", "in addition to", "contrary to", "in order to"], "a": 3, "exp": "空所後の minimize（〜を最小化する）は原形動詞（-ize は動詞に多い語尾の1つ）です。選択肢中、直後に原形動詞を伴うのは、目的を表す不定詞の (D) in order to（〜するために）です。ここでは、in order to minimize the impact of X on Y で、「X の Y への影響を最小限に抑えるために」という意味です。(A)「〜の前に」、(B)「〜に加えて」、(C)「〜に反して」は、いずれも前置詞です。prior to entering the room（部屋に入る前に）、in addition to the Sonava Resort、contrary to expectations（期待に反して）のように、目的語の動名詞や名詞を伴います。\n\n和訳: Sonava Resort は、工事の地元の交通への影響を最小限に抑えるため、3 段階に分けて建てられる予定だ。", "v": [{"word": "phase", "meaning": "名 段階"}, {"word": "minimize", "meaning": "動 最小化する"}, {"word": "impact of X on Y", "meaning": "Y への X の影響"}], "rule": {"number": 30, "title": "Part 5で注意したいtoの見分け。", "category": "第1章 品詞問題"}}, {"id": 1107, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "実戦問題 (Q107)", "q": "The city widened Burridge River last year, ------- many boaters still find it difficult to access Kingston Port.", "c": ["also", "because", "soon", "yet"], "a": 3, "exp": "空所の前後がどちらも節（SV）なので、空所に入るのは接続詞です。選択肢中、接続詞として機能するのは (B)(D) です。このうち、「市は昨年、川幅を広げた」「港にアクセスするのは難しいと依然として多くの人が思っている」の 2つの節の文脈がうまくつながるのは、(D) yet（しかし）です。yet は、「まだ」の意味の副詞に加えて、この but の意味の等位接続詞の用法も出題例があるので、頭に入れましょう。(B)「〜なので」は文意が通じません。(A)「も」と (C)「もうすぐ」は接続機能のない副詞です。\n\n和訳: 市は昨年、Burridge 川を拡張したが、ボートに乗る多くの人は、Kingston 港にアクセスするのが依然として難しいと感じている。", "v": [{"word": "widen", "meaning": "動 広げる"}, {"word": "boater", "meaning": "名 ボートに乗る人"}], "rule": {"number": 47, "title": "「前置詞 or 接続詞」問題は、「文のカタチ」「意味のつながり」を考える。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1108, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "実戦問題 (Q108)", "q": "To participate in the Frankfurt Health Symposium, please fill out the registration form and ------- proceed to payment.", "c": ["as soon as", "while", "then", "even though"], "a": 2, "exp": "文頭の不定詞 to からカンマまでは、目的を表す副詞のカタマリで修飾語です。カンマ後の節（SV）を見ると、please fill out X and proceed to Y.（X に記入して、Y に進んでください）と、文の要素がそろった命令文です（接続詞 and が 2つの V をつないでいます）。つまり、空所に入るのは修飾語なので、副詞の (C) then（それから、そのとき）が正解です。(A)「〜したらすぐに」、(B)「〜する間、〜する一方で」、(D)「〜だが」は、いずれも 2つの節をつなぐ接続詞で、直後に原形動詞を伴いません。\n\n和訳: Frankfurt 健康討論会に参加するためには、登録用紙に記入し、それからお支払いに進んでください。", "v": [{"word": "participate in", "meaning": "〜に参加する"}, {"word": "symposium", "meaning": "名 討論会"}, {"word": "registration form", "meaning": "登録用紙"}, {"word": "proceed", "meaning": "動 進む"}], "rule": {"number": 47, "title": "「前置詞 or 接続詞」問題は、「文のカタチ」「意味のつながり」を考える。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1109, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "実戦問題 (Q109)", "q": "The construction crew has to complete the first phase of the project ------- moving on to the second.", "c": ["still", "during", "before", "only"], "a": 2, "exp": "文頭から空所前が、The construction crew が主語、has to complete が述語動詞の節（SV）、空所後が名詞のカタマリなので、空所に入るのは前置詞です。選択肢中、前置詞として機能するのは (B)(C) です。このうち、(C) before を空所に入れると、「第 2 工程に進む前に」となり文意が通ります。(B)「〜の間」は、「進んでいることの間」となり文意が通じません。前置詞 during は動名詞を伴わないことも頭に入れましょう。(A)「まだ」と (D)「だけ」は接続機能のない副詞です。\n\n和訳: 建設作業員は、第 2 工程に進む前に、プロジェクトの第 1 工程を完了しなければならない。", "v": [{"word": "construction crew", "meaning": "建設作業員"}, {"word": "phase", "meaning": "名 段階"}, {"word": "move on to", "meaning": "〜に進む"}], "rule": {"number": 47, "title": "「前置詞 or 接続詞」問題は、「文のカタチ」「意味のつながり」を考える。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1110, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "実戦問題 (Q110)", "q": "State-of-the-art equipment is being installed in the factory ------- we can start a new assembly process in June.", "c": ["so that", "although", "rather than", "whenever"], "a": 0, "exp": "空所の前後がどちらも節（SV）で、選択肢に 2つの節をつなぐ接続詞が (A)(B)(D) と 3つあるので、意味のつながりを考えます。「最新式の機器を工場に設置中だ」「6 月に新たな組立工程を始められる」の 2つの節の文脈がうまくつながるのは、(A) so that です。so that S can V のカタチで、「S が V できるように」という意味を表し、「行為 so that 目的」の文脈をつなぎます。接続詞の (B)「〜だが」と (D)「〜するときはいつでも」は意味が通じません。(C)「〜ではなく」は、today rather than tomorrow（明日ではなく今日）のように 2つの語句はつなげますが、節と節はつなげません。\n\n和訳: 我々が 6 月に新たな組立工程を始められるよう、最新式の機器を工場に設置中だ。", "v": [{"word": "state-of-the-art", "meaning": "形 最新式の"}, {"word": "assembly process", "meaning": "組立工程"}], "rule": {"number": 52, "title": "thatは接続詞の目印。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1111, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "実戦問題 (Q111)", "q": "------- the top five historical sites tourists want to see, the amphitheater welcomes the most visitors.", "c": ["When", "Consequently", "Among", "Since"], "a": 2, "exp": "空所後からカンマまでが、the top five historical sites (that) tourists want to see と、目的格の関係代名詞が省略された名詞のカタマリだと見抜くのがポイントです。前置詞 (C)(D) のうち、(C) Among を空所に入れると、「観光客が見たい歴史の名所トップ 5 の中で」となり文意が通ります。among の基本イメージは、「集団の間、中」です。「最も〜な中の 1 つ」の意味で、最上級と相性が良いことも頭に入れましょう。(D)「〜以来」は過去の起点を伴います。(A)「〜するとき」は節をつなぐ接続詞、(B)「結果として」は副詞です。\n\n和訳: 観光客が見たい歴史の名所のトップ 5 の中で、円形競技場が最も来場者数が多い。", "v": [{"word": "historical site", "meaning": "歴史の名所、史跡"}, {"word": "amphitheater", "meaning": "名 円形競技場"}], "rule": {"number": 47, "title": "「前置詞 or 接続詞」問題は、「文のカタチ」「意味のつながり」を考える。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1112, "b": "kin", "ch": 3, "ch_title": "「前置詞 or 接続詞」問題", "th_title": "実戦問題 (Q112)", "q": "------- her contribution to improving Arkney City's transportation network, Ms. Rosenberg would make a good mayor.", "c": ["Given", "Even if", "Since", "As well as"], "a": 0, "exp": "空所後からカンマまでが名詞のカタマリ、カンマ後が節（SV）なので、前置詞の (A)(C)(D) が正解候補です。空所後の「市の交通網の改善への貢献」は、Rosenberg さんが良い市長になるだろうという予想の根拠なので、(A) Given（〜を考えると、〜を考慮に入れると）が正解です。前置詞 given は、considering の類義語で、TOEIC に頻出します。(C) は前置詞の場合、「〜以来」という意味で、since last year のように過去の起点を伴います。(D)「〜に加えて」は、tea as well as coffee（コーヒーに加えてティーも）のように、同等のモノを並べます。(B)「たとえ〜でも」は節（SV）を伴う接続詞です。\n\n和訳: Arkney 市の交通網の改善への貢献を考えると、Rosenberg さんは良い市長になるだろう。", "v": [{"word": "contribution", "meaning": "名 貢献"}, {"word": "transportation network", "meaning": "交通網"}, {"word": "mayor", "meaning": "名 市長、町長"}], "rule": {"number": 47, "title": "「前置詞 or 接続詞」問題は、「文のカタチ」「意味のつながり」を考える。", "category": "第3章 「前置詞 or 接続詞」問題"}}, {"id": 1113, "b": "kin", "ch": 4, "ch_title": "代名詞問題", "th_title": "解き方の基本 (Q113)", "q": "In an effort to reduce costs, ------- have moved our assembly operations to a plant in Ecuador.", "c": ["we", "our", "us", "ourselves"], "a": 0, "exp": "【解き方の手順】\n① 選択肢をチェック\n選択肢に人称代名詞の異なる格が並んでいるので、「格」を問うタイプの代名詞問題です。\n\n② 文のカタチをチェック\n文頭の前置詞 in からカンマまでは修飾語（副詞のカタマリ）です。空所後に述語動詞 have moved があり、主語が欠けています。空所には文の主語が必要なので、主格の (A) we が正解です。所有格の (B)、目的格の (C)、再帰代名詞の (D) はいずれも主語になりません。\n\n【代名詞の格の役割とポイント】\n「格」の問題を解く際は、まず文構造を確認しましょう。その上で、文の主語の位置が空所なら、主格を選びます。目的格・所有格・再帰代名詞は主語になりません。ただし、所有代名詞（「所有格＋名詞」の代わりに用いられる代名詞）は、主語になるので注意が必要です。たとえば、My car is red, and his (= his car) is blue. のようなカタチです。\nまた、格の役割を整理すると以下の通りです。\n・主格：文の主語になります。（They are students.）\n・所有格：名詞の前に置き、「誰の〜」という所有者を示します。（The men are sitting at their desks.）\n・目的格：他動詞や前置詞の目的語になります。（I love them. / I talked to them this morning.）\n・所有代名詞：「所有格＋前に出てきた名詞」の代わりに使われます。（Our house is old, and theirs is new.）\n・再帰代名詞：主語と目的語が同じ場合の目的語や、強調で使われます。（They introduced themselves. / They built the house themselves.）\n\n和訳: コスト削減のため、当社は組み立て業務をエクアドルにある工場に移しました。", "v": [{"word": "in an effort to do", "meaning": "〜するために"}, {"word": "reduce", "meaning": "動 減らす"}, {"word": "assembly", "meaning": "名 組み立て"}, {"word": "operation", "meaning": "名 業務"}, {"word": "plant", "meaning": "名 工場"}], "rule": {"number": 55, "title": "「格」の問題では、主語の位置が空所なら主格を選ぶ。", "category": "第4章 代名詞問題"}}, {"id": 1114, "b": "kin", "ch": 4, "ch_title": "代名詞問題", "th_title": "必修問題 (Q114)", "q": "In Mr. Connolly's absence, queries about the upcoming product launch should be directed to ------- assistant.", "c": ["he", "his", "him", "himself"], "a": 1, "exp": "文のカタチを見ると、queries が主語、should be directed が述語動詞です。続く前置詞 to の目的語の名詞 assistant が空所後にあるので、空所に入るのは修飾語です。選択肢中、名詞 assistant を修飾するのは、所有格の (B) his（彼の）です。所有格は名詞を修飾し、「誰の〜」という意味を表します。ここでは、「彼のアシスタント」という意味です。格の問題では、所有格が最頻出です。「名詞の前は所有格」と頭に入れましょう。(A) は文の主語になる主格、(C) は目的語になる目的格、(D) は再帰代名詞です。いずれも名詞を修飾できません。注意点として、「彼自身のアシスタント」と考えて、再帰代名詞を選んではいけません。「彼自身のアシスタント」は his own assistant です。\n\n【金のルール56のポイント】\n人称代名詞の正しい格を選ぶタイプの問題では、「文の要素がそろっていたら、名詞の前の空所には所有格を選ぶ」のが鉄則です。合わせて、「所有格＋own＋名詞」（〜自身の）の表現も押さえましょう。\nMr. Connolly started his own business.（Connolly さんは彼自身の会社を始めた）\n\n和訳: Connolly さんが不在の間、今度の製品の発売についての問い合わせは、彼のアシスタントの方にしてください。", "v": [{"word": "absence", "meaning": "名 不在"}, {"word": "query", "meaning": "名 問い合わせ"}, {"word": "upcoming", "meaning": "形 今度の"}, {"word": "launch", "meaning": "名 発売"}, {"word": "direct", "meaning": "動 〜の方にする、〜に向ける"}], "rule": {"number": 56, "title": "「格」の問題では、名詞の前の空所には所有格を選ぶ。", "category": "第4章 代名詞問題"}}, {"id": 1115, "b": "kin", "ch": 4, "ch_title": "代名詞問題", "th_title": "必修問題 (Q115)", "q": "In this presentation, I will be explaining where local tourists tend to spend ------- money.", "c": ["their", "our", "its", "my"], "a": 0, "exp": "選択肢がすべて所有格で、いずれも空所後の名詞 money を修飾できます。こうした、人称代名詞の同じ格が選択肢に並んでいるタイプの問題は、空所の代名詞が何の代わりをしているのかを確認して解かなければならないので、厳密には語彙問題です。Part 6 で出題されることが多いのですが、Part 5 でもときどき出題されます。ここでは、お金を使うのは、local tourists（地元の観光客）ですから、local tourists'（地元の観光客の）を言い換えた、複数名詞の所有格 (A) their（彼らの）が正解です。文の主語の I を見て、(D)「私の」を選んではいけません（私が大金持ちで、地元の観光客にお金を渡し、何に使う傾向にあるのかを観察する研究を行っている、といった TOEIC の世界ではありえない特殊な文脈がこの前に必要です）。(B)「私たちの」と (C)「その」も、何を指しているのかが不明で、文意が通じません。\n\n【金のルール57のポイント】\n人称代名詞の同じ格が選択肢に並んでいるタイプの問題は、主に Part 6 で出題されますが、Part 5 でもときどき出題されます。このタイプの問題は、問題文の意味を理解し、空所の代名詞が何の代わりをしているのかをしっかり確認して解くのがポイントです。\n\n和訳: このプレゼンでは、地元の観光客がどこでお金を使う傾向にあるのかについて、ご説明します。", "v": [{"word": "tend to do", "meaning": "〜する傾向にある、〜しがちだ"}], "rule": {"number": 57, "title": "同じ「格」が選択肢に並んでいたら、意味を考える。", "category": "第4章 代名詞問題"}}, {"id": 1116, "b": "kin", "ch": 4, "ch_title": "代名詞問題", "th_title": "必修問題 (Q116)", "q": "Ms. Harper has shown ------- to be a valuable member of the Kressford design team.", "c": ["she", "her own", "hers", "herself"], "a": 3, "exp": "Ms. Harper が主語、has shown が述語動詞で、空所には目的語が必要です。主語と目的語を同一人物と考え、「Harper さんは、自身が〜であることを示してきた」とすれば文意が通るので、再帰代名詞の (D) herself（彼女自身）が正解です。再帰代名詞は、主語と目的語が同じ場合の目的語として用いられます（Ms. Harper bought a gift for herself. のように、再帰代名詞は前置詞の目的語にもなります）。(A) は主語になる主格です。(B) は、her own team（彼女自身のチーム）のように、所有格を強調するカタチで主に用いられます。所有代名詞の (C)「彼女のもの」は、I forgot my pen, so I borrowed hers (= her pen).（ペンを忘れたので、彼女のを借りた）のように、目的語の機能もありますが、ここでは文意が通りません。\n\n【金のルール58のポイント】\n人称代名詞の正しい格を選ぶタイプの問題では、目的語の位置が空所なら、目的格を選ぶのが基本です。この問題のように、主語と目的語が明らかに同じ場合に限り、再帰代名詞を選びましょう。たとえば Ms. Harper asked me to send an e-mail to -------. といった空所には、再帰代名詞を選んではいけません。send の意味上の主語（メールの送信者）は I、受信者は her で異なるので、目的格の her が正解です。フィーリングで再帰代名詞を目的語の位置に選ばないよう注意しましょう。\n\n和訳: Harper さんは、自身が Kressford デザインチームの価値あるメンバーであることを示してきた。", "v": [], "rule": {"number": 58, "title": "空所が目的語なら、主語と同じ場合のみ、再帰代名詞を選ぶ。", "category": "第4章 代名詞問題"}}, {"id": 1117, "b": "kin", "ch": 4, "ch_title": "代名詞問題", "th_title": "必修問題 (Q117)", "q": "It is easy to create a persuasive presentation ------- using the latest software from Multecho Systems.", "c": ["you", "yourself", "your", "yours"], "a": 1, "exp": "文頭から空所前が節（SV）、空所後の現在分詞 using 以降は、その節に補足情報を加える副詞のカタマリ（分詞構文）で、空所がなくても文が成立しています。こうした文の要素がそろったカタチに加え、「（他の誰かではなく）自ら」「（人に頼らず）独力で」という強調の意味を表すのが、再帰代名詞の (B) yourself です。ここでは、「〜を使って、（人に頼らず）ご自身で説得力のあるプレゼンを作るのは簡単です」という意味です。再帰代名詞は、主語と目的語が同じ場合の目的語と、この強調の2つの用法があり、特に強調用法が Part 5 で頻出します。(A) は主格または目的格、(C) は所有格、(D) は所有代名詞です。\n\n【金のルール59のポイント】\n「格」の問題で、文の要素がそろっていたら、空所の位置が名詞の前なら所有格、それ以外の場所なら、「自ら」「独力で」という強調の意味を表す再帰代名詞を選ぶのが基本です。この強調用法の再帰代名詞は、I can do it myself.（私はそれを自分でできます）や Mr. Kato himself attended the event.（加藤さん自ら、そのイベントに出席した）のように、文末や主語の直後にも置かれます。\n\n和訳: Multecho Systems の最新のソフトウェアを使って、説得力のあるプレゼンをご自身で作ることは簡単です。", "v": [{"word": "persuasive", "meaning": "形 説得力のある"}], "rule": {"number": 59, "title": "文の要素がそろい、空所が名詞の前でない場合、再帰代名詞を選ぶ。", "category": "第4章 代名詞問題"}}, {"id": 1118, "b": "kin", "ch": 4, "ch_title": "代名詞問題", "th_title": "必修問題 (Q118)", "q": "Since Mr. Hadley was unable to attend the ceremony, Ms. Andrews accepted the award on ------- behalf.", "c": ["he", "him", "his", "himself"], "a": 2, "exp": "文全体は、Since SV, SV. のカタチです。カンマ後の節を見ると、Ms. Andrews が主語、accepted が述語動詞、the award が目的語で、文の要素がそろっています。前置詞 on 以降は、述語動詞を修飾する副詞のカタマリです。前置詞 on の後には目的語が必要ですが、空所後に behalf という名詞があります。したがって、所有格の (C) his を空所に入れると、on his behalf（彼の代わりに）という表現が完成し、正しい英文になります。名詞 behalf は、on behalf of X（X の代わりに、X を代表して）のカタチで、TOEIC でもスピーチや手紙等で頻出します。この on one's behalf も同じ意味です。behalf は、TOEIC では、この2つの表現でしか出ないので、合わせて頭に入れましょう。主格の (A)、目的格の (B)、再帰代名詞の (D) はいずれも名詞を修飾しません。\n\n【金のルール60のポイント】\n押さえておきたい所有格の定型表現。\n● on one's behalf（〜の代わりに）\nI wrote the letter on her behalf.（彼女の代わりに）\n● on one's own（1人で、独力で）\nMr. Kato traveled to London on his own.（1人で旅行した）\nMs. Sato did it on her own.（独力で行った）\n\n和訳: Hadley さんが祝典に出席できなかったので、Andrews さんが彼の代わりに賞を受け取った。", "v": [{"word": "since", "meaning": "接 〜なので"}, {"word": "accept", "meaning": "動 受け取る、受け入れる"}, {"word": "award", "meaning": "名 賞"}], "rule": {"number": 60, "title": "押さえておきたい所有格の定型表現。", "category": "第4章 代名詞問題"}}, {"id": 1119, "b": "kin", "ch": 4, "ch_title": "代名詞問題", "th_title": "必修問題 (Q119)", "q": "For ------- who wish to enjoy a taste of Thai cuisine, go to the Siam Food Festival this weekend.", "c": ["they", "them", "those", "that"], "a": 2, "exp": "空所には、前置詞 for の目的語の役割をしつつ、主格の関係代名詞 who の先行詞（関係代名詞以降の形容詞のカタマリが後ろから説明する名詞）になる代名詞が必要です。まず、(A)(B) のような人称代名詞は単独で用いられ、修飾語を伴いません。次に、関係代名詞 who の直後の述語動詞 wish に3単現の s が付いていないので、主述が合うのは、複数扱いの代名詞 (C) those です。代名詞 those は、複数形の名詞の代わりに用いられるほか、この those who（〜する人々）のカタチで頻出します。ここでは、those who wish to enjoy a taste of Thai cuisine で、「タイ料理の味を楽しみたい人」という意味です。代名詞の (D) は、単数扱いなので、述語動詞と主述が合いません（wishes と3単現の s が必要です）。また、that は、関係代名詞の先行詞にもなりません（代名詞 that に修飾語が付くのは、The population of Tokyo is larger than that of Osaka. のように、前に出てきた名詞の言い換えとして用いられる場合です）。\n\n【金のルール61のポイント】\nthey/their/them/themselves といった人称代名詞は、単独で用いられ、修飾語を伴いません。選択肢に人称代名詞と代名詞が混在していた場合、空所後が空所に対する修飾語なら、人称代名詞を選ばないようにしましょう。\n\n和訳: タイ料理の味を楽しみたい人は、今週末、Siam フードフェスティバルに行きましょう。", "v": [{"word": "cuisine", "meaning": "名 （特定の国や地域の）料理"}], "rule": {"number": 61, "title": "人称代名詞は修飾語を伴わない。", "category": "第4章 代名詞問題"}}, {"id": 1120, "b": "kin", "ch": 5, "ch_title": "前置詞問題", "th_title": "解き方の基本 (Q120)", "q": "Zappish Online guarantees that orders placed in North America will arrive ------- seven days of shipping.", "c": ["among", "beside", "since", "within"], "a": 3, "exp": "【解き方の手順】\n① 選択肢をチェック\n選択肢をすばやくチェックし、前置詞が並んでいることを確認します。もし、接続詞や副詞がまじっていたら、「前置詞 or 接続詞」問題なので、注意が必要です。\n\n② 意味がうまくつながる前置詞を選ぶ\n文頭から空所前は、「Zappish Online は、北米で出された注文は届くと保証している」、後は「出荷後7日」です。ここに、(D) within（〜以内）を入れると、within seven days of shipping（出荷後7日以内に）となり、注文が届く期間を正しく示すことができます。(A) among（〜の間）は、among customers（お客様の間で）のように「集団」「グループ」を伴います。「〜の間」という和訳に引きずられないようにしましょう。(B) beside（〜のそばに、脇に）は、beside a table（テーブルの脇に）のような位置を表します。(C) since（〜以来）は、since 1960 のように、過去の「起点」を伴います。\n\n③ 時間を浪費しない\nもし、「期間内」を表す within の用法を知らなければ、いくら考えてもこの問題を正解することはできません。その場合は、直感で答えを即決しましょう。TOEIC 対策の勉強をしていると、within 24 hours（24時間以内）や within a week（1週間以内）、within six months（6か月以内）といった表現を至る所で目にします。普段からたくさんの英語に触れて「前置詞感覚」を磨き、直感的に正しい前置詞を選べる上級者を目指しましょう。\n\n【金のルール62のポイント】\n前置詞 within の基本イメージは「範囲内」です。within 24 hours（24時間以内に）のような「期間内」に加えて、within walking distance（徒歩圏内に）、within the budget（予算の範囲内で）、within the company（社内で）、within the organization（組織内で）といったカタチでも用いられます。いずれも「範囲内」が共通イメージです。\n\n和訳: Zappish Online は、北米で出された注文は、出荷後7日以内に届くと保証している。", "v": [{"word": "guarantee", "meaning": "動 保証する"}, {"word": "place an order", "meaning": "注文を出す"}, {"word": "shipping", "meaning": "名 出荷"}], "rule": {"number": 62, "title": "withinの基本イメージは「範囲内」。", "category": "第5章 前置詞問題"}}, {"id": 1121, "b": "kin", "ch": 5, "ch_title": "前置詞問題", "th_title": "必修問題 (Q121)", "q": "The Lilium Giftshop will be open daily from 9:00 A.M. to 7:00 P.M. ------- the holiday season.", "c": ["about", "between", "throughout", "onto"], "a": 2, "exp": "空所前が、「Lilium Giftshop は毎日午前9時から午後7時まで営業します」、後が「休暇シーズン」です。選択肢中、「期間」を伴い、「〜を通してずっと」の意味を表すのが、(C) throughout です。throughout the holiday season で「休暇シーズンを通してずっと」という意味です。(A)「〜について」は、What is indicated about X?（X について何が示されていますか）のように設問文でも頻出します。(B)「〜の間」は、期間を表す場合、between November 30 and January 1（11月30日と1月1日の間）のように、between X and Y のカタチになります。(D)「〜の上に」は、He's climbing onto a roof.（彼は屋根に上ろうとしている）のように、何かの上面に向かう動きを表し、主に Part 1 で出ます。\n\n【金のルール63のポイント】\nthroughout は、「期間」と「場所」を伴う。\nthroughout は、through（〜を通して）に out（完全に）が付き、「期間」や「場所」を伴い、「〜を通してずっと」「〜の至る所で」の意味を表します。Part 5 でも頻出するので、用法を頭に入れましょう。\n● 期間「〜を通してずっと」\nthroughout the day/week/month/year（その日・週・月・年を通してずっと）\n● 場所「〜の至る所で」\nthroughout the country/region/factory（その国・地域・工場の至る所で）\n\n和訳: Lilium Giftshop は、休暇シーズンを通してずっと、毎日午前9時から午後7時まで営業します。", "v": [], "rule": {"number": 63, "title": "throughoutは、「期間」と「場所」を伴う。", "category": "第5章 前置詞問題"}}, {"id": 1122, "b": "kin", "ch": 5, "ch_title": "前置詞問題", "th_title": "必修問題 (Q122)", "q": "------- the direction of Catherine Smith, the Woodlawn Theater has become one of the most exciting venues in Melbourne.", "c": ["Across", "Inside", "Over", "Under"], "a": 3, "exp": "空所後の名詞 direction は、「方向、道順、指示」といったさまざまな意味を表す多義語です。ここでは、「Catherine Smith の監督（向かうべき道筋を示すこと）」といった意味です。この名詞 direction の前に置き、「監督下で」という意味を表す前置詞が、(D) Under です。under the direction of X（Xの監督下で、Xの指示の下で）は重要表現です。(A) は「何かを横切る」イメージで、across the street（通りの向こう側に）のように用いられます。(B) は「内側」が基本イメージで、inside the building（建物内で）のように用いられます。(C) は虹のような「上の円弧」が基本イメージで、特に、over the last five years（この5年間にわたって）のような「期間」を表すカタチで頻出します。\n\n【金のルール64のポイント】\nunder の基本イメージは「下」。\n● 下の位置：under a bridge（橋の下）\n● 〜より下：under 18 years old（18歳未満）\n● 状況下：under construction（工事中）、under renovation（改装中）、under review（検討中）、under certain circumstances（特定の状況下）\n● 影響下：under contract（契約期間中）、under warranty（保証期間中）\n● その他：under Mr. Kato's leadership（〜のリーダーシップの下で）\n\n和訳: Catherine Smith の監督下で、Woodlawn 劇場は、Melbourne で最も刺激的な会場の1つとなった。", "v": [{"word": "direction", "meaning": "名 監督、指示、方向"}, {"word": "venue", "meaning": "名 会場"}], "rule": {"number": 64, "title": "underの基本イメージは「下」。", "category": "第5章 前置詞問題"}}, {"id": 1123, "b": "kin", "ch": 5, "ch_title": "前置詞問題", "th_title": "必修問題 (Q123)", "q": "The Pennington Company processes recycled glass and plastic ------- various products.", "c": ["along", "into", "before", "beyond"], "a": 1, "exp": "The Pennington Company が主語、processes（〜を加工する）が述語動詞、recycled glass and plastic（リサイクルされたガラスとプラスチック）が目的語で、空所後の various products（さまざまな製品）は、目的語の加工後の姿です。こうした「変化」を表す前置詞が (B) into で、process X into Y で「Xを加工して Y にする」という意味です。into は「〜の内部へ」というイメージから派生して、「変化」を表します。(A)「〜に沿って」は、along the street（通りに沿って）や along the river（川沿いに）のように「細長いものに沿って」が基本イメージです。(C)「〜の前に」は、before processing X into Y（X を Y に加工する前に）といった動名詞を伴う形も重要です。(D)「〜を超えて」は、beyond the river（川の向こう側）、beyond 2021（2021年以降）、beyond repair（修理の範囲を超えて⇨修理不可能な）といったカタチで用いられます。\n\n【金のルール65のポイント】\ninto は「変化」を表す。\ninto は、「〜の内部へ」というイメージから派生して、「変化」を表します。\n● The rain changed/turned into snow.（変わる）\n● I translated the e-mail into Japanese.（翻訳する）\n● They transformed a train station into a museum.（一変させる）\n● They converted the building into a warehouse.（改築する）\n\n和訳: Pennington 社は、リサイクルされたガラスやプラスチックを加工して、さまざまな製品にします。", "v": [{"word": "process", "meaning": "動 加工する、処理する"}, {"word": "various", "meaning": "形 さまざまな"}], "rule": {"number": 65, "title": "intoは「変化」を表す。", "category": "第5章 前置詞問題"}}, {"id": 1124, "b": "kin", "ch": 5, "ch_title": "前置詞問題", "th_title": "必修問題 (Q124)", "q": "------- the next few weeks, the Vesmar Group will be holding various events to mark its centennial anniversary.", "c": ["Over", "From", "By", "At"], "a": 0, "exp": "空所後は、the next few weeks（次の数週間）という期間です。選択肢中、期間を伴い、「〜にわたって」という意味を表す前置詞が (A) Over です。前置詞 over の基本イメージは、虹の架け橋のような「上の円弧」です。特に、over the last five years（過去5年にわたって）や over the past year（過去1年にわたって）といった期間を表すカタチで頻出します。(B) は、from Monday to Friday（月曜から金曜まで）といったカタチで時の「起点」を示します。期間は伴わないので注意しましょう。(C) は、by Friday（金曜までには）のような「期限」、go by train（電車で行く）のような「手段」、increase by 20%（20%増）のような「差」を表す用法等が重要です。(D) は、The show starts at 6 P.M. や The event will be held at the Vesmar Hotel. のように、時の流れや地図上の「点」を示します。\n\n【金のルール66のポイント】\nover の基本イメージは「虹の架け橋」。\nover の基本イメージは、虹の架け橋のような「上の円弧」です。\n● We have worked hard over the past year.（過去1年間）\n● I was interviewed over the phone.（電話越しで）\n● I have traveled all over the world.（世界中を）\n● I have looked over the report.（ざっと）\n\n和訳: 次の数週間にわたって、Vesmar グループは、100 周年を記念するさまざまなイベントを行う予定だ。", "v": [{"word": "hold", "meaning": "動 （イベント等を）行う"}, {"word": "mark", "meaning": "動 記念する"}, {"word": "centennial", "meaning": "形 100年の"}, {"word": "anniversary", "meaning": "名 記念日"}], "rule": {"number": 66, "title": "overの基本イメージは「虹の架け橋」。", "category": "第5章 前置詞問題"}}, {"id": 1125, "b": "kin", "ch": 5, "ch_title": "前置詞問題", "th_title": "必修問題 (Q125)", "q": "------- the three menu items on special today, the most popular is the turkey sandwich with tomato soup.", "c": ["Toward", "Of", "As", "Without"], "a": 1, "exp": "空所に前置詞 (B) Of を入れると、「3つのメニューの品のうちで、最も人気なのは〜」となり文意が通ります。前置詞 of は、最上級と合わせて用いられ、「〜のうちで1番」の意味を表します。He is the tallest of the three.（3人のうちで1番背が高い）や、This is the busiest time of the year.（1年のうちで最も忙しい時期）といったカタチです。(A)「〜に向かって」は、walk toward a door（ドアに向かって歩く）や、the first step toward becoming a teacher（先生になるための最初の一歩）のように、「方向」や「方向性」、「用途」を表します。(C) は、前置詞の場合、「〜として」という意味を表し、as a result（結果として）や as a token of our appreciation（我々の感謝の印として）は重要表現です。(D) は、without permission（許可なしに）、without written consent（書面による同意なしに）といったカタチで、「〜なしに」の意味を表します。\n\n【金のルール67のポイント】\nof は「全体の一部」を表す。\nof の多岐に渡る用法の1つが、この問題で取り上げた「一部 of 全体」です。全体から一部を取り出すイメージで覚えましょう。\n● He is a member of the marketing team.\n● The store is in the center of the city.\n● The restaurant will be open at the beginning of April.\n\n和訳: 今日の特別料理の3つのメニューの品のうち、1番人気は、トマトスープ付きの七面鳥のサンドイッチです。", "v": [{"word": "special", "meaning": "名 特別料理"}], "rule": {"number": 67, "title": "ofは「全体の一部」を表す。", "category": "第5章 前置詞問題"}}, {"id": 1126, "b": "kin", "ch": 5, "ch_title": "前置詞問題", "th_title": "必修問題 (Q126)", "q": "------- entering the facility, Mr. Morris showed his security badge to the guard by the door.", "c": ["During", "Until", "From", "Upon"], "a": 3, "exp": "選択肢中、動名詞を伴い、「〜したらすぐに」の意味を表すのが、(D) Upon です。upon entering the facility で、「施設に入ったらすぐに」という意味です。前置詞 upon は、on のフォーマルなカタチです（ここでも On に置き換え可能です）。前置詞 on の基本イメージは「接触」で、ある行為や出来事に触れた途端に何かが起こるイメージです。upon arrival（到着時に）のように名詞を伴うカタチも頻出します。(A)「〜の間」と (B)「〜までずっと」は、動名詞を伴いません。どちらも、during the summer（夏の間）や until the end of the week（週末までずっと）のように、「期間」や「終点」を伴います。動作や行為を表す動名詞を目的語にとらないので注意しましょう。(C) は「起点」から離れていくイメージを持ちます。したがって、prevent X from doing（Xが〜することを防ぐ）や refrain from doing（〜することを控える）のように、「〜させない・しない」意味を持つ動詞と相性がよいことも頭に入れましょう。\n\n【金のルール68のポイント】\nupon は、「〜したらすぐに、〜時に」の意味で頻出。\n前置詞 upon は、「〜したらすぐに」の意味で動名詞を伴うカタチに加えて、「〜時に」の意味で名詞を伴うカタチも重要です。\n● upon arrival（到着時に）、upon check-in（チェックイン時に）、upon completion（完了時に）、upon delivery（配達時に）、upon receipt（受け取り時に）、upon reservation（予約時に）\n\n和訳: 施設に入ったらすぐに、Morris さんは、ドアのそばの警備員に身分証明書を見せた。", "v": [{"word": "security badge", "meaning": "身分証明書"}], "rule": {"number": 68, "title": "uponは、「〜したらすぐに、〜時に」の意味で頻出。", "category": "第5章 前置詞問題"}}, {"id": 1127, "b": "kin", "ch": 5, "ch_title": "前置詞問題", "th_title": "必修問題 (Q127)", "q": "The building inspector confirmed the factory had been constructed ------- government regulations.", "c": ["in order of", "in accordance with", "in line for", "in place of"], "a": 1, "exp": "選択肢がすべて前置詞のカタマリ（群前置詞）なので、意味を考えます。文頭から空所までが、「建築検査官は工場が建てられたことを確認した」で、空所後は「政府の規制」です。選択肢中、「（ルールや条件等）に従って」という意味の (B) in accordance with を空所に入れると、「政府の規制に従って」となり、前後の文脈が正しくつながります。(A)「〜順に」は in order of priority（優先度順に）、(C)「〜の候補で」は You are next in line for promotion.（あなたは次の昇進候補です）、(D)「〜の代わりに」は、work in place of Mr. Kato（Kato さんの代わりに働く）のように用いられます。\n\n【金のルール69のポイント】\n熟語の問題は考え込まない。\n熟語の問題は知らないと解けないので、時間を浪費しないようにしましょう。「（ルールや条件等）に従って、則って」の類義表現で、TOEIC に出る群前置詞は以下の通りです。\n● according to the rules（規則に従って）\n● in accordance with the terms of the contract（契約条件に従って）\n● in compliance with the law（法律を順守して）\n● in keeping with tradition（伝統に則って）\n● in observance of the national holiday（国民の休日を順守して）\n\n和訳: 建築検査官は、その工場が、政府の規制に従って建てられたことを確認した。", "v": [{"word": "inspector", "meaning": "名 検査官"}, {"word": "government regulation", "meaning": "政府の規制"}], "rule": {"number": 69, "title": "熟語の問題は考え込まない。", "category": "第5章 前置詞問題"}}, {"id": 1128, "b": "kin", "ch": 6, "ch_title": "関係詞問題", "th_title": "解き方の基本 (Q128)", "q": "Sprinklex will get rid of those stubborn carpet stains ------- seem impossible to remove.", "c": ["who", "they", "that", "whose"], "a": 2, "exp": "解き方の手順\n① 選択肢をチェック\n関係代名詞として機能する who, that, whose と、人称代名詞の they が並んでいます。\n② 文のカタチをチェック\n文のカタチを見ると、空所前は、文の要素がそろったカタチで、空所以降が、stains (染み) という名詞を後ろから説明する形容詞のカタマリです。したがって、空所に入るのは、名詞に後ろから形容詞節をつなぐ関係代名詞です。接続機能を持たない人称代名詞の (B) they は正解候補から外れます (SVSV と、1 つの文に SV が 2 つになり、文が成立しません)。\n③ 先行詞をチェック\n先行詞が、stains (染み) という「人以外」なので、「人」が先行詞の (A) who は正解候補から外れます (仮に stains の意味がわからなければ、文脈から、「人以外」であろうと推測します)。\n④ 空所後のカタチをチェック\n最後に、空所後のカタチを見ると、述語動詞 seem の主語が欠けています。つまり、空所に入るのは「主格」の関係代名詞なので、(C) that が正解です。「染み⇐取り除くのが不可能に思える」と、先行詞 stains をくわしく説明する形容詞のカタマリを作っています。(D) は直後に名詞を伴う所有格の関係代名詞です。\n\n和訳: Sprinklex は、取り除くのが不可能に思える頑固なカーペットの染みも取り除く。", "v": [{"word": "get rid of ~", "meaning": "〜を除去する"}, {"word": "stubborn", "meaning": "形 頑固な"}, {"word": "stain", "meaning": "名 染み"}, {"word": "remove", "meaning": "動 取り除く"}], "rule": {"number": 70, "title": "関係代名詞の問題は、「先行詞」と「空所後のカタチ」がポイント。", "category": "第6章 関係詞問題"}}, {"id": 1129, "b": "kin", "ch": 6, "ch_title": "関係詞問題", "th_title": "必修問題 (Q129)", "q": "Eight businesses sell antique toys in the Monroe Building, all of ------- are on its seventh floor.", "c": ["whose", "them", "which", "they"], "a": 2, "exp": "選択肢中、関係代名詞の機能を持つのが (A)(C)、人称代名詞が (B)(D) です。こうした関係代名詞と普通の代名詞が選択肢に混在する問題を解く際は、空所の前後だけではなく、必ず文全体のカタチを確認しましょう。まず、文頭からカンマまでは文の要素がそろったカタチです。次に、カンマ以降の「すべて7階にある」は、文頭の主語 Eight businesses を説明する形容詞のカタマリです。したがって、先行詞 businesses に形容詞節をつなぐ関係代名詞の (A)(C) が正解候補です。人称代名詞の (B)(D) は接続機能がなく、空所に入れると 1 つの文に SV が 2 つになり、文が成立しません (前後をつなぐには接続詞が必要です)。次に、空所部分のカタチを確認すると、前置詞 of の目的語が欠けているので、目的格の (C) which が正解です。所有格の (A) は、直後に名詞を伴い、「誰の〜」という意味を表します。なお、関係代名詞の先行詞は、直前の名詞とは限りません。この問題文のように、離れた位置にある場合もあるので、しっかり確認しましょう。\n\n和訳: Monroe Building にはアンティーク玩具を販売する 8 つの店があり、それらはすべて 7 階にある。", "v": [], "rule": {"number": 71, "title": "関係代名詞と普通の代名詞の文法的な違いに注意。", "category": "第6章 関係詞問題"}}, {"id": 1130, "b": "kin", "ch": 6, "ch_title": "関係詞問題", "th_title": "必修問題 (Q130)", "q": "Aloganics is a business ------- products are healthier than ice creams made by other manufacturers.", "c": ["what", "whose", "which", "when"], "a": 1, "exp": "選択肢に関係詞が並んでいる問題を解く際は、空所の前後で2文に分けて考えるのが基本です。まず、Aloganics is a business. は文の要素がそろったカタチです。空所後も、products are healthier than 〜. のカタチで、主語や目的語は欠けていません。関係代名詞の (A)(C) は、主語や目的語が欠けたカタチが後に続くので、正解候補から外れます。次に、先行詞 business を、所有格 its (その) に変えて、後ろの節に入れると、Its products are healthier than 〜. となり、文が成立します。したがって、所有格の関係代名詞 (B) whose が正解です。「会社⇐その製品が他のメーカーが作るアイスクリームよりヘルシーな」と、先行詞の business に後ろから形容詞のカタマリ (形容詞節) をつないでいます。接続詞の (D)「〜するとき」を空所に入れると文意が通じません。\n\n和訳: Aloganics の製品は、他のメーカーが作るアイスクリームよりヘルシーだ。", "v": [], "rule": {"number": 72, "title": "関係詞の問題は、2文に分けて考えるのが基本。", "category": "第6章 関係詞問題"}}, {"id": 1131, "b": "kin", "ch": 6, "ch_title": "関係詞問題", "th_title": "必修問題 (Q131)", "q": "Madras & Associates specializes in ------- that help clients optimize workplace efficiency and profitability.", "c": ["strategy", "strategic", "strategically", "strategies"], "a": 3, "exp": "選択肢を見ると、一見、関係代名詞とは無関係な品詞問題に思えますが、そうではありません。まず、空所には、前置詞 in の目的語となる名詞が必要なので、(A)(D) が正解候補です。次に、空所後の that に注目します。直後に述語動詞 help が続いているので、この that は主格の関係代名詞 (「名詞 that V」のカタチの that は主格の関係代名詞) で、空所が先行詞です。主格の関係代名詞の先行詞と、直後の述語動詞との間には SV の関係があり、主述が一致します。ここでは、現在形の述語動詞 help に 3 単現の s が付いていないので、先行詞は複数形の名詞です。したがって、(D) strategies (戦略) が正解です。単数形の (A) は主述が合いません。(B)「戦略的な」は形容詞、(C)「戦略的に」は副詞です。\n\n和訳: Madras & Associates は、顧客が職場の効率と利益性を最適化するのに役立つ戦略を専門にしている。", "v": [{"word": "specialize", "meaning": "動 専門にする"}, {"word": "optimize", "meaning": "動 最適化する"}, {"word": "efficiency", "meaning": "名 効率"}, {"word": "profitability", "meaning": "名 利益性"}], "rule": {"number": 73, "title": "主格の関係代名詞の先行詞と、直後の述語動詞は主述が一致する。", "category": "第6章 関係詞問題"}}, {"id": 1132, "b": "kin", "ch": 6, "ch_title": "関係詞問題", "th_title": "必修問題 (Q132)", "q": "------- who has not yet registered for the Virtual Energy Forum should do so by the end of today.", "c": ["Those", "Other", "They", "Anyone"], "a": 3, "exp": "まず、空所には、直後の主格の関係代名詞 who の先行詞になる「人」を表す代名詞が必要なので、(A)(D) が正解候補です。(B)「他の」は形容詞で、other forums (他の討論会) のように名詞を修飾します。人称代名詞の (C) は単独で用いられ、関係代名詞を伴いません。次に、主格の関係代名詞 who の直後の述語動詞を見ると、has not registered と、3単現の s が付いています。つまり、先行詞は単数名詞なので、単数扱いの代名詞 (D) Anyone (誰でも) が正解です。Anyone who has not 〜で、「まだ〜していない人は誰でも」という意味です。(A) Those は複数扱いなので、Those who have not 〜のカタチでないと主述が合いません (those は that の複数形です)。本試験で類題が出たら、who を見て反射的に those を選ばず、必ず述語動詞のカタチを確認しましょう。\n\n和訳: Virtual Energy Forum にまだ登録していない人は、今日中にそうしてください。", "v": [], "rule": {"number": 74, "title": "代名詞のthoseは複数扱い。", "category": "第6章 関係詞問題"}}, {"id": 1133, "b": "kin", "ch": 6, "ch_title": "関係詞問題", "th_title": "必修問題 (Q133)", "q": "The supermarket owner's decision to close the business disappointed ------- who live in the neighborhood.", "c": ["everyone", "many", "another", "nobody"], "a": 1, "exp": "The supermarket owner's decision が主語で、disappointed が過去形の述語動詞です。空所には、他動詞 disappointed (〜を落胆させた) の目的語の代名詞が必要です。選択肢は、すべて代名詞の機能を持ち、空所後の主格の関係代名詞 who の先行詞の「人」を表すことができます。主格の関係代名詞の先行詞と、直後の述語動詞との間には SV の関係があるので、who の後を見ると、現在形の述語動詞 live に 3 単現の s が付いていません。したがって、主述が一致するのは、複数扱いの代名詞 (B) many (多くの人) です。many は、この「多数の人、多数のモノ」を表す代名詞としても頻出します。(A)「全員」、(C)「もう一人」、(D)「誰も〜ない」は単数扱いなので、everyone/another/nobody who lives in the neighborhood と、述語動詞に 3 単現の s が必要です。\n\n和訳: 店を閉めるという、そのスーパーのオーナーの決定は、地域住民の多くを落胆させた。", "v": [{"word": "disappoint", "meaning": "動 落胆させる"}, {"word": "neighborhood", "meaning": "名 (市や町の) 地域"}], "rule": {"number": 75, "title": "注意が必要なmanyとmuchの用法。", "category": "第6章 関係詞問題"}}, {"id": 1134, "b": "kin", "ch": 6, "ch_title": "関係詞問題", "th_title": "必修問題 (Q134)", "q": "Please fill out the customer satisfaction survey and leave it with ------- is working at the front desk.", "c": ["those", "who", "anyone", "whoever"], "a": 3, "exp": "選択肢中、直後に述語動詞を伴いつつ、前置詞 with の目的語となる名詞のカタマリ (名詞節) を作るのは、複合関係代名詞の (D) whoever (〜する人は誰でも = anyone who) です。ここでは、whoever (= anyone who) is working at the front desk で、「受付で働いている人なら誰でも」という意味です。whoever は、先行詞を中に含みつつ、文の主語や目的語になる名詞節を作ります (先行詞は不要です)。(A)「人々」と (C)「誰でも」は代名詞で、空所に入れると、前置詞 with の後に SV が続くカタチになり、文が成立しません。主格の関係代名詞 (B) who は、leave it with anyone who 〜のように、「人」を表す先行詞が必要です。\n\n和訳: 顧客満足度調査にご記入いただき、受付で働いている者に預けてください。", "v": [{"word": "fill out", "meaning": "〜に記入する"}, {"word": "survey", "meaning": "名 調査"}], "rule": {"number": 76, "title": "thoseとanyone、whoeverの文法的な違いに注意。", "category": "第6章 関係詞問題"}}, {"id": 1135, "b": "kin", "ch": 6, "ch_title": "関係詞問題", "th_title": "必修問題 (Q135)", "q": "Much of the redecorating was done in the room ------- Mr. Wilson often has tea with his friends.", "c": ["where", "which", "what", "whose"], "a": 0, "exp": "文頭から空所前が節 (SV) で、空所後は、Mr. Wilson が主語、has が述語動詞、tea が目的語と、文の要素がそろったカタチです。選択肢中、先行詞の「場所」に、後ろから文の要素がそろったカタチをつなげるのは、関係副詞の (A) where です。「部屋⇐Wilson さんがよく友人とお茶を飲む」と、room という先行詞を説明する形容詞のカタマリ (形容詞節) を作っています。関係副詞は、Mr. Wilson often has tea with his friends there. のように、後に続く形容詞節の中で、先行詞が副詞の役割をします。関係代名詞の (B)(C)(D) は、主語・目的語・所有格が欠けたカタチが続きます。\n\n和訳: 模様替えの多くは、Wilson さんがよく友人とお茶を飲む部屋で行われた。", "v": [{"word": "redecorating", "meaning": "名 模様替え"}], "rule": {"number": 77, "title": "関係代名詞の後は「不完全」、関係副詞の後は「完全」なカタチが続く。", "category": "第6章 関係詞問題"}}, {"id": 1136, "b": "kin", "ch": 6, "ch_title": "関係詞問題", "th_title": "実戦問題 (Q136)", "q": "The president only wants to hear the opinions of managers ------- work closely with employees.", "c": ["they", "whose", "those", "who"], "a": 3, "exp": "文頭から空所前が節 (SV)、空所後が述語動詞 work で主語が欠けています。空所に主格の関係代名詞 (D) who を入れると、managers who work closely with employees (管理職⇐従業員と密に仕事をしている) と、先行詞 managers を説明する形容詞のカタマリができて正しい英文が完成します。所有格の関係代名詞の (B) は、managers whose work is 〜のように、直後に名詞を伴います。代名詞の (A)(C) は、接続詞無しで前後をつなげません。\n\n和訳: 社長が聞きたいのは、従業員と密に仕事をしている管理職の意見だけだ。", "v": [{"word": "opinion", "meaning": "名 意見"}, {"word": "closely", "meaning": "副 密に"}], "rule": {"number": 70, "title": "関係代名詞の問題は、「先行詞」と「空所後のカタチ」がポイント。", "category": "第6章 関係詞問題"}}, {"id": 1137, "b": "kin", "ch": 6, "ch_title": "関係詞問題", "th_title": "実戦問題 (Q137)", "q": "At the awards banquet, Mr. Santiago expressed his gratitude to Professor Mary Cho, ------- help in his research was invaluable.", "c": ["that", "whose", "her", "who"], "a": 1, "exp": "空所前が節 (SV) で、空所以降が Mary Cho という人物の説明です。まず、人称代名詞の (C) は、接続詞無しで前後をつなげないので、正解候補から外れます。残る選択肢は、関係代名詞として、先行詞の「人」を後ろから説明する形容詞節を作れるので、空所で 2 文に分けて考えます。先行詞の Mary Cho を所有格の Her に変えて空所に入れると、Her help in his research was invaluable. と正しい英文が完成するので、所有格の (B) whose が正解です。主格・目的格の (A) は主語または目的語、主格の (D) は主語が欠けたカタチが続きます。\n\n和訳: 受賞夕食会で、Santiago さんは、その助けが彼の研究において計り知れない価値があった Mary Cho 教授に対し、感謝の意を表した。", "v": [{"word": "awards banquet", "meaning": "受賞夕食会"}, {"word": "express", "meaning": "動 表す"}, {"word": "gratitude", "meaning": "名 感謝"}, {"word": "invaluable", "meaning": "形 計り知れない価値がある"}], "rule": {"number": 72, "title": "関係詞の問題は、2文に分けて考えるのが基本。", "category": "第6章 関係詞問題"}}, {"id": 1138, "b": "kin", "ch": 6, "ch_title": "関係詞問題", "th_title": "実戦問題 (Q138)", "q": "An ancient myth was the theme that Erica Akin returned to ------- during her years as a watercolor artist.", "c": ["repeat", "repetition", "repeatable", "repeatedly"], "a": 3, "exp": "関係代名詞がポイントの品詞問題です。目的格の関係代名詞 that の前後で 2 文に分けて考えます。that の先行詞 theme を代名詞 it に変え、関係詞節の前置詞 to の目的語の位置に戻します。Erica Akin returned to it -------. この空所に入れて正しい文が成立するのは、述語動詞 returned を修飾する副詞の (D) repeatedly (たびたび) です。「テーマ⇐Sがたびたび立ち返った」と、that 以降が theme を説明する形容詞節を作っています。(A) は「繰り返す」という動詞か「再発」という名詞、(B)「繰り返し」は名詞、(C)「繰り返し可能な」は形容詞です。いずれも空所に入れると文が成立しません。\n\n和訳: 古代の神話は、Erica Akin が、水彩画家としての長年の間にたびたび立ち返るテーマだった。", "v": [{"word": "ancient", "meaning": "形 古代の"}, {"word": "myth", "meaning": "名 神話"}, {"word": "theme", "meaning": "名 テーマ"}, {"word": "watercolor artist", "meaning": "水彩画家"}], "rule": {"number": 72, "title": "関係詞の問題は、2文に分けて考えるのが基本。", "category": "第6章 関係詞問題"}}, {"id": 1139, "b": "kin", "ch": 6, "ch_title": "関係詞問題", "th_title": "実戦問題 (Q139)", "q": "Mr. Miller has joined the awards committee, ------- consists of eight distinguished scholars in the field of chemistry.", "c": ["it", "which", "that", "what"], "a": 1, "exp": "空所前が節 (SV)、後が述語動詞 consists で主語が欠けています。空所に主格の関係代名詞 (B) which を入れると、「表彰委員会⇐〜で構成される」と、先行詞 the awards committee を補足説明する形容詞のカタマリができ、正しい英文が完成します。注意点として、関係代名詞の (C) that は、直前にカンマを置いたこのカタチでは用いられません。「カンマの後に関係代名詞の that は置けない」と頭に入れましょう。(A) は接続機能のない代名詞です。関係代名詞の (D) は先行詞が不要で、名詞のカタマリを作ります。\n\n和訳: Miller さんは、化学の分野の著名な 8 名の学者で構成される表彰委員会に加わった。", "v": [{"word": "awards committee", "meaning": "表彰委員会"}, {"word": "consist of ~", "meaning": "〜で構成される"}, {"word": "distinguished", "meaning": "形 著名な、名高い"}, {"word": "scholar", "meaning": "名 学者"}, {"word": "chemistry", "meaning": "名 化学"}], "rule": {"number": 70, "title": "関係代名詞の問題は、「先行詞」と「空所後のカタチ」がポイント。", "category": "第6章 関係詞問題"}}, {"id": 1140, "b": "kin", "ch": 6, "ch_title": "関係詞問題", "th_title": "実戦問題 (Q140)", "q": "When Mr. Robinson applied for a building permit, he provided a document that ------- that he owns the land.", "c": ["proves", "proving", "is proved", "to prove"], "a": 0, "exp": "文全体は、When SV, SV. のカタチです。カンマ後の節 (SV) を見ると、he provided a document までが文の要素がそろったカタチで、直後の that は主格の関係代名詞です。主格の関係代名詞の直後には V が続くので、(A)(C) が正解候補です。空所後に that he owns the land という目的語になる that 節 (この that は接続詞) が続いているので、能動態の (A) proves (証明する) が正解です。「書類⇐彼がその土地を所有していることを証明する」と、関係代名詞 that 以降が、先行詞 document の内容を説明する形容詞節を作っています。受動態の (C) は目的語を伴いません。(B) は現在分詞・動名詞、(D) は不定詞で、どちらも V にならないカタチです。\n\n和訳: Robinson さんは、建築許可証を申請した際、彼がその土地を所有していることを証明する書類を提供した。", "v": [{"word": "apply for ~", "meaning": "〜を申請する"}, {"word": "building permit", "meaning": "建築許可証"}, {"word": "provide", "meaning": "動 提供する"}], "rule": {"number": 73, "title": "主格の関係代名詞の先行詞と、直後の述語動詞は主述が一致する。", "category": "第6章 関係詞問題"}}, {"id": 1141, "b": "kin", "ch": 6, "ch_title": "関係詞問題", "th_title": "実戦問題 (Q141)", "q": "------- would like to attend Professor Howard's seminar on May 8 should sign up for it by Friday.", "c": ["Whenever", "Wherever", "Whatever", "Whoever"], "a": 3, "exp": "空所から May 8 までが主語になる名詞のカタマリで、should sign up が述語動詞です。選択肢中、主語になる名詞のカタマリ (名詞節) を作るのは、複合関係代名詞の (C)(D) です。このうち、直後の would like to attend (出席したい) の主語として文意が通るのは、(D) Whoever (〜する人は誰でも = anyone who) です。(C)「〜するモノは何でも (= anything that)」は文意が通りません。複合関係副詞の (A)「いつでも」と (B)「どこでも」は、副詞のカタマリ (副詞節) を作り、名詞のカタマリ (名詞節) は作りません。\n\n和訳: Howard 教授の 5 月 8 日のセミナーに出席したい皆さんは、金曜日までに申し込んでください。", "v": [{"word": "sign up for ~", "meaning": "〜に申し込む"}], "rule": {"number": 76, "title": "thoseとanyone、whoeverの文法的な違いに注意。", "category": "第6章 関係詞問題"}}, {"id": 1142, "b": "kin", "ch": 6, "ch_title": "関係詞問題", "th_title": "実戦問題 (Q142)", "q": "As consumers seek to reduce their expenses, the number of cars that ------- has risen significantly.", "c": ["leased", "is leased", "are being leased", "are leasing"], "a": 2, "exp": "文全体は、As SV, SV. のカタチです。カンマ後の節 (SV) を見ると、the number が主語で、of から空所までが修飾語、has risen が述語動詞です。空所前の that は主格の関係代名詞で、先行詞が複数名詞 cars、空所にはその V が必要です。cars と lease (〜をリースする) との間には、「車がリースされる」という受動の関係があるので、現在進行形の受動態 (C) are being leased (リースされている) が正解です。「車⇐リースされている」と、that are being leased という形容詞のカタマリが、cars を後ろから説明しています。lease は他動詞なので、能動態の (A)(D) は目的語が必要です。受動態の (B) は複数形の先行詞と主述が合いません。\n\n和訳: 消費者が支出を減らそうとするにつれて、リースされる車の数がかなり増えた。", "v": [{"word": "seek to do", "meaning": "〜しようとする"}, {"word": "expense", "meaning": "名 支出"}, {"word": "rise", "meaning": "動 上がる"}, {"word": "significantly", "meaning": "副 大幅に、かなり"}], "rule": {"number": 73, "title": "主格の関係代名詞の先行詞と、直後の述語動詞は主述が一致する。", "category": "第6章 関係詞問題"}}, {"id": 1143, "b": "kin", "ch": 6, "ch_title": "関係詞問題", "th_title": "実戦問題 (Q143)", "q": "Online shoppers can choose home delivery or in-store pickup, ------- is more convenient.", "c": ["whereas", "if", "whichever", "either"], "a": 2, "exp": "選択肢に関係詞と代名詞、接続詞が混在しているので、文のカタチを確認します。文頭からカンマまでが文の要素がそろった節 (SV) で、空所には述語動詞 is の主語が欠けています。選択肢中、主語の役割をしつつ、節に補足説明を加える副詞のカタマリ (副詞節) を作ることができるのは、複合関係代名詞の (C) whichever (どちらが〜しようと) です。ここでは、「宅配か店内受け取り、どちらがより便利でも」という意味です。(A)「〜であるのに対して」と (B)「もし〜なら」は2つの節をつなぐ接続詞です。(D) は、「(2 つの) どちらか (も)」の意味の代名詞か形容詞、either X or Y (X か Y のどちらか) のペア表現、否定文で「〜も〜ない」の意味の副詞で用いられます。\n\n和訳: オンラインでお買い物されたお客様は、宅配か店内受け取りか、どちらがより便利でも、お選びいただけます。", "v": [], "rule": {"number": 71, "title": "関係代名詞と普通の代名詞の文法的な違いに注意。", "category": "第6章 関係詞問題"}}, {"id": 1144, "b": "kin", "ch": 6, "ch_title": "関係詞問題", "th_title": "実戦問題 (Q144)", "q": "Across from the train station, visitors can access the seafood market ------- which the town is renowned.", "c": ["for", "as", "to", "about"], "a": 0, "exp": "関係代名詞の直前の空所に適切な前置詞を選ぶタイプの問題も、空所の前後で 2 文に分けて考えます。まず、空所と目的格の関係代名詞 which をまとめて関係詞節の末尾に戻します。次に、先行詞 (the seafood market) を代名詞 (it) に変え、which と置き換えます。すると、「The town is renowned ------- it.」となります。この空所に入れて正しい英文が完成する前置詞は、(A) for です。be renowned for X は「X で有名だ」という意味です。(B) は、be renowned as X で「X として有名だ」という意味を表しますが、町と海鮮市場はイコールではないので意味が通じません。(C)(D) はいずれも renowned とセットで用いられません。\n\n和訳: その駅の反対側で、観光客は、その町の有名な海鮮市場に行ける。", "v": [{"word": "across from X", "meaning": "X の反対側に"}, {"word": "renowned", "meaning": "形 名高い、有名な"}], "rule": {"number": 72, "title": "関係詞の問題は、2文に分けて考えるのが基本。", "category": "第6章 関係詞問題"}}, {"id": 1145, "b": "kin", "ch": 6, "ch_title": "関係詞問題", "th_title": "実戦問題 (Q145)", "q": "Mr. Anderson found a location for his new office that he thinks ------- all of his requirements.", "c": ["meet", "meets", "meeting", "to meet"], "a": 1, "exp": "問題文は、主格の関係代名詞 that の後に、he thinks という節が挿入されたカタチです。「a location (for his new office) that (he thinks) ------- 〜」と、修飾語と挿入部分をカッコでくくると、空所には、先行詞 a location と主述が一致する述語動詞が必要だとわかります。したがって、3 単現の s が付いた現在形の (B) meets (満たす) が正解です。念のため、先行詞を代名詞 it に変えて、後ろの節に戻すと、He thinks it meets 〜. (彼はそれが〜を満たしていると思っている) となり、文が成立します。(A) は先行詞と主述が一致せず、(C)(D) は V にならないカタチです。\n\n和訳: Anderson さんは、すべての必要条件を満たしていると思う新しいオフィスの場所を見つけた。", "v": [{"word": "requirement", "meaning": "名 必要条件"}], "rule": {"number": 73, "title": "主格の関係代名詞の先行詞と、直後の述語動詞は主述が一致する。", "category": "第6章 関係詞問題"}}, {"id": 1146, "b": "kin", "ch": 7, "ch_title": "その他の問題", "th_title": "必修問題 (Q146)", "q": "Submit your photographs ------- by sending them as e-mail attachments or by uploading them to our Web site.", "c": ["either", "both", "neither", "but"], "a": 0, "exp": "Part 5で年数問、出題される「ペア問題」です。選択肢はいずれも、他の語とペアで用いられることがあります。文後半のorとペアになるのは、(A) eitherです。either X or Yのカタチで、「XかYかどちらか」という意味を表します。ここでは、「メールの添付ファイルで送るか、ウェブサイトにアップするかどちらか」という意味です。(B)は、both X and Yのカタチで、「XもYもどちらも」の意味を表します。例: Both you and I should go. (私もあなたもどちらも行くべきです) (C)は、(A)にnotのnを付けた、neither X nor Yのカタチで、「XもYもどちらも〜ない」という意味を表します。例: Neither you nor I should go. (あなたも私も行くべきではない) (D)は、not only X but (also) Yのカタチで、「XだけでなくYも」の意味を表します。例: He is not only a teacher but also a writer. (彼は教師であるだけでなく、作家でもある)\n\n和訳: 写真は、メールの添付ファイルとして送るか、我々のウェブサイト上にアップロードするかどちらかでご提出ください。", "v": [{"word": "submit", "meaning": "動 提出する"}, {"word": "attachment", "meaning": "名 添付ファイル"}], "rule": {"number": 78, "title": "覚えておきたいPart 5に出るペア表現。", "category": "第7章 その他の問題"}}, {"id": 1147, "b": "kin", "ch": 7, "ch_title": "その他の問題", "th_title": "必修問題 (Q147)", "q": "At Sangson Automotive, we continuously seek ways to become more sustainable in ------- facets of our business.", "c": ["all", "another", "much", "every"], "a": 0, "exp": "こうした単語がPart 5で選択肢に並んでいたら、「数」がポイントです。空所後の名詞が可算名詞か不可算名詞か、可算名詞なら単数形か複数形かをチェックしましょう。ここでは、空所後が、可算名詞の複数形facets (面) です。選択肢中、複数形の名詞を修飾できるのは (A) all (すべての) です。in all facets of Xで、「Xのあらゆる面において」という意味です。(B) another (もう1つの) は、another facet (もう1つの面) のように可算名詞の単数形を修飾します。(C) much (たくさんの) は、much money (たくさんのお金) のように不可算名詞を修飾します。(D) every (すべての) は、every day (毎日) のように可算名詞の単数形を修飾します。\n\n和訳: Sangson自動車では、ビジネスのあらゆる面において、より持続可能になるための方法を常に探し求めています。", "v": [{"word": "automotive", "meaning": "名 自動車"}, {"word": "sustainable", "meaning": "形 持続可能な"}], "rule": {"number": 79, "title": "頭に入れたい「数」を表す語句。", "category": "第7章 その他の問題"}}, {"id": 1148, "b": "kin", "ch": 7, "ch_title": "その他の問題", "th_title": "必修問題 (Q148)", "q": "Candidates for the snow removal position must be ------- to work on December 25.", "c": ["possible", "convenient", "available", "easy"], "a": 2, "exp": "選択肢に異なる形容詞が並んでいるので、一見語彙問題です。しかし「その除雪の職の候補者は、12月25日に働くために-------なければならない」と和訳すると、選択肢の単語は、どれも空所に入りそうに思えます。そこで、「語法」の視点に切り替えます。選択肢中、candidates (候補者) のような「人」の補語として、主語とイコールになるのは、(C) availableです。availableは、「人」が主語の場合、「都合が付けられる」という意味です。「人以外」が主語の場合は、「入手できる、購入できる、利用できる」といった意味になります。「手に入れようと思えば入れられる、買おうと思えば買える、都合を付けようと思えば付けられる」といったイメージのTOEIC超頻出語です。その他の選択肢は、いずれも「人」が主語の場合の補語になりません。「it is possible/convenient/easy for 人 to do」のカタチで、「〜するのは誰々にとって可能・便利・簡単だ」という意味を表します。\n\n和訳: 除雪の職の候補者は、12月25日に勤務する都合が付けられなければならない。", "v": [{"word": "candidate", "meaning": "名 候補者"}, {"word": "removal", "meaning": "名 除去、撤去"}], "rule": {"number": 80, "title": "「意味」で解けない問題は、「語法」に視点を切り替える。", "category": "第7章 その他の問題"}}, {"id": 1149, "b": "kin", "ch": 7, "ch_title": "その他の問題", "th_title": "必修問題 (Q149)", "q": "Shannon Bremmer's hit album Starlite Motions ------- her an award at the Sydney Music Awards last night.", "c": ["achieved", "earned", "made", "honored"], "a": 1, "exp": "一見語彙問題ですが、意味を考えると、複数の選択肢が正解になりそうなので、「語法」の視点に切り替えます。すると、空所後に、her an award と、目的語が2つ続いています。選択肢中、こうしたSVOOのカタチをとれる動詞は (B) earned です。earnは、earn money (お金を稼ぐ) や earn a reputation (評判を得る) といったSVOのカタチに加えて、「earn 人 モノ」のSVOOのカタチで、「人に (ふさわしい) モノをもたらす、獲得させる」の意味を表します。ここでは、「ヒットアルバムが彼女に賞をもたらした」という意味です。(A)「〜を達成する」は achieve a goal (目標を達成する)、(D)「〜を称える、(契約等) を守る」は honor an employee (社員を称える) や honor a contract (契約を守る) のようにSVOのカタチで用いられます。(C)は、He made me dinner. (彼は私に夕食を作った) のようなSVOOのカタチにはなりますが、ここでは文意が通じません。\n\n和訳: Shannon Bremmerのヒットアルバム『Starlite Motions』は、昨晩、Sydney音楽賞で彼女に賞をもたらした。", "v": [], "rule": {"number": 81, "title": "注意したい二重目的語をとる動詞。", "category": "第7章 その他の問題"}}, {"id": 1150, "b": "kin", "ch": 7, "ch_title": "その他の問題", "th_title": "必修問題 (Q150)", "q": "After the renovation, the stylish décor will make the dining experience ------- more enjoyable for our guests.", "c": ["very", "enough", "better", "even"], "a": 3, "exp": "文全体のカタチを見ると、the stylish décorが主語 (S)、will makeが述語動詞 (V)、the dining experienceが目的語 (O)、enjoyableが補語 (C) のSVOCのカタチです。選択肢中、空所後の形容詞の比較級more enjoyableを強調できる副詞は、(D) even (さらに、より) です。ここでは、even more enjoyableで、「今までも楽しかったが、より一層楽しくなる」といったニュアンスを表しています。(A)「とても」は、The dinner was very enjoyable. のように形容詞の原級を修飾します。比較級は修飾しないので注意しましょう。副詞の (B)「十分に」は、形容詞を修飾する際、The restaurant is big enough for our party. のように、形容詞の後に来る語法が重要です。(C)は形容詞や副詞の比較級で、moreと重複して用いられません。a better dining experience (より良い食事の経験) のように、単独で比較の意味を表します。\n\n和訳: 改装後、おしゃれな装飾品が、当店のお客様にとっての食事の経験を、より一層楽しくするでしょう。", "v": [{"word": "renovation", "meaning": "名 改装"}, {"word": "décor", "meaning": "名 装飾品"}], "rule": {"number": 82, "title": "覚えておきたい比較級を強調する副詞。", "category": "第7章 その他の問題"}}, {"id": 1151, "b": "kin", "ch": 7, "ch_title": "その他の問題", "th_title": "実戦問題 (Q151)", "q": "Some Denver stores operate around the clock, but ------- remain open at night outside the city.", "c": ["each", "other", "few", "much"], "a": 2, "exp": "文全体は、SV, but SV.のカタチです。後半の節を見ると、空所には、述語動詞remainの主語が必要です。現在形の述語動詞に3単現のsが付いていないので、主述が一致するのは、複数扱いの代名詞 (C) few (少数) です。few remain openで、「ほとんどが開いていない」という意味です。fewは形容詞として、few storesのように複数名詞を修飾する用法も押さえましょう。代名詞の (A)「1つ1つ」と (D)「多くのこと」は、主語になりますが、単数扱いなので主述が合いません。(B)「他の」は名詞を修飾する形容詞です。\n\n和訳: Denverには24時間営業の店もあるが、市外では夜間営業している店はほとんどない。", "v": [{"word": "operate", "meaning": "動 営業する"}, {"word": "around the clock", "meaning": "24時間"}], "rule": {"number": 79, "title": "頭に入れたい「数」を表す語句。", "category": "第7章 その他の問題"}}, {"id": 1152, "b": "kin", "ch": 7, "ch_title": "その他の問題", "th_title": "実戦問題 (Q152)", "q": "Denton Publishing is ------- to environmentally friendly practices including the recycling of used paper.", "c": ["expected", "intended", "hoped", "committed"], "a": 3, "exp": "一見語彙問題ですが、意味を考えると正解が絞り込めません。そこで、「語法」に視点を切り替えます。空所後のtoの後に、environmentally friendly practices (環境にやさしい活動) という名詞が続いているので、このtoは前置詞です。選択肢中、前置詞toを伴うのは、(D) committedです。be committed to Xで「Xに尽力している」という意味です。(A) は、be expected to do (〜する予定だ)、(B) は intend to do (〜するつもりだ)、(C) は hope to do (〜したいと望む) のように、いずれも不定詞を伴います。\n\n和訳: Denton出版は、使用済みの紙のリサイクルを含む、環境にやさしい活動に尽力している。", "v": [{"word": "environmentally friendly practices", "meaning": "環境にやさしい活動"}, {"word": "including", "meaning": "前 〜を含む"}], "rule": {"number": 30, "title": "Part 5で注意したいtoの見分け。", "category": "第1章 品詞問題"}}, {"id": 1153, "b": "kin", "ch": 7, "ch_title": "その他の問題", "th_title": "実戦問題 (Q153)", "q": "------- are the business seminars free to attend in person, but they can also be viewed live online.", "c": ["Not only", "Additionally", "Only when", "Besides"], "a": 0, "exp": "空所後からカンマまでの節 (SV) を見ると、述語動詞 are の後に主語 the business seminars が続き、その後に補語の形容詞 free が続く疑問文の語順になっています。選択肢中、こうした倒置形になるのは、(A) Not only です。「Not only VS, but 〜 . (SがVするだけでなく〜)」のように、not only が文頭に出ると、倒置形が続くことがあると頭に入れましょう。カンマ後に but also があるので、not only X but also Y (X だけでなくYも) のペアを見つけて解くこともできます。副詞の (B)「加えて」、接続詞の (C)「〜するときだけ」、前置詞・副詞の (D)「その上」は、いずれも倒置形を伴わず、通常の語順になります。\n\n和訳: そのビジネスセミナーは直接無料で参加できるだけでなく、オンラインで、ライブで観ることもできる。", "v": [{"word": "in person", "meaning": "直接"}], "rule": {"number": 78, "title": "覚えておきたいPart 5に出るペア表現。", "category": "第7章 その他の問題"}}, {"id": 1154, "b": "kin", "ch": 7, "ch_title": "その他の問題", "th_title": "実戦問題 (Q154)", "q": "All guests receive a breakfast voucher that can be used at ------- of the two hotel restaurants.", "c": ["some", "every", "other", "either"], "a": 3, "exp": "選択肢の並びから、「数」を意識します。空所には、前置詞 at の目的語になる代名詞が必要なので、(A)(D) が正解候補です。空所後に、of the two hotel restaurants (ホテルの2つのレストランのうちの) とあるので、2つの「どちらか、どちらも」という意味を表す代名詞の (D) either が正解です。代名詞の (A)「いくつか」は、3以上の不特定の数を表します。(B)「すべての」と (C)「ほかの」は、every guest/other guests のように名詞を修飾する形容詞です。\n\n和訳: お客様は全員、ホテルの2つのレストランのどちらでも使える朝食の引換券を受け取ります。", "v": [{"word": "voucher", "meaning": "名 無料券、引換券"}], "rule": {"number": 79, "title": "頭に入れたい「数」を表す語句。", "category": "第7章 その他の問題"}}, {"id": 1155, "b": "kin", "ch": 7, "ch_title": "その他の問題", "th_title": "実戦問題 (Q155)", "q": "The luncheon will provide a unique opportunity to ------- acquainted with attorneys from a variety of Jakarta law firms.", "c": ["become", "develop", "learn", "know"], "a": 0, "exp": "空所後の形容詞 acquainted (知り合いの) がポイントです。選択肢中、唯一、形容詞を補語にとる SVC のカタチになる動詞が (A) become です。become acquainted with X で「Xと知り合いになる」という意味です。(B) は、develop a new product (新製品を開発する) や develop a plan (計画を作り上げる) のように、主に SVO のカタチで用いられます。(C)(D) は、learn/know (about) X や learn/know how to do といったカタチになります。選択肢にバラバラの動詞が並んでいて、意味で正解が絞れない場合、文型も意識しましょう。\n\n和訳: その昼食会は、さまざまな Jakarta の法律事務所の弁護士と知り合いになる、他にはない機会を提供するだろう。", "v": [{"word": "luncheon", "meaning": "名 昼食会"}, {"word": "unique", "meaning": "形 他にはない"}, {"word": "opportunity", "meaning": "名 機会"}, {"word": "acquainted", "meaning": "形 知り合いの、精通している"}, {"word": "attorney", "meaning": "名 弁護士"}, {"word": "a variety of", "meaning": "さまざまな"}], "rule": {"number": 80, "title": "「意味」で解けない問題は、「語法」に視点を切り替える。", "category": "第7章 その他の問題"}}, {"id": 1156, "b": "kin", "ch": 7, "ch_title": "その他の問題", "th_title": "実戦問題 (Q156)", "q": "Whether the golf tournament will be held in Scotland ------- Wales has yet to be decided.", "c": ["if", "or", "so", "neither"], "a": 1, "exp": "文頭の接続詞 whether とペアになり、「かどうか」という意味の名詞のカタマリ (名詞節) を作るのが (B) or です。ここでは、「S が開催されるのが Scotland か Wales かは」という意味の主語のカタマリを作 const DATES = [...new Set(RAW_WORDS.filter(x => x.d).map(x => getWeekLabel(x.d)))].sort();

function getWeekLabel(dateStr) {
  const d = new Date(dateStr);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  const monday = new Date(d.setDate(diff));
  return `${monday.getMonth()+1}/${monday.getDate()}〜`;
}

function saveWeakData() {
  localStorage.setItem('toeic_weak_words', JSON.stringify(state.weakData));
  updateWeakBadge();
}

function updateWeakBadge() {
  // 「苦手のみ」を押したときに出る問題数（今の出典・日付・品詞・範囲の絞り込みを反映）
  const count = dedupeWords(RAW_WORDS.filter(w => state.weakData[w.w] !== undefined && wordMatchesBaseFilters(w))).length;
  const badge = document.getElementById('weak-badge');
  if (count > 0) {
    badge.style.display = 'inline-block';
    badge.innerText = count;
  } else {
    badge.style.display = 'none';
  }
}

function initRangeFilters() {
  const rf = document.getElementById('range-filters');
  if (!rf) return;
  const teppanWords = RAW_WORDS.filter(w => w.s === 'teppan' && w.no);
  const maxNo = teppanWords.reduce((max, w) => Math.max(max, w.no), 0);
  
  let html = `<button class="chip active" data-range="all">全番号 (1〜${maxNo})</button>`;
  for (let start = 1; start <= maxNo; start += 100) {
    const end = Math.min(start + 99, maxNo);
    html += `<button class="chip" data-range="${start}-${end}">${start}〜${end}</button>`;
  }
  rf.innerHTML = html;
  
  rf.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', e => {
      rf.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      const val = e.target.dataset.range;
      if (val === 'all') {
        state.rangeFilter = null;
      } else {
        const [start, end] = val.split('-').map(Number);
        state.rangeFilter = { start, end };
      }
      applyFilters();
    });
  });
}

function saveGrammarWeakData() {

}

function updateGrammarWeakBadge() {
  // 「苦手のみ」を押したときに出る問題数（今の本・章・ルールの絞り込みを反映）
  const count = RAW_GRAMMAR.filter(ex => state.grammarWeakData[ex.id] !== undefined && grammarMatchesBaseFilters(ex)).length;
  const badge = document.getElementById('grammar-weak-badge');
  if (badge) {
    badge.style.display = count > 0 ? 'inline-block' : 'none';
    badge.innerText = count;
  }
}

function getGrammarChaptersList() {
  const book = state.grammarBook || 'all';
  const pool = book === 'all' ? RAW_GRAMMAR : RAW_GRAMMAR.filter(g => (g.b || 'sekai') === book);
  
  if (book === 'kin') {
    const kinChaps = [];
    const seen = new Set();
    RAW_GRAMMAR.filter(g => g.b === 'kin').forEach(g => {
      if (!seen.has(g.ch)) {
        seen.add(g.ch);
        const count = RAW_GRAMMAR.filter(x => x.b === 'kin' && x.ch === g.ch).length;
        kinChaps.push({ ch: g.ch, title: `第${g.ch}章 ${g.ch_title} (${count}問)` });
      }
    });
    return [{ ch: 'all', title: `金の文法 全7章 (${pool.length}問)` }, ...kinChaps];
  } else if (book === 'sekai') {
    const sekaiChaps = [];
    const seen = new Set();
    RAW_GRAMMAR.filter(g => (g.b || 'sekai') === 'sekai').forEach(g => {
      if (!seen.has(g.ch)) {
        seen.add(g.ch);
        const count = RAW_GRAMMAR.filter(x => (x.b || 'sekai') === 'sekai' && x.ch === g.ch).length;
        sekaiChaps.push({ ch: g.ch, title: `第${g.ch}章 ${g.ch_title} (${count}問)` });
      }
    });
    return [{ ch: 'all', title: `世界一 全14章 (${pool.length}問)` }, ...sekaiChaps];
  } else {
    return [
      { ch: 'all', title: `全問 (${pool.length}問)` }
    ];
  }
}

function renderGrammarChapterFilters() {
  const gcf = document.getElementById('grammar-chapter-filters');
  if (!gcf) return;
  
  const chapters = getGrammarChaptersList();
  let html = '';
  if (state.grammarRule !== null) {
    html += `<button class="chip active rule-filter-chip" data-clear-rule="1">金のルール ${state.grammarRule} で絞り込み中 ✕</button>`;
  }
  chapters.forEach((c, idx) => {
    const isActive = state.grammarRule === null && ((state.grammarChapter === c.ch) || (idx === 0 && state.grammarChapter === 'all'));
    html += `<button class="chip ${isActive ? 'active' : ''}" data-gchapter="${c.ch}">${c.title}</button>`;
  });
  gcf.innerHTML = html;

  gcf.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', e => {
      const val = e.currentTarget.dataset.gchapter;
      state.grammarRule = null;
      state.grammarChapter = val === undefined || val === 'all' ? 'all' : Number(val);
      renderGrammarChapterFilters();
      applyGrammarFilters();
    });
  });
}

function initGrammarFilters() {
  // Book segments
  const gbs = document.getElementById('grammar-book-segments');
  if (gbs) {
    gbs.querySelectorAll('.segment').forEach(btn => {
      btn.addEventListener('click', e => {
        gbs.querySelectorAll('.segment').forEach(b => b.classList.remove('active'));
        const target = e.currentTarget || e.target;
        target.classList.add('active');
        state.grammarBook = target.dataset.gbook;
        state.grammarChapter = 'all';
        state.grammarRule = null;
        renderGrammarChapterFilters();
        applyGrammarFilters();
      });
    });
  }

  renderGrammarChapterFilters();

  document.querySelectorAll('#grammar-weak-segments .segment').forEach(btn => {
    btn.addEventListener('click', e => {
      document.querySelectorAll('#grammar-weak-segments .segment').forEach(b => b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      state.grammarWeakFilter = e.currentTarget.dataset.gweak;
      applyGrammarFilters();
    });
  });
}

// 苦手フィルタ以外の絞り込み（本・章・ルール）
function grammarMatchesBaseFilters(ex) {
  const itemBook = ex.b || 'sekai';
  if (state.grammarBook !== 'all' && itemBook !== state.grammarBook) return false;
  if (state.grammarChapter !== 'all' && ex.ch !== state.grammarChapter) return false;
  if (state.grammarRule !== null && ex.rule?.number !== state.grammarRule) return false;
  return true;
}

function applyGrammarFilters() {
  let filtered = RAW_GRAMMAR.filter(ex => {
    if (!grammarMatchesBaseFilters(ex)) return false;
    const isWeak = state.grammarWeakData[ex.id] !== undefined;
    if (state.grammarWeakFilter === 'weak_only' && !isWeak) return false;
    return true;
  });

  state.grammarPool = shuffle(filtered);
  state.currentGrammarIndex = 0;
  state.grammarScore = 0;
  state.grammarAnsweredCount = 0;
  updateGrammarWeakBadge();
  updateFilterSummary();
  renderCurrentGrammar();
}

function renderCurrentGrammar() {
  setDontKnowVisible(false);
  document.getElementById('choices-container').classList.remove('compact');
  const container = document.getElementById('quiz-container');
  const choicesDiv = document.getElementById('choices-container');
  const nextBtn = document.getElementById('next-btn');

  if (state.grammarPool.length === 0) {
    container.innerHTML = `<div class="card"><div class="meaning-display">条件に合う文法問題がありません</div></div>`;
    choicesDiv.innerHTML = '';
    nextBtn.style.display = 'none';
    updateFooter();
    return;
  }

  if (state.currentGrammarIndex >= state.grammarPool.length) {
    container.innerHTML = `<div class="card"><div class="meaning-display">文法ドリル完了！ 🎉</div><div style="font-size:14px;color:var(--muted);margin-top:8px;">正答: ${state.grammarScore} / ${state.grammarAnsweredCount}</div></div>`;
    choicesDiv.innerHTML = '';
    nextBtn.style.display = 'none';
    updateFooter();
    return;
  }

  const ex = state.grammarPool[state.currentGrammarIndex];
  state.grammarAnswered = false;
  choicesDiv.innerHTML = '';
  nextBtn.style.display = 'none';

  // Highlight blank in question
  const formattedQ = ex.q.replace(/-{3,}/g, '<span style="color:var(--seal);font-weight:bold;text-decoration:underline;">_______</span>');

  const isKin = ex.b === 'kin';
  const bookBadgeHtml = isKin 
    ? '<span class="grammar-book-badge badge-kin">👑 金の文法</span>'
    : '<span class="grammar-book-badge badge-sekai">📖 世界一</span>';

  const ruleHtml = (ex.rule && ex.rule.number) ? `
    <div class="grammar-rule-card">
      <div class="grammar-rule-header">
        <span class="grammar-rule-icon">👑</span>
        <span class="grammar-rule-badge-text">金のルール ${ex.rule.number}</span>
        ${ex.rule.category && ex.rule.category !== `第${ex.ch}章 ${ex.ch_title}` ? `<span class="grammar-rule-cat">${ex.rule.category}</span>` : ''}
      </div>
      <div class="grammar-rule-title">${ex.rule.title}</div>
    </div>
  ` : '';

  const phaseInfo = isKin ? (typeof KIN_PHASES !== 'undefined' ? KIN_PHASES.find(p => p.chapter === ex.ch) : null) : null;
  const phaseHtml = (phaseInfo && phaseInfo.phases) ? `
    <details class="grammar-phase-details">
      <summary>💡 第${ex.ch}章 (${escapeHtml(phaseInfo.chapter_title)}) の解き方手順を見る</summary>
      ${renderPhaseSteps(phaseInfo.phases)}
    </details>
  ` : '';

  container.innerHTML = `
    <div class="card grammar-card" id="main-card">
      <div class="grammar-meta">
        <span class="grammar-badge">Part 5</span>
        ${bookBadgeHtml}
      </div>
      <div class="grammar-question">${formattedQ}</div>
      <div class="grammar-exp-container" id="grammar-exp-box" style="display:none;">
        <div class="grammar-correct-ans">正解: (${['A','B','C','D'][ex.a]}) ${ex.c[ex.a]}</div>
        <div class="grammar-your-ans" id="grammar-your-ans" style="display:none;"></div>
        <div class="grammar-theme-revealed">第${ex.ch}章 ${ex.ch_title} ・${ex.th_title}</div>
        ${ruleHtml}
        ${phaseHtml}
        <div class="grammar-exp-text">${ex.exp}</div>
        ${ex.v && ex.v.length > 0 ? `
          <div class="grammar-vocab-list">
            <div class="grammar-vocab-title">📌 重要語彙</div>
            <div class="grammar-vocab-items">
              ${ex.v.map(v => `<span class="grammar-vocab-item"><strong>${v.word}</strong>: ${v.meaning}</span>`).join('')}
            </div>
          </div>
        ` : ''}
      </div>
    </div>
  `;

  const labels = ['A', 'B', 'C', 'D'];
  ex.c.forEach((choice, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-label">${labels[idx]}</span><span class="choice-text">${choice}</span>`;
    btn.onclick = () => handleGrammarAnswer(idx, btn);
    choicesDiv.appendChild(btn);
  });
  setDontKnowVisible(true);
  document.getElementById('dont-know-btn').onclick = handleGrammarDontKnow;

  updateFooter();
}

function handleGrammarAnswer(selectedIdx, btn) {
  if (state.grammarAnswered) return;
  const ex = state.grammarPool[state.currentGrammarIndex];
  const isCorrect = selectedIdx === ex.a;

  if (!isCorrect) {
    btn.classList.add('wrong');
    document.getElementById('main-card').classList.add('shake');
    setTimeout(() => document.getElementById('main-card').classList.remove('shake'), 400);
    const yours = document.getElementById('grammar-your-ans');
    yours.textContent = `あなたの回答: (${['A','B','C','D'][selectedIdx]}) ${ex.c[selectedIdx]}`;
    yours.style.display = 'block';
    recordWeakGrammar(ex, false);
  } else {
    state.grammarScore++;
    recordWeakGrammar(ex, true);
  }
  revealGrammarAnswer(ex);
}

// 「わからない」: 正解と解説を見せて苦手に登録。スコアは増やさず、赤表示や揺れは出さない
function handleGrammarDontKnow() {
  if (state.grammarAnswered) return;
  const ex = state.grammarPool[state.currentGrammarIndex];
  recordWeakGrammar(ex, false);
  revealGrammarAnswer(ex);
}

function revealGrammarAnswer(ex) {
  state.grammarAnswered = true;
  setDontKnowVisible(false);

  const choicesDiv = document.getElementById('choices-container');
  choicesDiv.querySelectorAll('.choice-btn').forEach((b, i) => {
    if (i === ex.a) b.classList.add('correct');
    const mark = i === ex.a ? '✓' : (b.classList.contains('wrong') ? '✗' : '');
    if (mark) b.insertAdjacentHTML('beforeend', `<span class="choice-mark">${mark}</span>`);
    // 回答後は全文表示のまま。タップで記号だけの1行に縮めて解説を広く読める（再タップで戻る）
    b.onclick = () => choicesDiv.classList.toggle('compact');
  });

  const expBox = document.getElementById('grammar-exp-box');
  if (expBox) expBox.style.display = 'block';

  const nextBtn = document.getElementById('next-btn');
  nextBtn.style.display = 'block';
  nextBtn.onclick = () => {
    state.currentGrammarIndex++;
    renderCurrentGrammar();
  };
  updateFooter();
}

function recordWeakGrammar(ex, isCorrect) {
  state.grammarAnsweredCount++;
  if (isCorrect) {
    if (state.grammarWeakData[ex.id]) {
      state.grammarWeakData[ex.id].streak = (state.grammarWeakData[ex.id].streak || 0) + 1;
      if (state.grammarWeakData[ex.id].streak >= 2) {
        delete state.grammarWeakData[ex.id];
      }
    }
  } else {
    if (!state.grammarWeakData[ex.id]) {
      state.grammarWeakData[ex.id] = { streak: 0, added: Date.now() };
    } else {
      state.grammarWeakData[ex.id].streak = 0;
    }
  }
  saveGrammarWeakData();
}
