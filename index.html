<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TOEIC Drill</title>
<style>
:root {
  --ink: #1b1712;
  --paper: #f2e6c9;
  --seal: #b3382a;
  --gold: #c9a05c;
  --jade: #4f7a68;
  --ivory: #f0e6d2;
  --muted: #8a7f6e;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; padding: 0;
  background-color: var(--ink);
  background-image: radial-gradient(circle at 50% 0%, #2a241d, var(--ink));
  color: var(--paper);
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
#app {
  max-width: 540px;
  margin: 0 auto;
  width: 100%;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  position: relative;
  overflow: hidden;
}
.header {
  padding: 10px 20px 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
}
.title-wrap { text-align: left; line-height: 1.15; }
.eyebrow {
  color: var(--gold);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin: 0;
}
.title {
  font-size: 17px;
  font-weight: bold;
  margin: 0;
}
.subtitle { display: none; }
.filter-toggle {
  flex-shrink: 0;
  background: rgba(242, 230, 201, 0.08);
  border: 1px solid rgba(242, 230, 201, 0.25);
  color: var(--paper);
  font-size: 12px;
  font-family: inherit;
  padding: 6px 12px;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.filter-toggle.active {
  background: var(--paper);
  color: var(--ink);
  border-color: var(--paper);
  font-weight: 600;
}
.filter-toggle .caret { font-size: 9px; transition: transform 0.25s; }
.filter-toggle.active .caret { transform: rotate(180deg); }
.filter-count {
  background: var(--seal);
  color: #fff;
  border-radius: 10px;
  min-width: 16px;
  padding: 1px 5px;
  font-size: 10px;
  font-weight: 700;
  display: none;
}
.filters {
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex-shrink: 0;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height 0.25s ease, opacity 0.2s ease, padding 0.25s ease;
}
.filters.open {
  max-height: 290px;
  opacity: 1;
  padding: 2px 20px 8px;
}
.filter-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.filter-row::-webkit-scrollbar { display: none; }
.chip {
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--muted);
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
  background: transparent;
  cursor: pointer;
  transition: all 0.2s;
}
.chip.active {
  background: var(--paper);
  color: var(--ink);
  border-color: var(--paper);
  font-weight: 600;
}
.segments {
  display: flex;
  background: rgba(242, 230, 201, 0.1);
  border-radius: 10px;
  padding: 3px;
  margin: 0 20px 6px;
  flex-shrink: 0;
}
.filters .segments { margin: 0; }
#mode-segments { margin: 2px 20px 8px; }
.segment {
  flex: 1;
  text-align: center;
  padding: 6px 4px;
  font-size: 12px;
  border-radius: 7px;
  color: var(--muted);
  cursor: pointer;
  transition: 0.3s;
}
.segment.active {
  background: var(--paper);
  color: var(--ink);
  font-weight: bold;
}
.main-area {
  flex: 1;
  min-height: 0;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#quiz-container {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.card {
  background: var(--paper);
  color: var(--ink);
  border-radius: 16px;
  padding: 14px 18px;
  text-align: center;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  margin-bottom: 10px;
  position: relative;
  transition: transform 0.3s, opacity 0.3s;
  flex: 0 1 auto;
  min-height: clamp(120px, 26vh, 240px);
  max-height: 100%;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform-style: preserve-3d;
}
.card > * { flex-shrink: 0; }
.card::before, .card::after { content: ''; flex: 1 0 0; }
.card.flash-mode::before, .card.flash-mode::after { content: none; }
.card.shake {
  animation: shake 0.4s;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
.word-display {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: clamp(22px, 7vw, 32px);
  font-weight: bold;
  margin-bottom: 8px;
  line-height: 1.2;
  word-break: break-word;
}
.pos-tag {
  background: rgba(0,0,0,0.06);
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  color: var(--ink);
  margin-bottom: 8px;
  flex-shrink: 0;
}
.meaning-display {
  font-size: clamp(16px, 5vw, 20px);
  font-weight: 600;
  margin-bottom: 8px;
  line-height: 1.35;
}
.example-display {
  font-size: 13px;
  color: #555;
  line-height: 1.45;
  margin-top: 10px;
  border-top: 1px dashed rgba(0,0,0,0.1);
  padding-top: 10px;
  display: none;
}
.choices {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 10px;
  flex-shrink: 0;
}
.choice-btn {
  background: rgba(242, 230, 201, 0.05);
  border: 1px solid rgba(242, 230, 201, 0.2);
  color: var(--paper);
  font-family: inherit;
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.35;
  text-align: left;
  cursor: pointer;
  transition: 0.2s;
}
.choice-btn:active { background: rgba(242, 230, 201, 0.1); }
.choice-btn.correct {
  background: var(--jade);
  border-color: var(--jade);
  color: white;
}
.choice-btn.wrong {
  background: var(--seal);
  border-color: var(--seal);
  color: white;
}
.action-bar {
  flex-shrink: 0;
  height: 54px;
  padding: 0 20px 8px;
  display: flex;
}
.next-btn {
  background: var(--gold);
  color: var(--ink);
  border: none;
  font-family: inherit;
  padding: 13px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  flex: 1;
  display: none;
}
.type-input-container {
  width: 100%;
  margin-top: 12px;
}
.type-input {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 2px solid var(--ink);
  font-family: ui-monospace, SFMono-Regular, monospace;
  font-size: 24px;
  text-align: center;
  padding: 8px;
  color: var(--ink);
  outline: none;
}
.type-input::placeholder { color: rgba(0,0,0,0.2); }
.footer {
  padding: 8px 20px 12px;
  border-top: 1px solid rgba(242, 230, 201, 0.1);
  flex-shrink: 0;
}
.stats {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
}
.stamps {
  display: flex;
  gap: 4px;
  justify-content: center;
}
.stamp {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(242, 230, 201, 0.2);
}
.stamp.filled {
  background: var(--gold);
}
.bottom-sheet {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: var(--paper);
  color: var(--ink);
  border-radius: 24px 24px 0 0;
  padding: 24px;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  max-height: 80vh;
  overflow-y: auto;
  z-index: 100;
}
.bottom-sheet.open { transform: translateY(0); }
.sheet-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
  z-index: 99;
}
.sheet-overlay.open { opacity: 1; pointer-events: auto; }
.weak-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid rgba(0,0,0,0.1);
}
.weak-word {
  font-family: monospace;
  font-size: 16px;
  font-weight: bold;
}
.weak-meaning {
  font-size: 13px;
  color: #555;
  margin-top: 4px;
}
.del-btn {
  background: transparent;
  border: 1px solid var(--seal);
  color: var(--seal);
  border-radius: 12px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
}
.weak-badge {
  background: var(--seal);
  color: white;
  border-radius: 10px;
  padding: 2px 6px;
  font-size: 10px;
  vertical-align: middle;
  margin-left: 4px;
}
.card.flash-mode {
  flex: 1;
  cursor: pointer;
  perspective: 1000px;
  padding: 0;
  background: transparent;
  box-shadow: none;
  border: none;
  min-height: 200px;
  overflow: visible;
}
.card.flash-mode > * { margin: 0; }
.flip-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 200px;
  text-align: center;
  transition: transform 0.6s;
  transform-style: preserve-3d;
}
.card.flash-mode.flipped .flip-card-inner {
  transform: rotateY(180deg);
}
.card-face {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  min-height: 200px;
  overflow-y: auto;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  background: var(--paper);
  color: var(--ink);
  border-radius: 16px;
  padding: 20px 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.card-back {
  transform: rotateY(180deg);
}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="title-wrap">
      <div class="eyebrow">TOEIC Drill</div>
      <h1 class="title">単語ドリル</h1>
    </div>
    <button class="filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="filter-drawer">
      絞り込み<span class="filter-count" id="filter-count">0</span><span class="caret">▼</span>
    </button>
  </div>

  <div class="filters" id="filter-drawer">
    <div class="segments" id="source-segments" style="margin-bottom: 4px;">
      <div class="segment active" data-source="all">すべて</div>
      <div class="segment" data-source="daily">日々の単語</div>
      <div class="segment" data-source="teppan">TEPPAN</div>
    </div>
    <div class="filter-row" id="date-filters"></div>
    <div class="filter-row" id="pos-filters">
      <button class="chip active" data-pos="all">すべて</button>
      <button class="chip" data-pos="名詞">名詞</button>
      <button class="chip" data-pos="動詞">動詞</button>
      <button class="chip" data-pos="形容詞">形容詞</button>
      <button class="chip" data-pos="副詞">副詞</button>
      <button class="chip" data-pos="句・表現">句・表現</button>
    </div>
    <div class="segments" id="weak-segments">
      <div class="segment active" data-weak="all">すべて</div>
      <div class="segment" data-weak="weak_unlearned">苦手+未</div>
      <div class="segment" data-weak="weak_only">苦手のみ<span id="weak-badge" class="weak-badge" style="display:none">0</span></div>
    </div>
  </div>

  <div class="segments" id="mode-segments">
    <div class="segment active" data-mode="e2j">英→日</div>
    <div class="segment" data-mode="j2e">日→英</div>
    <div class="segment" data-mode="flash">カード</div>
    <div class="segment" data-mode="type">タイプ</div>
  </div>

  <div class="main-area">
    <div id="quiz-container"></div>
    <div id="choices-container" class="choices"></div>
  </div>
  <div class="action-bar">
    <button id="next-btn" class="next-btn">次へ</button>
  </div>

  <div class="footer">
    <div class="stats">
      <span id="progress-text">0 / 0</span>
      <span id="score-text">👍 0</span>
      <span style="cursor:pointer; text-decoration:underline;" onclick="toggleWeakList()">苦手リスト</span>
    </div>
    <div class="stamps" id="stamps"></div>
  </div>

  <div class="sheet-overlay" id="sheet-overlay" onclick="toggleWeakList()"></div>
  <div class="bottom-sheet" id="bottom-sheet">
    <h2 style="margin-top:0;">苦手リスト</h2>
    <div id="weak-list-content"></div>
  </div>
</div>

let state = {
  mode: 'e2j',
  sourceFilter: 'all',
  dateFilter: [], // empty means all
  posFilter: 'all',
  weakFilter: 'all', // all, weak_unlearned, weak_only
  
  pool: [],
  currentIndex: 0,
  score: 0,
  
  weakData: JSON.parse(localStorage.getItem('toeic_weak_words') || '{}'),
  
  currentOptions: [],
  answered: false
};

const DATES = [...new Set(RAW_WORDS.filter(x => x.d).map(x => getWeekLabel(x.d)))].sort();

function getWeekLabel(dateStr) {
  const d = new Date(dateStr);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  const monday = new Date(d.setDate(diff));
  return `${monday.getMonth()+1}/${monday.getDate()}〜`;
}

function saveWeakData() {
  localStorage.setItem('toeic_weak_words', JSON.stringify(state.weakData));
  updateWeakBadge();
}

function updateWeakBadge() {
  const count = Object.keys(state.weakData).length;
  const badge = document.getElementById('weak-badge');
  if (count > 0) {
    badge.style.display = 'inline-block';
    badge.innerText = count;
  } else {
    badge.style.display = 'none';
  }
}

function initFilters() {
  document.querySelectorAll('#source-segments .segment').forEach(btn => {
    btn.addEventListener('click', e => {
      document.querySelectorAll('#source-segments .segment').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      state.sourceFilter = e.target.dataset.source;
      const df = document.getElementById('date-filters');
      if (state.sourceFilter === 'teppan') {
        df.style.display = 'none';
      } else {
        df.style.display = 'flex';
      }
      applyFilters();
    });
  });

  const df = document.getElementById('date-filters');
  df.innerHTML = `<button class="chip active" data-date="all">すべて</button>`;
  DATES.forEach(d => {
    df.innerHTML += `<button class="chip" data-date="${d}">${d}</button>`;
  });
  
  document.querySelectorAll('#date-filters .chip').forEach(btn => {
    btn.addEventListener('click', e => {
      const val = e.target.dataset.date;
      if (val === 'all') {
        state.dateFilter = [];
        document.querySelectorAll('#date-filters .chip').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
      } else {
        const allBtn = document.querySelector('#date-filters .chip[data-date="all"]');
        allBtn.classList.remove('active');
        if (state.dateFilter.includes(val)) {
          state.dateFilter = state.dateFilter.filter(x => x !== val);
          e.target.classList.remove('active');
        } else {
          state.dateFilter.push(val);
          e.target.classList.add('active');
        }
        if (state.dateFilter.length === 0) allBtn.classList.add('active');
      }
      applyFilters();
    });
  });

  document.querySelectorAll('#pos-filters .chip').forEach(btn => {
    btn.addEventListener('click', e => {
      document.querySelectorAll('#pos-filters .chip').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      state.posFilter = e.target.dataset.pos;
      applyFilters();
    });
  });

  document.querySelectorAll('#weak-segments .segment').forEach(btn => {
    btn.addEventListener('click', e => {
      document.querySelectorAll('#weak-segments .segment').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      state.weakFilter = e.target.dataset.weak;
      applyFilters();
    });
  });

  document.querySelectorAll('#mode-segments .segment').forEach(btn => {
    btn.addEventListener('click', e => {
      document.querySelectorAll('#mode-segments .segment').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      state.mode = e.target.dataset.mode;
      renderCurrent();
    });
  });

  const toggle = document.getElementById('filter-toggle');
  const drawer = document.getElementById('filter-drawer');
  toggle.addEventListener('click', () => {
    const open = drawer.classList.toggle('open');
    toggle.classList.toggle('active', open);
    toggle.setAttribute('aria-expanded', String(open));
  });
}

function updateFilterSummary() {
  let n = 0;
  if (state.sourceFilter !== 'all') n++;
  if (state.sourceFilter !== 'teppan') n += state.dateFilter.length;
  if (state.posFilter !== 'all') n++;
  if (state.weakFilter !== 'all') n++;
  const el = document.getElementById('filter-count');
  if (!el) return;
  el.style.display = n > 0 ? 'inline-block' : 'none';
  el.innerText = n;
}

function shuffle(array) {
  let currentIndex = array.length, randomIndex;
  while (currentIndex !== 0) {
    randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
  }
  return array;
}

function applyFilters() {
  let filtered = RAW_WORDS.filter(w => {
    // source
    if (state.sourceFilter !== 'all' && w.s !== state.sourceFilter) return false;
    
    // date (only for daily words)
    if (state.sourceFilter !== 'teppan' && state.dateFilter.length > 0) {
      if (!w.d || !state.dateFilter.includes(getWeekLabel(w.d))) return false;
    }
    
    // pos
    if (state.posFilter !== 'all') {
      if (state.posFilter === '句・表現') {
        if (!['名詞句','動詞句','形容詞句','表現','副詞句'].includes(w.p)) return false;
      } else {
        if (w.p !== state.posFilter) return false;
      }
    }
    
    // weak
    const isWeak = state.weakData[w.w] !== undefined;
    const isLearned = state.weakData[w.w]?.learned;
    if (state.weakFilter === 'weak_only' && !isWeak) return false;
    if (state.weakFilter === 'weak_unlearned' && isLearned) return false;
    
    return true;
  });
  
  state.pool = shuffle(filtered);
  state.currentIndex = 0;
  state.score = 0;
  updateFilterSummary();
  renderCurrent();
}

function renderCurrent() {
  const container = document.getElementById('quiz-container');
  const choicesDiv = document.getElementById('choices-container');
  const nextBtn = document.getElementById('next-btn');
  
  if (state.pool.length === 0) {
    container.innerHTML = `<div class="card"><div class="meaning-display">条件に合う単語がありません</div></div>`;
    choicesDiv.innerHTML = '';
    nextBtn.style.display = 'none';
    updateFooter();
    return;
  }
  
  if (state.currentIndex >= state.pool.length) {
    container.innerHTML = `<div class="card"><div class="meaning-display">完了！</div></div>`;
    choicesDiv.innerHTML = '';
    nextBtn.style.display = 'none';
    updateFooter();
    return;
  }

  const word = state.pool[state.currentIndex];
  state.answered = false;
  choicesDiv.innerHTML = '';
  nextBtn.style.display = 'none';
  
  if (state.mode === 'e2j' || state.mode === 'j2e') {
    container.innerHTML = `
      <div class="card" id="main-card">
        <div class="pos-tag">${word.p}</div>
        <div class="${state.mode === 'e2j' ? 'word-display' : 'meaning-display'}">${state.mode === 'e2j' ? word.w : word.m}</div>
        <div class="example-display" id="example-box">${word.e ? word.e : '<span style="opacity:0.45; font-style:italic;">（例文なし）</span>'}<br><br>${state.mode === 'e2j' ? word.m : word.w}</div>
      </div>
    `;
    
    let options = [word];
    let poolCopy = shuffle([...RAW_WORDS]);
    for (let w of poolCopy) {
      if (options.length >= 4) break;
      if (w.w !== word.w && !options.find(x => x.w === w.w)) {
        options.push(w);
      }
    }
    options = shuffle(options);
    state.currentOptions = options;
    
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerText = state.mode === 'e2j' ? opt.m : opt.w;
      btn.onclick = () => handleAnswer(opt, btn);
      choicesDiv.appendChild(btn);
    });
  } else if (state.mode === 'flash') {
    container.innerHTML = `
      <div class="card flash-mode" onclick="this.classList.toggle('flipped')">
        <div class="flip-card-inner">
          <div class="card-face">
            <div class="pos-tag">${word.p}</div>
            <div class="word-display">${word.w}</div>
          </div>
          <div class="card-face card-back">
            <div class="meaning-display">${word.m}</div>
            <div style="font-size: 14px; line-height: 1.5; color: ${word.e ? '#555' : 'var(--muted)'}; font-style: ${word.e ? 'normal' : 'italic'};">${word.e || '（例文なし）'}</div>
          </div>
        </div>
      </div>
    `;
    nextBtn.style.display = 'block';
    nextBtn.onclick = () => { state.currentIndex++; renderCurrent(); };
  } else if (state.mode === 'type') {
    container.innerHTML = `
      <div class="card" id="main-card">
        <div class="pos-tag">${word.p}</div>
        <div class="meaning-display">${word.m}</div>
        <div class="type-input-container">
          <input type="text" id="type-input" class="type-input" placeholder="Type English here..." autocomplete="off">
        </div>
        <div class="example-display" id="example-box">${word.e ? word.e : '<span style="opacity:0.45; font-style:italic;">（例文なし）</span>'}<br><br>${word.w}</div>
      </div>
    `;
    const input = document.getElementById('type-input');
    input.focus();
    input.onkeypress = (e) => {
      if (e.key === 'Enter') handleTypeAnswer(input.value);
    };
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerText = 'Check';
    btn.style.textAlign = 'center';
    btn.onclick = () => handleTypeAnswer(input.value);
    choicesDiv.appendChild(btn);
  }
  
  updateFooter();
}

function handleAnswer(selectedOpt, btn) {
  if (state.answered) return;
  state.answered = true;
  
  const word = state.pool[state.currentIndex];
  const isCorrect = selectedOpt.w === word.w;
  
  document.querySelectorAll('.choice-btn').forEach((b, i) => {
    if (state.currentOptions[i].w === word.w) {
      b.classList.add('correct');
    }
  });
  
  if (!isCorrect) {
    btn.classList.add('wrong');
    document.getElementById('main-card').classList.add('shake');
    setTimeout(() => document.getElementById('main-card').classList.remove('shake'), 400);
    recordWeak(word, false);
  } else {
    state.score++;
    recordWeak(word, true);
  }
  
  document.getElementById('example-box').style.display = 'block';
  const nextBtn = document.getElementById('next-btn');
  nextBtn.style.display = 'block';
  nextBtn.onclick = () => { state.currentIndex++; renderCurrent(); };
  updateFooter();
}

function handleTypeAnswer(val) {
  if (state.answered) return;
  state.answered = true;
  
  const word = state.pool[state.currentIndex];
  const isCorrect = val.trim().toLowerCase() === word.w.toLowerCase();
  
  const choicesDiv = document.getElementById('choices-container');
  choicesDiv.innerHTML = `<div class="choice-btn ${isCorrect ? 'correct' : 'wrong'}" style="text-align:center;">${isCorrect ? 'Correct!' : 'Wrong!'}</div>`;
  
  if (!isCorrect) {
    document.getElementById('main-card').classList.add('shake');
    setTimeout(() => document.getElementById('main-card').classList.remove('shake'), 400);
    recordWeak(word, false);
  } else {
    state.score++;
    recordWeak(word, true);
  }
  
  document.getElementById('example-box').style.display = 'block';
  const nextBtn = document.getElementById('next-btn');
  nextBtn.style.display = 'block';
  nextBtn.onclick = () => { state.currentIndex++; renderCurrent(); };
  updateFooter();
}

function recordWeak(word, isCorrect) {
  if (isCorrect) {
    if (state.weakData[word.w]) {
      state.weakData[word.w].streak = (state.weakData[word.w].streak || 0) + 1;
      if (state.weakData[word.w].streak >= 2) {
        delete state.weakData[word.w];
      }
    }
  } else {
    if (!state.weakData[word.w]) {
      state.weakData[word.w] = { streak: 0, added: Date.now() };
    } else {
      state.weakData[word.w].streak = 0;
    }
  }
  saveWeakData();
}

function updateFooter() {
  document.getElementById('progress-text').innerText = state.pool.length > 0 ? `${Math.min(state.currentIndex + 1, state.pool.length)} / ${state.pool.length}` : '0 / 0';
  document.getElementById('score-text').innerText = `👍 ${state.score}`;
  
  const stampsContainer = document.getElementById('stamps');
  stampsContainer.innerHTML = '';
  const totalStamps = 12;
  const filled = state.score % totalStamps;
  for (let i = 0; i < totalStamps; i++) {
    stampsContainer.innerHTML += `<div class="stamp ${i < filled ? 'filled' : ''}"></div>`;
  }
}

function toggleWeakList() {
  const sheet = document.getElementById('bottom-sheet');
  const overlay = document.getElementById('sheet-overlay');
  if (sheet.classList.contains('open')) {
    sheet.classList.remove('open');
    overlay.classList.remove('open');
  } else {
    renderWeakList();
    sheet.classList.add('open');
    overlay.classList.add('open');
  }
}

function renderWeakList() {
  const container = document.getElementById('weak-list-content');
  const keys = Object.keys(state.weakData);
  if (keys.length === 0) {
    container.innerHTML = '<p>苦手な単語はありません。</p>';
    return;
  }
  
  let html = '';
  keys.forEach(k => {
    const w = RAW_WORDS.find(x => x.w === k);
    if (!w) return;
    html += `
      <div class="weak-item">
        <div>
          <div class="weak-word">${w.w}</div>
          <div class="weak-meaning">${w.m}</div>
        </div>
        <button class="del-btn" onclick="removeWeak('${w.w}')">削除</button>
      </div>
    `;
  });
  container.innerHTML = html;
}

window.removeWeak = function(w) {
  delete state.weakData[w];
  saveWeakData();
  renderWeakList();
}

initFilters();
updateWeakBadge();
applyFilters();
</script>
</body>
</html>
