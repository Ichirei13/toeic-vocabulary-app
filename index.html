<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEIC Drill</title>
<meta name="theme-color" content="#1b1712">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TOEIC Drill">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root {
  --ink: #1b1712;
  --paper: #f2e6c9;
  --seal: #b3382a;
  --gold: #c9a05c;
  --jade: #4f7a68;
  --ivory: #f0e6d2;
  --muted: #8a7f6e;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
body {
  margin: 0; padding: 0;
  background-color: var(--ink);
  background-image: radial-gradient(circle at 50% 0%, #2a241d, var(--ink));
  color: var(--paper);
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
#app {
  max-width: 540px;
  margin: 0 auto;
  width: 100%;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  position: relative;
  overflow: hidden;
}
.header {
  padding: 10px 20px 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
}
.title-wrap { text-align: left; line-height: 1.15; }
.eyebrow {
  color: var(--gold);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin: 0;
}
.title {
  font-size: 17px;
  font-weight: bold;
  margin: 0;
}
.subtitle { display: none; }
.filter-toggle {
  flex-shrink: 0;
  background: rgba(242, 230, 201, 0.08);
  border: 1px solid rgba(242, 230, 201, 0.25);
  color: var(--paper);
  font-size: 12px;
  font-family: inherit;
  padding: 6px 12px;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.filter-toggle.active {
  background: var(--paper);
  color: var(--ink);
  border-color: var(--paper);
  font-weight: 600;
}
.filter-toggle .caret { font-size: 9px; transition: transform 0.25s; }
.filter-toggle.active .caret { transform: rotate(180deg); }
.filter-count {
  background: var(--seal);
  color: #fff;
  border-radius: 10px;
  min-width: 16px;
  padding: 1px 5px;
  font-size: 10px;
  font-weight: 700;
  display: none;
}
.filters {
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex-shrink: 0;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height 0.25s ease, opacity 0.2s ease, padding 0.25s ease;
}
.filters.open {
  max-height: 290px;
  opacity: 1;
  padding: 2px 20px 8px;
}
.filter-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.filter-row::-webkit-scrollbar { display: none; }
.chip {
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--muted);
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
  background: transparent;
  cursor: pointer;
  transition: all 0.2s;
}
.chip.active {
  background: var(--paper);
  color: var(--ink);
  border-color: var(--paper);
  font-weight: 600;
}
.segments {
  display: flex;
  background: rgba(242, 230, 201, 0.1);
  border-radius: 10px;
  padding: 3px;
  margin: 0 20px 6px;
  flex-shrink: 0;
}
.filters .segments { margin: 0; }
#mode-segments { margin: 2px 20px 8px; }
.segment {
  flex: 1;
  text-align: center;
  padding: 6px 4px;
  font-size: 12px;
  border-radius: 7px;
  color: var(--muted);
  cursor: pointer;
  transition: 0.3s;
}
.segment.active {
  background: var(--paper);
  color: var(--ink);
  font-weight: bold;
}
.main-area {
  flex: 1;
  min-height: 0;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#quiz-container {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.card {
  background: var(--paper);
  color: var(--ink);
  border-radius: 16px;
  padding: 14px 18px;
  text-align: center;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  margin-bottom: 10px;
  position: relative;
  transition: transform 0.3s, opacity 0.3s;
  flex: 0 1 auto;
  min-height: clamp(120px, 26vh, 240px);
  max-height: 100%;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform-style: preserve-3d;
}
.card > * { flex-shrink: 0; }
.card::before, .card::after { content: ''; flex: 1 0 0; }
.card.flash-mode::before, .card.flash-mode::after { content: none; }
.card.shake {
  animation: shake 0.4s;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
.word-display {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: clamp(22px, 7vw, 32px);
  font-weight: bold;
  margin-bottom: 8px;
  line-height: 1.2;
  word-break: break-word;
}
.pos-tag {
  background: rgba(0,0,0,0.06);
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  color: var(--ink);
  margin-bottom: 8px;
  flex-shrink: 0;
}
.meaning-display {
  font-size: clamp(16px, 5vw, 20px);
  font-weight: 600;
  margin-bottom: 8px;
  line-height: 1.35;
}
.example-display {
  font-size: 13px;
  color: #555;
  line-height: 1.45;
  margin-top: 10px;
  border-top: 1px dashed rgba(0,0,0,0.1);
  padding-top: 10px;
  display: none;
}
.choices {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 10px;
  flex-shrink: 0;
}
.choice-btn {
  background: rgba(242, 230, 201, 0.05);
  border: 1px solid rgba(242, 230, 201, 0.2);
  color: var(--paper);
  font-family: inherit;
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.35;
  text-align: left;
  cursor: pointer;
  transition: 0.2s;
}
.choice-btn:active { background: rgba(242, 230, 201, 0.1); }
.choice-btn.correct {
  background: var(--jade);
  border-color: var(--jade);
  color: white;
}
.choice-btn.wrong {
  background: var(--seal);
  border-color: var(--seal);
  color: white;
}
.action-bar {
  flex-shrink: 0;
  height: 54px;
  padding: 0 20px 8px;
  display: flex;
  gap: 8px;
}
.next-btn {
  background: var(--gold);
  color: var(--ink);
  border: none;
  font-family: inherit;
  padding: 13px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  flex: 1;
  display: none;
}
.dont-know-btn {
  background: transparent;
  color: var(--muted);
  border: 1px dashed rgba(242, 230, 201, 0.35);
  font-family: inherit;
  padding: 13px;
  border-radius: 12px;
  font-size: 14px;
  cursor: pointer;
  flex: 1;
  display: none;
  transition: 0.2s;
}
.dont-know-btn:active { background: rgba(242, 230, 201, 0.08); color: var(--paper); }
.type-input-container {
  width: 100%;
  margin-top: 12px;
}
.type-input {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 2px solid var(--ink);
  font-family: ui-monospace, SFMono-Regular, monospace;
  font-size: 24px;
  text-align: center;
  padding: 8px;
  color: var(--ink);
  outline: none;
}
.type-input::placeholder { color: rgba(0,0,0,0.2); }
.footer {
  padding: 8px 20px 12px;
  border-top: 1px solid rgba(242, 230, 201, 0.1);
  flex-shrink: 0;
}
.stats {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
}
.progress-track {
  height: 4px;
  border-radius: 2px;
  background: rgba(242, 230, 201, 0.15);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0;
  background: var(--gold);
  transition: width 0.3s;
}
.sheet-close {
  position: sticky;
  top: 0;
  float: right;
  margin: -8px -8px 0 0;
  z-index: 1;
  width: 32px; height: 32px;
  border-radius: 50%;
  border: none;
  background: rgba(0,0,0,0.08);
  color: var(--ink);
  font-size: 16px;
  cursor: pointer;
}
/* 文法: 回答後は選択肢を1行に縮めて解説に縦を譲る */
.choices.compact { flex-direction: row; }
.choices.compact .choice-btn {
  flex: 1;
  padding: 8px 4px;
  text-align: center;
  font-size: 13px;
}
.choices.compact .choice-text { display: none; }
.choice-mark { margin-left: 6px; font-weight: 700; }
.choices.compact .choice-btn.correct .choice-label,
.choices.compact .choice-btn.wrong .choice-label { color: #fff; }
.grammar-your-ans {
  font-size: 13px;
  color: var(--seal);
  font-weight: 600;
  margin: -4px 0 8px;
}
/* タイプモード */
.type-check-btn {
  width: 100%;
  margin-top: 10px;
  background: var(--ink);
  color: var(--paper);
  border: none;
  border-radius: 10px;
  padding: 10px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.type-input:disabled { opacity: 1; -webkit-text-fill-color: var(--ink); }
.type-result {
  width: 100%;
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  text-align: left;
  font-size: 14px;
  line-height: 1.6;
}
.type-result.ok { background: rgba(79, 122, 104, 0.15); }
.type-result.ng { background: rgba(179, 56, 42, 0.1); }
.type-result-label { font-size: 11px; color: var(--muted); margin-right: 6px; }
.type-result-yours { text-decoration: line-through; color: var(--seal); font-family: ui-monospace, SFMono-Regular, monospace; }
.type-result-answer { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 20px; font-weight: bold; color: var(--jade); }
.bottom-sheet {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: var(--paper);
  color: var(--ink);
  border-radius: 24px 24px 0 0;
  padding: 24px;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  max-height: 80vh;
  overflow-y: auto;
  z-index: 100;
}
.bottom-sheet.open { transform: translateY(0); }
.bottom-sheet .chip { border-color: rgba(0,0,0,0.25); color: var(--muted); }
.bottom-sheet .chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.guide-chapter { margin-top: 20px; }
.guide-chapter h3 { font-size: 15px; margin: 0 0 8px; padding-bottom: 6px; border-bottom: 2px solid var(--gold); }
.guide-notes { font-size: 13px; line-height: 1.7; white-space: pre-wrap; background: rgba(255,255,255,0.45); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
.guide-notes.empty { color: var(--muted); font-style: italic; }
.guide-label { font-size: 11px; font-weight: bold; color: var(--muted); margin: 10px 0 4px; }
.guide-themes { display: flex; flex-wrap: wrap; gap: 4px; }
.guide-theme { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: rgba(0,0,0,0.06); }
.guide-rule { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.08); }
.guide-rule-no { flex-shrink: 0; min-width: 34px; font-size: 12px; font-weight: bold; color: #b45309; }
.guide-rule-title { flex: 1; font-size: 13px; line-height: 1.5; }
.guide-rule-meta { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.guide-rule-weak { color: var(--seal); font-weight: bold; }
.guide-solve-btn { flex-shrink: 0; background: transparent; border: 1px solid var(--jade); color: var(--jade); border-radius: 12px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
.phase-overview { font-size: 13px; line-height: 1.7; margin-bottom: 10px; }
.phase-cards { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
.phase-card { background: rgba(255,255,255,0.5); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.6; }
.phase-card strong { display: block; color: #b45309; font-size: 13px; }
.phase-list { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.7; }
.phase-steps { display: flex; flex-direction: column; gap: 8px; }
.phase-step { display: flex; gap: 10px; background: rgba(234,179,8,0.08); border-left: 3px solid #eab308; border-radius: 6px; padding: 8px 10px; }
.phase-step-no { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: #b45309; color: #fff; font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
.phase-step-title { font-size: 13px; font-weight: bold; color: #b45309; }
.phase-step-action { font-size: 12.5px; font-weight: 600; margin-top: 2px; line-height: 1.6; }
.phase-step-detail { font-size: 12px; color: #555; margin-top: 4px; line-height: 1.65; white-space: pre-line; }
.phase-tips { margin-top: 10px; background: rgba(234,179,8,0.12); border-radius: 8px; padding: 8px 10px; }
.phase-tips-title { font-size: 12px; font-weight: bold; color: #b45309; margin-bottom: 2px; }
.grammar-phase-details { margin: 10px 0; padding: 10px 12px; background: rgba(234,179,8,0.08); border: 1px solid rgba(234,179,8,0.25); border-radius: 8px; }
.grammar-phase-details summary { cursor: pointer; font-weight: 600; color: #b45309; font-size: 13px; }
.grammar-phase-details .phase-steps { margin-top: 10px; }
.chip.rule-filter-chip { border-color: #b45309; color: #b45309; }
.sheet-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
  z-index: 99;
}
.sheet-overlay.open { opacity: 1; pointer-events: auto; }
.weak-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid rgba(0,0,0,0.1);
}
.weak-word {
  font-family: monospace;
  font-size: 16px;
  font-weight: bold;
}
.weak-meaning {
  font-size: 13px;
  color: #555;
  margin-top: 4px;
}
.del-btn {
  background: transparent;
  border: 1px solid var(--seal);
  color: var(--seal);
  border-radius: 12px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
}
.weak-list-summary { font-size: 12px; color: var(--muted); margin: -4px 0 8px; }
.weak-list-summary strong { color: var(--seal); }
.weak-due { font-size: 11px; color: var(--muted); margin-top: 4px; }
.weak-due.now { color: var(--seal); font-weight: bold; }
.weak-badge {
  background: var(--seal);
  color: white;
  border-radius: 10px;
  padding: 2px 6px;
  font-size: 10px;
  vertical-align: middle;
  margin-left: 4px;
}
.card.flash-mode {
  flex: 1;
  cursor: pointer;
  perspective: 1000px;
  padding: 0;
  background: transparent;
  box-shadow: none;
  border: none;
  min-height: 200px;
  overflow: visible;
}
.card.flash-mode > * { margin: 0; }
.flip-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 200px;
  text-align: center;
  transition: transform 0.6s;
  transform-style: preserve-3d;
}
.card.flash-mode.flipped .flip-card-inner {
  transform: rotateY(180deg);
}
.card-face {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  min-height: 200px;
  overflow-y: auto;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  background: var(--paper);
  color: var(--ink);
  border-radius: 16px;
  padding: 20px 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.card-back {
  transform: rotateY(180deg);
}

/* Grammar Part 5 styles */
.grammar-card {
  text-align: left !important;
  align-items: flex-start !important;
  padding: 16px 18px !important;
  min-height: 180px;
  max-height: 100%;
  overflow-y: auto;
}
.grammar-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-bottom: 10px;
  font-size: 11px;
}
/* Book and Rule Badges */
.grammar-book-badge {
  padding: 2px 7px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 10px;
  display: inline-flex;
  align-items: center;
}
.badge-kin {
  background: rgba(234, 179, 8, 0.2);
  color: #b45309;
  border: 1px solid rgba(234, 179, 8, 0.4);
}
.badge-sekai {
  background: rgba(59, 130, 246, 0.15);
  color: #1d4ed8;
  border: 1px solid rgba(59, 130, 246, 0.3);
}
.grammar-rule-card {
  margin: 10px 0 14px 0;
  padding: 10px 14px;
  background: linear-gradient(135deg, rgba(234, 179, 8, 0.15), rgba(245, 158, 11, 0.06));
  border: 1px solid rgba(234, 179, 8, 0.45);
  border-left: 4px solid #eab308;
  border-radius: 8px;
  text-align: left;
}
.grammar-rule-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}
.grammar-rule-icon {
  font-size: 14px;
}
.grammar-rule-badge-text {
  font-size: 11px;
  font-weight: 800;
  color: #b45309;
  letter-spacing: 0.3px;
}
.grammar-rule-cat {
  font-size: 10px;
  color: var(--muted);
  background: rgba(0,0,0,0.06);
  padding: 1px 6px;
  border-radius: 4px;
}
.grammar-rule-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.45;
}

.grammar-badge {
  background: var(--seal);
  color: #fff;
  padding: 2px 7px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 10px;
}
.grammar-chapter {
  color: var(--muted);
  font-weight: 600;
}
.grammar-theme {
  color: var(--ink);
  opacity: 0.85;
}
.grammar-theme-revealed {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 8px;
}
.grammar-question {
  font-size: 15px;
  line-height: 1.55;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 8px;
  word-break: break-word;
}
.grammar-exp-container {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed rgba(0,0,0,0.15);
  width: 100%;
}
.grammar-correct-ans {
  font-size: 14px;
  color: var(--jade);
  font-weight: 700;
  margin-bottom: 8px;
}
.grammar-exp-text {
  font-size: 12.5px;
  line-height: 1.6;
  color: #333;
  white-space: pre-line;
  margin-bottom: 10px;
}
.grammar-vocab-list {
  background: rgba(0,0,0,0.04);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 11.5px;
}
.grammar-vocab-title {
  font-weight: 700;
  margin-bottom: 4px;
  color: var(--ink);
}
.grammar-vocab-items {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
}
.grammar-vocab-item {
  color: #444;
}
.choice-label {
  display: inline-block;
  font-weight: 700;
  margin-right: 6px;
  color: var(--gold);
}

</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="title-wrap">
      <div class="eyebrow">TOEIC Drill</div>
      <h1 class="title">単語ドリル</h1>
    </div>
    <button class="filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="filter-drawer">
      絞り込み<span class="filter-count" id="filter-count">0</span><span class="caret">▼</span>
    </button>
  </div>

  <div class="segments" id="app-type-segments" style="margin: 0 20px 8px;">
    <div class="segment active" data-app="vocab">単語ドリル</div>
    <div class="segment" data-app="grammar">文法ドリル (Part 5)</div>
  </div>

  <div class="filters" id="filter-drawer">

<script>
// localStorage が壊れていたり使えなかったり（プライベートモードなど）しても起動できるようにする
function loadJSON(key, fallback) {
  try {
    const v = JSON.parse(localStorage.getItem(key));
    if (v === null || typeof v !== typeof fallback || Array.isArray(v) !== Array.isArray(fallback)) return fallback;
    return v;
  } catch (e) {
    return fallback;
  }
}

function saveJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    // 保存できなくても学習は続けられるので無視する
  }
}

// ==================== 苦手の間隔復習 ====================

const DAY_MS = 24 * 60 * 60 * 1000;
// 復習の間隔（日）。復習日以降に正解するたびに次の間隔へ進み、最後の間隔のあとも正解したら苦手から外れる
const REVIEW_INTERVALS = [1, 3, 7];

// 前のバージョンの記録（復習日なし）は「今すぐ復習」からやり直す
function loadWeakData(key) {
  const data = loadJSON(key, {});
  Object.keys(data).forEach(k => {
    const e = data[k];
    if (!e || typeof e !== 'object') delete data[k];
    else if (typeof e.due !== 'number') data[k] = { streak: 0, added: e.added || Date.now(), due: 0 };
  });
  return data;
}

function startOfToday() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

function isDue(entry) {
  return entry.due <= Date.now();
}

// 回答結果を苦手データに反映する（単語・文法共通）。間違えたら今すぐ復習対象に戻す
function updateWeakEntry(store, key, isCorrect) {
  const entry = store[key];
  if (!isCorrect) {
    store[key] = { streak: 0, added: entry ? entry.added : Date.now(), due: Date.now() };
    return;
  }
  // 苦手でない問題や、復習日より前の正解では記録を進めない
  if (!entry || !isDue(entry)) return;
  if (entry.streak >= REVIEW_INTERVALS.length) {
    delete store[key];
  } else {
    entry.streak++;
    entry.due = startOfToday() + REVIEW_INTERVALS[entry.streak - 1] * DAY_MS;
  }
}

// 苦手リストに出す「次の復習」の表示
function dueLabel(entry) {
  if (isDue(entry)) return '<div class="weak-due now">要復習</div>';
  const days = Math.round((entry.due - startOfToday()) / DAY_MS);
  const d = new Date(entry.due);
  return `<div class="weak-due">次の復習 ${d.getMonth()+1}/${d.getDate()}（${days === 1 ? '明日' : `${days}日後`}）</div>`;
}

let state = {
  app: 'vocab', // 'vocab' or 'grammar'

  // Vocab state
  mode: 'e2j',
  sourceFilter: 'all',
  rangeFilter: null,
  dateFilter: [],
  posFilter: 'all',
  weakFilter: 'all',
  pool: [],
  currentIndex: 0,
  score: 0,
  answeredCount: 0,
  weakData: loadWeakData('toeic_weak_words'),
  seenWords: new Set(loadJSON('toeic_seen_words', [])),
  currentOptions: [],
  answered: false,

  // Grammar state
  grammarBook: 'all',
  grammarChapter: 'all',
  grammarWeakFilter: 'all',
  grammarRule: null, // 金のルール番号で絞り込み中なら数値
  guideChapter: 'all',
  grammarPool: [],
  currentGrammarIndex: 0,
  grammarScore: 0,
  grammarAnsweredCount: 0,
  grammarWeakData: loadWeakData('toeic_weak_grammar'),
  grammarAnswered: false,

  weakSort: 'new' // 苦手リストの並び順
};

// "2026-06-22" を現地時間の日付として読む（new Date("2026-06-22") は UTC 扱いで、日本より西の地域では前日になる）
function parseLocalDate(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function getWeekLabel(dateStr) {
  const d = parseLocalDate(dateStr);
  const day = d.getDay();
  d.setDate(d.getDate() - (day === 0 ? 6 : day - 1)); // その週の月曜
  return `${d.getMonth()+1}/${d.getDate()}〜`;
}

// ラベルのまま並べると "7/13〜" が "7/6〜" より前に来るので、元の日付順に並べてからラベルにする
const DATES = [...new Set(RAW_WORDS.filter(x => x.d).map(x => x.d).sort().map(getWeekLabel))];

function saveWeakData() {
  saveJSON('toeic_weak_words', state.weakData);
  updateWeakBadge();
}

function setBadge(id, count) {
  const badge = document.getElementById(id);
  if (!badge) return;
  badge.style.display = count > 0 ? 'inline-block' : 'none';
  badge.innerText = count;
}

function updateWeakBadge() {
  // 「苦手のみ」「要復習」を押したときに出る問題数（今の出典・日付・品詞・範囲の絞り込みを反映）
  const weak = dedupeWords(RAW_WORDS.filter(w => state.weakData[w.w] !== undefined && wordMatchesBaseFilters(w)));
  setBadge('weak-badge', weak.length);
  setBadge('due-badge', weak.filter(w => isDue(state.weakData[w.w])).length);
}

// TEPPAN の番号を100語ずつに区切った範囲
const TEPPAN_MAX_NO = RAW_WORDS.reduce((max, w) => (w.s === 'teppan' && w.no ? Math.max(max, w.no) : max), 0);
const TEPPAN_RANGES = [];
for (let start = 1; start <= TEPPAN_MAX_NO; start += 100) {
  TEPPAN_RANGES.push({ start, end: Math.min(start + 99, TEPPAN_MAX_NO) });
}

function initRangeFilters() {
  const rf = document.getElementById('range-filters');
  if (!rf) return;
  let html = `<button class="chip active" data-range="all">全番号 (1〜${TEPPAN_MAX_NO})</button>`;
  TEPPAN_RANGES.forEach(({ start, end }) => {
    html += `<button class="chip" data-range="${start}-${end}">${start}〜${end}</button>`;
  });
  rf.innerHTML = html;

  rf.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', e => {
      rf.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      const val = e.currentTarget.dataset.range;
      if (val === 'all') {
        state.rangeFilter = null;
      } else {
        const [start, end] = val.split('-').map(Number);
        state.rangeFilter = { start, end };
      }
      applyFilters();
    });
  });
}


// ==================== GRAMMAR LOGIC ====================

function saveGrammarWeakData() {
  saveJSON('toeic_weak_grammar', state.grammarWeakData);
  updateGrammarWeakBadge();
}

function updateGrammarWeakBadge() {
  // 「苦手のみ」「要復習」を押したときに出る問題数（今の本・章・ルールの絞り込みを反映）
  const weak = RAW_GRAMMAR.filter(ex => state.grammarWeakData[ex.id] !== undefined && grammarMatchesBaseFilters(ex));
  setBadge('grammar-weak-badge', weak.length);
  setBadge('grammar-due-badge', weak.filter(ex => isDue(state.grammarWeakData[ex.id])).length);
}

function getGrammarChaptersList() {
  const book = state.grammarBook || 'all';
  const pool = book === 'all' ? RAW_GRAMMAR : RAW_GRAMMAR.filter(g => (g.b || 'sekai') === book);
  
  if (book === 'kin') {
    const kinChaps = [];
    const seen = new Set();
    RAW_GRAMMAR.filter(g => g.b === 'kin').forEach(g => {
      if (!seen.has(g.ch)) {
        seen.add(g.ch);
        const count = RAW_GRAMMAR.filter(x => x.b === 'kin' && x.ch === g.ch).length;
        kinChaps.push({ ch: g.ch, title: `第${g.ch}章 ${g.ch_title} (${count}問)` });
      }
    });
    return [{ ch: 'all', title: `金の文法 全7章 (${pool.length}問)` }, ...kinChaps];
  } else if (book === 'sekai') {
    const sekaiChaps = [];
    const seen = new Set();
    RAW_GRAMMAR.filter(g => (g.b || 'sekai') === 'sekai').forEach(g => {
      if (!seen.has(g.ch)) {
        seen.add(g.ch);
        const count = RAW_GRAMMAR.filter(x => (x.b || 'sekai') === 'sekai' && x.ch === g.ch).length;
        sekaiChaps.push({ ch: g.ch, title: `第${g.ch}章 ${g.ch_title} (${count}問)` });
      }
    });
    return [{ ch: 'all', title: `世界一 全14章 (${pool.length}問)` }, ...sekaiChaps];
  } else {
    return [
      { ch: 'all', title: `全問 (${pool.length}問)` }
    ];
  }
}

function renderGrammarChapterFilters() {
  const gcf = document.getElementById('grammar-chapter-filters');
  if (!gcf) return;
  
  const chapters = getGrammarChaptersList();
  let html = '';
  if (state.grammarRule !== null) {
    html += `<button class="chip active rule-filter-chip" data-clear-rule="1">金のルール ${state.grammarRule} で絞り込み中 ✕</button>`;
  }
  chapters.forEach((c, idx) => {
    const isActive = state.grammarRule === null && ((state.grammarChapter === c.ch) || (idx === 0 && state.grammarChapter === 'all'));
    html += `<button class="chip ${isActive ? 'active' : ''}" data-gchapter="${c.ch}">${c.title}</button>`;
  });
  gcf.innerHTML = html;

  gcf.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', e => {
      const val = e.currentTarget.dataset.gchapter;
      state.grammarRule = null;
      state.grammarChapter = val === undefined || val === 'all' ? 'all' : Number(val);
      renderGrammarChapterFilters();
      applyGrammarFilters();
    });
  });
}

function initGrammarFilters() {
  // Book segments
  const gbs = document.getElementById('grammar-book-segments');
  if (gbs) {
    gbs.querySelectorAll('.segment').forEach(btn => {
      btn.addEventListener('click', e => {
        gbs.querySelectorAll('.segment').forEach(b => b.classList.remove('active'));
        const target = e.currentTarget;
        target.classList.add('active');
        state.grammarBook = target.dataset.gbook;
        state.grammarChapter = 'all';
        state.grammarRule = null;
        renderGrammarChapterFilters();
        applyGrammarFilters();
      });
    });
  }

  renderGrammarChapterFilters();

  document.querySelectorAll('#grammar-weak-segments .segment').forEach(btn => {
    btn.addEventListener('click', e => {
      document.querySelectorAll('#grammar-weak-segments .segment').forEach(b => b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      state.grammarWeakFilter = e.currentTarget.dataset.gweak;
      applyGrammarFilters();
    });
  });
}

// 苦手フィルタ以外の絞り込み（本・章・ルール）
function grammarMatchesBaseFilters(ex) {
  const itemBook = ex.b || 'sekai';
  if (state.grammarBook !== 'all' && itemBook !== state.grammarBook) return false;
  if (state.grammarChapter !== 'all' && ex.ch !== state.grammarChapter) return false;
  if (state.grammarRule !== null && ex.rule?.number !== state.grammarRule) return false;
  return true;
}

function applyGrammarFilters() {
  let filtered = RAW_GRAMMAR.filter(ex => {
    if (!grammarMatchesBaseFilters(ex)) return false;
    const entry = state.grammarWeakData[ex.id];
    if (state.grammarWeakFilter === 'weak_only' && !entry) return false;
    if (state.grammarWeakFilter === 'due' && !(entry && isDue(entry))) return false;
    return true;
  });

  state.grammarPool = shuffle(filtered);
  state.currentGrammarIndex = 0;
  state.grammarScore = 0;
  state.grammarAnsweredCount = 0;
  updateGrammarWeakBadge();
  updateFilterSummary();
  renderCurrentGrammar();
}

function renderCurrentGrammar() {
  resetActionBar();
  document.getElementById('choices-container').classList.remove('compact');
  const container = document.getElementById('quiz-container');
  const choicesDiv = document.getElementById('choices-container');
  const nextBtn = document.getElementById('next-btn');

  if (state.grammarPool.length === 0) {
    container.innerHTML = `<div class="card"><div class="meaning-display">条件に合う文法問題がありません</div></div>`;
    choicesDiv.innerHTML = '';
    nextBtn.style.display = 'none';
    updateFooter();
    return;
  }

  if (state.currentGrammarIndex >= state.grammarPool.length) {
    container.innerHTML = `<div class="card"><div class="meaning-display">文法ドリル完了！ 🎉</div><div style="font-size:14px;color:var(--muted);margin-top:8px;">正答: ${state.grammarScore} / ${state.grammarAnsweredCount}</div></div>`;
    choicesDiv.innerHTML = '';
    nextBtn.style.display = 'none';
    updateFooter();
    return;
  }

  const ex = state.grammarPool[state.currentGrammarIndex];
  state.grammarAnswered = false;
  choicesDiv.innerHTML = '';
  nextBtn.style.display = 'none';

  // Highlight blank in question
  const formattedQ = ex.q.replace(/-{3,}/g, '<span style="color:var(--seal);font-weight:bold;text-decoration:underline;">_______</span>');

  const isKin = ex.b === 'kin';
  const bookBadgeHtml = isKin 
    ? '<span class="grammar-book-badge badge-kin">👑 金の文法</span>'
    : '<span class="grammar-book-badge badge-sekai">📖 世界一</span>';

  const ruleHtml = (ex.rule && ex.rule.number) ? `
    <div class="grammar-rule-card">
      <div class="grammar-rule-header">
        <span class="grammar-rule-icon">👑</span>
        <span class="grammar-rule-badge-text">金のルール ${ex.rule.number}</span>
        ${ex.rule.category && ex.rule.category !== `第${ex.ch}章 ${ex.ch_title}` ? `<span class="grammar-rule-cat">${ex.rule.category}</span>` : ''}
      </div>
      <div class="grammar-rule-title">${ex.rule.title}</div>
    </div>
  ` : '';

  const phaseInfo = isKin ? (typeof KIN_PHASES !== 'undefined' ? KIN_PHASES.find(p => p.chapter === ex.ch) : null) : null;
  const phaseHtml = (phaseInfo && phaseInfo.phases) ? `
    <details class="grammar-phase-details">
      <summary>💡 第${ex.ch}章 (${escapeHtml(phaseInfo.chapter_title)}) の解き方手順を見る</summary>
      ${renderPhaseSteps(phaseInfo.phases)}
    </details>
  ` : '';

  container.innerHTML = `
    <div class="card grammar-card" id="main-card">
      <div class="grammar-meta">
        <span class="grammar-badge">Part 5</span>
        ${bookBadgeHtml}
      </div>
      <div class="grammar-question">${formattedQ}</div>
      <div class="grammar-exp-container" id="grammar-exp-box" style="display:none;">
        <div class="grammar-correct-ans">正解: (${['A','B','C','D'][ex.a]}) ${ex.c[ex.a]}</div>
        <div class="grammar-your-ans" id="grammar-your-ans" style="display:none;"></div>
        <div class="grammar-theme-revealed">第${ex.ch}章 ${ex.ch_title} ・${ex.th_title}</div>
        ${ruleHtml}
        ${phaseHtml}
        <div class="grammar-exp-text">${ex.exp}</div>
        ${ex.v && ex.v.length > 0 ? `
          <div class="grammar-vocab-list">
            <div class="grammar-vocab-title">📌 重要語彙</div>
            <div class="grammar-vocab-items">
              ${ex.v.map(v => `<span class="grammar-vocab-item"><strong>${v.word}</strong>: ${v.meaning}</span>`).join('')}
            </div>
          </div>
        ` : ''}
      </div>
    </div>
  `;

  const labels = ['A', 'B', 'C', 'D'];
  ex.c.forEach((choice, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-label">${labels[idx]}</span><span class="choice-text">${choice}</span>`;
    btn.onclick = () => handleGrammarAnswer(idx, btn);
    choicesDiv.appendChild(btn);
  });
  setDontKnowVisible(true);
  document.getElementById('dont-know-btn').onclick = handleGrammarDontKnow;

  updateFooter();
}

function handleGrammarAnswer(selectedIdx, btn) {
  if (state.grammarAnswered) return;
  const ex = state.grammarPool[state.currentGrammarIndex];
  const isCorrect = selectedIdx === ex.a;

  if (!isCorrect) {
    btn.classList.add('wrong');
    shakeCard();
    const yours = document.getElementById('grammar-your-ans');
    yours.textContent = `あなたの回答: (${['A','B','C','D'][selectedIdx]}) ${ex.c[selectedIdx]}`;
    yours.style.display = 'block';
    recordWeakGrammar(ex, false);
  } else {
    state.grammarScore++;
    recordWeakGrammar(ex, true);
  }
  revealGrammarAnswer(ex);
}

// 「わからない」: 正解と解説を見せて苦手に登録。スコアは増やさず、赤表示や揺れは出さない
function handleGrammarDontKnow() {
  if (state.grammarAnswered) return;
  const ex = state.grammarPool[state.currentGrammarIndex];
  recordWeakGrammar(ex, false);
  revealGrammarAnswer(ex);
}

function revealGrammarAnswer(ex) {
  state.grammarAnswered = true;
  setDontKnowVisible(false);

  const choicesDiv = document.getElementById('choices-container');
  choicesDiv.querySelectorAll('.choice-btn').forEach((b, i) => {
    if (i === ex.a) b.classList.add('correct');
    const mark = i === ex.a ? '✓' : (b.classList.contains('wrong') ? '✗' : '');
    if (mark) b.insertAdjacentHTML('beforeend', `<span class="choice-mark">${mark}</span>`);
    // 回答後は全文表示のまま。タップで記号だけの1行に縮めて解説を広く読める（再タップで戻る）
    b.onclick = () => choicesDiv.classList.toggle('compact');
  });

  const expBox = document.getElementById('grammar-exp-box');
  if (expBox) expBox.style.display = 'block';

  showNextButton(() => {
    state.currentGrammarIndex++;
    renderCurrentGrammar();
  });
  updateFooter();
}

function recordWeakGrammar(ex, isCorrect) {
  state.grammarAnsweredCount++;
  updateWeakEntry(state.grammarWeakData, ex.id, isCorrect);
  saveGrammarWeakData();
}

function renderGrammarWeakList() {
  const container = document.getElementById('weak-list-content');
  const items = Object.keys(state.grammarWeakData)
    .map(id => ({ key: id, entry: state.grammarWeakData[id], ex: RAW_GRAMMAR.find(g => g.id === Number(id)) }))
    .filter(x => x.ex);
  document.getElementById('sheet-title').innerText = `苦手リスト（${items.length}）`;
  if (items.length === 0) {
    container.innerHTML = '<div style="color:var(--muted);text-align:center;padding:20px;">文法の苦手問題はありません</div>';
    return;
  }
  const bookOrder = ex => (ex.b === 'kin' ? 0 : 1);
  sortWeakItems(items, (a, b) => bookOrder(a.ex) - bookOrder(b.ex) || a.ex.ch - b.ex.ch || a.ex.id - b.ex.id);

  let html = weakListHeader(items, '本・章順');
  items.forEach(({ key, entry, ex }) => {
    html += `
      <div class="weak-item" style="flex-direction:column;align-items:flex-start;gap:6px;">
        <div style="display:flex;justify-content:space-between;width:100%;align-items:center;">
          <span style="font-size:11px;color:var(--muted);font-weight:bold;">
            ${ex.b === 'kin' ? '<span style="color:#b45309;">👑 金の文法</span>' : '<span style="color:#1d4ed8;">📖 世界一</span>'} 第${ex.ch}章 ${ex.ch_title}
          </span>
          <button class="del-btn" data-remove-weak="${key}">削除</button>
        </div>
        ${ex.rule ? `<div style="font-size:11px;color:#b45309;font-weight:bold;background:rgba(234,179,8,0.15);padding:2px 6px;border-radius:4px;border:1px solid rgba(234,179,8,0.4);">👑 金のルール ${ex.rule.number}: ${ex.rule.title}</div>` : ''}
        <div style="font-size:13px;font-weight:600;color:var(--ink);">${ex.q}</div>
        <div style="font-size:12px;color:var(--jade);">正解: (${['A','B','C','D'][ex.a]}) ${ex.c[ex.a]}</div>
        ${dueLabel(entry)}
      </div>
    `;
  });
  container.innerHTML = html;
}

// 単語／文法の切り替え。前回の続きが保存されていればそこから、なければ今の絞り込みで出題し直す
function setApp(app) {
  state.app = app;
  const isGrammar = app === 'grammar';
  document.querySelectorAll('#app-type-segments .segment').forEach(b => b.classList.toggle('active', b.dataset.app === app));
  document.querySelector('.header .title').innerText = isGrammar ? '文法ドリル (Part 5)' : '単語ドリル';
  document.getElementById('rule-guide-link').style.display = isGrammar ? 'inline' : 'none';
  document.getElementById('mode-segments').style.display = isGrammar ? 'none' : 'flex';
  document.getElementById('vocab-filters').style.display = isGrammar ? 'none' : 'block';
  document.getElementById('grammar-filters').style.display = isGrammar ? 'block' : 'none';
  resetActionBar();

  if (isGrammar) {
    if (!restoreSession('grammar')) return applyGrammarFilters();
    updateGrammarWeakBadge();
    updateFilterSummary();
    renderCurrentGrammar();
  } else {
    if (!restoreSession('vocab')) return applyFilters();
    updateWeakBadge();
    updateFilterSummary();
    renderCurrent();
  }
}

// TEPPAN は番号範囲で、それ以外は日付・品詞で絞る
function updateSourceRows() {
  const teppan = state.sourceFilter === 'teppan';
  document.getElementById('date-filters').style.display = teppan ? 'none' : 'flex';
  document.getElementById('pos-filters').style.display = teppan ? 'none' : 'flex';
  document.getElementById('range-filters').style.display = teppan ? 'flex' : 'none';
}

// ボタンの選択表示を state に合わせる（保存していた設定を復元したときなど）
function syncFilterUI() {
  const mark = (selector, isActive) =>
    document.querySelectorAll(selector).forEach(b => b.classList.toggle('active', isActive(b.dataset)));
  const range = state.rangeFilter ? `${state.rangeFilter.start}-${state.rangeFilter.end}` : 'all';
  mark('#source-segments .segment', d => d.source === state.sourceFilter);
  mark('#date-filters .chip', d => d.date === 'all' ? state.dateFilter.length === 0 : state.dateFilter.includes(d.date));
  mark('#pos-filters .chip', d => d.pos === state.posFilter);
  mark('#range-filters .chip', d => d.range === range);
  mark('#weak-segments .segment', d => d.weak === state.weakFilter);
  mark('#mode-segments .segment', d => d.mode === state.mode);
  mark('#grammar-book-segments .segment', d => d.gbook === state.grammarBook);
  mark('#grammar-weak-segments .segment', d => d.gweak === state.grammarWeakFilter);
  renderGrammarChapterFilters();
  updateSourceRows();
}

function initFilters() {
  document.querySelectorAll('#app-type-segments .segment').forEach(btn => {
    btn.addEventListener('click', e => setApp(e.currentTarget.dataset.app));
  });

  initGrammarFilters();
  initRangeFilters();

  document.querySelectorAll('#source-segments .segment').forEach(btn => {
    btn.addEventListener('click', e => {
      document.querySelectorAll('#source-segments .segment').forEach(b => b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      state.sourceFilter = e.currentTarget.dataset.source;
      updateSourceRows();
      applyFilters();
    });
  });

  const df = document.getElementById('date-filters');
  df.innerHTML = `<button class="chip active" data-date="all">すべて</button>`;
  DATES.forEach(d => {
    df.innerHTML += `<button class="chip" data-date="${d}">${d}</button>`;
  });
  
  document.querySelectorAll('#date-filters .chip').forEach(btn => {
    btn.addEventListener('click', e => {
      const val = e.currentTarget.dataset.date;
      if (val === 'all') {
        state.dateFilter = [];
      } else if (state.dateFilter.includes(val)) {
        state.dateFilter = state.dateFilter.filter(x => x !== val);
      } else {
        state.dateFilter.push(val);
      }
      syncFilterUI();
      applyFilters();
    });
  });

  document.querySelectorAll('#pos-filters .chip').forEach(btn => {
    btn.addEventListener('click', e => {
      document.querySelectorAll('#pos-filters .chip').forEach(b => b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      state.posFilter = e.currentTarget.dataset.pos;
      applyFilters();
    });
  });

  document.querySelectorAll('#weak-segments .segment').forEach(btn => {
    btn.addEventListener('click', e => {
      document.querySelectorAll('#weak-segments .segment').forEach(b => b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      state.weakFilter = e.currentTarget.dataset.weak;
      applyFilters();
    });
  });

  document.querySelectorAll('#mode-segments .segment').forEach(btn => {
    btn.addEventListener('click', e => {
      document.querySelectorAll('#mode-segments .segment').forEach(b => b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      state.mode = e.currentTarget.dataset.mode;
      renderCurrent();
    });
  });

  const toggle = document.getElementById('filter-toggle');
  const drawer = document.getElementById('filter-drawer');
  toggle.addEventListener('click', () => {
    const open = drawer.classList.toggle('open');
    toggle.classList.toggle('active', open);
    toggle.setAttribute('aria-expanded', String(open));
  });
}

function updateFilterSummary() {
  let n = 0;
  if (state.app === 'grammar') {
    if (state.grammarBook !== 'all') n++;
    if (state.grammarChapter !== 'all') n++;
    if (state.grammarRule !== null) n++;
    if (state.grammarWeakFilter !== 'all') n++;
  } else {
    if (state.sourceFilter !== 'all') n++;
    if (state.sourceFilter === 'teppan') {
      if (state.rangeFilter) n++;
    } else {
      n += state.dateFilter.length;
      if (state.posFilter !== 'all') n++;
    }
    if (state.weakFilter !== 'all') n++;
  }
  const el = document.getElementById('filter-count');
  if (!el) return;
  el.style.display = n > 0 ? 'inline-block' : 'none';
  el.innerText = n;
}

function shuffle(array) {
  let currentIndex = array.length, randomIndex;
  while (currentIndex !== 0) {
    randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
  }
  return array;
}

// 品詞「句・表現」に含める品詞（TEPPAN はそのまま「句・表現」で登録されている）
const PHRASE_POS = ['名詞句', '動詞句', '形容詞句', '副詞句', '表現', '句・表現'];

// 苦手フィルタ以外の絞り込み（出典・範囲・日付・品詞）
function wordMatchesBaseFilters(w) {
  // source
  if (state.sourceFilter !== 'all' && w.s !== state.sourceFilter) return false;

  // range filter (for TEPPAN)
  if (state.sourceFilter === 'teppan' && state.rangeFilter) {
    if (!w.no || w.no < state.rangeFilter.start || w.no > state.rangeFilter.end) return false;
  }

  // date (for daily words or all)
  if (state.sourceFilter !== 'teppan' && state.dateFilter.length > 0) {
    if (!w.d || !state.dateFilter.includes(getWeekLabel(w.d))) return false;
  }

  // pos (for daily words or all)
  if (state.sourceFilter !== 'teppan' && state.posFilter !== 'all') {
    if (state.posFilter === '句・表現') {
      if (!PHRASE_POS.includes(w.p)) return false;
    } else {
      if (w.p !== state.posFilter) return false;
    }
  }
  return true;
}

// 日々の単語と TEPPAN の両方にある単語は1問にまとめる（苦手記録は綴りで共通なので）
function dedupeWords(words) {
  const seen = new Set();
  return words.filter(w => {
    if (seen.has(w.w)) return false;
    seen.add(w.w);
    return true;
  });
}

function applyFilters() {
  let filtered = RAW_WORDS.filter(w => {
    if (!wordMatchesBaseFilters(w)) return false;

    // weak
    const entry = state.weakData[w.w];
    if (state.weakFilter === 'weak_only' && !entry) return false;
    if (state.weakFilter === 'weak_unlearned' && !entry && state.seenWords.has(w.w)) return false;
    if (state.weakFilter === 'due' && !(entry && isDue(entry))) return false;

    return true;
  });
  
  state.pool = shuffle(dedupeWords(filtered));
  state.currentIndex = 0;
  state.score = 0;
  state.answeredCount = 0;
  updateWeakBadge();
  updateFilterSummary();
  renderCurrent();
}

// 4択の「わからない」ボタン。次へボタンと同じ枠を回答前だけ使う
function setDontKnowVisible(visible) {
  const dk = document.getElementById('dont-know-btn');
  if (dk) dk.style.display = visible ? 'block' : 'none';
}

// 下のボタンを両方隠し、カードモードで書き換えた文言を元に戻す
function resetActionBar() {
  const dk = document.getElementById('dont-know-btn');
  const nextBtn = document.getElementById('next-btn');
  dk.style.display = 'none';
  dk.innerText = 'わからない';
  nextBtn.style.display = 'none';
  nextBtn.innerText = '次へ';
}

function showNextButton(onNext) {
  const nextBtn = document.getElementById('next-btn');
  nextBtn.style.display = 'block';
  nextBtn.onclick = onNext;
}

function nextWord() {
  state.currentIndex++;
  renderCurrent();
}

// 不正解のときにカードを揺らす。揺らしたカードそのものを戻すので、0.4秒以内に次へ進んでも問題ない
function shakeCard() {
  const card = document.getElementById('main-card');
  if (!card) return;
  card.classList.add('shake');
  setTimeout(() => card.classList.remove('shake'), 400);
}

// 品詞は答えの推測材料になるので回答前は隠す。No.しか無いときは品詞の枠ごと隠す
function posTagHtml(word, showPos) {
  const no = word.no ? `<span style="font-weight:700;margin-right:6px;color:var(--gold);">No.${word.no}</span>` : '';
  return `<div class="pos-tag" id="pos-tag"${!no && !showPos ? ' hidden' : ''}>${no}<span id="pos-text"${showPos ? '' : ' hidden'}>${word.p}</span></div>`;
}

function revealPos() {
  const tag = document.getElementById('pos-tag');
  const text = document.getElementById('pos-text');
  if (tag) tag.hidden = false;
  if (text) text.hidden = false;
}

// 選択肢を選ぶときは「名詞」と「名詞句」などを同じ品詞として扱う
const POS_GROUPS = { '名詞句': '名詞', '動詞句': '動詞', '形容詞句': '形容詞', '副詞句': '副詞', '句・表現': '表現' };
function posGroup(p) {
  return POS_GROUPS[p] || p;
}

// 4択の選択肢。品詞だけで正解が分からないよう、出題範囲 → 全単語の順に同じ品詞の単語を優先して選ぶ
function buildOptions(word) {
  const options = [word];
  const samePos = w => posGroup(w.p) === posGroup(word.p);
  const candidateLists = [state.pool.filter(samePos), RAW_WORDS.filter(samePos), state.pool, RAW_WORDS];
  for (const list of candidateLists) {
    for (const w of shuffle([...list])) {
      if (options.length >= 4) return shuffle(options);
      if (!options.some(x => x.w === w.w || x.m === w.m)) options.push(w);
    }
  }
  return shuffle(options);
}

function renderCurrent() {
  resetActionBar();
  document.getElementById('choices-container').classList.remove('compact');
  const container = document.getElementById('quiz-container');
  const choicesDiv = document.getElementById('choices-container');

  if (state.pool.length === 0) {
    container.innerHTML = `<div class="card"><div class="meaning-display">条件に合う単語がありません</div></div>`;
    choicesDiv.innerHTML = '';
    updateFooter();
    return;
  }

  if (state.currentIndex >= state.pool.length) {
    container.innerHTML = `<div class="card"><div class="meaning-display">完了！</div><div style="font-size:14px;color:var(--muted);margin-top:8px;">正答: ${state.score} / ${state.answeredCount}</div></div>`;
    choicesDiv.innerHTML = '';
    updateFooter();
    return;
  }

  const word = state.pool[state.currentIndex];
  state.answered = false;
  choicesDiv.innerHTML = '';

  if (state.mode === 'e2j' || state.mode === 'j2e') {
    container.innerHTML = `
      <div class="card" id="main-card">
        ${posTagHtml(word, false)}
        <div class="${state.mode === 'e2j' ? 'word-display' : 'meaning-display'}">${state.mode === 'e2j' ? word.w : word.m}</div>
        <div class="example-display" id="example-box">${word.e ? word.e : '<span style="opacity:0.45; font-style:italic;">（例文なし）</span>'}<br><br>${state.mode === 'e2j' ? word.m : word.w}</div>
      </div>
    `;

    const options = buildOptions(word);
    state.currentOptions = options;

    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerText = state.mode === 'e2j' ? opt.m : opt.w;
      btn.onclick = () => handleAnswer(opt, btn);
      choicesDiv.appendChild(btn);
    });
    setDontKnowVisible(true);
    document.getElementById('dont-know-btn').onclick = handleDontKnow;
  } else if (state.mode === 'flash') {
    container.innerHTML = `
      <div class="card flash-mode" id="flash-card">
        <div class="flip-card-inner">
          <div class="card-face">
            ${posTagHtml(word, false)}
            <div class="word-display">${word.w}</div>
          </div>
          <div class="card-face card-back">
            <div class="pos-tag">${word.p}</div>
            <div class="meaning-display">${word.m}</div>
            <div style="font-size: 14px; line-height: 1.5; color: ${word.e ? '#555' : 'var(--muted)'}; font-style: ${word.e ? 'normal' : 'italic'};">${word.e || '（例文なし）'}</div>
          </div>
        </div>
      </div>
    `;
    document.getElementById('flash-card').onclick = flipCard;
    document.getElementById('next-btn').innerText = 'めくる';
    showNextButton(flipCard);
  } else if (state.mode === 'type') {
    container.innerHTML = `
      <div class="card" id="main-card">
        ${posTagHtml(word, false)}
        <div class="meaning-display">${word.m}</div>
        <div class="type-input-container">
          <input type="text" id="type-input" class="type-input" placeholder="英語で入力" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
          <button class="type-check-btn" id="type-check-btn">答え合わせ</button>
        </div>
        <div class="type-result" id="type-result" style="display:none;"></div>
        <div class="example-display" id="example-box">${word.e ? word.e : '<span style="opacity:0.45; font-style:italic;">（例文なし）</span>'}</div>
      </div>
    `;
    const input = document.getElementById('type-input');
    input.focus();
    input.addEventListener('keydown', e => {
      // 日本語入力の変換確定の Enter では答え合わせしない
      if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229 || state.answered) return;
      e.preventDefault();
      e.stopPropagation(); // 同じ Enter でキーボード操作の「次へ」まで進まないようにする
      handleTypeAnswer(input.value);
    });
    document.getElementById('type-check-btn').onclick = () => handleTypeAnswer(input.value);
    setDontKnowVisible(true);
    document.getElementById('dont-know-btn').onclick = handleTypeDontKnow;
  }

  updateFooter();
}

function handleAnswer(selectedOpt, btn) {
  const word = state.pool[state.currentIndex];
  answerChoice(selectedOpt.w === word.w, btn);
}

// 「わからない」: 正解を見せて苦手に登録。スコアは増やさず、赤表示や揺れは出さない
function handleDontKnow() {
  answerChoice(false, null);
}

function answerChoice(isCorrect, selectedBtn) {
  if (state.answered) return;
  state.answered = true;
  setDontKnowVisible(false);

  const word = state.pool[state.currentIndex];
  document.querySelectorAll('#choices-container .choice-btn').forEach((b, i) => {
    if (state.currentOptions[i] && state.currentOptions[i].w === word.w) {
      b.classList.add('correct');
    }
  });

  if (isCorrect) {
    state.score++;
  } else if (selectedBtn) {
    selectedBtn.classList.add('wrong');
    shakeCard();
  }
  recordWeak(word, isCorrect);
  showAnswerDetails();
}

// 回答後に品詞と例文を見せて次へボタンを出す（4択・タイプ共通）
function showAnswerDetails() {
  revealPos();
  document.getElementById('example-box').style.display = 'block';
  showNextButton(nextWord);
  updateFooter();
}

// カードモード: めくって答えを確かめてから「覚えた／まだ」で自己採点する
function flipCard() {
  const card = document.getElementById('flash-card');
  if (!card) return;
  card.classList.toggle('flipped');
  if (state.answered) return;
  const dk = document.getElementById('dont-know-btn');
  dk.innerText = 'まだ';
  dk.onclick = () => gradeFlash(false);
  setDontKnowVisible(true);
  document.getElementById('next-btn').innerText = '覚えた';
  showNextButton(() => gradeFlash(true));
}

function gradeFlash(known) {
  if (state.answered) return;
  state.answered = true;
  if (known) state.score++;
  recordWeak(state.pool[state.currentIndex], known);
  nextWord();
}

// 見出し語の「~」は入力不要、空白の揺れは無視して比較する
function normalizeTyped(str) {
  return str.replace(/[~～]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
}

function handleTypeAnswer(val) {
  if (state.answered) return;
  if (!val.trim()) return; // 空のまま送信しても不正解にしない

  const word = state.pool[state.currentIndex];
  const isCorrect = word.w.split('/').map(normalizeTyped).includes(normalizeTyped(val));

  if (isCorrect) {
    state.score++;
  } else {
    shakeCard();
  }
  recordWeak(word, isCorrect);
  revealTypeAnswer(word, isCorrect, val);
}

function handleTypeDontKnow() {
  if (state.answered) return;
  const word = state.pool[state.currentIndex];
  recordWeak(word, false);
  revealTypeAnswer(word, false, '');
}

function revealTypeAnswer(word, isCorrect, typed) {
  state.answered = true;
  setDontKnowVisible(false);

  const input = document.getElementById('type-input');
  input.disabled = true;
  input.blur();
  document.getElementById('type-check-btn').style.display = 'none';

  const result = document.getElementById('type-result');
  result.className = `type-result ${isCorrect ? 'ok' : 'ng'}`;
  result.innerHTML = isCorrect
    ? `<span class="type-result-label">正解</span><span class="type-result-answer">${escapeHtml(word.w)}</span>`
    : `${typed ? `<div><span class="type-result-label">あなた</span><span class="type-result-yours">${escapeHtml(typed)}</span></div>` : ''}
       <div><span class="type-result-label">正解</span><span class="type-result-answer">${escapeHtml(word.w)}</span></div>`;
  result.style.display = 'block';

  showAnswerDetails();
}

function recordWeak(word, isCorrect) {
  state.answeredCount++;
  updateWeakEntry(state.weakData, word.w, isCorrect);
  if (!state.seenWords.has(word.w)) {
    state.seenWords.add(word.w);
    saveJSON('toeic_seen_words', [...state.seenWords]);
  }
  saveWeakData();
}

function updateFooter() {
  const isGrammar = state.app === 'grammar';
  const pool = isGrammar ? state.grammarPool : state.pool;
  const index = isGrammar ? state.currentGrammarIndex : state.currentIndex;
  const score = isGrammar ? state.grammarScore : state.score;
  const answered = isGrammar ? state.grammarAnsweredCount : state.answeredCount;
  document.getElementById('progress-text').innerText = pool.length > 0 ? `${Math.min(index + 1, pool.length)} / ${pool.length}` : '0 / 0';
  const rate = answered > 0 ? `（${Math.round(score / answered * 100)}%）` : '';
  document.getElementById('score-text').innerText = `正答 ${score} / ${answered}${rate}`;
  // 進捗バーは「回答済み（次へ進んだ）問題数 / プール全体」
  const done = Math.min(index, pool.length);
  document.getElementById('progress-fill').style.width = pool.length > 0 ? `${done / pool.length * 100}%` : '0';

  // 表示が変わるたびに呼ばれるので、ここで設定と進み具合を保存しておく
  saveSettings();
  saveSession();
}

// ==================== 設定・進み具合の保存 ====================
// 絞り込みやモードと、出題中の問題の並び・何問目か・正答数を保存し、開き直しても続きから始める

const SETTINGS_KEY = 'toeic_settings';
const SESSION_KEY = 'toeic_session';
const WORD_INDEX = new Map(RAW_WORDS.map((w, i) => [w, i]));
const GRAMMAR_BY_ID = new Map(RAW_GRAMMAR.map(g => [g.id, g]));

function saveSettings() {
  const keys = ['app', 'mode', 'sourceFilter', 'rangeFilter', 'dateFilter', 'posFilter', 'weakFilter',
                'grammarBook', 'grammarChapter', 'grammarWeakFilter', 'grammarRule', 'weakSort'];
  saveJSON(SETTINGS_KEY, Object.fromEntries(keys.map(k => [k, state[k]])));
}

// 保存された値のうち、今のデータで有効なものだけを state に戻す
function restoreSettings() {
  const saved = loadJSON(SETTINGS_KEY, {});
  const pick = (value, allowed, fallback) => (allowed.includes(value) ? value : fallback);
  state.app = pick(saved.app, ['vocab', 'grammar'], 'vocab');
  state.mode = pick(saved.mode, ['e2j', 'j2e', 'flash', 'type'], 'e2j');
  state.sourceFilter = pick(saved.sourceFilter, ['all', 'daily', 'teppan'], 'all');
  const range = saved.rangeFilter;
  state.rangeFilter = range && TEPPAN_RANGES.some(r => r.start === range.start && r.end === range.end)
    ? { start: range.start, end: range.end } : null;
  state.dateFilter = Array.isArray(saved.dateFilter) ? saved.dateFilter.filter(d => DATES.includes(d)) : [];
  state.posFilter = pick(saved.posFilter, ['all', '名詞', '動詞', '形容詞', '副詞', '句・表現'], 'all');
  state.weakFilter = pick(saved.weakFilter, ['all', 'weak_unlearned', 'weak_only', 'due'], 'all');
  state.grammarBook = pick(saved.grammarBook, ['all', 'kin', 'sekai'], 'all');
  state.grammarChapter = pick(saved.grammarChapter, getGrammarChaptersList().map(c => c.ch), 'all');
  state.grammarRule = KIN_RULES.some(r => r.number === saved.grammarRule) ? saved.grammarRule : null;
  state.grammarWeakFilter = pick(saved.grammarWeakFilter, ['all', 'weak_only', 'due'], 'all');
  state.weakSort = pick(saved.weakSort, ['new', 'old', 'due', 'order'], 'new');
}

// 今の絞り込みを表す値。保存した出題順はこれが一致するときだけ使う（データが増減したときも作り直す）
function sessionSignature(app) {
  return JSON.stringify(app === 'grammar'
    ? [RAW_GRAMMAR.length, state.grammarBook, state.grammarChapter, state.grammarRule, state.grammarWeakFilter]
    : [RAW_WORDS.length, state.sourceFilter, state.rangeFilter, state.dateFilter, state.posFilter, state.weakFilter]);
}

function saveSession() {
  const sessions = loadJSON(SESSION_KEY, {});
  // 回答済みの問題は開き直したときに出し直さないよう、次の問題から再開する
  if (state.app === 'grammar') {
    sessions.grammar = {
      sig: sessionSignature('grammar'),
      pool: state.grammarPool.map(g => g.id),
      index: Math.min(state.currentGrammarIndex + (state.grammarAnswered ? 1 : 0), state.grammarPool.length),
      score: state.grammarScore,
      answered: state.grammarAnsweredCount,
    };
  } else {
    sessions.vocab = {
      sig: sessionSignature('vocab'),
      pool: state.pool.map(w => WORD_INDEX.get(w)),
      index: Math.min(state.currentIndex + (state.answered ? 1 : 0), state.pool.length),
      score: state.score,
      answered: state.answeredCount,
    };
  }
  saveJSON(SESSION_KEY, sessions);
}

// 保存した続きを戻せたら true。絞り込みが変わっていたり、最後まで解き終えていたら false（新しく出題し直す）
function restoreSession(app) {
  const saved = loadJSON(SESSION_KEY, {})[app];
  if (!saved || saved.sig !== sessionSignature(app) || !Array.isArray(saved.pool)) return false;
  const pool = saved.pool.map(k => (app === 'grammar' ? GRAMMAR_BY_ID.get(k) : RAW_WORDS[k]));
  const index = Number.isInteger(saved.index) ? saved.index : 0;
  if (pool.length === 0 || pool.some(x => !x) || index < 0 || index >= pool.length) return false;
  const score = Number.isInteger(saved.score) ? saved.score : 0;
  const answered = Number.isInteger(saved.answered) ? saved.answered : 0;
  if (app === 'grammar') {
    Object.assign(state, { grammarPool: pool, currentGrammarIndex: index, grammarScore: score, grammarAnsweredCount: answered });
  } else {
    Object.assign(state, { pool, currentIndex: index, score, answeredCount: answered });
  }
  return true;
}

function closeSheet() {
  document.getElementById('bottom-sheet').classList.remove('open');
  document.getElementById('sheet-overlay').classList.remove('open');
}

function openSheet(title, render) {
  document.getElementById('sheet-title').innerText = title;
  render();
  const sheet = document.getElementById('bottom-sheet');
  sheet.scrollTop = 0;
  sheet.classList.add('open');
  document.getElementById('sheet-overlay').classList.add('open');
}

function toggleWeakList() {
  if (document.getElementById('bottom-sheet').classList.contains('open')) return closeSheet();
  openSheet('苦手リスト', renderWeakList);
}

function toggleRuleGuide() {
  if (document.getElementById('bottom-sheet').classList.contains('open')) return closeSheet();
  openSheet('金の文法 章ガイド', renderRuleGuide);
}

// ==================== 金のルール・章ガイド ====================

// 章ごとの解説メモ。{ 1: "本文…", 2: "…" } の形で書くとガイドの各章の先頭に表示される（改行はそのまま反映）。
const KIN_CHAPTER_NOTES = {};

// 問題データから 金のルール の一覧を組み立てる（番号順、各ルールの問題idつき）
const KIN_RULES = (() => {
  const map = new Map();
  RAW_GRAMMAR.filter(g => g.b === 'kin' && g.rule && g.rule.number).forEach(g => {
    if (!map.has(g.rule.number)) {
      map.set(g.rule.number, { number: g.rule.number, title: g.rule.title, ch: g.ch, ids: [] });
    }
    map.get(g.rule.number).ids.push(g.id);
  });
  return [...map.values()].sort((a, b) => a.number - b.number);
})();

const KIN_CHAPTERS = (() => {
  const map = new Map();
  RAW_GRAMMAR.filter(g => g.b === 'kin').forEach(g => {
    if (!map.has(g.ch)) map.set(g.ch, { ch: g.ch, title: g.ch_title, sections: {} });
    // th_title は「必修問題 (Q114)」の形なので、括弧の前をセクション名として数える
    const section = (g.th_title || '').replace(/\s*\(.*$/, '');
    const sections = map.get(g.ch).sections;
    if (section) sections[section] = (sections[section] || 0) + 1;
  });
  return [...map.values()].sort((a, b) => a.ch - b.ch);
})();

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 解き方フェーズの手順（章ガイドと解説欄の両方で使う）
function renderPhaseSteps(phases) {
  return `<div class="phase-steps">${phases.map(p => `
    <div class="phase-step">
      <span class="phase-step-no">${p.phase}</span>
      <div>
        <div class="phase-step-title">${escapeHtml(p.title)}</div>
        ${p.action ? `<div class="phase-step-action">${escapeHtml(p.action)}</div>` : ''}
        ${p.detail ? `<div class="phase-step-detail">${escapeHtml(p.detail)}</div>` : ''}
      </div>
    </div>`).join('')}</div>`;
}

// 章ごとに持っている補足リスト（章によってキー名が違う）
const PHASE_EXTRA_LISTS = [
  ['points', '押さえる視点'],
  ['steps', '解き方のステップ'],
  ['major_patterns', '主な出題パターン'],
];

function renderPhaseGuide(pi) {
  let html = '';
  if (pi.overview) html += `<div class="phase-overview">${escapeHtml(pi.overview)}</div>`;
  if (pi.types && pi.types.length) {
    html += `<div class="guide-label">問題のタイプ</div><div class="phase-cards">${pi.types.map(t =>
      `<div class="phase-card"><strong>${escapeHtml(t.name)}</strong>${escapeHtml(t.desc || '')}</div>`).join('')}</div>`;
  }
  PHASE_EXTRA_LISTS.forEach(([key, label]) => {
    if (pi[key] && pi[key].length) {
      html += `<div class="guide-label">${label}</div><ul class="phase-list">${pi[key].map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul>`;
    }
  });
  if (pi.phases && pi.phases.length) {
    html += `<div class="guide-label">解き方フェーズ</div>${renderPhaseSteps(pi.phases)}`;
  }
  if (pi.tips && pi.tips.length) {
    html += `<div class="phase-tips"><div class="phase-tips-title">🎯 鉄則</div><ul class="phase-list">${pi.tips.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul></div>`;
  }
  return html;
}

function renderRuleGuide() {
  const container = document.getElementById('weak-list-content');
  let html = `<div class="filter-row" style="flex-wrap:wrap;">
    <button class="chip ${state.guideChapter === 'all' ? 'active' : ''}" data-guide-ch="all">すべて</button>
    ${KIN_CHAPTERS.map(c => `<button class="chip ${state.guideChapter === c.ch ? 'active' : ''}" data-guide-ch="${c.ch}">第${c.ch}章</button>`).join('')}
  </div>`;

  KIN_CHAPTERS.filter(c => state.guideChapter === 'all' || state.guideChapter === c.ch).forEach(c => {
    const notes = KIN_CHAPTER_NOTES[c.ch];
    const phaseInfo = typeof KIN_PHASES !== 'undefined' ? KIN_PHASES.find(p => p.chapter === c.ch) : null;
    const rules = KIN_RULES.filter(r => r.ch === c.ch);
    html += `<div class="guide-chapter">
      <h3>第${c.ch}章 ${escapeHtml(c.title)}</h3>
      ${phaseInfo
        ? renderPhaseGuide(phaseInfo)
        : notes
          ? `<div class="guide-notes">${escapeHtml(notes)}</div>`
          : `<div class="guide-notes empty">章の解説はまだ登録されていません</div>`}
      <div class="guide-themes">${Object.entries(c.sections).map(([name, n]) => `<span class="guide-theme">${escapeHtml(name)} ${n}問</span>`).join('')}</div>
      <div class="guide-label">金のルール（${rules.length}）</div>
      ${rules.map(r => {
        const weak = r.ids.filter(id => state.grammarWeakData[id] !== undefined).length;
        return `<div class="guide-rule">
          <span class="guide-rule-no">No.${r.number}</span>
          <span class="guide-rule-title">${escapeHtml(r.title)}
            <span class="guide-rule-meta">${r.ids.length}問${weak > 0 ? ` ・ <span class="guide-rule-weak">苦手 ${weak}</span>` : ''}</span>
          </span>
          <button class="guide-solve-btn" data-solve-rule="${r.number}">解く</button>
        </div>`;
      }).join('')}
    </div>`;
  });
  container.innerHTML = html;
}

function startRuleDrill(number) {
  state.grammarBook = 'kin';
  state.grammarChapter = 'all';
  state.grammarWeakFilter = 'all';
  state.grammarRule = number;
  syncFilterUI();
  applyGrammarFilters();
  closeSheet();
}

document.getElementById('weak-list-content').addEventListener('click', e => {
  const chBtn = e.target.closest('[data-guide-ch]');
  if (chBtn) {
    const v = chBtn.dataset.guideCh;
    state.guideChapter = v === 'all' ? 'all' : Number(v);
    renderRuleGuide();
    return;
  }
  const solveBtn = e.target.closest('[data-solve-rule]');
  if (solveBtn) return startRuleDrill(Number(solveBtn.dataset.solveRule));

  const sortBtn = e.target.closest('[data-weak-sort]');
  if (sortBtn) {
    state.weakSort = sortBtn.dataset.weakSort;
    saveSettings();
    renderWeakList();
    return;
  }
  const delBtn = e.target.closest('[data-remove-weak]');
  if (delBtn) removeWeak(delBtn.dataset.removeWeak);
});

// ==================== 苦手リスト ====================

function renderWeakList() {
  if (state.app === 'grammar') renderGrammarWeakList();
  else renderWordWeakList();
}

// items は { entry } を持つ配列。order は「ABC順」「本・章順」の比べ方
function sortWeakItems(items, order) {
  const compare = {
    new: (a, b) => b.entry.added - a.entry.added,
    old: (a, b) => a.entry.added - b.entry.added,
    due: (a, b) => a.entry.due - b.entry.due,
    order,
  }[state.weakSort] || order;
  return items.sort(compare);
}

// 件数・要復習数と並び替えボタン（単語・文法共通）
function weakListHeader(items, orderLabel) {
  const due = items.filter(x => isDue(x.entry)).length;
  const sorts = [['new', '新しい順'], ['old', '古い順'], ['due', '復習日順'], ['order', orderLabel]];
  return `
    <div class="weak-list-summary">
      苦手 ${items.length}件 ・ 要復習 <strong>${due}</strong>件<br>
      復習日以降に正解するたびに ${REVIEW_INTERVALS.join('日→')}日後 と間隔が延び、最後も正解すると苦手から外れます
    </div>
    <div class="filter-row" style="flex-wrap:wrap;margin-bottom:4px;">
      ${sorts.map(([k, label]) => `<button class="chip ${state.weakSort === k ? 'active' : ''}" data-weak-sort="${k}">${label}</button>`).join('')}
    </div>`;
}

function renderWordWeakList() {
  const container = document.getElementById('weak-list-content');
  const items = Object.keys(state.weakData)
    .map(k => ({ key: k, entry: state.weakData[k], word: RAW_WORDS.find(x => x.w === k) }))
    .filter(x => x.word);
  document.getElementById('sheet-title').innerText = `苦手リスト（${items.length}）`;
  if (items.length === 0) {
    container.innerHTML = '<p>苦手な単語はありません。</p>';
    return;
  }
  sortWeakItems(items, (a, b) => a.key.localeCompare(b.key, 'en', { sensitivity: 'base' }));

  let html = weakListHeader(items, 'ABC順');
  items.forEach(({ key, entry, word }) => {
    html += `
      <div class="weak-item">
        <div>
          <div class="weak-word">${escapeHtml(word.w)}</div>
          <div class="weak-meaning">${escapeHtml(word.m)}</div>
          ${dueLabel(entry)}
        </div>
        <button class="del-btn" data-remove-weak="${escapeHtml(key)}">削除</button>
      </div>
    `;
  });
  container.innerHTML = html;
}

function removeWeak(key) {
  if (state.app === 'grammar') {
    delete state.grammarWeakData[key];
    saveGrammarWeakData();
  } else {
    delete state.weakData[key];
    saveWeakData();
  }
  renderWeakList();
}

// ==================== キーボード操作（PC 向け） ====================
// 1〜4: 選択肢 / 0: わからない / Enter・スペース: 次へ
// カードモード: スペース: めくる / Enter: めくる・覚えた / 1・←: まだ / 2・→: 覚えた
// Esc: 下から出るシートを閉じる

function isShown(el) {
  return el && el.style.display !== 'none' && el.offsetParent !== null;
}

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
  if (document.getElementById('bottom-sheet').classList.contains('open')) {
    if (e.key === 'Escape') closeSheet();
    return;
  }
  const t = e.target;
  if ((t.tagName === 'INPUT' && !t.disabled) || t.tagName === 'TEXTAREA' || t.isContentEditable) return;

  const dk = document.getElementById('dont-know-btn');
  const nextBtn = document.getElementById('next-btn');
  const press = btn => {
    e.preventDefault();
    btn.click();
  };

  if (state.app === 'vocab' && state.mode === 'flash' && document.getElementById('flash-card')) {
    if (e.key === ' ') return press(document.getElementById('flash-card'));
    if ((e.key === '1' || e.key === 'ArrowLeft') && isShown(dk)) return press(dk);
    if ((e.key === '2' || e.key === 'ArrowRight' || e.key === 'Enter') && isShown(nextBtn)) return press(nextBtn);
    return;
  }

  if (/^[1-4]$/.test(e.key)) {
    // 回答前（わからないボタンが出ている間）だけ選択肢を選べる
    const btn = document.querySelectorAll('#choices-container .choice-btn')[Number(e.key) - 1];
    if (btn && isShown(dk)) press(btn);
  } else if (e.key === '0' && isShown(dk)) {
    press(dk);
  } else if ((e.key === 'Enter' || e.key === ' ') && isShown(nextBtn)) {
    press(nextBtn);
  }
});

// ==================== 起動 ====================

restoreSettings();
initFilters();
syncFilterUI();
setApp(state.app);

// オフラインでも開けるようにする（ファイルを直接開いたときは使えないので登録しない）
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
